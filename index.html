// One source of truth for the build stamp. The footer and the diagnostics
// file both read it, so a bug report can never name a build that is not the
// one that produced it.
const APP_VERSION = 'v10.6';
const APP_TAGLINE = 'somewhere to change your mind';

/**
 * A provider forced for the current operation, or null. In memory ONLY -- never
 * saved, so nothing it does can outlive the call that set it.
 *
 * Before v9.63, compareProviders() forced a provider by writing S.settings and
 * restoring it in a finally. recordAiCall() saves on every AI call, so those
 * temporary values were persisted for the whole comparison; if the app died in
 * that window the finally never ran and the user kept an aiFallback of false
 * with nothing on screen saying so (code review P2-01, reproduced).
 */
let aiOverride = null;
function aiProvider(){
  if(aiOverride && aiOverride.provider) return aiOverride.provider;
  return S.settings.aiProvider === 'local' ? 'local' : 'anthropic';
}
// The single read point for "may this call fall back?", so an override has one
// place to apply and the four scattered reads become one.
function aiFallbackOn(){
  if(aiOverride && aiOverride.fallback !== undefined) return aiOverride.fallback;
  return !!S.settings.aiFallback;
}

// Why AI can't run a scan right now, worded for the ACTIVE provider — or null when
// it's ready. The scan entry points used to check `!S.settings.apiKey` unconditionally,
// which dead-ended local-model (Gordon) users — who need no Anthropic key — with a
// message telling them to add one. Gate on what THIS provider actually needs instead.
function aiSetupError(){
  if(!aiEnabled()) return 'Turn AI back on in Settings first (Gordon and AI).';
  if(aiProvider() === 'local'){
    // Local model: needs a Gordon sign-in. If Anthropic fallback is armed (fallback
    // on AND a key saved), callAI can still answer, so don't block the scan.
    if(gordonSignedInEmail()) return null;
    if(S.settings.aiFallback && S.settings.apiKey) return null;
    return 'Sign in to Gordon in Settings first — or add an Anthropic key and turn on "Fall back to Anthropic".';
  }
  // Anthropic: needs the user's key.
  if(!S.settings.apiKey) return 'Add your Anthropic API key in Settings first.';
  return null;
}
// How Gordon addresses the user (Settings → Gordon and AI). Default professional.
function assistantTone(){ return (S.settings && S.settings.assistantTone === 'casual') ? 'casual' : 'professional'; }

// Which task the current call belongs to (gen_ai.operation.name). Set once at
// the top of callAI and read by both transports, so a log line says WHAT was
// being attempted -- "extract.photo failed" rather than "a call failed".
let aiOp = 'unknown';

async function callAI(contentBlocks, maxTokens, system, op){
  aiOp = op || 'unknown';
  if(aiProvider() === 'local'){
    // Timed at this boundary rather than inside callLocalModel so that a
    // local millisecond and an Anthropic millisecond mean the same thing.
    const started = Date.now();
    try{
      const out = await callLocalModel(contentBlocks, maxTokens, system);
      recordAiCall({ op: aiOp, provider:'local', reqModel: S.settings.localModel || null,
        ok:true, ms: Date.now() - started,
        inTokens: lastLocalUsage.inTokens, outTokens: lastLocalUsage.outTokens,
        finish: lastLocalUsage.finish });
      return out;
    }catch(err){
      // Not signed in to Gordon: the local path is gated per-user now. Treat it
      // as a local failure so the Anthropic fallback (the user's own key) still
      // answers when enabled, but SAY why so the fix is discoverable.
      const needAuth = err && err.message === 'GORDON_AUTH_REQUIRED';
      const unsupported = /^UNSUPPORTED_BLOCK:/.test(err.message);
      const localFail = { op: aiOp, provider:'local',
        reqModel: S.settings.localModel || null, ok:false, ms: Date.now() - started,
        errorType: needAuth ? 'auth_required' : (unsupported ? 'unsupported_input' : classifyError(err)),
        detail: needAuth ? 'Not signed in to Gordon' : (err && err.message) };
      // A 429 from the proxy is "wait a moment," not "the model is broken" -- say
      // so, rather than the generic "did not answer," so a busy Gordon reads as
      // transient and the user retries instead of assuming it's down.
      const rateLimited = localFail.errorType === 'rate_limit';
      if(needAuth && !aiFallbackOn()){
        recordAiCall(localFail);
        logProblem('Gordon', 'Sign in to use the local model (Settings → Gordon and AI)', aiModelName());
        throw new Error('Sign in to use Gordon.\n\nOpen Settings → Gordon and AI and sign in — or turn on "Fall back to Anthropic".');
      }
      if(aiFallbackOn()){
        // WORDING MATTERS. This used to read "Local model unavailable — using
        // Anthropic", which on a phone toast reads as "...unavailable ...
        // Anthropic" -- Logan reported repeated "Anthropic couldn't be
        // reached" alerts when the log showed Anthropic succeeding every time.
        // Lead with the outcome, name the thing that failed second. The toast
        // itself now fires below, once there is an outcome to report.
        // A successful fallback RECOVERED -- the user got an answer -- so it is
        // NOT a "problem to look at." It is recorded in the AI call log with
        // fellBackTo, which Diagnostics summarises as "fell back N×". Logging it
        // as a Problem too made the "N problems to look at" count never drop
        // even though nothing was actually broken.
        //
        // ORDER MATTERS. Until v9.67 the toast and the fellBackTo entry were
        // emitted BEFORE this call, so a failing Anthropic left the user having
        // been told it answered and the log claiming a recovery that never
        // happened. Announce the outcome after there IS one -- the same mistake
        // P4-01 fixed in sign-out.
        let answer;
        try{
          answer = await callClaude(contentBlocks, maxTokens, system);
        }catch(fallbackErr){
          // The LOCAL failure is the diagnostic that matters, and it was lost
          // exactly here: recordAiCall ran only after callClaude RESOLVED, so a
          // fallback that THREW discarded it. NO_API_KEY throws immediately, so
          // a user signed in to Gordon whose local call failed ended up with a
          // log containing only `no_api_key` -- no record of what Gordon did,
          // and a message pointing at the wrong subsystem entirely.
          recordAiCall(localFail);
          // Rule 13: never put a working provider's name next to the word that
          // describes the failure -- and never name only the SECOND thing that
          // went wrong. "NO_API_KEY" alone hides the failure that started it.
          if(fallbackErr && fallbackErr.message === 'NO_API_KEY'){
            throw new Error(explainError(localFail.errorType, 'local', localFail.detail)
              + '\n\nAnthropic could not stand in either — no API key is saved.');
          }
          throw fallbackErr;
        }
        // Unchanged from v9.67 and load-bearing: the fellBackTo entry and the
        // toast are emitted only once there IS an outcome to report.
        recordAiCall(Object.assign({}, localFail, { fellBackTo:'anthropic' }));
        toast(needAuth ? 'Read by Anthropic — sign in (Settings) to use Gordon'
                       : rateLimited ? 'Read by Anthropic — Gordon is busy (rate limited); try again shortly'
                       : (unsupported ? 'Read by Anthropic instead — PDFs need it'
                          : 'Read by Anthropic instead — your local model did not answer'));
        return answer;
      }
      recordAiCall(localFail);
      if(unsupported){
        logProblem('Local model', 'Cannot read PDFs or fetched links', aiModelName());
        throw new Error('The local model cannot read PDFs or fetched links — only photos and text.\n\nEither photograph the page instead, or turn on "Fall back to Anthropic" in Settings.');
      }
      logProblem('Local model', err.message, aiModelName());
      // Say what to DO about it. "Local model unavailable" is true of a sleeping
      // desktop and of a thinking model that burnt its whole budget reasoning,
      // and the fix is completely different in each case. explainError already
      // knows which; the same wording appears here and in the problem log.
      throw new Error(explainError(localFail.errorType, 'local', localFail.detail));
    }
  }
  return callClaude(contentBlocks, maxTokens, system);
}

// Ollama speaks the OpenAI Chat Completions shape, so Anthropic content blocks
// are translated: text passes through, images become data-URL image_url parts.
// The OpenAI chat shape carries text and images. It has no equivalent of
// Anthropic's `document` block, so PDFs and fetched URLs cannot cross over.
// Dropping them silently would send the prompt with nothing attached and the
// model would answer about thin air -- so this throws instead. Better a clear
// error than a confident answer about a document nobody sent.
function blocksToOpenAI(contentBlocks){
  const parts = [];
  for(const b of contentBlocks){
    if(b.type === 'text'){
      parts.push({ type:'text', text:b.text });
    } else if(b.type === 'image' && b.source && b.source.type === 'base64'){
      parts.push({ type:'image_url', image_url:{
        url: 'data:' + b.source.media_type + ';base64,' + b.source.data } });
    } else if(b.type === 'document'){
      throw new Error('UNSUPPORTED_BLOCK:document');
    } else {
      throw new Error('UNSUPPORTED_BLOCK:' + (b.type || 'unknown'));
    }
  }
  if(!parts.some(p => p.type === 'text')) throw new Error('UNSUPPORTED_BLOCK:no-prompt');
  return parts;
}

// Reasoning models (qwen3-vl, deepseek-r1 and friends) narrate before answering:
// "Thinking..." / "...done thinking.", or <think>...</think>. FlyerSnap runs
// JSON.parse on the result, and a parse failure yields ZERO items rather than
// partial ones -- so the symptom is a silent "found nothing". Strip the narration
// and, if prose still surrounds the payload, cut it down to the JSON itself.
function stripThinking(text){
  let t = String(text || '');
  t = t.replace(/<think>[\s\S]*?<\/think>/gi, ' ');
  t = t.replace(/<thinking>[\s\S]*?<\/thinking>/gi, ' ');
  // "Thinking..." through "...done thinking." (the CLI/Ollama style)
  t = t.replace(/(^|\n)\s*Thinking\.\.\.[\s\S]*?\.\.\.\s*done thinking\.?/gi, ' ');
  // An unterminated thinking block: drop everything before the last marker.
  const done = t.lastIndexOf('...done thinking.');
  if(done >= 0) t = t.slice(done + '...done thinking.'.length);
  return t.replace(/```json|```/g, '').trim();
}

// Pull the outermost JSON value out of surrounding prose, respecting strings so
// a brace inside a title cannot end the scan early.
function extractJson(text){
  const t = String(text || '');
  const starts = [t.indexOf('{'), t.indexOf('[')].filter(i => i >= 0);
  if(!starts.length) return t.trim();
  const start = Math.min.apply(null, starts);
  const open = t[start];
  const close = open === '{' ? '}' : ']';
  let depth = 0, inStr = false, esc = false;
  for(let i = start; i < t.length; i++){
    const c = t[i];
    if(esc){ esc = false; continue; }
    if(c === '\\'){ esc = true; continue; }
    if(c === '"'){ inStr = !inStr; continue; }
    if(inStr) continue;
    if(c === open) depth++;
    else if(c === close){ depth--; if(depth === 0) return t.slice(start, i + 1); }
  }
  return t.slice(start).trim();   // unbalanced; hand back what we have
}

function cleanModelText(text){
  const stripped = stripThinking(text);
  return /[{\[]/.test(stripped) ? extractJson(stripped) : stripped;
}

// The measured context window of the loaded local model, or null while
// unknown. Cached for the session: asking costs a round trip, and the answer
// only changes when Ollama is restarted -- at which point the app is reloaded
// too, more often than not.
let localCtx = null;
let localCtxAsked = false;
// WHICH model and endpoint the cached window belongs to. Without this the cache
// was answered for the life of the session no matter what the user changed:
// measured 29 Aug -- set the model to something else, re-select the provider,
// and probeLocalContext still returned the old 32768 (code review P5).
let localCtxFor = '';
function localCtxKey(){
  return ((S.settings && S.settings.localBaseUrl) || '') + '|'
       + ((S.settings && S.settings.localModel) || '');
}
/** Forget the probed window. Called wherever the thing it describes changes. */
function invalidateLocalContext(){
  localCtx = null; localCtxAsked = false; localCtxFor = '';
}

/**
 * Ask the server how big a window it actually allocated.
 *
 * Best effort by design. Older Ollama builds do not report it, /api/ps may be
 * blocked where /v1 is not, and no model may be loaded yet. Every one of those
 * returns null, and null means "carry on unchanged" -- a detection failure
 * must never be able to stop a call that would have worked.
 */
async function probeLocalContext(){
  const key = localCtxKey();
  if(localCtxAsked && localCtxFor === key) return localCtx;
  localCtxAsked = true;
  localCtxFor = key;
  // Read the model name ONCE, here, with the key -- not again after the fetch.
  // The settings can change while the request is in flight (the user edits the
  // model field, or another surface writes), and re-reading afterwards would
  // attribute this answer to a name that was not the one asked about. That is
  // the same class of mistake as trusting a rendered index instead of
  // re-deriving from a key.
  const askedModel = (S.settings.localModel || '').trim();
  const url = psUrlFrom((S.settings.localBaseUrl||'').trim() || GORDON_BASE_URL);
  if(!url) return null;
  const gtok = await gordonAuthToken();
  if(!gtok) return null;   // signed out: skip the probe (best-effort by design)
  try{
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 5000);
    const res = await fetch(url, { headers:{ 'Authorization':'Bearer ' + gtok }, signal: ctrl.signal });
    clearTimeout(t);
    // A probe that could not answer must not be cached as "no window". It is
    // best-effort, and one blocked /api/ps used to silence the check for the
    // rest of the session (code review P5).
    if(!res.ok){ localCtxAsked = false; return null; }
    localCtx = contextFromPs(await res.json(), askedModel);
    if(localCtx === null) localCtxAsked = false;
  }catch(e){
    localCtx = null;
    localCtxAsked = false;
  }
  return localCtx;
}

// Usage from the most recent local call, so the success path can log tokens
// the way the Anthropic path already does.
let lastLocalUsage = { inTokens:null, outTokens:null, finish:null };

async function callLocalModel(contentBlocks, maxTokens, system){
  const base = ((S.settings.localBaseUrl||'').trim() || GORDON_BASE_URL).replace(/\/+$/,'');
  if(!base) throw new Error('No local model URL saved.');
  const model = (S.settings.localModel||'').trim() || GORDON_MODEL;
  // Gordon is gated by per-user sign-in. No session -> refuse here; callAI's
  // catch treats it like any local failure and falls back to Anthropic (the
  // user's own key) when that is enabled.
  const gtok = await gordonAuthToken();
  if(!gtok) throw new Error('GORDON_AUTH_REQUIRED');
  // Local models are more verbose than Claude for the same task, so give the
  // budget extra room rather than risk a truncated, unparseable response.
  maxTokens = Math.max(maxTokens || 2000, 4000);

  // ...but only as much room as there is. Asking for 4,000 tokens of answer
  // inside a 4,096-token window cannot work however good the model is, and
  // that is exactly what this app did until v9.25. Both numbers are measured:
  // the window from the server, the prompt size from previous calls in the AI
  // log. When either is unknown the plan is "carry on unchanged".
  const ctx = await probeLocalContext();
  const seen = observedPromptTokens(S.aiLog || [], aiOp, 'local');
  const plan = planBudget({ ctx, promptTokens: seen && seen.tokens, want: maxTokens });
  if(!plan.ok){
    // Fail in a second rather than burning three minutes on a request whose
    // arithmetic already says no.
    throw new Error('CONTEXT_TOO_SMALL: ' + contextAdvice(plan));
  }
  if(plan.clamped) console.log('local budget clamped to', plan.maxTokens, 'to fit', ctx);
  maxTokens = plan.maxTokens;

  const messages = [{ role:'system', content: SECRETARY_PERSONA + (system ? '\n\n' + system : '') },
                    { role:'user', content: blocksToOpenAI(contentBlocks) }];

  const ctrl = new AbortController();
  // The first call loads the model into VRAM and is slow; later ones are fast.
  const timer = setTimeout(()=>ctrl.abort(), 180000);
  let res;
  try{
    res = await fetch(base + '/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + gtok },
      // Ollama 0.12+ auto-enables thinking for thinking-capable models unless
      // told otherwise, and reasoning tokens are spent from the SAME budget as
      // the answer -- so the model can narrate until it runs out and never emit
      // the JSON. That failure looks identical to "found nothing".
      //
      // `reasoning_effort:'none'` is the one that WORKS here. Ollama's
      // OpenAI-compatibility docs list the accepted fields for
      // /v1/chat/completions, and `think` is not among them -- it is a native
      // /api/chat field, so it was silently ignored on every call this app has
      // ever made. `reasoning_effort` IS on that list, 'none' among its
      // values. That is why a thinking model kept thinking with `think:false`
      // sitting right there in the request.
      //
      // The other two stay: they are free, and they cover proxies that speak
      // the native shape instead.
      // `/no_think` in the prompt is deliberately NOT used: it is unreliable,
      // and models have been observed reasoning about the token itself.
      body: JSON.stringify({
        model, messages,
        temperature: 0.2,
        max_tokens: maxTokens || 2000,
        reasoning_effort: 'none',
        think: false,
        chat_template_kwargs: { enable_thinking: false }
      }),
      signal: ctrl.signal
    });
  }catch(e){
    clearTimeout(timer);
    throw new Error(e.name === 'AbortError' ? 'timed out after 3 minutes' : e.message);
  }
  clearTimeout(timer);
  if(!res.ok) throw new Error('model error ' + res.status + ': ' + (await res.text()).slice(0,200));
  const json = await res.json();
  const choice = (json.choices && json.choices[0]) || {};
  const msg = choice.message || {};
  // Remember what this cost. Every later call plans its budget from these
  // numbers, so a log without them leaves the fit check permanently blind.
  lastLocalUsage = {
    inTokens: (json.usage && json.usage.prompt_tokens) || null,
    outTokens: (json.usage && json.usage.completion_tokens) || null,
    finish: choice.finish_reason || null,
  };
  // Some builds put the reasoning trace in a separate field; if content is empty
  // but a trace exists, the model spent everything thinking.
  let out = msg.content || '';
  const trace = msg.thinking || msg.reasoning || msg.reasoning_content || '';
  if(!out && trace){
    throw new Error('the model produced only reasoning and no answer — raise max_tokens, or use a model without thinking');
  }
  if(!out){
    throw new Error('the model returned an empty answer (finish_reason: ' +
      (choice.finish_reason || 'unknown') + ')');
  }
  if(choice.finish_reason === 'length'){
    console.log('local model response hit the token limit; output may be truncated');
  }
  // v9.77: the transport must NOT pull JSON out of the answer. callLocalModel
  // serves BOTH the JSON callers (extraction) and the one PROSE caller (Ask),
  // and extractJson on prose returns the first [n] citation and discards the
  // sentence -- ANSWER_CONTRACT rule 2 REQUIRES those citations, so every
  // well-formed Ask answer arrived as "[2]". Confirmed on device 31 Aug 2026.
  // Strip thinking and fences here, matching callClaude; the JSON callers now
  // extract for themselves (parseExtractedEvents, extractRecipeFromImages).
  return stripThinking(out);
}

async function callClaude(contentBlocks, maxTokens, system){
  if(!S.settings.apiKey){
    recordAiCall({ op: aiOp, provider:'anthropic', reqModel: MODEL, ok:false,
      errorType:'no_api_key', detail:'No API key saved' });
    throw new Error('NO_API_KEY');
  }
  // BEFORE the fetch, because a check after the call has already spent the
  // money it was meant to prevent. Every Anthropic call in the app funnels
  // through this function, including the automatic email pass and every
  // fallback from the local model -- which is exactly what makes one gate here
  // enough.
  if(spendCapHit()){
    recordAiCall({ op: aiOp, provider:'anthropic', reqModel: MODEL, ok:false,
      errorType:'spend_cap',
      detail:'stopped by the app\'s own $' + spendCap() + ' monthly limit' });
    throw new Error('SPEND_CAP');
  }
  const started = Date.now();
  let res;
  try{
    res = await fetch(API_URL, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': S.settings.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify(Object.assign(
      { model: MODEL, max_tokens: maxTokens||2000,
        messages:[{role:'user', content: contentBlocks}] },
      system ? { system: SECRETARY_PERSONA + '\n\n' + system } : {}))
    });
  }catch(err){
    // A thrown fetch is the network layer: no status, no body.
    recordAiCall({ op: aiOp, provider:'anthropic', reqModel: MODEL, ok:false,
      ms: Date.now() - started, errorType: classifyError(err), detail: err && err.message });
    throw err;
  }
  if(!res.ok){
    const body = await res.text();
    recordAiCall({ op: aiOp, provider:'anthropic', reqModel: MODEL, ok:false,
      ms: Date.now() - started, status: res.status,
      errorType: classifyError(null, res.status), detail: body.slice(0, 300) });
    throw new Error('API error '+res.status+': '+body.slice(0,200));
  }
  const data = await res.json();
  const u = data.usage || {};
  // Charged from what Anthropic SAYS it used, not from an estimate of the
  // prompt -- the response carries the real token counts.
  addSpend(u.input_tokens, u.output_tokens);
  recordAiCall({ op: aiOp, provider:'anthropic', reqModel: MODEL,
    resModel: data.model || null, ok:true, ms: Date.now() - started,
    inTokens: u.input_tokens, outTokens: u.output_tokens,
    finish: data.stop_reason || null });
  return (data.content||[]).map(b=>b.type==='text'?b.text:'').join('\n')
    .replace(/```json|```/g,'').trim();
}

function eventPrompt(){
  return `You are reading a photo or PDF of paperwork handed out to a parent — school flyers, dance studio notices, volleyball schedules, enrollment forms, permission slips, etc.

Today's date is ${todayISO()}. Use it to resolve dates that omit the year (assume the nearest future occurrence).

Extract EVERY actionable date you can find. Respond with ONLY a JSON array, no markdown fences, no commentary. Each item:
{"title":"short human-friendly name","date":"YYYY-MM-DD","time":"HH:MM start time in 24h or null","endTime":"HH:MM end time in 24h, or null if none is stated","location":"string or null","kind":"deadline" if it is a due date / registration cutoff / form return date, otherwise "event","notes":"one short useful sentence or null"}

Rules:
- SCHEDULE GRIDS/TABLES: if there is a timetable where columns are days/dates and rows are time slots, do NOT summarise it. Walk it cell by cell. Every non-empty cell is its own separate event. Its date comes from that cell's COLUMN header, and its start/end time from that cell's ROW label -- unless the cell states its own time (e.g. "12:30-2:30pm"), which always wins. A single day's column often holds several different sessions; return each one.
- Never collapse several sessions into one general item, and never let one day's entry stand in for the whole week. If a week-long block like "Hell Week" is named, return the named block AND every individual session inside it.
- Keep the exact label from the cell as the title, including the instructor in parentheses, e.g. "Mini M.T. (Austin)".
- Rows labelled Lunch/Dinner/Break are not events; skip them.
- Registration/signup/payment/form-due dates are "deadline". Performances, games, meetings, picture days are "event".
- If a date range is given, create one item for the start date and mention the range in notes.
- If you find a deadline AND its related event, include both.
- If no dates are found, return [].`;
}

const CLASSIFY_PROMPT = `You are reading a photo or PDF a parent has captured. It is ONE of two things:

(a) PAPERWORK — a school flyer, dance/sports schedule, newsletter, permission slip, enrollment form. Contains dates, times, deadlines.
(b) A RECIPE — a recipe card, cookbook page, or recipe clipped from a flyer. Contains ingredients and cooking steps.

Today's date is {TODAY}. Use it to resolve dates that omit the year (assume the nearest future occurrence).

Respond with ONLY a JSON object, no markdown fences, no commentary.

If it is PAPERWORK:
{"type":"events","events":[{"title":"short name","date":"YYYY-MM-DD","time":"HH:MM start 24h or null","endTime":"HH:MM end 24h or null","location":"string or null","kind":"deadline" if a due date/registration cutoff/form return date, otherwise "event","notes":"one short useful sentence or null"}]}

If the content contains a schedule table (HTML <table> or a grid where columns are days/dates and rows are time slots), walk it cell by cell. Every non-empty cell is a separate event: its date comes from the cell's column header, its time from the row label unless the cell states its own time. One day's column often holds several sessions -- return every one, and never summarise a week into a single item. Skip Lunch/Dinner/Break rows.

If it is a RECIPE:
{"type":"recipe","recipe":{"title":"dish name","category":"Breakfast"|"Lunch"|"Dinner"|"Snack"|"Other","ingredients":"plain text, one ingredient per line","instructions":"numbered plain text steps"}}

If you genuinely cannot tell, use {"type":"unknown"}.

Rules for paperwork: registration/signup/payment/form-due dates are "deadline"; performances, games, meetings, picture days are "event". If a date range is given, use the start date and mention the range in notes. If it is paperwork but has no dates at all, return {"type":"events","events":[]}.`;

async function extractAny(base64, mediaType, isPdf){
  const block = isPdf
    ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:base64}}
    : {type:'image', source:{type:'base64', media_type:mediaType, data:base64}};
  const text = await callAI([block,
    {type:'text', text: CLASSIFY_PROMPT.replace('{TODAY}', todayISO())}], 3000,
    undefined, isPdf ? 'classify.pdf' : 'classify.image');
  let out;
  try{ out = JSON.parse(text); }catch(e){ throw new Error('Could not read that. Try a clearer photo.'); }
  if(out && out.type === 'recipe' && out.recipe && out.recipe.title){
    return { type:'recipe', recipe: out.recipe };
  }
  if(out && out.type === 'events'){
    return { type:'events', events: parseExtractedEvents(JSON.stringify(out.events || [])) };
  }
  return { type:'unknown' };
}

async function extractEvents(base64, mediaType, isPdf){
  const block = isPdf
    ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:base64}}
    : {type:'image', source:{type:'base64', media_type:mediaType, data:base64}};
  const text = await callAI(withContext([block]), 3000, GROUNDING_EVENTS,
    isPdf ? 'extract.pdf' : 'extract.image');
  return parseExtractedEvents(text);
}

async function extractEventsFromUrl(url){
  // Anthropic's servers fetch the URL — no browser CORS, no proxy needed.
  // Works cleanly for PDFs; HTML pages behind a login will return an error we translate below.
  const block = {type:'document', source:{type:'url', url}};
  const text = await callAI(withContext([block]), 3000, GROUNDING_EVENTS, 'extract.url');
  return parseExtractedEvents(text);
}

function parseExtractedEvents(text){
  let arr;
  // extractJson here, not in the transport (v9.77): this parser knows it wants
  // JSON, the transport does not. Also makes the Anthropic path tolerant of
  // prose around the JSON, which it never was.
  try{ arr = JSON.parse(extractJson(text)); }catch(e){ throw new Error('Could not read that document. Try a clearer photo or link.'); }
  // A model can return 2026-02-30 as easily as 2026-02-28. Dropping the whole
  // row on a bad date is right -- an event with no date cannot be reminded
  // about -- while a bad TIME just becomes null, as a missing one already does.
  return (Array.isArray(arr)?arr:[]).filter(e=>e && e.title && isRealDate(e.date||''))
    .map(e=>({ title:String(e.title), date:e.date,
      time:(e.time && isRealTime(e.time))?e.time:null,
      endTime:(e.endTime && isRealTime(e.endTime))?e.endTime:null,
      location:e.location||null, kind:e.kind==='deadline'?'deadline':'event', notes:e.notes||null }));
}

async function extractRecipeFromImage(base64, mediaType){
  return extractRecipeFromImages([{base64, mediaType}]);
}

// One recipe, possibly spread across several photos (page 1 / page 2 etc).
async function extractRecipeFromImages(images){
  const many = images.length > 1;
  const prompt = `You are reading ${many ? images.length + ' photos that together show ONE recipe (continued pages of the same dish)' : 'a photo of a recipe'}. Respond with ONLY a JSON object:
{"title":"dish name","category":"Breakfast"|"Lunch"|"Dinner"|"Snack"|"Other","ingredients":"plain text, one per line","instructions":"numbered plain text steps"}
${many ? 'Combine every page into one complete recipe. Do not repeat ingredients or steps that appear on more than one page.' : ''}
If it is not a recipe, respond with {"title":null}.`;
  const blocks = images.map(im => ({type:'image', source:{type:'base64', media_type:im.mediaType, data:im.base64}}));
  blocks.push({type:'text', text:prompt});
  const text = await callAI(blocks, 2000, GROUNDING_RECIPE, 'extract.recipe');
  // Same two-step as parseExtractedEvents (v9.77). A model that answers in
  // prose used to surface a raw SyntaxError to the user here, while both
  // siblings (extractAny, parseExtractedEvents) say something actionable.
  let r;
  try{ r = JSON.parse(extractJson(text)); }
  catch(e){ throw new Error('Could not read that recipe. Try a clearer photo.'); }
  if(!r || !r.title) throw new Error('That does not look like a recipe.');
  return r;
}

// ---------- File reading / image downscale ----------
function readFile(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(',')[1]);
    r.onerror = ()=>rej(new Error('Could not read the file.'));
    r.readAsDataURL(file);
  });
}
async function readImageDownscaled(file){
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej)=>{
      const i = new Image();
      i.onload = ()=>res(i); i.onerror = ()=>rej(new Error('decode'));
      i.src = url;
    });
    const MAX = 1600;
    const scale = Math.min(1, MAX/Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return { base64: c.toDataURL('image/jpeg', 0.85).split(',')[1], mediaType:'image/jpeg' };
  }catch(e){
    return { base64: await readFile(file), mediaType: file.type||'image/jpeg' };
  }
}

// ---------- ICS calendar export (with alarms) ----------
function icsEscape(s){ return String(s??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
const ALERT_CHOICES = [14, 7, 3, 2, 1, 0];
function alertLabel(n){ return n===0 ? 'Day of' : n===1 ? '1 day' : n+' days'; }

// Apple Calendar honors only two alerts per event, so the two NEAREST offsets
// become real alarms; anything earlier can optionally become its own entry.
// Lead times that would land before today are useless -- a "7 days before"
// alert on an event 2 days away fires 5 days in the past, which either does
// nothing or drops a stray entry onto an old date. Drop those, and if every
// configured lead time is already past, fall back to a day-of alert so the
// event still notifies.
function alertPlan(kind, evt){
  const chosen = ((S.settings.alerts||{})[kind] || []).slice().sort((x,y)=>x-y);
  let usable = chosen;
  if(evt && evt.date){
    const away = daysUntil(evt.date);
    if(away >= 0){
      usable = chosen.filter(n => n <= away);
      if(!usable.length) usable = [0];
    }
  }
  return { alarms: usable.slice(0,2), extras: S.settings.extraReminders ? usable.slice(2) : [] };
}

function eventTitle(evt){
  const kid = evt.kidId ? kidById(evt.kidId) : null;
  return (evt.kind==='deadline'?'\u23f0 ':'') + (kid?kid.name+': ':'') + evt.title;
}
function icsStamp(){ return new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z'; }
function valarm(title, daysBefore){
  return 'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+icsEscape(title)+
    '\r\nTRIGGER:'+(daysBefore===0?'-PT0M':'-P'+daysBefore+'D')+'\r\nEND:VALARM';
}

function buildVEVENT(evt){
  const plan = alertPlan(evt.kind, evt);
  const title = eventTitle(evt);
  const d = evt.date.replace(/-/g,'');
  let dt;
  if(evt.time){
    const t = evt.time.replace(':','') + '00';
    const [y,m,day] = evt.date.split('-').map(Number);
    const [hh,mm] = evt.time.split(':').map(Number);
    let end;
    if(evt.endTime && /^\d{2}:\d{2}$/.test(evt.endTime)){
      let [eh,em] = evt.endTime.split(':').map(Number);
      // An end earlier than the start means it runs past midnight -> next day.
      const crossesMidnight = (eh*60+em) <= (hh*60+mm);
      end = new Date(y, m-1, day + (crossesMidnight?1:0), eh, em);
    } else {
      end = new Date(y, m-1, day, hh, mm+60);   // no end given -> assume one hour
    }
    const endStr = iso(end).replace(/-/g,'') + 'T' +
      String(end.getHours()).padStart(2,'0') + String(end.getMinutes()).padStart(2,'0') + '00';
    dt = 'DTSTART:'+d+'T'+t+'\r\nDTEND:'+endStr;
  } else {
    dt = 'DTSTART;VALUE=DATE:'+d;
  }
  const alarms = plan.alarms.map(n=>valarm(title, n)).join('\r\n');
  return ['BEGIN:VEVENT','UID:'+evt.id+'@flyersnap','DTSTAMP:'+icsStamp(), dt,
    'SUMMARY:'+icsEscape(title),
    evt.location?'LOCATION:'+icsEscape(evt.location):null,
    (evt.notes||evt.source)?'DESCRIPTION:'+icsEscape([evt.notes, evt.source?'From: '+evt.source:null].filter(Boolean).join(' \u2014 ')):null,
    alarms || null,'END:VEVENT'].filter(Boolean).join('\r\n');
}

// A standalone 8:00 AM nudge entry, for lead times past Apple's 2-alert cap.
function buildReminderVEVENT(evt, daysBefore){
  const [y,m,day] = evt.date.split('-').map(Number);
  const dt = new Date(y, m-1, day - daysBefore, 8, 0);
  const ds = iso(dt).replace(/-/g,'');
  const title = '\u23f0 ' + alertLabel(daysBefore) + ' until: ' + eventTitle(evt).replace(/^\u23f0 /,'');
  return ['BEGIN:VEVENT','UID:'+evt.id+'-r'+daysBefore+'@flyersnap','DTSTAMP:'+icsStamp(),
    'DTSTART:'+ds+'T080000','DTEND:'+ds+'T081500',
    'SUMMARY:'+icsEscape(title),
    'DESCRIPTION:'+icsEscape('Actual date: '+friendly(evt.date)+(evt.time?' at '+fmt12(evt.time):'')),
    valarm(title, 0),'END:VEVENT'].join('\r\n');
}

function buildVEVENTs(evt){
  const plan = alertPlan(evt.kind, evt);
  return [buildVEVENT(evt)].concat(plan.extras.map(n=>buildReminderVEVENT(evt, n)));
}

function wrapICS(vevents){
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FlyerSnap//EN'].concat(vevents).concat(['END:VCALENDAR']).join('\r\n');
}
// True when running as an installed home-screen app. In that mode iOS CANNOT
// open a new browser tab, so window.open() strands the app on a blank page.
function isStandalone(){
  return (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}

function deliverICS(ics, filename, msg){
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);

  if(isStandalone()){
    // Installed PWA: no new tab is possible. Download the .ics instead — tapping
    // the downloaded file opens Calendar's import screen with an "Add All" button.
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Saved ' + filename + ' — open it from Downloads to add everything 📆');
  } else {
    // Real Safari tab: rendering the URL shows Calendar's Add / Add All screen.
    const win = window.open(url, '_blank');
    if(!win){
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    }
    if(msg) toast(msg);
  }
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

// Last-resort path: hand the file to the share sheet so it can be mailed to
// yourself — Mail's ICS attachments import with one tap.
async function shareICSFile(ics, filename){
  const blob = new Blob([ics], {type:'text/calendar'});
  try{
    const file = new File([blob], filename, {type:'text/calendar'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'FlyerSnap events'});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

function addAllAtOnce(onlyNew){
  const evts = S.events.filter(e=>!e.deleted && e.date>=todayISO() && (!onlyNew || !e.exported));
  if(!evts.length){ toast(onlyNew ? 'Everything is already added' : 'No upcoming events'); return; }
  const veh = [];
  evts.forEach(e=>veh.push(...buildVEVENTs(e)));
  deliverICS(wrapICS(veh), 'flyersnap-events.ics',
    'Tap "Add All" in the Calendar screen that opens 📆');
  evts.forEach(e=>e.exported=true); save(); render(); // render(): refresh the "In calendar" flags (single-event downloadICS already does)
}

function emailAllToSelf(){
  const evts = S.events.filter(e=>!e.deleted && e.date>=todayISO());
  if(!evts.length){ toast('No upcoming events'); return; }
  const veh2 = [];
  evts.forEach(e=>veh2.push(...buildVEVENTs(e)));
  shareICSFile(wrapICS(veh2), 'flyersnap-events.ics');
  toast('Pick Mail, send it to yourself, then tap the attachment');
}

function downloadICS(evt, customMsg){
  deliverICS(wrapICS(buildVEVENTs(evt)),
    evt.title.replace(/[^\w ]/g,'').slice(0,40)+'.ics',
    customMsg || 'Sent to Calendar — tap Add there to save it 📆');
  evt.exported = true; save(); render();
}

// iOS strips the "Add All" button from multi-event .ics files, so batching them
// into one file is a dead-end. Instead we queue events and send them one at a
// time — iOS handles single-event files smoothly.
function startExportQueue(force){
  const evts = S.events.filter(e=>!e.deleted && e.date>=todayISO() && (force || !e.exported));
  if(!evts.length){ toast('No upcoming events to add'); return; }
  S.settings.exportQueue = evts.map(e=>e.id);
  save(); sub('exportQueue');
}
function exportNextInQueue(){
  const q = S.settings.exportQueue || [];
  if(!q.length) return;
  const id = q[0];
  S.settings.exportQueue = q.slice(1);
  save();
  const evt = S.events.find(x=>x.id===id);
  if(!evt || evt.deleted){ render(); return; }
  const remaining = S.settings.exportQueue.length;
  const msg = remaining > 0
    ? `Sent to Calendar — tap Add, then come back for ${remaining} more`
    : 'Last one! Tap Add in Calendar to finish';
  downloadICS(evt, msg);
}
function skipNextInQueue(){
  const q = S.settings.exportQueue || [];
  if(!q.length) return;
  S.settings.exportQueue = q.slice(1);
  save(); render();
}
function openExportQueue(){ sub('exportQueue'); }

function cancelExportQueue(){
  if(!confirm('Cancel adding the rest to Calendar?')) return;
  S.settings.exportQueue = [];
  save(); render();
}
function renderExportQueue(m){
  setHeader('Adding to Calendar', true);
  const q = S.settings.exportQueue || [];
  if(!q.length){
    m.innerHTML = `<div class="empty">
      <div class="et">All done</div>
      <div class="eb">Nothing left in the queue.</div></div>
      <button class="btn" onclick="goToEvents()">Back to events</button>`;
    return;
  }
  const next = S.events.find(x=>x.id===q[0] && !x.deleted);
  if(!next){ S.settings.exportQueue = q.slice(1); save(); return renderExportQueue(m); }
  const alreadyDone = S.events.filter(e=>!e.deleted && e.exported && e.date>=todayISO()).length;
  const total = q.length + alreadyDone;
  m.innerHTML = `<div class="card" style="background:var(--green);color:var(--on-accent)">
    <div style="font-weight:800;margin-bottom:4px">Adding events to Calendar</div>
    <div style="font-size:13px;opacity:0.92;margin-bottom:4px">${alreadyDone+1} of ${total}: ${esc(next.title)}</div>
    <div style="font-size:12px;opacity:0.85;line-height:1.45;margin-bottom:10px">
      Tap <b>Add next</b> → Calendar opens → tap <b>Add</b> → come back and repeat.
    </div>
    <button class="btn" style="background:var(--card);color:var(--accent);margin-bottom:2px" onclick="exportNextInQueue()">Add next event →</button>

// A soft crossfade between screens on navigation (View Transitions API). Only
// the changed part (#main) visibly fades — header/nav are identical old→new, so
// crossfading them shows nothing. Falls back to an instant render where the API
// is absent or reduced-motion is on, so behaviour never depends on it.
function withTransition(fn){
  const reduce = typeof window !== 'undefined' && window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(typeof document !== 'undefined' && document.startViewTransition && !reduce){
    try{
      const t = document.startViewTransition(fn);
      // A ViewTransition's `ready` and `finished` are PROMISES, and a skipped
      // or superseded transition REJECTS them. The try/catch around this call
      // is synchronous and cannot catch a promise, so those rejections escaped
      // to window.onunhandledrejection and were filed as "App: Background task
      // did not finish" with the detail "Transition was aborted because of
      // invalid state" -- a false app fault, observed in a live v9.78 report.
      //
      // The DOM update itself still ran, so there is nothing to recover here,
      // only something to stop misreporting. NOT PROVEN, and deliberately not
      // guessed at: WHY the transition aborted. That needs a reproduction, and
      // this change neither fixes it nor claims to.
      if(t && t.finished && t.finished.catch) t.finished.catch(() => {});
      if(t && t.ready && t.ready.catch) t.ready.catch(() => {});
      return;
    }catch(e){ /* fall through */ }
  }
  fn();
}
/**
 * Move to a tab, optionally landing on a named half of the Notes tab.
 *
 * `area` exists so performRoute does not have to reach into S.settings itself.
 * Both halves of the Notes tab are addressable by name -- asking Gordon for
 * notes must not drop you on lists just because that is where you were last --
 * and until v9.89 the router achieved that by writing S.settings.notesArea and
 * calling save(), which made the app's stated invariant ("performRoute NEVER
 * writes", CLAUDE.md) untrue. nav() already did exactly this write for 'lists',
 * so the rule belongs here in full rather than half here and half in the router.
 *
 * A tab TAP passes no area and is unchanged: the Notes tab still remembers
 * which half you were on. Only a caller that names an area moves you.
 */
function nav(tab, area){
  closeSheet(); askOrigin = null;
  // 'lists' was a tab of its own until v9.61 and is still the name people, the
  // router and the a11y audit use. Translate it instead of stranding the caller
  // on a view.tab that the `tabs` map no longer answers to.
  if(tab === 'lists'){ area = 'lists'; tab = 'notes'; }
  // No save() here, deliberately, matching what nav('lists') has always done:
  // this is where you are looking, and it rides along with the next write.
  if(area && S.settings) S.settings.notesArea = area === 'lists' ? 'lists' : 'notes';
  view = {tab, sub:null, data:null};
  withTransition(render);
}
function sub(name, data){ closeSheet(); view.sub = name; view.data = data||null; withTransition(render); }

function renderNav(){

    const on = view.tab === t.id;

    return `<button class="${on?'on':''}"${on?' aria-current="page"':''} onclick="nav('${t.id}')">
      <span class="ic">${t.ic}</span>${t.label}</button>`;
  }).join('');

function setHeader(title, showBack, onBack){

  // you were and closeAsk() puts you back, form state and all. So the answer

function render(){

  const key = view.tab + '|' + (view.sub||'');
  const y = window.scrollY;
  renderNav();

    noteGroups:renderNoteGroups, noteArchive:renderNoteArchive,
    recipeBox:renderRecipeBox, recipeForm:renderRecipeForm,

    problems:renderProblems,     selfTest:renderSelfTest, compare:renderCompare, bench:renderBench,

    setBackup:renderSetBackup, setTrouble:renderSetTrouble,
    setDismissed:renderSetDismissed, setDeleted:renderSetDeleted,
    ask:renderAsk};
  const tabs = {events:renderEvents, chores:renderChores,
    notes:renderNotes, meals:renderMeals, settings:renderSettings};
  const changedScreen = key !== lastViewKey;
  m.classList.remove('enter');
  m.classList.remove('hascomposer');   // only the Ask screen has a composer
  m.classList.remove('isform');        // only form screens need the extra clearance
  (view.sub ? subs[view.sub] : tabs[view.tab])(m);
  // Above every screen, not just the one where the save happened to fail.
  if(saveFailed) m.innerHTML = saveFailedBanner() + m.innerHTML;
  if(changedScreen){
    // Retrigger the animation. Only on a genuine navigation -- animating every
    // re-render would make simple taps feel laggy.
    m.classList.add('enter');
    if(m.getAnimations){
      // Restart via the Web Animations API. The old `void m.offsetWidth`
      // trick works by forcing a synchronous layout, which a Lighthouse
      // trace measured at 39ms per navigation -- the app's biggest blocking
      // cost. This reads no layout at all.
      m.getAnimations().forEach(a => { a.cancel(); a.play(); });
    } else {
      void m.offsetWidth;                    // pre-Safari-13.1 fallback
    }
    // Focus follows the navigation, or a screen-reader/keyboard user stays
    // parked on the control they just left. preventScroll because iOS will
    // otherwise jump the page; the guard keeps typing (which re-renders the
    // same screen) from stealing focus mid-word.
    try{ m.focus({ preventScroll:true }); }catch(e){ /* older WebKit */ }
  }
  if(key === lastViewKey) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastViewKey = key;
}

    if(b.icon){

function withContext(blocks){
  const ctx = contextBlock();

}

function contextBlock(){
