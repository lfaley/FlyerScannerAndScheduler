// ---------- Cross-app exchange (recipe app) ----------
// Same origin as https://lfaley.github.io/meal-planner-shoppin/, so we trade
// through two localStorage keys. One writer per key, no merging.
//   mealplan-out           <- recipe app writes, we read
//   flyersnap-scanned-out  <- we write, recipe app reads
// We NEVER write mealplan-out or any mealplanner-* key, and never touch their
// IndexedDB database (MealPlannerDB).

const MEALPLAN_KEY = 'mealplan-out';
const SCANNED_KEY = 'flyersnap-scanned-out';
const SCANNED_KEEP = 20;          // they dedupe by id; we just keep a rolling window
const RECIPE_APP_URL = 'https://lfaley.github.io/meal-planner-shoppin/';

function readMealPlan(){
  try{
    const raw = localStorage.getItem(MEALPLAN_KEY);
    if(!raw) return null;
    const env = JSON.parse(raw);
    if(!env || env.schema !== 'mealplan-exchange.v1' || !Array.isArray(env.meals)) return null;
    return env;
  }catch(e){ return null; }   // unreadable = no data, never an error
}

function plannedMeals(){
  const env = readMealPlan();
  if(!env) return [];
  const today = todayISO();
  return env.meals
    .filter(m => m && m.date >= today && SLOTS.includes(m.slot))
    .sort((a,b) => a.date === b.date
      ? SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot)
      : a.date.localeCompare(b.date));
}

function mealsByDate(){
  const map = {};
  plannedMeals().forEach(m => { (map[m.date] = map[m.date] || []).push(m); });
  return map;
}

function recipeUrl(meal){
  const env = readMealPlan();
  if(!env || !env.recipeUrlTemplate || !meal.recipeId) return null;
  return env.recipeUrlTemplate.replace('{id}', meal.recipeId);   // rb_ prefix stays; their router strips it
}
function shoppingUrl(){
  const env = readMealPlan();
  return (env && env.shoppingListUrl) || RECIPE_APP_URL;
}
function openUrl(u){ if(u) window.open(u, '_blank'); }

// --- what we send them: recipes the scanner produced ---
function queueScannedRecipe(r){
  let env;
  try{
    env = JSON.parse(localStorage.getItem(SCANNED_KEY) || 'null');
  }catch(e){ env = null; }
  if(!env || env.schema !== 'recipe-exchange.v1' || !Array.isArray(env.recipes)){
    env = { schema:'recipe-exchange.v1', updatedAt:new Date().toISOString(), recipes:[] };
  }
  env.recipes.push({
    id: 'fs_' + uid(),                       // their collision guard rejects anything not fs_*
    title: r.title,
    category: r.category || null,
    ingredients: r.ingredients || '',
    instructions: r.instructions || '',
    updatedAt: new Date().toISOString(),
    source: 'Scanned in FlyerSnap'
  });
  if(env.recipes.length > SCANNED_KEEP) env.recipes = env.recipes.slice(-SCANNED_KEEP);
  env.updatedAt = new Date().toISOString();
  try{
    localStorage.setItem(SCANNED_KEY, JSON.stringify(env));
    return true;
  }catch(e){ return false; }
}
// Recipes from FlyerSnap's retired Recipe Box. The migration stashed them
// rather than deleting them; this is their way out to the library of record.
function legacyRecipes(){
  return (S.legacyRecipes || []).filter(r => r && r.title && !r.deleted && !r.sentToRecipeApp);
}

function sendLegacyRecipes(){
  const pending = legacyRecipes();
  if(!pending.length){ toast('No old recipes left to send'); return; }
  let sent = 0;
  for(const r of pending){
    const ok = queueScannedRecipe({
      title: r.title,
      category: r.category,
      ingredients: r.ingredients || '',
      instructions: r.instructions || ''
    });
    if(!ok) break;                       // storage full — stop, keep the rest for a retry
    r.sentToRecipeApp = true;
    sent++;
  }
  save(); render();
  if(sent){
    toast(`Sent ${sent} recipe${sent===1?'':'s'} — confirm them in the Recipe app`);
  } else {
    toast('Could not send: storage is full');
  }
}

function scannedCount(){
  try{
    const env = JSON.parse(localStorage.getItem(SCANNED_KEY) || 'null');
    return (env && Array.isArray(env.recipes)) ? env.recipes.length : 0;
  }catch(e){ return 0; }
}

// ---------- Meals tab (read-only view of the recipe app's plan) ----------

function renderMeals(m){
  setHeader('Meal Plan', false);
  const env = readMealPlan();
  const byDate = mealsByDate();
  const dates = Object.keys(byDate).sort();

  let html = '';

  if(!env){
    html += emptyState('utensils', 'No meal plan yet',
      'Meals are planned in the Recipe app. Once you plan a week there, it shows up here with links back to each recipe.',
      `<button class="btn" onclick="openUrl(RECIPE_APP_URL)">${ico('pan')}Open Recipe app</button>`)
      + `<div class="actionrow" style="margin-top:10px">
        <button class="btn alt" onclick="sub('recipeBox')">${ico('camera')}Scan a recipe</button>
        <button class="btn alt" onclick="mealPlanDiagnostic()">${ico('search')}Why no meals?</button>
      </div>`;
    m.innerHTML = html;
    return;
  }

  html += `<div class="actionrow">
    <button class="btn alt" onclick="openUrl(RECIPE_APP_URL)">${ico('pan')}Recipe app</button>
    <button class="btn alt" onclick="openUrl(shoppingUrl())">${ico('cart')}Shopping list</button>
    <button class="btn alt" onclick="sub('recipeBox')">${ico('camera')}Scan a recipe</button>
  </div>`;

  if(!dates.length){
    html += `<div class="empty"><div class="eb">Nothing planned for the days ahead. Plan a week in the Recipe app and it'll appear here.</div>
      <div style="text-align:center;margin-top:10px"><button class="linkbtn" onclick="mealPlanDiagnostic()">${ico('search')}Why don't I see my meals?</button></div></div>`;
    m.innerHTML = html;
    return;
  }

  const SLOT_LABEL = { breakfast:'B', lunch:'L', snack:'Sn', dinner:'D', dessert:'Ds' };
  html += dates.map(d => {
    const idx = daysUntil(d);
    const label = idx === 0 ? 'Today' : idx === 1 ? 'Tomorrow' : friendly(d);
    return `<div class="card">
      <div style="font-size:14px;font-weight:800;margin-bottom:6px">${label}</div>` +
      byDate[d].map((meal, i) => `<div class="slot" onclick="mealActions('${d}','${meal.slot}')">
        <span class="slotb">${SLOT_LABEL[meal.slot]}</span>
        <span class="slottext grow">${esc(meal.title || 'Planned')}</span>
        <span class="meta">${ico('chevron-right')}</span>
      </div>`).join('') + `</div>`;
  }).join('');

  if(env.updatedAt){
    html += `<div class="help" style="text-align:center;font-size:11px">Plan updated ${new Date(env.updatedAt).toLocaleString()}</div>`;
  }
  m.innerHTML = html;
}

// Health, not a wall of numbers. Two questions get answered on the screen --
// "is it working" and "is it slow" -- and everything else lives in the export,
// because a phone is a bad place to read a log.
function aiHealthLine(){
  const s = summarize(S.aiLog || []);
  if(!s.calls) return 'No AI calls recorded yet.';
  const parts = [s.calls + ' AI call' + (s.calls === 1 ? '' : 's')];
  parts.push(s.failed ? s.failed + ' failed' : 'none failed');
  if(s.medianMs != null) parts.push('typically ' +
    (s.medianMs >= 1000 ? (s.medianMs/1000).toFixed(1) + 's' : s.medianMs + 'ms'));
  if(s.fellBack) parts.push('fell back to Anthropic ' + s.fellBack + '\u00d7');
  return parts.join(' \u00b7 ') + '.';
}

// `withHeading` is false when the page it sits on is ALREADY titled the same

      ${ico('alert')}${problems} problem${problems===1?'':'s'} to look at</button>`

    <button class="btn${failed ? '' : ' alt'}" onclick="shareDiagnostics()">
      ${ico('share')}Send diagnostics</button>

/**
 * The opt-out had no control until v9.29: the flag was honoured in two places
 * and set nowhere, so the only way to stop automatic reporting was to edit
 * localStorage by hand.
 *
 * The help text beside it is a STANDARD, not a description -- "never your
 * events, notes, email contents, or API key" is guaranteed by the ruling in
 * ERROR-LOGGING-RULINGS-REPLY.md (every field of an automatic report is
 * diagnostics-only) and enforced by isThirdPartyContent() in js/errorReport.js.
 * Do not soften that wording without changing the standard first.
 *
 * Stored INVERTED (`errorReportsOff`) so that an absent value means reporting
 * is on, which is what every install before v9.24 already assumed.
 */
function setErrorReports(on){
  S.settings.errorReportsOff = !on;
  save();
  toast(on ? 'Error reports on' : 'Error reports off — problems stay on this phone');

function mealPlanDiagnostic(){
  let raw = null, err = null;
  try{ raw = localStorage.getItem(MEALPLAN_KEY); }catch(e){ err = e.message; }

  const lines = [];
  if(err){
    lines.push('Could not read storage: ' + err);
  } else if(raw === null){
    lines.push('The recipe app has not written a meal plan to this app\'s storage.');
    lines.push('');
    lines.push('Most likely: the recipe app and FlyerSnap are not sharing storage.');
    lines.push('iOS keeps an installed home-screen app separate from Safari, even on the same site.');
    lines.push('');
    lines.push('Try this: open the RECIPE app the SAME way you opened FlyerSnap.');
    lines.push('If FlyerSnap is your home-screen icon, add the recipe app to your home screen too and plan/join from that icon — not from a Safari tab.');
  } else {
    let env = null;
    try{ env = JSON.parse(raw); }catch(e){ /* `if(!env)` below IS the failure path: it prints the unparseable text */ }
    if(!env){
      lines.push('A meal plan exists but could not be read (not valid JSON).');
      lines.push('First 200 characters:');
      lines.push(raw.slice(0, 200));
    } else {
      lines.push('Found a meal plan in storage.');
      lines.push('Schema: ' + (env.schema || '(none)'));
      lines.push('Total meals in plan: ' + (Array.isArray(env.meals) ? env.meals.length : 'not an array'));
      if(Array.isArray(env.meals) && env.meals.length){
        const today = todayISO();
        const upcoming = env.meals.filter(m => m && m.date >= today);
        const slots = [...new Set(env.meals.map(m => m && m.slot))];
        lines.push('Upcoming (today or later): ' + upcoming.length);
        lines.push('Slots present: ' + slots.join(', '));
        const dates = env.meals.map(m => m && m.date).sort();
        lines.push('Date range: ' + dates[0] + ' to ' + dates[dates.length-1]);
        lines.push('Today is: ' + today);
        if(!upcoming.length){
          lines.push('');
          lines.push('>> All planned meals are in the PAST, so nothing shows. Plan a meal for today or later.');
        } else if(env.schema !== 'mealplan-exchange.v1'){
          lines.push('');
          lines.push('>> Schema is not mealplan-exchange.v1, so FlyerSnap ignores it. The recipe app is writing the wrong format.');
        } else {
          const goodSlots = upcoming.filter(m => SLOTS.includes(m.slot));
          lines.push('');
          if(goodSlots.length){
            lines.push('>> ' + goodSlots.length + ' meal(s) SHOULD be showing. Close and reopen FlyerSnap.');
          } else {
            lines.push('>> Upcoming meals exist but none are breakfast/lunch/dinner. FlyerSnap shows: ' + SLOTS.join(', ') + '.');
          }
        }
      }
    }
  }
  alert(lines.join('\n'));
}

function mealActions(date, slot){
  const meal = plannedMeals().find(x => x.date === date && x.slot === slot);
  if(!meal) return;
  const rUrl = recipeUrl(meal);
  const buttons = [];
  if(rUrl) buttons.push({ label:'Open recipe', icon:'book', fn:()=>openUrl(rUrl) });
  buttons.push({ label:'Open shopping list', icon:'cart', fn:()=>openUrl(shoppingUrl()) });
  showSheet(meal.title || 'Planned meal',
    friendly(date) + ' · ' + slot.charAt(0).toUpperCase() + slot.slice(1), buttons);
}

let recipeBatch = null;      // { files:[], done:[], mode:'separate'|'one' }

async function handleRecipeScan(files){
  const list = Array.from(files || []).filter(Boolean);
  if(!list.length) return;
  const setupErr = aiSetupError();
  if(setupErr){ alert(setupErr); nav('settings'); return; }

  if(list.length === 1) return runRecipeScan(list, 'one');

  showSheet(list.length + ' photos', 'Are these separate recipes, or pages of one?', [
    {label:list.length + ' separate recipes', icon:'layers', fn:()=>runRecipeScan(list, 'separate')},
    {label:'Pages of one recipe', icon:'file', fn:()=>runRecipeScan(list, 'one')},
  ]);
}

async function runRecipeScan(list, mode){
  try{
    if(mode === 'one'){
      sub('busy', {msg:'Reading the recipe…', hint: list.length>1 ? list.length + ' pages' : ''});
      const images = [];
      for(const f of list) images.push(await readImageDownscaled(f));
      const r = await extractRecipeFromImages(images);
      recipeForm = toRecipeForm(r);
      recipeBatch = null;
      sub('recipeForm');
      return;
    }
    // Separate recipes: read them all, then review one at a time.
    recipeBatch = { pending:[], total:list.length };
    for(let i = 0; i < list.length; i++){
      sub('busy', {msg:'Reading recipe ' + (i+1) + ' of ' + list.length + '…', hint:''});
      try{
        const im = await readImageDownscaled(list[i]);
        const r = await extractRecipeFromImages([im]);
        recipeBatch.pending.push(toRecipeForm(r));
      }catch(e){ logProblem('Recipe scan', 'A photo could not be read', e.message); }
    }
    if(!recipeBatch.pending.length){
      recipeBatch = null;
      alert('None of those photos looked like a recipe.');
      sub('recipeBox');
      return;
    }
    nextBatchRecipe();
  }catch(err){
    recipeBatch = null;
    logProblem('Scanning', err.message, scanContext || null);
    // handleLinkCapture already translates this one; the scan path never got
    // the same treatment and showed the literal string "Scan failed: NO_API_KEY".
    // Which sentence is right depends on which provider was being asked.
    if(err.message === 'NO_API_KEY'){
      alert(aiProvider() === 'local'
        ? 'Could not read that.\n\nGordon did not answer, and there is no Anthropic API key saved to stand in. Sign in to Gordon, or add a key in Settings → Gordon and AI.'
        : 'Add your Anthropic API key in Settings first.');
    } else {
      alert('Scan failed: ' + err.message);
    }
    sub('recipeBox');
  }
}

function toRecipeForm(r){
  return { title:r.title||'', category:['Breakfast','Lunch','Dinner','Snack','Other'].includes(r.category)?r.category:'Other',
    ingredients:r.ingredients||'', instructions:r.instructions||'' };
}

function skipBatchRecipe(){
  recipeForm = null;
  nextBatchRecipe();
}

function nextBatchRecipe(){
  if(!recipeBatch || !recipeBatch.pending.length){ recipeBatch = null; sub('recipeBox'); return; }
  recipeForm = recipeBatch.pending.shift();
  sub('recipeForm');
}

async function gordonSignInUI(){

  if(!email || !password){ if(msg) msg.textContent = 'Enter both your email and password.'; return; }
  if(msg) msg.textContent = 'Signing in…';
  try{
    await gordonSignIn(email, password);

// ---------------------------------------------------------------------------
// Recently Deleted (v9.83). The window without this screen was storage spent on
// a safety net nobody could reach: a soft delete was invisible, and the only
// route back to a row was an undo toast that leaves after 7 seconds. Google
// Drive, Apple Photos, Apple Notes and Dropbox all pair the retention window
// with a place you can browse -- see DATA-LOSS-PLAN.md 1.4.
//
// Sibling of renderSetDismissed, deliberately: that screen is already this
// pattern for suppressions, and two ways back should not look like two
// different ideas.
// ---------------------------------------------------------------------------

// Which collections carry soft deletes, and how to name a row in each. ONE
// table, so a new collection is added here rather than in three separate
// switches.
//
// noteFolders/noteLabels were absent, with a comment saying a folder "comes
// back by re-adding it under the same name". Measured, and it did not: the row
// came back EMPTY, because nothing remembered what had been in it. They are
// here now, and delNoteGroup writes that membership onto the tombstone so
// Restore can honour it. This screen promises "anything you delete waits here
// for 30 days" -- two collections quietly opting out made that false.
const DELETED_COLLS = [
  { coll:'events',      label:'Event',     name: r => r.title || 'Untitled' },
  { coll:'chores',      label:'Chore',     name: r => r.title || 'Untitled' },
  { coll:'lists',       label:'List',      name: r => r.name  || 'Untitled' },
  { coll:'listItems',   label:'List item', name: r => r.text  || 'Untitled' },
  { coll:'notes',       label:'Note',      name: r => noteTitleOf(r) || 'Untitled' },
  { coll:'rewards',     label:'Reward',    name: r => r.title || 'Untitled' },
  { coll:'kids',        label:'Person',    name: r => r.name  || 'Untitled' },
  { coll:'noteFolders', label:'Note folder', name: r => r.name || 'Untitled' },
  { coll:'noteLabels',  label:'Note label',  name: r => r.name || 'Untitled' },
];

/** Every soft-deleted row across every collection, newest deletion first. */
function deletedRows(){
  const out = [];
  DELETED_COLLS.forEach(d => (S[d.coll] || []).forEach(r => {
    if(r && r.deleted){
      out.push({ coll:d.coll, label:d.label, id:r.id, name:d.name(r), at:r.deletedAt || null });
    }
  }));
  // Undated rows sort last. They are the ones prune will never remove, so they
  // are the least urgent thing here.
  return out.sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
}

function deletedCount(){ return deletedRows().length; }

/** Whole days before prune may take it. null when the row carries no date. */
function daysLeftDeleted(at){
  if(!at) return null;
  const due = Date.parse(at) + KEEP_SOFT_DELETED_DAYS * 24 * 3600 * 1000;
  if(!isFinite(due)) return null;
  return Math.max(0, Math.ceil((due - Date.now()) / (24 * 3600 * 1000)));
}

function restoreDeleted(coll, id){
  const row = (S[coll] || []).find(x => x.id === id);
  if(!row) return;
  unmarkDeleted(row);
  // A folder or a label comes back WITH the notes that were in it. Saying the
  // number matters: relink deliberately skips a note you have since deleted or
  // filed elsewhere, so "3 notes back in it" and "1 note back in it" are
  // different outcomes and the user is the only one who can tell whether the
  // difference is right.
  const back = relinkNoteGroup(coll, row);
  save(); render();
  toast(back
    ? 'Restored — ' + back + ' note' + (back === 1 ? '' : 's') + ' back in it'
    : 'Restored');
}

function purgeDeleted(coll, id){
  const row = (S[coll] || []).find(x => x.id === id);
  if(!row) return;
  // The one place in the app that hard-deletes on purpose, so it asks -- and it
  // says the part that matters, which is that there is no undo behind it.
  if(!confirm('Delete this permanently?\n\nIt cannot be brought back.')) return;
  S[coll] = (S[coll] || []).filter(x => x.id !== id);
  save(); render();
  toast('Deleted permanently');
}

function saveLocalModel(){

  let url = (b ? b.value : '').trim().replace(/\/+$/,'');
  if(url && !/^https:\/\//.test(url)){
    alert('The URL must start with https://\n\nA page served over HTTPS cannot call a plain http:// address — use the Tailscale https://...ts.net address, not an IP.');
    return;
  }
  if(url && !/\/v1$/.test(url)) url += '/v1';

  // back to GORDON_MODEL (`callLocalModel`, `probeLocalContext`), so this line

  // photo at all, and is slower than the vision model it replaced. That is how
  // Logan's Ollama ended up serving the wrong model on 24 Aug.

// A 1x1 PNG. Small enough to send anywhere, real enough to prove the image
// pipeline works end to end rather than just the text path.
const TINY_PNG = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';

let selfTestResults = [];

async function runLocalSelfTest(){
  selfTestResults = [];
  const add = (name, ok, detail) => selfTestResults.push({ name, ok, detail: detail || '' });

  const base = ((S.settings.localBaseUrl||'').trim() || GORDON_BASE_URL).replace(/\/+$/,'');
  const model = (S.settings.localModel||'').trim() || GORDON_MODEL;

  // Stage 1 -- configuration, before any network work.
  if(!base){ add('Base URL saved', false, 'empty'); sub('selfTest'); return; }
  add('Base URL saved', /^https:\/\//.test(base), base);
  add('Model name saved', !!model, model || 'missing');

  // Stage 2 -- can we reach it at all, and does it list our model?
  sub('busy', {msg:'Checking the connection…', hint:'/models'});
  try{
    const data = await jsonpRequestOrFetch(base + '/models');
    const ids = (data && data.data || []).map(m => m.id || '');
    add('Server reachable', true, ids.length + ' model(s) available');
    add('Chosen model is installed', ids.some(id => id === model || id.indexOf(model) === 0),
      ids.length ? ids.slice(0,6).join(', ') : 'none listed');
  }catch(err){
    add('Server reachable', false, err.message);
    sub('selfTest'); return;
  }

  // Stage 3 -- a plain text round trip.
  sub('busy', {msg:'Testing text…', hint:'first call loads the model, be patient'});
  let textOut = '';
  try{
    textOut = await callLocalModel([{type:'text', text:'Reply with exactly: READY'}], 50,
      'Answer in one word.');
    add('Text request works', /READY/i.test(textOut), JSON.stringify(textOut).slice(0,80));
  }catch(err){
    add('Text request works', false, err.message);
    sub('selfTest'); return;
  }

  // Stage 4 -- did thinking actually get disabled? This was assumed, not verified.
  const leaked = /<think>|Thinking\.\.\.|done thinking/i.test(textOut);
  add('Thinking is off', !leaked,
    leaked ? 'reasoning leaked into the answer — the cleaner is doing the work'
           : 'no reasoning trace in the reply');

  // Stage 4b -- the window. This is the check that would have saved Logan two
  // 48-second failures and an afternoon: the arithmetic was already decided
  // before either request left the phone.
  const ctx = await probeLocalContext();
  const seen = observedPromptTokens(S.aiLog || [], 'extract.image', 'local');
  if(ctx === null){
    add('Context window big enough', true,
      'the server does not report it — cannot check, so nothing is clamped');
  }else{
    const need = (seen && seen.tokens) || 2400;   // a measured flyer, or a typical one
    const plan = planBudget({ ctx, promptTokens: need, want: 4000 });
    add('Context window big enough', plan.ok,
      plan.ok
        ? `${ctx} tokens; a flyer costs about ${need}, leaving ${plan.room} for the answer`
          + (plan.clamped ? ' (answers will be clamped to fit)' : '')
        : `${ctx} tokens is not enough — ${plan.detail} Set OLLAMA_CONTEXT_LENGTH=16384 and restart Ollama.`);
  }

  // Stage 5 -- vision. The whole scanner depends on this.
  sub('busy', {msg:'Testing vision…', hint:'sending a test image'});
  try{
    const out = await callLocalModel([
      {type:'image', source:{type:'base64', media_type:'image/png', data:TINY_PNG}},
      {type:'text', text:'Reply with exactly: SAW_IMAGE'}], 50, 'Answer in one word.');
    const refused = /cannot|unable|no image|don.t see/i.test(out);
    add('Vision works', !refused, JSON.stringify(out).slice(0,100));
  }catch(err){
    add('Vision works', false, err.message);
  }

  // Stage 6 -- strict JSON, which every extraction depends on.
  // Exercise the real job: a scrap of text with a date in it, asked for in the
  // exact shape extraction uses. The earlier version of this stage asked for an
  // arbitrary {"ok":true} while sending the calendar-secretary persona, which
  // told the model to discard anything without a date -- so an empty reply was
  // the model behaving correctly, and the test was simply wrong.
  sub('busy', {msg:'Testing extraction…', hint:'a small sample with one date'});
  try{
    const sample = 'Reminder: Picture Day is on Friday, September 11, 2026 at 9:00 AM in the gym.';
    const out = await callLocalModel(
      [{type:'text', text:sample}, {type:'text', text:eventPrompt()}], 2000, GROUNDING_EVENTS);
    let parsed = null;
    try{ parsed = JSON.parse(out); }catch(e){ /* a non-JSON reply is a FAILED self-test, reported by `gotOne` below, not an error here */ }
    const arr = Array.isArray(parsed) ? parsed : (parsed && parsed.events);
    const gotOne = Array.isArray(arr) && arr.length >= 1 && arr[0] && arr[0].date;
    add('Extracts events as JSON', !!gotOne,
      gotOne ? (arr.length + ' event: ' + (arr[0].title||'') + ' ' + arr[0].date)
             : ('could not parse: ' + JSON.stringify(out).slice(0,120)));
  }catch(err){
    add('Extracts events as JSON', false, err.message);
  }

  sub('selfTest');
}

// /models is a plain GET; use fetch where CORS allows and fall back to JSONP.
async function jsonpRequestOrFetch(url){
  const gtok = await gordonAuthToken();
  if(!gtok) throw new Error('Sign in to Gordon first (Settings → Gordon and AI).');
  try{
    const res = await fetch(url, { headers:{ 'Authorization':'Bearer ' + gtok } });
    if(!res.ok) throw new Error('status ' + res.status);
    return await res.json();
  }catch(e){
    throw new Error(e.message + ' (check OLLAMA_ORIGINS includes this site, and OLLAMA_HOST=0.0.0.0)');
  }
}

// P1.5 -- run the SAME input through both providers and show the results side by
// side. Turns "is local good enough" from an opinion into something you can look
// at. Scoring is deliberately not automatic: you judge, because only you know
// which dates were really on the page.
let compareResult = null;

async function compareProviders(file){
  if(!file) return;
  compareResult = { name: file.name || 'image', anthropic:null, local:null,
                    anthropicErr:null, localErr:null };
  try{
    const { base64, mediaType } = await readImageDownscaled(file);
    const blocks = () => ([
      {type:'image', source:{type:'base64', media_type:mediaType, data:base64}},
      ...(contextBlock()?[contextBlock()]:[]), {type:'text', text:eventPrompt()}]);

    // In memory only. Nothing here is saved, so an app that dies mid-comparison
    // leaves the user's real settings exactly as they were.
    aiOverride = { provider:null, fallback:false };   // never let one provider answer for the other

    sub('busy', {msg:'Reading with Anthropic…', hint:''});
    try{
      aiOverride.provider = 'anthropic';
      compareResult.anthropic = parseExtractedEvents(
        await callAI(blocks(), 8000, GROUNDING_EVENTS, 'compare.anthropic')) || [];
    }catch(err){ compareResult.anthropicErr = err.message; }

    sub('busy', {msg:'Reading with the local model…', hint:'this one may be slower'});
    try{
      aiOverride.provider = 'local';
      compareResult.local = parseExtractedEvents(
        await callAI(blocks(), 8000, GROUNDING_EVENTS, 'compare.local')) || [];
    }catch(err){ compareResult.localErr = err.message; }
  }catch(err){
    compareResult.anthropicErr = compareResult.anthropicErr || err.message;
  }finally{
    // Dropping the override IS the restore. There is nothing to put back,
    // because nothing was taken.
    aiOverride = null;
  }
  sub('compare');
}

function compareColumn(title, events, err){
  if(err) return `<div class="card" style="border-left:5px solid var(--red)">

// Its own file kind and its own shape -- the two benchmarks measure different
// things and a reader must not have to guess which one it is holding.
function exportExtractionBenchmark(){
  try{
    const s = benchSummary();
    const payload = {
      kind: 'flyersnap-extraction-benchmark',
      version: 1,
      generatedAt: new Date().toISOString(),
      app: { version: APP_VERSION, provider: benchState.provider, model: benchState.model,
             elapsedMs: benchState.ms },
      summary: s,
      cases: benchState.results.map(r => ({
        id: r.id, precision: r.precision, recall: r.recall,
        matched: r.matched, missed: r.missed, invented: r.invented,
        misdated: r.misdated,
        fields: r.fields,
        transportError: r.transportError ? redact(r.transportError) : undefined,
      })),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'flyersnap-extraction-benchmark-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast(`Exported ${payload.cases.length} results`);
  }catch(e){
    alert('Could not build the benchmark file: ' + (e && e.message));
  }
}

// Which long details the user has opened, and whether the passing checks are
// hidden. Kept OUT of S: this is a view preference for one run of one screen,
// and nothing here is worth surviving a restart or reaching the save file.
let selfTestOpen = {};
let selfTestFailsOnly = false;

// Below this, a detail is short enough that clamping it saves nothing and
// costs a control. Measured against the real strings this screen prints:
// "200 OK" and "3 model(s) available" are ~20 characters; a dumped model list
// or a stack-ish error runs to several hundred.
const DETAIL_CLAMP_AT = 140;

function toggleSelfTestDetail(i){
  selfTestOpen[i] = !selfTestOpen[i];
  render();
}

function toggleSelfTestFailsOnly(){
  selfTestFailsOnly = !selfTestFailsOnly;
  render();
}

function renderSelfTest(m){
  setHeader('Local Model Self-Test', true);
  const pass = selfTestResults.filter(r=>r.ok).length;
  const failed = selfTestResults.length - pass;
  // Index against the FULL list, so filtering the view cannot make an opened
  // detail snap shut or -- worse -- open a different one.
  const rows = selfTestResults.map((r, i) => ({ r, i }))
    .filter(x => !selfTestFailsOnly || !x.r.ok);

  let html = `<div class="card" style="border-left:5px solid ${pass===selfTestResults.length?'var(--accent)':'var(--amber-accent)'}">
    <div style="font-weight:800">${pass} of ${selfTestResults.length} checks passed</div></div>`;

  // Only offered when it would do something. A "hide passing" control on a
  // run with nothing to hide is a control that lies about having work to do.
  if(failed && pass){
    html += `<button class="btn alt" aria-pressed="${selfTestFailsOnly ? 'true' : 'false'}"
        onclick="toggleSelfTestFailsOnly()">${ico(selfTestFailsOnly ? 'layers' : 'alert')}${
      selfTestFailsOnly
        ? `Show all ${selfTestResults.length} checks`
        : `Show only the ${failed} that failed`}</button>`;
  }

  html += rows.map(({ r, i }) => {
    const detail = String(r.detail || '');
    const long = detail.length > DETAIL_CLAMP_AT;
    const open = !!selfTestOpen[i];
    return `<div class="card">
    <div class="row">
      <div class="grow">
        <div style="font-weight:700;font-size:var(--t-sm)">${r.ok?'✓':'✗'} ${esc(r.name)}</div>
        ${detail?`<div id="std${i}" class="meta${long && !open ? ' clamp3' : ''}"
            style="font-size:var(--t-cap);word-break:break-word">${esc(detail)}</div>`:''}
        ${long?`<button class="morebtn" aria-expanded="${open ? 'true' : 'false'}"
            aria-controls="std${i}"
            onclick="toggleSelfTestDetail(${i})">${
          open ? 'Show less' : 'Show all ' + detail.length + ' characters'}</button>`:''}
      </div></div></div>`;
  }).join('');

  html += `<button class="btn alt" onclick="runLocalSelfTest()">Run again</button>`;
  m.innerHTML = html;
}

function saveWatcher(){
  let u = (document.getElementById('watcherUrl').value||'').trim();
  let t = (document.getElementById('watcherToken').value||'').trim();

  // Pasting the whole working URL is the obvious thing to do, so handle it:
  // pull the token out and keep the URL clean rather than doubling the param.
  const q = u.indexOf('?');
  if(q >= 0){
    const qs = u.slice(q + 1);
    u = u.slice(0, q);
    const m = /(?:^|&)token=([^&]*)/.exec(qs);
    if(m && !t){ try{ t = decodeURIComponent(m[1]); }catch(e){ t = m[1]; } }
  }
  u = u.replace(/\/+$/, '');

  if(u && !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u)){
    alert('That does not look like a deployment URL.\n\nIt should look like:\nhttps://script.google.com/macros/s/AKfy.../exec\n\nCopy it from Deploy > Manage deployments > Web app > Copy. The /dev URL will not work.');
    return;
  }
  const wasConfigured = watcherConfigured();
  S.settings.watcherUrl = u;
  S.settings.watcherToken = t;
  if(u && !wasConfigured) S.settings.lastEmailCheck = null;   // let the first check run now
  save(); render();
  toast(u ? 'Watcher saved — tap Test to check it' : 'Watcher disconnected');
  if(u) maybeCheckEmail();
}

function alertSummary(kind){
  const plan = alertPlan(kind);
  if(!plan.alarms.length) return `<div class="help" style="color:var(--red)">No alerts — pick at least one.</div>`;
  let s = `Calendar alerts: ${plan.alarms.map(alertLabel).join(' and ')}.`;
  const chosen = ((S.settings.alerts||{})[kind]||[]).slice().sort((x,y)=>x-y);
  const overflow = chosen.slice(2);
  if(overflow.length){
    s += S.settings.extraReminders
      ? ` Plus separate entries at ${overflow.map(alertLabel).join(', ')}.`
      : ` ${overflow.map(alertLabel).join(', ')} won't fit — turn on extra entries below to keep them.`;
  }
  return `<div class="help">${s}</div>`;
}
function toggleAlert(kind, n){
  const cur = (S.settings.alerts[kind] || []).slice();
  const i = cur.indexOf(n);
  if(i >= 0){
    if(cur.length === 1){ toast('Keep at least one alert'); return; }
    cur.splice(i,1);
  } else cur.push(n);
  S.settings.alerts[kind] = cur;
  save(); render();
}
function toggleExtraReminders(){
  S.settings.extraReminders = !S.settings.extraReminders;
  save(); render();
}
function addKid(){
  const inp = document.getElementById('kidName');
  const name = inp.value.trim();
  if(!name) return;
  if(S.kids.some(k=>!k.deleted && k.name.toLowerCase()===name.toLowerCase())){
    alert(name+' is already on the list.'); return;
  }
  clearDraft('kidName');
  // Pick the first colour NOBODY IS USING, not the one at the live-count index.
  // Indexing by count collided as soon as a person in the middle was deleted:
  // add Ana/Ben/Cy, delete Ben, add Dee -> the live count is 2, so Dee got
  // KID_COLORS[2] -- Cy's colour -- while KID_COLORS[1] sat free. Verified by
  // execution: Cy and Dee both came out #B45309, and colour is the person tag
  // everywhere in the app (code review, P5 candidate verified 28 Aug).
  const used = new Set(S.kids.filter(k => !k.deleted).map(k => k.color));
  const color = KID_COLORS.find(c => !used.has(c))
             || KID_COLORS[S.kids.length % KID_COLORS.length];
  S.kids.push({id:uid(), name, color, type:(newPersonType||'kid'), deleted:false});
  save(); render();
}
function delKid(id){
  const k = kidById(id);
  // Undo instead of a blocking confirm: removing a person also strips their tag
  // off every event and chore, which was irreversible and unlike every other
  // delete in the app. Snapshot exactly what we're about to change (live object
  // refs + their prior values) so Undo restores the person AND every tag.
  const evBefore = S.events
    .filter(e => (Array.isArray(e.personIds) && e.personIds.includes(id)) || e.kidId === id)
    .map(e => ({ e, personIds: Array.isArray(e.personIds) ? e.personIds.slice() : undefined, kidId: e.kidId }));
  const chBefore = S.chores.filter(c => c.kidId === id).map(c => ({ c, kidId: c.kidId }));
  markDeleted(k);
  S.events.forEach(e=>{
    if(Array.isArray(e.personIds)){ e.personIds = e.personIds.filter(pid => pid !== id); }
    if(e.kidId===id) e.kidId = (e.personIds && e.personIds[0]) || null;
  });
  S.chores.forEach(c=>{ if(c.kidId===id) c.kidId=null; });
  save(); render();
  toast(`Removed ${k.name} — their tags were cleared`, {
    label: 'Undo',
    fn: () => {
      unmarkDeleted(k);
      evBefore.forEach(s => { if(s.personIds !== undefined) s.e.personIds = s.personIds; s.e.kidId = s.kidId; });
      chBefore.forEach(s => { s.c.kidId = s.kidId; });
      save(); render();
      toast(`${k.name} is back`);
    }
  });
}
/**
 * Delete the stored key. There was no way to do this before v9.29 -- a key
 * could be replaced but never removed, so "I am selling this phone" or "that
 * key leaked" had no answer inside the app.
 *
 * A plain confirm, not the undo-toast pattern the app uses for deletes. Undo
 * works by keeping the deleted thing around long enough to restore it, and the
 * entire point here is that the value stops existing -- an undoable key
 * deletion would be a key that is still on the device.
 *
 * The security action is emptying it out of the PERSISTED blob, which is what
 * save() writes; clearing the input alone would leave the key in localStorage.
 */
function removeKey(){
  if(!S.settings.apiKey) return;
  if(!confirm('Remove the API key from this device?\n\nAnthropic features stop working until you paste a new one. This cannot be undone.')) return;
  S.settings.apiKey = '';
  save();
  // save() snapshots the PREVIOUS blob, so the removal itself used to be able to
  // archive a fresh copy of the key. snapshot() redacts at the write now, and
  // this clears anything an older version left behind -- so the promise this
  // button makes is true when it is made, not at the next boot.
  scrubSnapshots();
  const box = document.getElementById('apiKey');
  if(box) box.value = '';
  render();
  toast('API key removed from this device');
}

/**
 * Set the app's own monthly ceiling. 0 (or empty) means no ceiling.
 *
 * Refuses junk rather than storing NaN -- spendCap() would read that as "no
 * limit", which is the failure direction that costs money.
 */
function saveSpendCap(){
  const box = document.getElementById('aiCap');
  const raw = box ? String(box.value).trim() : '';
  const n = raw === '' ? 0 : Number(raw);
  if(!Number.isFinite(n) || n < 0){
    alert('Enter a whole number of dollars, or 0 for no limit.');
    return;
  }
  S.settings.aiCapUsd = n;
  save(); render();
  toast(n > 0 ? 'Limit set to $' + n + ' a month' : 'No limit set');
}

function saveKey(){
  const v = document.getElementById('apiKey').value.trim();
  if(!v.startsWith('sk-ant-')){ alert('Anthropic API keys start with "sk-ant-".'); return; }
  S.settings.apiKey = v; save(); render();
  toast('API key saved on this device');
}
// Diagnostics leave the phone as their own file. Deliberately NOT the full
// backup: no events, chores, lists, notes or API key, so it is safe to email
// or AirDrop to a desktop.
// Build once, used by both the share and the download paths.
function buildDiagnosticsFile(){
  const diag = buildDiagnostics(S, {
    now: new Date().toISOString(),
    appVersion: 'FlyerSnap ' + APP_VERSION,
    provider: aiProvider(), model: aiModelName(),
    includeLocalUrl: true,
    // Null until something has asked. Worth having in the file either way:
    // "we never found out" and "it is 4096" are different problems.
    localContext: typeof localCtx === 'undefined' ? null : localCtx,
    persisted: storagePersisted,
    userAgent: navigator.userAgent,
  });
  const name = 'flyersnap-diagnostics-' + todayISO() + '.json';
  const text = JSON.stringify(diag, null, 2);
  return { diag, name, text };
}

/**
 * Send the diagnostics somewhere, in one tap.
 *
 * v9.23, at Logan's request: he needs errors off the phone and into an email
 * so they can be looked at. A download alone means finding the file in Files
 * and attaching it by hand -- on an installed PWA that is several steps and
 * easy to abandon. The Web Share API hands it straight to Mail, Messages or
 * AirDrop.
 *
 * Feature-detected, and the download stays as the fallback: share with files
 * is not available everywhere, and a failed share must not be a dead end.
 * A cancelled share is not an error -- the user simply changed their mind.
 */
async function shareDiagnostics(){
  let f, text;
  try{
    const built = buildDiagnosticsFile();
    text = built.text;
    // .txt / text/plain, NOT .json. iOS filters the share sheet by file type,
    // and application/json is one many apps -- Gmail among them -- do not
    // declare support for, so the sheet offered Outlook and little else.
    // Plain text is accepted almost everywhere. The contents are unchanged and
    // tools/diagnostics.js parses by content, never by extension.
    f = new File([text], built.name.replace(/\.json$/, '.txt'), { type:'text/plain' });
  }catch(e){
    alert('Could not build the diagnostics file: ' + (e && e.message));
    return;
  }
  if(navigator.canShare && navigator.canShare({ files:[f] })){
    try{
      await navigator.share({ files:[f], title:'FlyerSnap diagnostics',
        text:'FlyerSnap diagnostics — AI call log and reported problems. No events, notes or API key.' });
      return;
    }catch(err){
      // AbortError is the user tapping Cancel. Anything else falls through to
      // the download, which always works.
      if(err && err.name === 'AbortError') return;
    }
  }
  exportDiagnostics();
}

// The route that cannot be blocked by a share sheet that will not list your
// mail app: paste it anywhere. Logan's sheet offered Outlook and not Gmail.
async function copyDiagnostics(){
  try{
    const { text } = buildDiagnosticsFile();
    await navigator.clipboard.writeText(text);
    toast('Diagnostics copied — paste it into an email');
  }catch(e){
    alert('Could not copy: ' + (e && e.message) + '\n\nUse Send or Save to Files instead.');
  }
}

function exportDiagnostics(){
  try{
    // One builder for all three routes -- share, copy and save. Built
    // separately, the three could quietly disagree about what the word
    // "diagnostics" means.
    const { diag, name, text } = buildDiagnosticsFile();
    const blob = new Blob([text], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast(`Diagnostics downloaded (${diag.aiLog.length} AI calls, ${diag.problems.length} problems)`);
  }catch(e){
    alert('Could not build the diagnostics file: ' + (e && e.message));
  }
}

function exportBackup(){
  S.settings.lastBackup = todayISO();
  save();
  // Redacted through the same door as the snapshots. This file is the copy that
  // leaves the device; it must not carry a credential.
  //
  // The old fallback was `|| JSON.stringify(S, null, 1)` -- on the one path
  // where redaction fails it wrote the UNREDACTED blob, which is the single
  // thing this line exists to prevent. It is very hard to reach (the input is
  // JSON.stringify's own output, so the parse cannot fail), but a fallback
  // whose failure mode is "leak the credential" is not a fallback worth having.
  // Refuse instead, and say so.
  const body = redactSaved(JSON.stringify(S));
  if(body === null){
    alert('Could not prepare the backup safely, so nothing was downloaded.\n\nYour data is untouched. Please report this.');
    logProblem('Backup', 'Could not redact the backup, so it was not written', '');
    render();
    return;
  }
  const blob = new Blob([body], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'flyersnap-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup downloaded');
  render();
}
function importBackup(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    // THREE STEPS, IN THIS ORDER, AND THE ORDER IS THE FIX.
    //
    // The old version did all of it inside one try whose catch said "That file
    // is not a FlyerSnap backup." -- so a throw AFTER the overwrite reported
    // that nothing had happened at the exact moment everything had. It also
    // validated `events` and nothing else, skipped migration, and skipped the
    // nested settings merges that load() does.
    let next;
    // 1. Understand the file. adoptParsed reads no storage and writes none, so
    //    a file we cannot use is refused with NOTHING destroyed.
    try{
      next = adoptParsed(JSON.parse(r.result));
    }catch(e){
      alert('That file is not a FlyerSnap backup.');
      return;
    }
    if(!confirm('Replace everything in the app with this backup?')) return;
    // 2. Keep what is about to be replaced. Forced past the daily throttle: if
    //    today's snapshot was already taken, the state being overwritten would
    //    otherwise exist nowhere.
    snapshot({ force:true });
    // 3. Adopt it. Past this line the old state is gone, so nothing here may be
    //    reported as "that file is not a backup".
    S = next;
    delete S.__locked;               // a good file clears the lock
    loadError = null;
    view = {tab:'events', sub:null, data:null};
    try{
      save();
      applyTheme();                  // a light-theme backup onto a dark phone
      render();
      toast('Backup restored');
    }catch(e){
      alert('The backup was restored, but the app could not finish opening it.\n\n'
        + ((e && e.message) || '') + '\n\nClose FlyerSnap and open it again.');
    }
  };
  r.readAsText(file);
}

// ---------- Boot ----------
// v9.20: the service worker serves from cache first, so a launch paints
// immediately instead of waiting on 395KB. The cost is that a push arrives one
// launch late -- so when the background check finds a genuinely different
// build, say so and offer the reload rather than leaving it silent.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  let updateOffered = false;
  navigator.serviceWorker.addEventListener('message', (e) => {
    if(!e.data || e.data.type !== 'update-ready' || updateOffered) return;
    updateOffered = true;   // once per launch; a nag is worse than a wait
    toast('A new version is ready', { label:'Reload', fn:() => location.reload() });
  });
}

// ---------- Swipe between tabs ----------
// Listeners live on <main> only: the tab bar and any open sheet keep their
// own behaviour. See js/gestures.js for why the edges are left alone and why
// nothing here calls preventDefault.
(function initSwipeNav(){
  const m = document.getElementById('main');
  if(!m || !('ontouchstart' in window)) return;
  let sx = 0, sy = 0, t0 = 0, live = false;

  m.addEventListener('touchstart', (e) => {
    // Multi-touch is a pinch-zoom, which must keep working (WCAG 1.4.4).
    if(e.touches.length !== 1){ live = false; return; }
    // Only the five top-level tabs swipe. On a sub-screen (capture, review,
    // an edit form) a sideways flick would throw away what the user is doing.
    if(view.sub || S.__locked){ live = false; return; }
    if(startsOnSomethingElse(e.target)){ live = false; return; }
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY; t0 = Date.now(); live = true;
  }, { passive: true });

  m.addEventListener('touchend', (e) => {
    if(!live) return;
    live = false;
    const t = e.changedTouches && e.changedTouches[0];
    if(!t) return;
    const want = swipeIntent({
      dx: t.clientX - sx, dy: t.clientY - sy,
      ms: Date.now() - t0, startX: sx, width: window.innerWidth,
    });
    if(!want) return;
    const i = TABS.findIndex(x => x.id === view.tab);
    const next = i + (want === 'next' ? 1 : -1);
    // No wrap-around: running off the end should feel like the end.
    if(next < 0 || next >= TABS.length) return;
    nav(TABS[next].id);
  }, { passive: true });

  // A gesture interrupted by a call or the app backgrounding is not a swipe.
  m.addEventListener('touchcancel', () => { live = false; }, { passive: true });
})();

// recorded -- they went to a console nobody can read on a phone. Now they land
// in the same log as everything else.
window.addEventListener('error', ev => {
  logProblem('App', ev.message || 'Unexpected error',
    (ev.filename ? String(ev.filename).split('/').pop() : '') +
    (ev.lineno ? ':' + ev.lineno : ''));
});
window.addEventListener('unhandledrejection', ev => {
  const r = ev.reason;
  logProblem('App', 'Background task did not finish',
    r && r.message ? r.message : String(r));
});
