<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2D5A4A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FlyerSnap</title>
<style>
  :root{
    --green:#2D5A4A; --green-lt:#E4EEE9; --red:#C0392B; --amber:#B45309;
    --bg:#F7F5F0; --card:#fff; --ink:#1E2B26; --muted:#4A5B53; --faint:#6B7A72;
    --line:#D5DDD8;

    /* Type scale. Five steps instead of twelve ad-hoc sizes. Body sits at 16px,
       the mobile minimum in Apple HIG (17pt) and Material (16sp). */
    --t-cap:13px;    /* captions, tags -- non-essential only */
    --t-sm:15px;     /* secondary text */
    --t-body:16px;   /* body minimum */
    --t-title:17px;  /* card titles */
    --t-lg:22px;     /* section heads */
    --t-xl:28px;     /* page numbers, counts */

    /* 4px spacing grid */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;

    /* WCAG 2.5.8 floor is 24px; 44px is the Apple HIG / WCAG 2.5.5 AAA target. */
    --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Nothing in the app showed focus before -- switch-control and keyboard users
     had no idea where they were. :focus-visible keeps it invisible for taps. */
  :focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--ink);font-size:var(--t-body);line-height:1.5;
    padding-top:env(safe-area-inset-top);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;background:var(--green);color:#fff;padding:14px 16px;
    font-weight:700;font-size:17px;z-index:10;display:flex;align-items:center;gap:10px;
    padding-top:calc(14px + env(safe-area-inset-top));margin-top:calc(-1 * env(safe-area-inset-top))}
  header .back{background:none;border:none;color:#fff;font-size:20px;padding:0 4px;font-weight:700}
  main{padding:var(--s4);max-width:640px;margin:0 auto;padding-bottom:var(--s5)}
  /* Larger phones get a touch more air; content stays in a readable measure. */
  @media (min-width:430px){ main{padding:var(--s5)} }
  nav{position:fixed;bottom:0;left:0;right:0;background:#ffffff;display:flex;
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -4px 12px rgba(0,0,0,.06);z-index:30}
  nav button{flex:1;background:none;border:none;padding:8px 0 6px;font-size:var(--t-cap);font-weight:600;min-height:var(--tap);
    color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button.on{color:var(--green)}
  nav button .ic{font-size:20px;opacity:.45}
  nav button.on .ic{opacity:1}
  .card{background:var(--card);border-radius:14px;padding:var(--s4);margin-bottom:var(--s3);
    box-shadow:0 1px 2px rgba(30,43,38,.04), 0 2px 8px rgba(30,43,38,.05);
    transition:transform .1s ease, box-shadow .1s ease}
  .card:active{transform:scale(.99)}

  /* Sticky bucket headers -- the anchor points that make a long list scannable. */
  .bucket{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s2);
    background:var(--bg);padding:var(--s4) 0 var(--s2);
    font-size:var(--t-cap);font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted)}
  .bucket::after{content:'';flex:1;height:1px;background:var(--line)}
  .bucket-n{order:3;background:var(--line);color:var(--muted);border-radius:9px;
    padding:1px 7px;font-size:11px;letter-spacing:0}

  /* Density tiers. Imminent events earn presence; distant ones stay quiet. */
  .card.near{box-shadow:0 1px 2px rgba(30,43,38,.05), 0 4px 14px rgba(30,43,38,.09)}
  .card.compact{padding:var(--s3) var(--s4);margin-bottom:var(--s2);opacity:.88}
  .card.compact .badge{background:transparent;color:var(--faint);padding:4px 0;font-weight:600}

  /* Entrances. Guarded by the prefers-reduced-motion block above. */
  @keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  main > .card, main > .bucket{animation:riseIn .22s ease both}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .title{font-size:var(--t-title);font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .meta{font-size:var(--t-sm);color:var(--muted);margin-top:var(--s1);line-height:1.45}
  .notes{font-size:var(--t-sm);color:var(--faint);font-style:normal;margin-top:var(--s2);
    white-space:pre-wrap;word-break:break-word;line-height:1.5;padding-left:10px;border-left:2px solid var(--line)}
  .stripe{border-left:5px solid var(--green)}
  .stripe.deadline{border-left-color:var(--red)}
  .badge{font-size:var(--t-cap);font-weight:700;color:var(--green);background:var(--green-lt);
    padding:6px 10px;border-radius:9px;white-space:nowrap}
  .badge.urgent{color:#fff;background:var(--red)}
  .kidtag{display:inline-block;color:#fff;font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:10px;margin-top:6px}
  .kindtag{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--green);
    background:var(--green-lt);padding:2px 6px;border-radius:4px}
  .kindtag.deadline{color:#fff;background:var(--red)}
  .btn{background:var(--green);color:#fff;border:none;border-radius:12px;
    padding:14px 18px;font-size:var(--t-body);font-weight:700;width:100%;
    min-height:var(--tap);-webkit-tap-highlight-color:transparent;
    transition:transform .08s ease}
  .btn:active{transform:scale(.985)}
  .btn.alt{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  .btn.sm{width:auto;padding:10px 18px;font-size:var(--t-sm);min-height:var(--tap)}
  .btn.danger{background:var(--red)}
  .btn:disabled{opacity:.5}
  .fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:auto;padding:14px 24px;border-radius:28px;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:9}
  .newflag{display:inline-block;background:var(--amber);color:#fff;border-radius:6px;
    padding:1px 6px;font-size:10px;font-weight:800;margin-right:6px;vertical-align:middle;letter-spacing:.4px}
  .calflag{display:inline-block;background:#E7F0EA;color:var(--green);border:1px solid #CBDDD2;
    border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;margin-top:4px;white-space:nowrap}
  .chip{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);
    color:var(--muted);border-radius:22px;padding:0 16px;min-height:var(--tap);
    font-size:var(--t-sm);font-weight:600;margin:0 var(--s2) var(--s2) 0;
    flex-shrink:0;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .check{width:28px;height:28px;border-radius:14px;border:2px solid #B8C4BE;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
  .check.on{background:var(--green);border-color:var(--green)}
  input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],textarea{
    width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:16px;font-family:inherit;color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  .formrow{display:flex;gap:8px;margin-bottom:10px}
  .label{font-size:var(--t-cap);font-weight:700;color:var(--muted);margin:var(--s4) 0 var(--s2);
    text-transform:uppercase;letter-spacing:.06em}
  .empty{text-align:center;padding:50px 24px;color:var(--muted)}
  .empty .et{font-size:var(--t-lg);font-weight:800;color:var(--ink);margin-bottom:var(--s2)}
  .empty .eb{font-size:var(--t-body);line-height:1.6;max-width:34ch;margin:0 auto}
  .sect{font-size:var(--t-lg);font-weight:800;margin:var(--s6) 0 var(--s2);letter-spacing:-.02em}
  .help{font-size:var(--t-sm);color:var(--muted);line-height:1.55;margin-bottom:var(--s3)}
  .filterbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
  .balance{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid;
    border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
  .spin{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px}
  .spinner{width:36px;height:36px;border:4px solid var(--green-lt);border-top-color:var(--green);
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  main.enter{animation:screenIn .2s ease both}
  .celebrate{background:var(--green-lt);border-radius:10px;padding:12px;text-align:center;
    font-weight:700;color:var(--green);margin-bottom:12px}
  .toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;
    z-index:99;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .strike{text-decoration:line-through;color:var(--faint)}
  .dim{opacity:.55}
  .slot{display:flex;align-items:center;gap:10px;padding:6px 0}
  .slotb{width:24px;height:24px;border-radius:12px;background:var(--green-lt);color:var(--green);
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .slottext{font-size:14px}
  .slottext.empty{color:#B8C4BE;font-style:italic}
  .sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;
    padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;
    box-shadow:0 -2px 12px rgba(0,0,0,.12)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
  /* min-height wins over the inline paddings scattered through the markup, so
     every one of these clears the 44px target without touching 26 call sites. */
  .linkbtn{background:none;border:none;color:var(--green);font-weight:700;
    font-size:var(--t-sm);padding:8px;min-height:var(--tap);min-width:var(--tap);
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:8px;-webkit-tap-highlight-color:rgba(45,90,74,.12)}
  .linkbtn:active{background:var(--green-lt)}
  .linkbtn.red{color:var(--red)}
  .sheetbtn{display:block;width:100%;background:var(--green-lt);color:var(--green);border:none;
    border-radius:10px;padding:13px;font-size:15px;font-weight:700;margin-bottom:8px;text-align:center}
  .sheetbtn.danger{background:#FDEBEA;color:var(--red)}
  .sheetbtn.cancel{background:none;color:var(--muted);font-weight:600}
  h3{margin:6px 0 10px;font-size:16px}
</style>
</head>
<body>
<header id="header">FlyerSnap</header>
<main id="main"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fLib" accept="image/*" multiple hidden>
<input type="file" id="fPdf" accept="application/pdf" hidden>
<input type="file" id="fRecipe" accept="image/*" multiple hidden>
<input type="file" id="fCompare" accept="image/*" hidden>
<input type="file" id="fImport" accept="application/json" hidden>

<script>
'use strict';
// ============================================================
// FlyerSnap PWA — single file, zero dependencies.
// Data: localStorage JSON. Reminders: .ics calendar files w/ alarms.
// Extraction: Claude API directly from the browser.
// ============================================================

// ---------- State & storage ----------
const KID_COLORS = ['#7C3AED','#0E7490','#B45309','#BE185D','#166534','#4338CA'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SLOTS = ['breakfast','lunch','snack','dinner','dessert'];

// Bump when the saved shape changes, and add a migration step below.
// v1 = everything up to and including v2.1 (implicit; no version field was stored).
// v2 = meal planner / recipe box retired; recipes+meals now live in the recipe app.
// NOTE: must be declared before load() runs, since blank() reads it at startup.
const SCHEMA_VERSION = 4;

let loadError = null;
let storageWarned = false;
let S = load();

function blank(){ return { events:[], kids:[], chores:[], completions:[], rewards:[],
  redemptions:[], lists:[], listItems:[],
  settings:{ apiKey:'', alerts:{ deadline:[7,1], event:[2,0] }, extraReminders:false,
    watcherUrl:'', watcherToken:'', seenMsgs:[], starCarry:{}, senderTags:{},
    aiProvider:'anthropic', localBaseUrl:'', localModel:'qwen2.5:14b-instruct', aiFallback:true },
  schemaVersion: SCHEMA_VERSION }; }

function migrate(s, fromVersion){
  const from = Number(fromVersion) || 1;
  if(from >= SCHEMA_VERSION){ s.schemaVersion = SCHEMA_VERSION; return s; }

  if(from < 2){
    // FlyerSnap no longer owns recipes or meal plans — the recipe app does.
    // Keep the rows (harmless, and a user may want them exported) but stop
    // treating them as live data. Nothing is deleted here on purpose: a
    // migration that destroys data is the thing we most want to avoid.
    s.legacyRecipes = Array.isArray(s.recipes) ? s.recipes : [];
    s.legacyMeals   = Array.isArray(s.meals)   ? s.meals   : [];
    delete s.recipes;
    delete s.meals;
  }

  if(from < 3){
    // People can now be adults, and events can be tagged to several people.
    // Existing kids become type 'kid'; existing single kidId becomes a
    // one-entry personIds list. kidId is preserved so the star/chore system,
    // which is deliberately kids-only, keeps working untouched.
    (s.kids || []).forEach(k => { if(!k.type) k.type = 'kid'; });
    (s.events || []).forEach(e => {
      if(!Array.isArray(e.personIds)){
        e.personIds = e.kidId ? [e.kidId] : [];
      }
    });
  }

  if(from < 4){
    // Events can now be flagged unread. Everything already in the app counts as
    // seen, so nobody opens the app to a wall of "new" items.
    (s.events || []).forEach(e => { if(e.unread === undefined) e.unread = false; });
  }

  s.schemaVersion = SCHEMA_VERSION;
  return s;
}
function load(){
  const base = blank();
  let raw = null;
  try{
    raw = localStorage.getItem('flyersnap');
    if(!raw) return base;
    const parsed = JSON.parse(raw);
    // Shape check — a JSON blob that parses but isn't ours is still unusable
    if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || !Array.isArray(parsed.events)){
      throw new Error('Saved data is not in the expected format');
    }
    const defaults = base.settings;
    const s = Object.assign(base, parsed);
    // settings is nested, so merge it rather than letting old saves drop new keys
    s.settings = Object.assign({}, defaults, parsed.settings||{});
    s.settings.alerts = Object.assign({}, defaults.alerts, (parsed.settings||{}).alerts||{});
    s.settings.starCarry = Object.assign({}, (parsed.settings||{}).starCarry||{});
    // Version comes from the SAVED data — blank() already stamped the current
    // one onto the merge target, so reading it from `s` would skip migration.
    return migrate(s, parsed.schemaVersion);
  }catch(e){
    // NEVER silently start empty — that would let the next save() overwrite the
    // only copy. Quarantine the bytes, lock writes, and let the user decide.
    loadError = e.message || String(e);
    try{
      if(raw) localStorage.setItem('flyersnap-quarantine', raw);
    }catch(_){}
    const locked = blank();
    locked.__locked = true;
    return locked;
  }
}

function save(){
  if(S.__locked){ console.warn('save blocked: data is locked pending recovery'); return; }
  try{
    snapshot();                    // stash the last known good copy first
    localStorage.setItem('flyersnap', JSON.stringify(S));
    storageWarned = false;
  }catch(e){
    // Quota exceeded, private mode, etc. Silence here would lose edits invisibly.
    if(!storageWarned){
      storageWarned = true;
      alert('Could not save — storage on this phone is full.\n\nExport a backup from Settings now, then clear out old past events or recipes.');
    }
  }
}

// ---------- Pruning ----------
// Storage is ~5MB and these arrays otherwise grow forever. Rules are deliberately
// conservative: nothing recent goes, and anything that would change a visible
// number (star balances) is rolled forward rather than dropped.

const KEEP_COMPLETIONS_DAYS = 365;   // a year of chore history stays browsable
const KEEP_SOFT_DELETED_DAYS = 90;   // tombstones for deleted rows
const KEEP_PAST_EVENTS_DAYS = 730;   // two years of past events

function daysAgoISO(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return iso(d);
}

function pruneData(){
  if(S.__locked) return 0;
  let removed = 0;
  const completionCutoff = daysAgoISO(KEEP_COMPLETIONS_DAYS);
  const deletedCutoff = daysAgoISO(KEEP_SOFT_DELETED_DAYS);
  const eventCutoff = daysAgoISO(KEEP_PAST_EVENTS_DAYS);

  // Chore completions: roll old ones into a carried balance BEFORE dropping them,
  // so a kid's star total never changes just because time passed.
  const carry = Object.assign({}, S.settings.starCarry || {});
  const keptCompletions = [];
  for(const c of S.completions){
    if(c.date && c.date < completionCutoff){
      if(c.kidId && c.stars) carry[c.kidId] = (carry[c.kidId] || 0) + c.stars;
      removed++;
    } else keptCompletions.push(c);
  }
  // Same for redemptions (they subtract).
  const keptRedemptions = [];
  for(const r of S.redemptions){
    if(r.date && r.date < completionCutoff){
      if(r.kidId && r.stars) carry[r.kidId] = (carry[r.kidId] || 0) - r.stars;
      removed++;
    } else keptRedemptions.push(r);
  }
  S.completions = keptCompletions;
  S.redemptions = keptRedemptions;
  S.settings.starCarry = carry;

  // Soft-deleted rows: once they're old, actually drop them.
  const before = S.events.length + S.listItems.length + S.lists.length +
                 S.chores.length + S.rewards.length + S.kids.length;
  const oldDeleted = row => row.deleted && (!row.date || row.date < deletedCutoff);
  S.events = S.events.filter(e => !(e.deleted && (e.date || '') < deletedCutoff));
  S.listItems = S.listItems.filter(i => !i.deleted);          // no date; drop on prune
  S.lists = S.lists.filter(l => !l.deleted);
  S.chores = S.chores.filter(c => !c.deleted);
  S.rewards = S.rewards.filter(r => !r.deleted);
  S.kids = S.kids.filter(k => !k.deleted);
  removed += before - (S.events.length + S.listItems.length + S.lists.length +
                       S.chores.length + S.rewards.length + S.kids.length);

  // Very old past events.
  const beforeEvents = S.events.length;
  S.events = S.events.filter(e => !e.date || e.date >= eventCutoff);
  removed += beforeEvents - S.events.length;

  // Watcher message ids don't need to be remembered forever.
  if(S.settings.seenMsgs && S.settings.seenMsgs.length > 400){
    S.settings.seenMsgs = S.settings.seenMsgs.slice(-400);
  }

  if(removed) save();
  return removed;
}

// ---------- Rolling local snapshots ----------
// Protects against corruption and fat-finger deletes. Does NOT protect against
// iOS evicting site data — only an exported file does that.
const SNAP_PREFIX = 'flyersnap-snap-';
const SNAP_KEEP = 3;

function snapshotKeys(){
  const out = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(SNAP_PREFIX) === 0) out.push(k);
    }
  }catch(e){}
  return out.sort();
}
function snapshot(){
  try{
    const now = Date.now();
    const last = Number(localStorage.getItem('flyersnap-lastsnapshot') || 0);
    if(now - last < 24*3600*1000) return;      // at most one a day
    const raw = localStorage.getItem('flyersnap');
    if(!raw) return;
    localStorage.setItem(SNAP_PREFIX + new Date().toISOString().slice(0,10), raw);
    localStorage.setItem('flyersnap-lastsnapshot', String(now));
    const keys = snapshotKeys();
    while(keys.length > SNAP_KEEP) localStorage.removeItem(keys.shift());
  }catch(e){ /* snapshots are best-effort; never block a save */ }
}
function restoreSnapshot(key){
  const raw = localStorage.getItem(key);
  if(!raw){ alert('That snapshot is gone.'); return; }
  let parsed;
  try{
    parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.events)) throw new Error('bad shape');
  }catch(e){ alert('That snapshot is unreadable too.'); return; }
  if(!confirm('Restore the snapshot from ' + key.replace(SNAP_PREFIX,'') + '?\n\nAnything added since then will be replaced.')) return;
  S = Object.assign(blank(), parsed);
  const defaults = blank().settings;
  S.settings = Object.assign({}, defaults, parsed.settings||{});
  loadError = null;
  localStorage.setItem('flyersnap', JSON.stringify(S));
  view = {tab:'events', sub:null, data:null};
  render();
  toast('Snapshot restored');
}
function storageBytes(){
  let n = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      n += k.length + (localStorage.getItem(k)||'').length;
    }
  }catch(e){}
  return n;
}
function downloadQuarantine(){
  const dump = {};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('flyersnap') === 0) dump[k] = localStorage.getItem(k);
    }
  }catch(e){}
  const blob = new Blob([JSON.stringify(dump, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

// ---------- Claude API ----------
const API_URL = 'https://api.anthropic.com/v1/messages';
const MODEL = 'claude-sonnet-4-6';


// ===========================================================================
// SECRETARY PERSONA + GROUNDING
//
// Modelled on how a world-class executive assistant takes minutes. The rules
// below are drawn from professional minute-taking practice, and each one exists
// to prevent a specific failure we have actually seen:
//
//  - "owner, task, deadline" for every item   -> stops vague, unusable entries
//  - "never invent clarity"                   -> stops inferred/hallucinated dates
//  - "suggestion is not a decision"           -> stops 'maybe' becoming an event
//  - "restraint vs elaboration"               -> stops a whole week collapsing
//                                                into one generic item
//  - "objective, no interpretation"           -> stops editorialising in notes
// ===========================================================================
const SECRETARY_PERSONA = `You are the executive secretary to a busy parent. You are a world-class note taker: precise, literal, and completely reliable. Your reputation rests on one thing -- what you write down is exactly what the source said, no more and no less.

How you work:

1. OWNER, TASK, DEADLINE. Every item you record answers three questions: what is happening, who it concerns, and exactly when. An item missing a date is not an item; leave it out rather than guessing.

2. NEVER INVENT CLARITY. If the source is vague, your note is vague. You do not resolve ambiguity by guessing, and you never infer a date, time, or location that is not stated. A missing field is null. Inventing a plausible detail is the worst error you can make -- worse than omitting the item.

3. A SUGGESTION IS NOT A DECISION. "We hope to schedule", "a sign-up sheet will be available", "more details to follow" are not events. Record only what is actually scheduled or actually due.

4. RESTRAINT AND ELABORATION. Never collapse many things into one summary item. If a schedule lists twelve sessions, you record twelve items -- not "training week". Conversely, do not pad: no item needs a paragraph.

5. OBJECTIVE AND LITERAL. Keep the source's own wording for names and titles, including instructor or room names in parentheses. Add no opinion, no interpretation, no encouragement.

6. DEADLINES ARE DIFFERENT FROM EVENTS. A form due, registration cutoff, payment date, or RSVP-by is a deadline. Something you attend is an event.

7. VERIFY BEFORE FINALISING. Re-read what you produced against the source. If a date, time, or name does not appear verbatim in the source, remove it.`;

// Task-specific grounding, appended after the persona.
const GROUNDING_EVENTS = `Working from the material provided, produce the calendar items.

- Dates must be resolved to YYYY-MM-DD. If the source gives a weekday and a date ("Monday 8/3"), use the date. If the year is absent, infer it from today's date, choosing the nearest future occurrence.
- Times are 24-hour HH:MM. Record both a start and an end when a range is given ("6:00-8:30 PM" -> time 18:00, endTime 20:30). A single time has a null endTime.
- SCHEDULE GRIDS: when rows are time slots and columns are days, every non-empty cell is its own separate item. Its date comes from the column, its time from the row label, unless the cell states its own time -- which always wins. One column often holds several sessions; record every one. Rows labelled Lunch, Dinner, or Break are not items.
- Keep the cell's own label as the title, including a name in parentheses, e.g. "Mini M.T. (Austin)".
- notes: this is where a good secretary earns their keep. Capture what the parent will actually need to know on the day, drawn from anywhere in the source -- the item itself, the surrounding paragraphs, or a covering email.

  Include when stated: what to bring or wear; cost, fee, or payment deadline; where exactly to go (door, room, building); whether to RSVP or sign up and by when; who it is for (which grade, which team, parents or students only); who to contact; what to do beforehand; and any consequence of missing it.

  Write it as plain factual phrases, semicolon-separated, in the source's own words where possible. Two or three sentences at most. Example: "Wear all black, hair up; bring water bottle, healthy snacks and all dance shoes; returning parents bring the company handbook binder."

  Do NOT pad. If the source says nothing beyond the date and title, notes is null. Never invent a requirement that is not stated -- a made-up instruction is worse than no note at all.`;

const GROUNDING_RECIPE = `Working from the photograph(s), transcribe the recipe exactly as written.

- Do not adjust quantities, substitute ingredients, or improve the method.
- Preserve the source's units and order.
- If several photographs are provided, they are continued pages of one recipe: combine them, and do not repeat an ingredient or step that appears on more than one page.
- If the image is not a recipe, say so rather than inventing one.`;

// ---------------------------------------------------------------------------
// Provider dispatch. Anthropic remains fully intact and is still the default;
// the local model is an additional option, never a replacement.
// ---------------------------------------------------------------------------

// user switches. These follow whatever is actually configured.
// Gordon is the assistant's name in the interface. The model behind him is an
// implementation detail that can change (Anthropic, a local model, whatever
// comes next) without the app's voice changing. The real model is still shown
// where it matters -- in Settings, in the self-test, and on each event's
// provenance line -- so a bad extraction can still be traced.
const ASSISTANT_NAME = 'Gordon';

function aiName(){ return ASSISTANT_NAME; }

// The actual model, for places where the truth matters more than the voice.
function aiModelName(){
  return aiProvider() === 'local'
    ? ((S.settings.localModel||'').trim() || 'local model')
    : MODEL;
}

  ];

function aiProvider(){ return S.settings.aiProvider === 'local' ? 'local' : 'anthropic'; }

async function callAI(contentBlocks, maxTokens, system){
  if(aiProvider() === 'local'){
    try{
      return await callLocalModel(contentBlocks, maxTokens, system);
    }catch(err){
      const unsupported = /^UNSUPPORTED_BLOCK:/.test(err.message);
      if(S.settings.aiFallback){
        toast(unsupported ? 'PDFs need Anthropic — using it for this one'
                          : 'Local model unavailable — using Anthropic');
        return await callClaude(contentBlocks, maxTokens, system);
      }
      if(unsupported){
        throw new Error('The local model cannot read PDFs or fetched links — only photos and text.\n\nEither photograph the page instead, or turn on "Fall back to Anthropic" in Settings.');
      }

        '\n\nIs the desktop awake and Tailscale connected?');
    }
  }
  return callClaude(contentBlocks, maxTokens, system);

// Ollama speaks the OpenAI Chat Completions shape, so Anthropic content blocks
// are translated: text passes through, images become data-URL image_url parts.
// The OpenAI chat shape carries text and images. It has no equivalent of
// Anthropic's `document` block, so PDFs and fetched URLs cannot cross over.
// Dropping them silently would send the prompt with nothing attached and the
// model would answer about thin air -- so this throws instead. Better a clear
// error than a confident answer about a document nobody sent.
function blocksToOpenAI(contentBlocks){
  const parts = [];
  for(const b of contentBlocks){
    if(b.type === 'text'){
      parts.push({ type:'text', text:b.text });
    } else if(b.type === 'image' && b.source && b.source.type === 'base64'){
      parts.push({ type:'image_url', image_url:{
        url: 'data:' + b.source.media_type + ';base64,' + b.source.data } });
    } else if(b.type === 'document'){
      throw new Error('UNSUPPORTED_BLOCK:document');
    } else {
      throw new Error('UNSUPPORTED_BLOCK:' + (b.type || 'unknown'));
    }
  }
  if(!parts.some(p => p.type === 'text')) throw new Error('UNSUPPORTED_BLOCK:no-prompt');
  return parts;
}

// Reasoning models (qwen3-vl, deepseek-r1 and friends) narrate before answering:
// "Thinking..." / "...done thinking.", or <think>...</think>. FlyerSnap runs
// JSON.parse on the result, and a parse failure yields ZERO items rather than
// partial ones -- so the symptom is a silent "found nothing". Strip the narration
// and, if prose still surrounds the payload, cut it down to the JSON itself.
function stripThinking(text){
  let t = String(text || '');
  t = t.replace(/<think>[\s\S]*?<\/think>/gi, ' ');
  t = t.replace(/<thinking>[\s\S]*?<\/thinking>/gi, ' ');
  // "Thinking..." through "...done thinking." (the CLI/Ollama style)
  t = t.replace(/(^|\n)\s*Thinking\.\.\.[\s\S]*?\.\.\.\s*done thinking\.?/gi, ' ');
  // An unterminated thinking block: drop everything before the last marker.
  const done = t.lastIndexOf('...done thinking.');
  if(done >= 0) t = t.slice(done + '...done thinking.'.length);
  return t.replace(/```json|```/g, '').trim();
}

// Pull the outermost JSON value out of surrounding prose, respecting strings so
// a brace inside a title cannot end the scan early.
function extractJson(text){
  const t = String(text || '');
  const starts = [t.indexOf('{'), t.indexOf('[')].filter(i => i >= 0);
  if(!starts.length) return t.trim();
  const start = Math.min.apply(null, starts);
  const open = t[start];
  const close = open === '{' ? '}' : ']';
  let depth = 0, inStr = false, esc = false;
  for(let i = start; i < t.length; i++){
    const c = t[i];
    if(esc){ esc = false; continue; }
    if(c === '\\'){ esc = true; continue; }
    if(c === '"'){ inStr = !inStr; continue; }
    if(inStr) continue;
    if(c === open) depth++;
    else if(c === close){ depth--; if(depth === 0) return t.slice(start, i + 1); }
  }
  return t.slice(start).trim();   // unbalanced; hand back what we have
}

function cleanModelText(text){
  const stripped = stripThinking(text);
  return /[{\[]/.test(stripped) ? extractJson(stripped) : stripped;
}

async function callLocalModel(contentBlocks, maxTokens, system){
  const base = (S.settings.localBaseUrl||'').trim().replace(/\/+$/,'');
  if(!base) throw new Error('No local model URL saved.');
  const model = (S.settings.localModel||'').trim() || 'qwen2.5:14b-instruct';
  // Local models are more verbose than Claude for the same task, so give the
  // budget extra room rather than risk a truncated, unparseable response.
  maxTokens = Math.max(maxTokens || 2000, 4000);

  const messages = [{ role:'system', content: SECRETARY_PERSONA + (system ? '\n\n' + system : '') },
                    { role:'user', content: blocksToOpenAI(contentBlocks) }];

  const ctrl = new AbortController();
  // The first call loads the model into VRAM and is slow; later ones are fast.
  const timer = setTimeout(()=>ctrl.abort(), 180000);
  let res;
  try{
    res = await fetch(base + '/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer local' },
      // Ollama 0.12+ auto-enables thinking for thinking-capable models unless
      // told otherwise, and reasoning tokens are spent from the SAME budget as
      // the answer -- so the model can narrate until it runs out and never emit
      // the JSON. That failure looks identical to "found nothing".
      //
      // `think` is Ollama's documented field; `chat_template_kwargs` is what
      // other OpenAI-compatible runtimes accept. Sending both is harmless --
      // unknown fields are ignored -- and covers either backend.
      // `/no_think` in the prompt is deliberately NOT used: it is unreliable,
      // and models have been observed reasoning about the token itself.
      body: JSON.stringify({
        model, messages,
        temperature: 0.2,
        max_tokens: maxTokens || 2000,
        think: false,
        chat_template_kwargs: { enable_thinking: false }
      }),
      signal: ctrl.signal
    });
  }catch(e){
    clearTimeout(timer);
    throw new Error(e.name === 'AbortError' ? 'timed out after 3 minutes' : e.message);
  }
  clearTimeout(timer);
  if(!res.ok) throw new Error('model error ' + res.status + ': ' + (await res.text()).slice(0,200));
  const json = await res.json();
  const choice = (json.choices && json.choices[0]) || {};
  const msg = choice.message || {};
  // Some builds put the reasoning trace in a separate field; if content is empty
  // but a trace exists, the model spent everything thinking.
  let out = msg.content || '';
  const trace = msg.thinking || msg.reasoning || msg.reasoning_content || '';
  if(!out && trace){
    throw new Error('the model produced only reasoning and no answer — raise max_tokens, or use a model without thinking');
  }
  if(!out){
    throw new Error('the model returned an empty answer (finish_reason: ' +
      (choice.finish_reason || 'unknown') + ')');
  }
  if(choice.finish_reason === 'length'){
    console.log('local model response hit the token limit; output may be truncated');
  }
  return cleanModelText(out);
}

async function callClaude(contentBlocks, maxTokens, system){
  if(!S.settings.apiKey) throw new Error('NO_API_KEY');
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': S.settings.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify(Object.assign(
      { model: MODEL, max_tokens: maxTokens||2000,
        messages:[{role:'user', content: contentBlocks}] },
      system ? { system: SECRETARY_PERSONA + '\n\n' + system } : {}))
  });
  if(!res.ok){
    const body = await res.text();
    throw new Error('API error '+res.status+': '+body.slice(0,200));
  }
  const data = await res.json();
  return (data.content||[]).map(b=>b.type==='text'?b.text:'').join('\n')
    .replace(/```json|```/g,'').trim();
}

// ---------- File reading / image downscale ----------
function readFile(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(',')[1]);
    r.onerror = ()=>rej(new Error('Could not read the file.'));
    r.readAsDataURL(file);
  });
}
async function readImageDownscaled(file){
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej)=>{
      const i = new Image();
      i.onload = ()=>res(i); i.onerror = ()=>rej(new Error('decode'));
      i.src = url;
    });
    const MAX = 1600;
    const scale = Math.min(1, MAX/Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return { base64: c.toDataURL('image/jpeg', 0.85).split(',')[1], mediaType:'image/jpeg' };
  }catch(e){
    return { base64: await readFile(file), mediaType: file.type||'image/jpeg' };
  }
}

// ---------- ICS calendar export (with alarms) ----------
function icsEscape(s){ return String(s??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
const ALERT_CHOICES = [14, 7, 3, 2, 1, 0];
function alertLabel(n){ return n===0 ? 'Day of' : n===1 ? '1 day' : n+' days'; }

// Apple Calendar honors only two alerts per event, so the two NEAREST offsets
// become real alarms; anything earlier can optionally become its own entry.
// Lead times that would land before today are useless -- a "7 days before"
// alert on an event 2 days away fires 5 days in the past, which either does
// nothing or drops a stray entry onto an old date. Drop those, and if every
// configured lead time is already past, fall back to a day-of alert so the
// event still notifies.
function alertPlan(kind, evt){
  const chosen = ((S.settings.alerts||{})[kind] || []).slice().sort((x,y)=>x-y);
  let usable = chosen;
  if(evt && evt.date){
    const away = daysUntil(evt.date);
    if(away >= 0){
      usable = chosen.filter(n => n <= away);
      if(!usable.length) usable = [0];
    }
  }
  return { alarms: usable.slice(0,2), extras: S.settings.extraReminders ? usable.slice(2) : [] };
}

function fmt12(t){
  if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return t || '';
  let [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return h + ':' + String(m).padStart(2,'0') + ' ' + ampm;
}
function fmtTimeRange(e){
  if(!e.time) return '';
  return e.endTime ? fmt12(e.time) + '–' + fmt12(e.endTime) : fmt12(e.time);
}
function eventTitle(evt){
  const kid = evt.kidId ? kidById(evt.kidId) : null;
  return (evt.kind==='deadline'?'\u23f0 ':'') + (kid?kid.name+': ':'') + evt.title;
}
function icsStamp(){ return new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z'; }
function valarm(title, daysBefore){
  return 'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+icsEscape(title)+
    '\r\nTRIGGER:'+(daysBefore===0?'-PT0M':'-P'+daysBefore+'D')+'\r\nEND:VALARM';
}

function buildVEVENT(evt){
  const plan = alertPlan(evt.kind, evt);
  const title = eventTitle(evt);
  const d = evt.date.replace(/-/g,'');
  let dt;
  if(evt.time){
    const t = evt.time.replace(':','') + '00';
    const [y,m,day] = evt.date.split('-').map(Number);
    const [hh,mm] = evt.time.split(':').map(Number);
    let end;
    if(evt.endTime && /^\d{2}:\d{2}$/.test(evt.endTime)){
      let [eh,em] = evt.endTime.split(':').map(Number);
      // An end earlier than the start means it runs past midnight -> next day.
      const crossesMidnight = (eh*60+em) <= (hh*60+mm);
      end = new Date(y, m-1, day + (crossesMidnight?1:0), eh, em);
    } else {
      end = new Date(y, m-1, day, hh, mm+60);   // no end given -> assume one hour
    }
    const endStr = iso(end).replace(/-/g,'') + 'T' +
      String(end.getHours()).padStart(2,'0') + String(end.getMinutes()).padStart(2,'0') + '00';
    dt = 'DTSTART:'+d+'T'+t+'\r\nDTEND:'+endStr;
  } else {
    dt = 'DTSTART;VALUE=DATE:'+d;
  }
  const alarms = plan.alarms.map(n=>valarm(title, n)).join('\r\n');
  return ['BEGIN:VEVENT','UID:'+evt.id+'@flyersnap','DTSTAMP:'+icsStamp(), dt,
    'SUMMARY:'+icsEscape(title),
    evt.location?'LOCATION:'+icsEscape(evt.location):null,
    (evt.notes||evt.source)?'DESCRIPTION:'+icsEscape([evt.notes, evt.source?'From: '+evt.source:null].filter(Boolean).join(' \u2014 ')):null,
    alarms || null,'END:VEVENT'].filter(Boolean).join('\r\n');
}

// A standalone 8:00 AM nudge entry, for lead times past Apple's 2-alert cap.
function buildReminderVEVENT(evt, daysBefore){
  const [y,m,day] = evt.date.split('-').map(Number);
  const dt = new Date(y, m-1, day - daysBefore, 8, 0);
  const ds = iso(dt).replace(/-/g,'');
  const title = '\u23f0 ' + alertLabel(daysBefore) + ' until: ' + eventTitle(evt).replace(/^\u23f0 /,'');
  return ['BEGIN:VEVENT','UID:'+evt.id+'-r'+daysBefore+'@flyersnap','DTSTAMP:'+icsStamp(),
    'DTSTART:'+ds+'T080000','DTEND:'+ds+'T081500',
    'SUMMARY:'+icsEscape(title),
    'DESCRIPTION:'+icsEscape('Actual date: '+friendly(evt.date)+(evt.time?' at '+fmt12(evt.time):'')),
    valarm(title, 0),'END:VEVENT'].join('\r\n');
}

function buildVEVENTs(evt){
  const plan = alertPlan(evt.kind, evt);
  return [buildVEVENT(evt)].concat(plan.extras.map(n=>buildReminderVEVENT(evt, n)));
}

function wrapICS(vevents){
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FlyerSnap//EN'].concat(vevents).concat(['END:VCALENDAR']).join('\r\n');
}
// True when running as an installed home-screen app. In that mode iOS CANNOT
// open a new browser tab, so window.open() strands the app on a blank page.
function isStandalone(){
  return (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}

function deliverICS(ics, filename, msg){
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);

  if(isStandalone()){
    // Installed PWA: no new tab is possible. Download the .ics instead — tapping
    // the downloaded file opens Calendar's import screen with an "Add All" button.
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Saved ' + filename + ' — open it from Downloads to add everything 📆');
  } else {
    // Real Safari tab: rendering the URL shows Calendar's Add / Add All screen.
    const win = window.open(url, '_blank');
    if(!win){
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    }
    if(msg) toast(msg);
  }
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

// Last-resort path: hand the file to the share sheet so it can be mailed to
// yourself — Mail's ICS attachments import with one tap.
async function shareICSFile(ics, filename){
  const blob = new Blob([ics], {type:'text/calendar'});
  try{
    const file = new File([blob], filename, {type:'text/calendar'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'FlyerSnap events'});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

function addAllAtOnce(onlyNew){
  const evts = S.events.filter(e=>!e.deleted && e.date>=todayISO() && (!onlyNew || !e.exported));
  if(!evts.length){ toast(onlyNew ? 'Everything is already added' : 'No upcoming events'); return; }
  const veh = [];
  evts.forEach(e=>veh.push(...buildVEVENTs(e)));
  deliverICS(wrapICS(veh), 'flyersnap-events.ics',
    'Tap "Add All" in the Calendar screen that opens 📆');
  evts.forEach(e=>e.exported=true); save();
}

function emailAllToSelf(){
  const evts = S.events.filter(e=>!e.deleted && e.date>=todayISO());
  if(!evts.length){ toast('No upcoming events'); return; }
  const veh2 = [];
  evts.forEach(e=>veh2.push(...buildVEVENTs(e)));
  shareICSFile(wrapICS(veh2), 'flyersnap-events.ics');
  toast('Pick Mail, send it to yourself, then tap the attachment');
}

function downloadICS(evt, customMsg){

    evt.title.replace(/[^\w ]/g,'').slice(0,40)+'.ics',
    customMsg || 'Sent to Calendar — tap Add there to save it 📆');

}

// iOS strips the "Add All" button from multi-event .ics files, so batching them
// into one file is a dead-end. Instead we queue events and send them one at a
// time — iOS handles single-event files smoothly.
function startExportQueue(force){
  const evts = S.events.filter(e=>!e.deleted && e.date>=todayISO() && (force || !e.exported));
  if(!evts.length){ toast('No upcoming events to add'); return; }
  S.settings.exportQueue = evts.map(e=>e.id);
  save(); sub('exportQueue');
}
function exportNextInQueue(){
  const q = S.settings.exportQueue || [];
  if(!q.length) return;
  const id = q[0];
  S.settings.exportQueue = q.slice(1);
  save();
  const evt = S.events.find(x=>x.id===id);
  if(!evt || evt.deleted){ render(); return; }
  const remaining = S.settings.exportQueue.length;
  const msg = remaining > 0
    ? `Sent to Calendar — tap Add, then come back for ${remaining} more`
    : 'Last one! Tap Add in Calendar to finish';
  downloadICS(evt, msg);
}
function skipNextInQueue(){
  const q = S.settings.exportQueue || [];
  if(!q.length) return;
  S.settings.exportQueue = q.slice(1);
  save(); render();
}
function openExportQueue(){ sub('exportQueue'); }

function cancelExportQueue(){
  if(!confirm('Cancel adding the rest to Calendar?')) return;
  S.settings.exportQueue = [];
  save(); render();
}
function renderExportQueue(m){

const TABS = [
  {id:'events', label:'Events', ic:'📅', title:'FlyerSnap'},
  {id:'chores', label:'Chores', ic:'✅', title:'Chores & Routines'},
  {id:'lists',  label:'Lists',  ic:'🛒', title:'Lists'},
  {id:'meals',  label:'Meals',  ic:'🍽️', title:'Meal Plan'},
  {id:'settings', label:'Settings', ic:'⚙️', title:'Settings'},
];
let view = {tab:'events', sub:null, data:null};
let lastViewKey = '';

function nav(tab){ closeSheet(); view = {tab, sub:null, data:null}; render(); }
function sub(name, data){ closeSheet(); view.sub = name; view.data = data||null; render(); }
function back(){ closeSheet(); view.sub = null; view.data = null; render(); }

function renderNav(){
  document.getElementById('nav').innerHTML = TABS.map(t=>
    `<button class="${view.tab===t.id?'on':''}" onclick="nav('${t.id}')">
      <span class="ic">${t.ic}</span>${t.label}</button>`).join('');
}
function setHeader(title, showBack){
  document.getElementById('header').innerHTML =
    (showBack?`<button class="back" onclick="back()">‹</button>`:'') + esc(title);
}

function render(){
  if(S.__locked){ renderRecovery(document.getElementById('main')); return; }
  const key = view.tab + '|' + (view.sub||'');
  const y = window.scrollY;
  renderNav();
  const m = document.getElementById('main');
  const subs = {capture:renderCapture, review:renderReview, rewards:renderRewards,
    listDetail:renderListDetail, recipeBox:renderRecipeBox, recipeForm:renderRecipeForm,
    busy:renderBusy, eventEdit:renderEventEdit, ledger:renderLedger,
    shareEvents:renderShareEvents, dedupe:renderDedupe, senders:renderSenders, pickExport:renderPickExport, exportQueue:renderExportQueue,
    selfTest:renderSelfTest, compare:renderCompare};
  const tabs = {events:renderEvents, chores:renderChores, lists:renderLists,
    meals:renderMeals, settings:renderSettings};
  const changedScreen = key !== lastViewKey;
  m.classList.remove('enter');
  (view.sub ? subs[view.sub] : tabs[view.tab])(m);
  if(changedScreen){
    // Retrigger the animation. Only on a genuine navigation -- animating every
    // re-render would make simple taps feel laggy.
    void m.offsetWidth;
    m.classList.add('enter');
  }
  if(key === lastViewKey) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastViewKey = key;
}

let sheetEls = null;

// ---------- Events tab ----------
let eventFilter = null;
// Something the user knows that the page does not say -- "these are all band
// dates". Photographs of a schedule often carry dates and nothing else.
let scanContext = '';

// Insert the user's context just before the prompt, if they gave any.
function withContext(blocks){
  const ctx = contextBlock();
  const out = blocks.slice();
  if(ctx) out.push(ctx);
  out.push({ type:'text', text: eventPrompt() });
  return out;
}

function contextBlock(){
  const c = (scanContext||'').trim();
  if(!c) return null;
  return { type:'text', text:
    'CONTEXT FROM THE USER: these items are about "' + c + '".\n' +
    'The page itself may not say so. Use this when writing each title and note so ' +
    'the events are recognisable later -- for example a bare "Rehearsal" becomes ' +
    '"Rehearsal (' + c + ')". This context does NOT license invention: do not invent dates or details that are not on the page. It only tells you what the page is for.' };
}
let newPersonType = 'kid';
let selectMode = false;
let selectedEvents = new Set();
let showPast = false;
function upcomingEvents(){
  const t = todayISO();
  return S.events.filter(e=>!e.deleted && e.date>=t && matchesFilter(e) && matchesSearch(e))
    .sort((a,b)=> a.date===b.date ? String(a.time||'99').localeCompare(String(b.time||'99')) : a.date.localeCompare(b.date));
}
let eventSearch = '';
let pastLimit = 30;               // grows on demand; pruning bounds the data at 2 years

function matchesSearch(e){
  const q = eventSearch.trim().toLowerCase();
  if(!q) return true;
  const people = eventPeople(e);
  return [e.title, e.location, e.notes, e.source, eventPeople(e).map(p=>p.name).join(' '), friendly(e.date)]
    .filter(Boolean).join(' ').toLowerCase().includes(q);
}

function pastEvents(){
  const t = todayISO();
  return S.events.filter(e=>!e.deleted && e.date<t && matchesFilter(e) && matchesSearch(e))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function backupNudge(){
  const count = S.events.length + S.chores.length + S.listItems.length;
  if(count < 6) return '';
  const last = S.settings.lastBackup;
  const snooze = S.settings.nudgeSnooze;
  const stale = !last || daysUntil(last) <= -7;
  const snoozed = snooze && daysUntil(snooze) > -7;
  if(!stale || snoozed) return '';
  return `<div class="card" style="background:var(--green-lt)">
    <div class="title" style="font-size:14px">💾 Time for a backup</div>
    <div class="meta">Your data lives only on this phone, and iOS can clear it without warning. ${last?'Last backup: '+friendly(last)+'.':'No backup yet.'}</div>
    <div class="formrow" style="margin:10px 0 0">
      <button class="btn sm" onclick="exportBackup()">Export now</button>
      <button class="btn alt sm" onclick="S.settings.nudgeSnooze=todayISO();save();render()">Later</button>
    </div></div>`;
}
function newFlag(e){ return e.unread ? `<span class="newflag">NEW</span>` : ''; }
function fromLine(e){
  if(!e.from && !e.source) return '';
  const bits = [];
  if(e.from) bits.push(esc(e.from));
  if(e.source) bits.push(esc(e.source));
  return `<div class="meta" style="font-size:11px;opacity:.75;margin-top:2px">✉️ ${bits.join(' · ')}</div>`;
}
function calFlag(e){
  return e.exported
    ? `<span class="calflag">📆 In calendar</span>`
    : '';
}
// Group upcoming events into scannable time buckets. A flat list of 25 cards
// gives the eye nothing to anchor on; headers let you navigate by scanning.
function timeBucket(days){
  if(days <= 0) return 'Today';
  if(days === 1) return 'Tomorrow';
  if(days <= 7) return 'This week';
  if(days <= 14) return 'Next week';
  if(days <= 31) return 'This month';
  return 'Later';
}

function groupedUpcoming(evts){
  const groups = [];
  let current = null;
  evts.forEach(e => {
    const b = timeBucket(daysUntil(e.date));
    if(!current || current.label !== b){ current = { label:b, items:[] }; groups.push(current); }
    current.items.push(e);
  });
  return groups;
}

  if(far){

  return `<div class="card stripe ${e.kind} ${isPast?'dim':''} ${near?'near':''}" onclick="eventActions('${e.id}')">
    <div class="row">
      <div class="grow">

// ---------- Gmail watcher ----------
// A Google Apps Script reads matching emails on Google's servers every 15 min
// and holds extracted events in a queue. We just fetch and review them.
let pendingMsgIds = [];

function watcherConfigured(){ return !!(S.settings.watcherUrl && S.settings.watcherToken); }
function personsForSender(from){
  const map = S.settings.senderTags || {};
  if(!from) return [];
  const addr = String(from).toLowerCase();
  if(map[addr]) return map[addr].filter(id => personById(id));
  const at = addr.indexOf('@');
  const domain = at >= 0 ? addr.slice(at+1) : addr;
  if(map[domain]) return map[domain].filter(id => personById(id));
  return [];
}

// Apps Script /exec redirects to script.googleusercontent.com, and that hop
// does not carry CORS headers a browser will accept for a cross-origin fetch().
// Script tags are exempt from CORS, so we load the response as JSONP instead.
function watcherBaseUrl(){
  let u = (S.settings.watcherUrl || '').trim();
  const q = u.indexOf('?');
  if(q >= 0) u = u.slice(0, q);        // drop any query the user pasted in
  return u.replace(/\/+$/, '');
}

function jsonpRequest(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = 'fsWatcherCb' + Date.now() + Math.floor(Math.random() * 1e6);
    const tag = document.createElement('script');
    let settled = false;
    const cleanup = () => {
      settled = true;
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(tag.parentNode) tag.parentNode.removeChild(tag);
    };
    const timer = setTimeout(() => {
      if(settled) return;
      cleanup();
      reject(new Error('The watcher did not answer in time. Check the /exec URL and that the deployment is Active.'));
    }, timeoutMs || 20000);
    window[cb] = (data) => { if(settled) return; cleanup(); resolve(data); };
    tag.onerror = () => {
      if(settled) return;
      cleanup();
      reject(new Error('Could not load that URL. Copy it again from Deploy > Manage deployments > Web app.'));
    };
    tag.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.body.appendChild(tag);
  });
}

async function fetchEmailQueue(){
  const base = watcherBaseUrl();
  if(!base) throw new Error('No watcher URL saved.');
  const url = base + '?token=' + encodeURIComponent((S.settings.watcherToken || '').trim());
  const data = await jsonpRequest(url);
  if(data.error) throw new Error(data.error === 'unauthorized'
    ? 'Token rejected — check the secret matches the script.' : data.error);
  const seen = new Set(S.settings.seenMsgs || []);
  const items = data.items || [];
  const today = todayISO();
  let noMsgId = 0, alreadySeen = 0, inPast = 0;
  const fresh = items.filter(i => {
    if(!i.msgId){ noMsgId++; return false; }
    if(seen.has(i.msgId)){ alreadySeen++; return false; }
    if(isMessageRef(i)) return true;                             // not extracted yet
    if(!(i.date >= today)){ inPast++; return false; }
    return true;
  });
  const report = 'Queue: ' + items.length + ' item(s) from the watcher. ' +
    'Offered: ' + fresh.length + '. Skipped -- already imported: ' + alreadySeen +
    ', dated before today (' + today + '): ' + inPast + ', missing message id: ' + noMsgId + '.';
  return { fresh, lastRun: data.lastRun, report };
}

// Queue items arrive in one of two shapes: already-extracted events (the old
// path) or raw email text for the app to extract (RAW_MODE). Handle both, so a
// mixed queue during the changeover still works.
// Ask the watcher for one message's prepared text and its attachments.
// A queue entry is either a finished event (has a date/title) or a reference to
// a message the app still needs to fetch and extract.
function isMessageRef(i){
  if(!i || !i.msgId) return false;
  if(typeof i.raw === 'string' && i.raw.length) return true;   // legacy shape
  return !i.date && !i.title;
}

async function fetchMessage(msgId){
  const base = watcherBaseUrl();
  const url = base + '?token=' + encodeURIComponent((S.settings.watcherToken||'').trim()) +
    '&action=message&msgId=' + encodeURIComponent(msgId);
  const data = await jsonpRequest(url, 60000);
  if(!data || data.error) throw new Error((data && data.error) || 'no response');
  return data;
}

// A single email can carry dates in the body AND on an attached flyer image.
// Neither pass alone is enough: a text model cannot see the image, and reading
// only the image loses the body. So run both and merge.
function providerLabel(){ return aiModelName(); }

// One email can hold the date on a flyer, the dress code in the body, and the
// kit list in an attached PDF. Separate passes cannot see across those, so we
// send everything in a SINGLE request first and let the model correlate. Only
// if that is impossible (a PDF on a provider that cannot read PDFs, or a payload
// too large) do we fall back to per-source passes.
function emailBlocks(payload, includeAttachments){
  const blocks = [];
  const atts = (includeAttachments && Array.isArray(payload.attachments))
    ? payload.attachments : [];

  atts.forEach((att, i) => {
    blocks.push({ type:'text', text:'--- ATTACHMENT ' + (i+1) + ': ' + (att.name||'file') + ' ---' });
    blocks.push(att.mediaType === 'application/pdf'
      ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:att.data } }
      : { type:'image',    source:{ type:'base64', media_type:att.mediaType,     data:att.data } });
  });

  if(payload.text && payload.text.trim().length > 20){
    blocks.push({ type:'text', text:
      '--- EMAIL BODY ---\nFrom: ' + (payload.from||'unknown') +
      '\nSubject: ' + (payload.subject||'') + '\n\n' + payload.text });
  }
  return blocks;
}

const MULTI_SOURCE_NOTE = `The material above may come from more than one place: the body of an email, and one or more attachments (flyers, schedules, letters).

Treat them as ONE set of facts about the same events. A date may appear only on a flyer while what to bring is only in the email, or the reverse. Combine them: each event gets the best date, time and location found anywhere, and notes drawn from every source that says something useful about it.

If the same event appears in two places, produce ONE item, not two.`;

async function extractFromEmailPayload(payload){
  const found = [];
  const problems = [];
  const atts = Array.isArray(payload.attachments) ? payload.attachments : [];

  // Preferred path: everything in one request, so notes can be drawn from
  // whichever source happens to hold them.
  if(atts.length){
    try{
      const blocks = emailBlocks(payload, true);
      blocks.push({ type:'text', text: MULTI_SOURCE_NOTE });
      blocks.push({ type:'text', text: eventPrompt() });
      const text = await callAI(blocks, 8000, GROUNDING_EVENTS);
      const events = parseExtractedEvents(text) || [];
      if(events.length) return { events, problems };
      problems.push('combined read found nothing; trying each part separately');
    }catch(err){
      problems.push('combined read failed (' + err.message + '); trying each part separately');
    }
  }

  // Fallback -- read each source on its own and stitch the results together.
  // Pass 1: the body text. Any model can do this.
  if(payload.text && payload.text.trim().length > 20){
    try{
      const text = await callAI([
        {type:'text', text:'Email from ' + (payload.from||'unknown') +
          '\nSubject: ' + (payload.subject||'') + '\n\n' + payload.text},
        {type:'text', text:eventPrompt()}], 8000, GROUNDING_EVENTS);
      (parseExtractedEvents(text)||[]).forEach(e => found.push(e));
    }catch(err){ problems.push('body text: ' + err.message); }
  }

  // Pass 2 -- each attachment. Images need a vision model; PDFs only work on
  // Anthropic, and callAI reports that clearly rather than failing silently.
  // Give the attachment pass the covering email as context. A flyer often shows
  // the date while the email body carries the detail worth noting.
  const context = (payload.text || '').slice(0, 6000);
  for(const att of atts){
    const isPdf = att.mediaType === 'application/pdf';
    const block = isPdf
      ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:att.data}}
      : {type:'image', source:{type:'base64', media_type:att.mediaType, data:att.data}};
    try{
      const blocks = [block];
      if(context.trim().length > 40){
        blocks.push({type:'text', text:
          'This was attached to an email from ' + (payload.from||'unknown') +
          ', subject "' + (payload.subject||'') + '". The email said:\n\n' + context +
          '\n\nExtract from the ATTACHMENT above. Use the email only for context when writing notes.'});
      }
      blocks.push({type:'text', text:eventPrompt()});
      const text = await callAI(blocks, 8000, GROUNDING_EVENTS);
      (parseExtractedEvents(text)||[]).forEach(e => found.push(e));
    }catch(err){
      problems.push((att.name || 'attachment') + ': ' + err.message);
    }
  }

  // Merge: the same date can appear in both the body and the flyer. One event.
  // Merge duplicates, keeping the fullest version of each field. The body and
  // the flyer often each know something the other does not.
  const merged = [];
  found.forEach(e => {
    const hit = merged.find(m => looksDuplicate(m, e));
    if(!hit){ merged.push(e); return; }
    if((e.notes||'').length > (hit.notes||'').length) hit.notes = e.notes;
    if(!hit.time && e.time) hit.time = e.time;
    if(!hit.endTime && e.endTime) hit.endTime = e.endTime;
    if(!hit.location && e.location) hit.location = e.location;
    if((e.title||'').length > (hit.title||'').length) hit.title = e.title;
  });
  return { events: merged, problems };
}

async function extractFromRawItems(items){
  const out = [];
  const failures = [];
  const stamp = aiModelName();

  for(let i = 0; i < items.length; i++){
    const it = items[i];
    const label = it.subject ? String(it.subject).slice(0,60) : '';
    sub('busy', {msg:'Reading email ' + (i+1) + ' of ' + items.length + '…', hint: label});
    try{
      const payload = await fetchMessage(it.msgId);
      if(payload.attachments && payload.attachments.length){
        sub('busy', {msg:'Reading email ' + (i+1) + ' of ' + items.length + '…',
                     hint: label + ' (+' + payload.attachments.length + ' attachment)'});
      }
      const { events, problems } = await extractFromEmailPayload(payload);
      events.forEach(e => out.push(Object.assign({}, e,
        { msgId: it.msgId, from: payload.from || it.from || null,
          source: 'Email - ' + (payload.subject || it.subject || ''),
          aiSource: stamp })));
      problems.forEach(p => failures.push(label + ' — ' + p));
      if(!events.length && !problems.length) failures.push(label + ' — no dates found');
    }catch(err){
      failures.push(label + ' — ' + err.message);
    }
  }

  // Failures must be visible. console.log is invisible on a phone.
  if(failures.length){
    lastEmailProblems = failures;
  }
  return out;
}

async function openEmailReview(fresh){
  const rawItems = fresh.filter(isMessageRef);
  if(rawItems.length){
    const extracted = await extractFromRawItems(rawItems);
    fresh = fresh.filter(i => !isMessageRef(i)).concat(extracted);
  }
  pendingMsgIds = [...new Set(fresh.map(i=>i.msgId))];
  pendingEvents = markDuplicates(fresh.map(i => {
    const ppl = personsForSender(i.from);
    return {

// Duplicates that are already saved -- e.g. a flyer scanned by hand and the same
// announcement arriving by email before matching was improved.
function pairKey(a, b){ return [a.id, b.id].sort().join('~'); }
function isDismissedPair(a, b){
  const d = (S.settings && S.settings.notDuplicates) || [];
  return d.indexOf(pairKey(a, b)) >= 0;
}
function dismissGroup(i){
  const g = duplicateGroups()[i];
  if(!g) return;
  if(!S.settings.notDuplicates) S.settings.notDuplicates = [];
  for(let x = 0; x < g.length; x++)
    for(let y = x + 1; y < g.length; y++){
      const k = pairKey(g[x], g[y]);
      if(S.settings.notDuplicates.indexOf(k) < 0) S.settings.notDuplicates.push(k);
    }
  save();
  toast('Marked as different events');
  if(!duplicateGroups().length){ view = { tab:'events', sub:null, data:null }; }
  render();
}

function duplicateGroups(){
  const evts = S.events.filter(e => !e.deleted)
    .sort((a,b) => a.date.localeCompare(b.date));
  const used = new Set();
  const groups = [];
  for(let i = 0; i < evts.length; i++){
    if(used.has(evts[i].id)) continue;
    const group = [evts[i]];
    for(let j = i + 1; j < evts.length; j++){
      if(used.has(evts[j].id)) continue;
      if(evts[j].date !== evts[i].date) continue;
      if(group.some(g => looksDuplicate(g, evts[j]) && !isDismissedPair(g, evts[j]))){
        group.push(evts[j]);
        used.add(evts[j].id);
      }
    }
    if(group.length > 1){ used.add(evts[i].id); groups.push(group); }
  }
  return groups;
}

// Keep whichever copy carries the most information.
function richness(e){
  return (e.time ? 2 : 0) + (e.location ? 2 : 0) + (e.notes ? 1 : 0) +
         (e.kidId ? 1 : 0) + (e.exported ? 1 : 0);
}
function bestOfGroup(group){
  return group.slice().sort((a,b) => richness(b) - richness(a))[0];
}

let dedupeKeep = {};      // groupIndex -> event id to keep

function openDedupe(){
  dedupeKeep = {};
  duplicateGroups().forEach((g, i) => { dedupeKeep[i] = bestOfGroup(g).id; });
  sub('dedupe');
}
function setDedupeKeep(i, id){ dedupeKeep[i] = id; render(); }

function applyDedupe(){
  const groups = duplicateGroups();
  let removed = 0;
  if(!S.settings.notDuplicates) S.settings.notDuplicates = [];
  groups.forEach((g, i) => {
    const keep = dedupeKeep[i];
    if(!keep){
      // "Keep both" means you have reviewed this pair and they are different.
      // Record it so the banner stops re-flagging the same events forever.
      for(let x = 0; x < g.length; x++)
        for(let y = x + 1; y < g.length; y++){
          const k = pairKey(g[x], g[y]);
          if(S.settings.notDuplicates.indexOf(k) < 0) S.settings.notDuplicates.push(k);
        }
      return;
    }
    g.forEach(e => {
      if(e.id !== keep){ e.deleted = true; e.dirty = 1; removed++; }
    });
  });
  save();
  toast(removed ? `Removed ${removed} duplicate${removed===1?'':'s'}` : 'Kept everything');
  view = { tab:'events', sub:null, data:null };
  render();
}

// The same announcement can reach us twice -- once photographed, once by email --
// and Claude words the two slightly differently ("&" vs "and", extra qualifiers).
// Matching therefore has to be on meaning, not on the exact string.
function normTitle(t){
  return String(t || '').toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\b(the|a|an|of|for|to|at|on|in|our|your|please|note)\b/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function dupKey(t, d){ return normTitle(t) + '|' + d; }

// Overlap measured against the shorter title, so "Picture Day" still matches
// "Fall Picture Day for Grades 1-5".
function titleSimilarity(a, b){
  const A = normTitle(a).split(' ').filter(Boolean);
  const B = normTitle(b).split(' ').filter(Boolean);
  if(!A.length || !B.length) return 0;
  const setB = new Set(B);
  const overlap = A.filter(w => setB.has(w)).length;
  return overlap / Math.min(A.length, B.length);
}

function looksDuplicate(a, b){
  if(!a || !b || a.date !== b.date) return false;          // same day is required
  const na = normTitle(a.title), nb = normTitle(b.title);
  if(!na || !nb) return false;
  if(na === nb) return true;                                // identical after normalizing
  // For anything else, demand a strong match. Short titles (1-2 words) are too
  // easy to collide by chance ("Mini Jazz" vs "Mini M.T."), so for those we
  // require one title to fully contain the other rather than mere word overlap.
  const wa = na.split(' ').filter(Boolean), wb = nb.split(' ').filter(Boolean);
  const shorter = Math.min(wa.length, wb.length);
  if(shorter <= 2){
    return na.indexOf(nb) >= 0 || nb.indexOf(na) >= 0;     // full containment only
  }
  return titleSimilarity(a.title, b.title) >= 0.8;         // was 0.6 — too loose
}

// Shared by every import path: photo, PDF, link and email.
function markDuplicates(found, alsoPending){
  const seen = S.events.filter(e => !e.deleted).map(e => ({ title:e.title, date:e.date }));
  if(alsoPending) alsoPending.forEach(p => seen.push({ title:p.title, date:p.date }));
  return found.map(e => {
    const dup = seen.some(x => looksDuplicate(e, x));
    seen.push({ title:e.title, date:e.date });
    return { ...e, selected: !dup, dup,
      personIds: Array.isArray(e.personIds) ? e.personIds : [],
      kidId: (Array.isArray(e.personIds) && e.personIds[0]) || null };
  });
}

async function handleCapture(fileList, isPdf){
  const files = Array.from(fileList||[]).filter(Boolean);
  if(!files.length) return;
  if(!S.settings.apiKey){
    alert('Add your Anthropic API key in Settings first.'); nav('settings'); return;
  }
  const append = captureAppend && pendingEvents.length > 0;
  captureAppend = false;
  sub('busy', {msg:'Reading the document…', hint: aiWorkingHint()});
  try{
    let found = [];
    for(let i=0; i<files.length; i++){
      if(files.length>1) sub('busy', {msg:`Reading page ${i+1} of ${files.length}…`, hint: aiName() + ' is working out what this is'});
      const f = files[i];
      let base64, mediaType;
      if(isPdf){ base64 = await readFile(f); mediaType='application/pdf'; }
      else { const r = await readImageDownscaled(f); base64=r.base64; mediaType=r.mediaType; }

      // A single capture might be a recipe rather than paperwork — let Claude
      // decide rather than making the user sort it first.
      if(files.length === 1 && !append){
        const out = await extractAny(base64, mediaType, isPdf);
        if(out.type === 'recipe'){
          recipeForm = {
            title: out.recipe.title || '',
            category: ['Breakfast','Lunch','Dinner','Snack','Other'].includes(out.recipe.category) ? out.recipe.category : 'Other',
            ingredients: out.recipe.ingredients || '',
            instructions: out.recipe.instructions || ''
          };
          toast('That looks like a recipe — sending it to the Recipe app');
          sub('recipeForm');
          return;
        }
        if(out.type === 'unknown'){
          alert('Could not tell what that is. Try a clearer photo, or use Scan a recipe if it is a recipe.');
          back(); return;
        }
        found = out.events;
      } else {
        found = found.concat(await extractEvents(base64, mediaType, isPdf));
      }
    }
    if(!found.length){
      alert('No dates found. Try a clearer photo or a different page.');
      append ? sub('review') : back();
      return;
    }
    // Duplicate detection: against saved events, prior pending items, and within this batch
    const items = markDuplicates(found, append ? pendingEvents : null);
    if(append){ pendingEvents = pendingEvents.concat(items); }
    else {
      pendingEvents = items;
      pendingSource = isPdf ? (files[0].name||'PDF import') : 'Photo '+todayISO();
    }
    sub('review');
  }catch(err){
    alert(err.message==='NO_API_KEY' ? 'Add your Anthropic API key in Settings first.' : 'Extraction failed: '+err.message);
    append ? sub('review') : back();
  }
}

async function pasteFromClipboard(){
  if(!navigator.clipboard || !navigator.clipboard.read){
    alert('This iOS version does not support paste. Use Choose from Photos instead.');
    return;
  }
  try{
    const items = await navigator.clipboard.read();
    for(const item of items){
      for(const type of item.types){
        if(type.startsWith('image/')){
          const blob = await item.getType(type);
          const file = new File([blob], 'pasted.'+type.split('/')[1], {type});
          handleCapture([file], false);
          return;
        }
      }
    }
    alert('No image on your clipboard. Copy an image first (long-press it in Mail, Photos, or Safari and tap Copy), then come back and tap Paste an image.');
  }catch(err){
    if(err.name === 'NotAllowedError'){
      alert('Paste blocked. When you tap Paste an image, iOS will ask "Allow paste?" — tap Allow.');
    } else {
      alert('Could not read the clipboard: ' + err.message);
    }
  }
}

function submitLink(){

async function handleLinkCapture(url){
  if(!S.settings.apiKey){
    alert('Add your Anthropic API key in Settings first.'); nav('settings'); return;
  }
  const append = captureAppend && pendingEvents.length > 0;
  captureAppend = false;
  sub('busy', {msg:'Fetching the link…', hint: aiWorkingHint()});
  try{
    const found = await extractEventsFromUrl(url);
    if(!found.length){
      alert('No dates found at that link. If it needed a login, try opening it in Safari, saving the PDF, and importing it.');
      append ? sub('review') : back();
      return;
    }
    const items = markDuplicates(found, append ? pendingEvents : null);
    let host = url; try{ host = new URL(url).hostname.replace(/^www\./,''); }catch(e){}
    if(append){ pendingEvents = pendingEvents.concat(items); }
    else { pendingEvents = items; pendingSource = 'Link · ' + host; }
    sub('review');
  }catch(err){
    if(err.message === 'NO_API_KEY'){ alert('Add your Anthropic API key in Settings first.'); }
    else if(/40\d|fetch|url|access|forbidden|unauth/i.test(err.message)){
      alert('Could not fetch that link — it likely needs a login. Open it in Safari, save the PDF, and use Import instead.');
    } else {
      alert('Extraction failed: ' + err.message);
    }
    append ? sub('review') : back();
  }
}

function toggleReview(i){ pendingEvents[i].selected = !pendingEvents[i].selected; render(); }
function setReviewKid(i, personId){
  const e = pendingEvents[i];
  if(!Array.isArray(e.personIds)) e.personIds = e.kidId ? [e.kidId] : [];
  const at = e.personIds.indexOf(personId);
  if(at >= 0) e.personIds.splice(at, 1); else e.personIds.push(personId);
  e.kidId = e.personIds[0] || null;      // keep a primary for any legacy reader
  render();
}
function tagAll(personId){
  pendingEvents.forEach(e=>{
    if(!e.selected) return;
    if(!Array.isArray(e.personIds)) e.personIds = e.kidId ? [e.kidId] : [];
    if(!e.personIds.includes(personId)) e.personIds.push(personId);
    e.kidId = e.personIds[0] || null;
  });
  render();
}
// Mark the current email batch handled without tracking anything from it.
function dismissPendingEmail(){
  if(pendingMsgIds.length){
    S.settings.seenMsgs = [...new Set((S.settings.seenMsgs||[]).concat(pendingMsgIds))].slice(-400);
    pendingMsgIds = [];
  }
  save();
  toast('Skipped — these will not come back');
  pendingEvents = [];
  lastEmailProblems = [];
  scanContext = '';
  view = {tab:'events', sub:null, data:null};
  render();
}

function saveReview(){
  const chosen = pendingEvents.filter(e=>e.selected);
  if(!chosen.length){
    // Deselecting everything is a legitimate answer: "none of these". This used
    // to bail out before recording the message ids, so the same events came back
    // on every scan with no way to dismiss them.
    if(pendingMsgIds.length){
      if(!confirm('Nothing is selected.\n\nSkip everything from this email? It will not be offered again.')) return;
      dismissPendingEmail();
      return;
    }
    alert('Tap the events you want to track, then save.');
    return;
  }
  for(const e of chosen){
    S.events.push({ id:uid(), title:e.title, date:e.date, time:e.time, location:e.location,
      kind:e.kind, notes:e.notes, endTime:(e.time?e.endTime:null)||null, personIds:(e.personIds||(e.kidId?[e.kidId]:[])), kidId:e.kidId||null, source:pendingSource, from:e.from||null, aiSource:e.aiSource||null, exported:false, unread:true, deleted:false });
  }
  // Only mark emails handled once they've actually been reviewed — abandoning
  // the screen leaves them in the queue for next time.
  if(pendingMsgIds.length){
    S.settings.seenMsgs = [...new Set((S.settings.seenMsgs||[]).concat(pendingMsgIds))].slice(-400);
    pendingMsgIds = [];
  }
  save();
  toast(`Tracking ${chosen.length} item${chosen.length===1?'':'s'} — tap any event to add calendar alerts`);
  pendingEvents = [];
  lastEmailProblems = [];
  scanContext = '';
  view = {tab:'events', sub:null, data:null}; render();
}

    endTime:(f.time && f.endTime)?f.endTime:null,
    location:(f.location||'').trim()||null, notes:(f.notes||'').trim()||null,
    kind:f.kind, personIds:ids, kidId:ids[0]||null };
  if(f.saved){
    const e = S.events.find(x=>x.id===f.ref);

    sub('review');

function completionFor(choreId, date){
  return S.completions.find(c=>c.choreId===choreId && c.date===date);

function starBalances(){
  // Start from stars carried forward when old history was pruned, so balances
  // survive pruning unchanged.
  const bal = Object.assign({}, S.settings.starCarry || {});
  for(const c of S.completions){ if(c.kidId) bal[c.kidId]=(bal[c.kidId]||0)+(c.stars||0); }
  for(const r of S.redemptions){ bal[r.kidId]=(bal[r.kidId]||0)-r.stars; }
  return bal;
}
