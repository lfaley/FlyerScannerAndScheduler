  html += conflictBanner();

  const dGroups = duplicateGroups();
  if(dGroups.length && !eventSearch){
    const first = dGroups[0];
    const preview = first.map(e => e.title).join('  vs  ');
    html += `<div class="card" style="border-left:5px solid var(--amber)" onclick="openDedupe()">
      <div style="font-weight:800;font-size:14px;margin-bottom:2px">${dGroups.length} possible duplicate${dGroups.length===1?'':'s'} — tap to review</div>
      <div class="meta" style="font-size:12px">${esc(preview)}</div>
    </div>`;
  }
  html += backupNudge();
  if(!evts.length){
    if(eventSearch){
      html += `<div class="empty"><div class="et">No upcoming matches</div>
        <div class="eb">Nothing upcoming matches "${esc(eventSearch)}". Past events are below if there are matches there.</div></div>`;
    } else if(totalEvents > 0){
      // Data exists but nothing is showing — almost always a stuck kid filter.
      html += `<div class="empty"><div class="et">Nothing upcoming to show</div>
        <div class="eb">You have ${totalEvents} event${totalEvents===1?'':'s'} saved${eventFilter?', but the filter above is limiting this list':''}. ${eventFilter?'Tap <b>All</b> to see everything.':'They may all be in the past — check below.'}</div></div>`;
    } else {
      html += emptyState('camera', 'Nothing tracked yet',
        'Snap a flyer or import a PDF and FlyerSnap will pull out the dates for you.',
        `<button class="btn alt" style="width:auto" onclick="openNewEvent()">${ico('pen')}Type one in instead</button>`);
    }
  } else {
    // Always available. These used to be hidden while an export queue was
    // running, which made the button vanish if a queue was left unfinished.
    html += `<div style="display:flex;justify-content:flex-end">
      ${aiEnabled() ? `<button class="linkbtn" style="padding:2px 8px" onclick="openAsk()">${ico('search')}Ask</button>` : ''}
      <button class="linkbtn" style="padding:2px 8px" onclick="openShareEvents()">${ico('share')}Share</button>
      <button class="linkbtn" style="padding:2px 8px" onclick="calendarOptions()">${ico('calendar-plus')}Add to Calendar</button></div>`;
    html += groupedUpcoming(evts).map(g => `
      <div class="bucket">${g.label}<span class="bucket-n">${g.items.length}</span></div>
      ${g.items.map(e=>evtCard(e, false)).join('')}`).join('');
  }
  if(selectMode){
    html += `<div class="card" style="position:sticky;bottom:76px;z-index:20">
      <button class="btn ${selectedEvents.size?'':'alt'}" onclick="bulkTagSheet()">
        ${selectedEvents.size ? `${ico('gear')}${selectedEvents.size} selected — choose action` : 'Tap events to select them'}
      </button></div><div style="height:70px"></div>`;
  }

  if(past.length){
    const open = showPast || !!eventSearch;      // a search should look everywhere
    html += `<div style="text-align:center;margin-top:6px">
      <button class="linkbtn" onclick="togglePastEvents()">${ico(open?'chevron-down':'chevron-right')} Past events (${past.length})</button></div>`;
    if(open){
      const shown = past.slice(0, pastLimit);
      html += shown.map(e=>evtCard(e, true)).join('');
      if(past.length > shown.length){
        html += `<div style="text-align:center"><button class="linkbtn" onclick="pastLimit+=60;render()">
          Show ${Math.min(60, past.length - shown.length)} more (${past.length - shown.length} older)</button></div>`;
      }
    }
  }
  html += `<button class="btn fab" onclick="captureAppend=false;sub('capture')">${ico('plus')}Add paperwork</button>
    <div style="height:70px"></div>`;
  m.innerHTML = html;
}
// ---------- Clash warnings (deterministic -- see js/conflicts.js) ----------
// Not AI. Deliberately: "do these overlap?" is arithmetic with one exact
// answer, and routing it through a model would trade certainty for latency,
// cost and the chance of being wrong. Shown here so the app can say so.

function conflictKey(c){ return c.type + '|' + c.date + '|' + c.events.map(e=>e.id).sort().join(','); }

// Which of several live conflicts the banner is currently showing. Lets the
// user page through them (Logan's request) instead of having to dismiss one to
// see the next. Reset/clamped whenever the live list shrinks.
let conflictViewIndex = 0;

/**
 * Select mode on the clash banner (v9.70). `null` = not selecting (the normal
 * state); a Set of event ids = selecting. Same shape as problemSel, and held
 * outside S for the same reason: it is view state, so it must never be saved
 * or reach a backup, and a Set would serialise to {} if it were.
 *
 * clashSelKey pins the selection to the conflict it was made in. findConflicts()
 * re-derives on every render, so without it a selection made on one clash could
 * act on whatever the banner happens to be showing after a dismiss, a page, or
 * an undo -- which is exactly the failure P5-07 found in dedupeKeep, where the
 * key was the group's position in a list that changes shape.
 */
let clashSel = null;
let clashSelKey = null;

function clashSelecting(key){ return !!clashSel && clashSelKey === key; }

function toggleClashSelect(key){
  if(clashSelecting(key)){ clashSel = null; clashSelKey = null; }
  else { clashSel = new Set(); clashSelKey = key; }
  render();
}
function toggleClashPick(id, key){
  if(!clashSelecting(key)) return;
  if(clashSel.has(id)) clashSel.delete(id); else clashSel.add(id);
  render();
}
function selectAllClash(key){
  const c = findConflicts(S.events, todayISO()).find(x => conflictKey(x) === key);
  if(!c) return;
  const ids = c.events.map(e => e.id);
  // One control, both directions: tapping it again when everything is picked
  // clears, which is the only sane second meaning of "Select all".
  const all = clashSel && ids.every(id => clashSel.has(id)) && clashSel.size === ids.length;
  clashSel = all ? new Set() : new Set(ids);
  clashSelKey = key;
  render();
}
function clearClashSel(){ clashSel = null; clashSelKey = null; }

function conflictBanner(){
  const dismissed = new Set(S.settings.dismissedConflicts || []);
  const all = findConflicts(S.events, todayISO());
  const live = all.filter(c => !dismissed.has(conflictKey(c)));
  if(!live.length) return '';
  if(conflictViewIndex >= live.length) conflictViewIndex = 0;   // a dismiss shrank the list
  const c = live[conflictViewIndex];
  const n = live.length;
  return `<div class="card" style="border-left:5px solid var(--amber-accent)">
    <div class="row">
      <div class="grow">
        <div style="font-weight:800;font-size:14px;margin-bottom:2px">
          ${ico('alert')}${esc(describeConflict(c))}</div>
        <div class="meta" style="font-size:12px">${friendly(c.date)}${n > 1 ? ` · ${conflictViewIndex + 1} of ${n}` : ''}</div>
      </div>
      <button class="linkbtn" style="padding:4px 6px"
        onclick="event.stopPropagation();dismissConflict('${esc(conflictKey(c))}')">Dismiss</button>
    </div>
    <div class="actionrow" style="margin:10px 0 0">${conflictActions(c)}</div>
    ${n > 1 ? `<div class="row" style="justify-content:space-between;align-items:center;margin-top:10px">
      <span class="meta" style="font-size:12px">${n - 1} other clash${n - 1 === 1 ? '' : 'es'} to review</span>
      <button class="linkbtn" onclick="stepConflict()">See next clash</button>
    </div>` : ''}
    </div>`;
}

// Page to the next live conflict without dismissing the current one.
function stepConflict(){
  clearClashSel();          // a selection belongs to the clash it was made in
  const dismissed = new Set(S.settings.dismissedConflicts || []);
  const live = findConflicts(S.events, todayISO()).filter(c => !dismissed.has(conflictKey(c)));
  if(live.length > 1) conflictViewIndex = (conflictViewIndex + 1) % live.length;
  render();
}

// HAX G9 is "support efficient correction": make it easy to FIX the thing,
// not just to hide it. The first version of this banner only had a dismiss,
// which trains you to bury problems instead of dealing with them -- and the
// event itself was buried under "Past events", which made acting on it a
// chore. These are the actions that actually resolve a warning.
function conflictActions(c){
  const e = c.events[0];
  if(c.type === 'missed-deadline'){
    return `<button class="btn sm" onclick="markHandled('${esc(e.id)}')">${ico('check-circle')}Mark as handled</button>
      <button class="btn alt sm" onclick="eventActions('${esc(e.id)}')">${ico('edit')}Open it</button>`;
  }
  // Overlaps and busy days are NOT necessarily errors: on a family calendar the
  // usual case is two children each with their own thing at the same time, and
  // both must stay. Research on double-booking UX (and Apple/Google's own
  // side-by-side overlaps) says a soft, non-blocking warning with an explicit
  // "keep both" is right — never force a resolution. So the FIRST, primary action
  // here is "Keep both": it acknowledges the overlap and won't nag about this pair
  // again. Moving one (reschedule) is offered second, for a genuine clash.
  const people = allPeople();
  const key = conflictKey(c);
  const nameOf = id => (people.find(p => p.id === id) || {}).name;
  // Are these plausibly for DIFFERENT people? (distinct non-empty person tags.)
  const tagged = c.events.map(ev => (ev.personIds || []).map(nameOf).filter(Boolean).sort().join(', ')).filter(Boolean);
  const differentPeople = new Set(tagged).size > 1;
  const keepLabel = c.events.length > 2 ? 'Keep all' : 'Keep both';
  // v9.70: select mode, the same shape the Problem Log has used since v9.39.
  // The default view carries NO per-event destructive control -- v9.69 put two
  // red links under every row, which on a four-event busy day is eight of them
  // and still could not express "these two".
  const picking = clashSelecting(key);
  const nPicked = picking ? clashSel.size : 0;
  const nTotal = c.events.length;
  const note = differentPeople
    ? `Looks like these are for different people${tagged.length === c.events.length ? ' (' + tagged.join(' vs ') + ')' : ''} — keeping ${c.events.length > 2 ? 'them all' : 'both'} is usually right.`
    : 'Overlaps aren’t always a problem — keep them if that’s intended, or move one below.';
  return `<div style="width:100%;display:flex;flex-direction:column;gap:6px">`
    + (picking ? '' : `<button class="btn sm" style="width:100%" onclick="event.stopPropagation();dismissConflict('${esc(key)}')">${ico('check-circle')}${keepLabel} — dismiss this warning</button>`)
    + (picking ? '' : `<div class="meta" style="font-size:12px;margin:2px 0 4px">${esc(note)}</div>`)
    + (picking ? `<div class="card" style="padding:10px;margin:0 0 6px;border-left:4px solid var(--accent)">
        <div class="row">
          <div class="grow" style="font-weight:700;font-size:var(--t-sm)">${nPicked} selected</div>
          <button class="linkbtn" onclick="event.stopPropagation();selectAllClash('${esc(key)}')">${nPicked === nTotal ? 'Select none' : 'Select all'}</button>
          <button class="linkbtn" onclick="event.stopPropagation();toggleClashSelect('${esc(key)}')">Cancel</button>
        </div>
        <div class="formrow" style="margin-top:8px">
          <button class="btn sm alt" ${nPicked ? '' : 'disabled'}
            style="border-color:var(--red-accent);color:var(--red-accent)"
            onclick="event.stopPropagation();removeSelectedClash('${esc(key)}')">Remove selected${nPicked ? ' (' + nPicked + ')' : ''}</button>
          <button class="btn sm alt" ${nPicked && nPicked < nTotal ? '' : 'disabled'}
            style="border-color:var(--red-accent);color:var(--red-accent)"
            onclick="event.stopPropagation();keepOnlySelectedClash('${esc(key)}')">Keep only ${nPicked === 1 ? 'this' : 'these'}${nPicked && nPicked < nTotal ? ' — remove ' + (nTotal - nPicked) : ''}</button>
        </div>
      </div>` : '')
    + `<div class="meta" style="font-size:11px;color:var(--muted)">${picking
        ? 'Tick the ones you mean:'
        : 'Or tap one to move it:'}</div>`
    + c.events.slice(0, 5).map(ev => {
        const t = fmtTimeRange(ev) || (ev.time ? fmt12(ev.time)
          : (ev.kind === 'deadline' ? 'due (no time)' : 'all day'));
        const who = (ev.personIds || [])
          .map(id => nameOf(id)).filter(Boolean).join(', ');
        const meta = [t, ev.location || '', who].filter(Boolean).join(' · ');
        // The reschedule button is unchanged. The "keep only this" link is new,
        // and sits UNDER the row it belongs to so the event it keeps is the one
        // named directly above it.
        // In select mode the row IS the checkbox -- tapping it toggles rather
        // than opening the editor, so the whole card is the target on a phone.
        // Out of select mode it is exactly what it always was.
        if(picking){
          const on = clashSel.has(ev.id);
          return `<button class="btn alt sm" role="checkbox" aria-checked="${on ? 'true' : 'false'}"
            style="width:100%;text-align:left;white-space:normal;padding:10px 12px;display:flex;align-items:flex-start;gap:10px${on ? ';border-color:var(--accent)' : ''}"
            onclick="event.stopPropagation();toggleClashPick('${esc(ev.id)}','${esc(key)}')">
            <span class="check ${on ? 'on' : ''}" style="width:22px;height:22px;border-radius:11px;margin-top:1px" aria-hidden="true">${on ? '✓' : ''}</span>
            <span class="grow">
              <span style="font-weight:700;display:block">${esc(ev.title || 'Untitled')}${ev.kind === 'deadline' ? ' · deadline' : ''}</span>
              <span class="meta" style="font-size:12px;display:block;margin-top:2px">${esc(meta)}</span>
            </span>
          </button>`;
        }
        return `<button class="btn alt sm" style="width:100%;text-align:left;white-space:normal;padding:10px 12px"
          onclick="openEventEdit('${esc(ev.id)}')">
          <span style="font-weight:700;display:block">${esc(ev.title || 'Untitled')}${ev.kind === 'deadline' ? ' · deadline' : ''}</span>
          <span class="meta" style="font-size:12px;display:block;margin-top:2px">${esc(meta)}</span>
          <span class="meta" style="font-size:11px;display:block;margin-top:3px;color:var(--accent)">${ico('edit')}Tap to reschedule</span>
        </button>`;
      }).join('')
    + (c.events.length > 5 ? `<div class="meta" style="font-size:12px">and ${c.events.length - 5} more overlapping</div>` : '')
    + (picking ? '' : `<div class="row" style="justify-content:flex-end;margin-top:2px">
        <button class="linkbtn" onclick="event.stopPropagation();toggleClashSelect('${esc(key)}')">Select…</button>
      </div>`)
    + `</div>`;
}

/**
 * Resolve a clash by keeping ONE of its events and removing the rest (v9.59).
 *
 * The banner could already say "these are fine" (dismiss) or "let me move one"
 * (edit). It could not say "this one wins" -- the one answer a double-booking
 * usually has -- so the only way to act on it was to leave the banner, find the
 * loser in the list, and delete it by hand.
 *
 * Soft delete plus `dirty`, exactly as applyDedupe() and bulkDelete() do, so
 * the removed events are recoverable and are marked the same way any other
 * bulk removal marks them.
 *
 * No dismissConflict() call is needed or wanted: eventsClash() returns false
 * the moment either side is deleted, so the warning goes on its own. Writing
 * the key into dismissedConflicts as well would leave a dead entry there
 * forever, and would silence the pair if an undo brought them both back.
 */
/**
 * THE one implementation of "remove these events from this clash" (v9.70).
 *
 * Everything else on the banner routes through here: keeping one, removing one,
 * removing a selection, keeping a selection. Before v9.70 there were three
 * near-copies of this loop and they had already drifted in what they confirmed
 * and what their undo restored.
 *
 * Soft delete plus `dirty`, exactly as applyDedupe() and bulkDelete() do, and
 * an undo that restores each row's PRIOR flags rather than assuming they were
 * unset.
 *
 * No dismissConflict() call is needed or wanted: eventsClash() returns false
 * the moment either side is deleted, and a busy day that drops below the
 * threshold stops being one, so the warning goes on its own. Writing the key
 * into dismissedConflicts as well would leave a dead entry there forever, and
 * would silence the group if an undo brought the events back.
 */
function removeFromClash(ids, key, opts){
  // Re-derive rather than trusting a rendered index -- see stepConflict().
  const c = findConflicts(S.events, todayISO()).find(x => conflictKey(x) === key);
  if(!c){ toast('That clash is already resolved'); render(); return; }

  const set = new Set(ids || []);
  const losers = c.events.filter(e => set.has(e.id) && !e.deleted);
  if(!losers.length){ render(); return; }
  const staying = c.events.filter(e => !set.has(e.id) && !e.deleted).length;

  const names = losers.map(e => '“' + (e.title || 'Untitled') + '”').join(', ');
  const lead = (opts && opts.lead) || ('Remove ' + names + '?');
  if(!confirm(lead
    + (staying ? '\n\nThe other ' + staying + (staying === 1 ? ' event stays' : ' events stay') + '.' : '')
    + '\n\n' + (losers.length === 1 ? 'It is' : 'They are')
    + ' removed from your list. Anything already added to your calendar stays there — delete those in the Calendar app.')) return;

  const before = losers.map(e => ({ e, deleted: e.deleted, deletedAt: e.deletedAt, dirty: e.dirty }));
  losers.forEach(e => { markDeleted(e); e.dirty = 1; });
  clearClashSel();
  save();
  render();
  toast((opts && opts.toast) || ('Removed ' + losers.length + ' event' + (losers.length === 1 ? '' : 's')),
    { label:'Undo', fn:() => {
      before.forEach(b => { b.e.deleted = b.deleted; b.e.deletedAt = b.deletedAt; b.e.dirty = b.dirty; });
      save(); render(); toast('Put back');
    }});
}

/**
 * Keep the named events and remove the rest of the clash. The inverse selection
 * of removeFromClash, expressed through it so there is one code path.
 */
function keepOnlyInClash(keepIds, key){
  const c = findConflicts(S.events, todayISO()).find(x => conflictKey(x) === key);
  if(!c){ toast('That clash is already resolved'); render(); return; }
  const keepSet = new Set(keepIds || []);
  const keeping = c.events.filter(e => keepSet.has(e.id));
  const losers = c.events.filter(e => !keepSet.has(e.id) && !e.deleted);
  if(!keeping.length || !losers.length){ render(); return; }

  const kept = keeping.map(e => '“' + (e.title || 'Untitled') + '”').join(', ');
  const gone = losers.map(e => '“' + (e.title || 'Untitled') + '”').join(', ');
  removeFromClash(losers.map(e => e.id), key, {
    lead: 'Keep ' + kept + ' and remove ' + gone + '?',
    toast: 'Kept ' + keeping.length + ' — removed ' + losers.length
  });
}

/**
 * Keep exactly one event and remove the rest (v9.59). Unchanged in name,
 * signature and behaviour -- it is now the one-id case of keepOnlyInClash, so
 * the loop it used to own lives in a single place.
 */
function keepOnlyEvent(keepId, key){ keepOnlyInClash([keepId], key); }

/**
 * Resolve a clash by removing ONE of its events and keeping the rest (v9.69).
 *
 * The exact inverse of keepOnlyEvent(), and the action the banner was missing.
 * Every control on that screen acted on the whole conflict: dismiss silenced
 * the group, "keep only this" deleted every other member. That is fine for an
 * `overlap`, which always holds exactly two events -- keeping one IS removing
 * the other -- and wrong for a `busy-day`, which holds four or more. Logan hit
 * it on 28 Aug with four events on one date and no way to drop a single one
 * without destroying the three he wanted.
 *
 * Soft delete plus `dirty`, with an Undo that restores the prior flags rather
 * than assuming they were unset -- the same mechanism keepOnlyEvent() uses on
 * its losers, so a removal made from either direction is recoverable the same
 * way.
 *
 * No dismissConflict() here, for the reason recorded on keepOnlyEvent():
 * findConflicts() re-derives from live events, so an overlap that loses a side
 * or a busy day that drops below the threshold stops warning by itself. A key
 * written into dismissedConflicts would outlive the events it names and would
 * silence the group if the Undo brought this one back.
 */
/** Remove exactly one event and keep the rest. The one-id case. */
function removeOneEvent(evId, key){ removeFromClash([evId], key); }

/** The two select-mode actions. Both refuse an empty selection. */
function removeSelectedClash(key){
  if(!clashSelecting(key) || !clashSel.size) return;
  removeFromClash([...clashSel], key);
}
function keepOnlySelectedClash(key){
  if(!clashSelecting(key) || !clashSel.size) return;
  keepOnlyInClash([...clashSel], key);
}

// The real field, set here and read by findConflicts. Undoable, like every
// other state change in the app.
function markHandled(id){
  const e = S.events.find(x => x.id === id);
  if(!e) return;
  e.handled = true; save(); render();
  toast('Marked as handled', { label:'Undo', fn:() => {
    e.handled = false; save(); render(); toast('Put back');
  }});
}

// HAX G8: support efficient dismissal -- one tap, and it stays dismissed.
/**
 * Silence one clash warning -- reversibly.
 *
 * Until v9.66 this pushed a key and that was that: no undo, no screen listing
 * what had been silenced, and nothing anywhere that could clear it. One tap on
 * an unlabelled x hid that pair of events for good (code review P6-01).
 */
function dismissConflict(key){
  const list = S.settings.dismissedConflicts || (S.settings.dismissedConflicts = []);
  if(list.includes(key)) return;                 // already silenced; nothing to undo
  clearClashSel();
  list.push(key);
  save(); render();
  toast('Warning dismissed', { label:'Undo', fn:() => {
    restoreDismissedConflict(key);
    toast('Warning back');
  }});
}
function restoreDismissedConflict(key){
  S.settings.dismissedConflicts = (S.settings.dismissedConflicts || []).filter(k => k !== key);
  save(); render();
}
function clearNotDuplicates(){
  const before = (S.settings.notDuplicates || []).slice();
  if(!before.length) return;
  S.settings.notDuplicates = [];
  save(); render();
  toast('Restored ' + before.length + ' pair' + (before.length === 1 ? '' : 's'),
    { label:'Undo', fn:() => { S.settings.notDuplicates = before; save(); render(); } });
}
function clearDismissedConflicts(){
  const before = (S.settings.dismissedConflicts || []).slice();
  if(!before.length) return;
  S.settings.dismissedConflicts = [];
  save(); render();
  toast('Brought back ' + before.length + ' warning' + (before.length === 1 ? '' : 's'),
    { label:'Undo', fn:() => { S.settings.dismissedConflicts = before; save(); render(); } });
}

// ---------- Ask (see js/ask.js, js/router.js, js/assistant-actions.js) ----------
// A conversation, not a single shot. Turns are kept so a follow-up can say
// "and Braelyn?" -- HAX G12, remember recent interactions. Only the last
// couple are ever SENT (see HISTORY_TURNS); the rest stay on the phone.
// Restored from the save file, so Gordon picks up where you left off.
// Trimmed on the way in as well as out: a save file is untrusted input like
// any other, and a malformed turn must not break the screen.
let askState = { turns: trimConversation((S.ask && S.ask.turns) || []),
                 busy:false, error:'', draft:'' };

// Persist after every exchange. Kept out of the render path so a re-render
// never writes.
function saveConversation(){
  S.ask = S.ask || { turns: [] };
  S.ask.turns = trimConversation(askState.turns);
  save();
}

function renderAsk(m){
  setHeader('Ask ' + aiName(), true, 'closeAsk()');
  // The composer is fixed above the nav; without this the last message hides
  // behind it.
  m.classList.add('hascomposer');
  const a = askState;
  // Generated from the intent registry so the app can never suggest something
  // it cannot do, nor hide something it can (NN/g discoverability).
  const suggestions = assistantCapabilityChips();
  m.innerHTML = `
    ${!a.turns.length ? `<div class="help" style="margin-top:0">
      Ask about what is in this app — never the internet — or tell ${esc(aiName())} to
      add an event, start a chore or tick something off. He shows you what he is
      about to do and waits for you to say yes; nothing is saved before that.
    </div>` : ''}

    ${(() => { const i = firstTurnOfToday(a.turns, todayISO());
        return (a.turns.length && i !== 0)
          ? `<div class="bucket">Earlier<span class="bucket-n">${i < 0 ? a.turns.length : i}</span></div>` : ''; })()}
    ${a.turns.map((t, i) => `
      ${i === firstTurnOfToday(a.turns, todayISO()) && i > 0
        ? `<div class="bucket">Today<span class="bucket-n">${a.turns.length - i}</span></div>` : ''}
      <div style="display:flex;justify-content:flex-end;margin:10px 0 2px">
        <div style="max-width:85%;background:var(--green-lt);border-radius:16px 16px 4px 16px;padding:10px 14px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere">${esc(t.q)}</div>
      </div>
      <div style="display:flex;justify-content:flex-start;margin:0 0 6px">
        <div style="max-width:88%;min-width:0">
          <div class="meta" style="font-size:11px;font-weight:700;margin:0 0 3px 6px">${esc(aiName())}</div>
          <div class="card" style="margin:0;border-radius:16px 16px 16px 4px">
            <div style="white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere">${esc(t.a)}</div>
            ${t.sourceNote ? `<div class="meta" style="font-size:12px;margin-top:10px">${esc(t.sourceNote)}</div>` : ''}
            <div class="row" style="justify-content:flex-end;margin-top:8px">
              <button class="linkbtn" onclick="copyAnswer(${i})">${ico('clipboard')}Copy</button>
            </div>
          </div>
        </div>
      </div>
      ${/* Only ever on the LAST turn. An earlier turn keeps confirm:true forever,
            and a later pendingAction would otherwise re-show its stale buttons
            -- offering to redo something already done. */
        t.confirm && pendingAction && i === a.turns.length - 1
        ? `<div class="card" style="border-left:5px solid var(--${t.destructive ? 'red' : 'amber'}-accent)">
        <div class="meta" style="font-size:12px;margin-bottom:8px">${t.destructive
          ? 'Nothing has been deleted yet. You will be able to undo it.'
          : 'Nothing has been saved yet.'}</div>
        <div class="actionrow" style="margin-bottom:0">
          <button class="btn${t.destructive ? ' danger' : ''}" onclick="confirmPendingAction()">${esc(t.actionName || 'Do it')}</button>
          <button class="btn alt" onclick="cancelPendingAction()">Cancel</button>
        </div></div>` : ''}
      ${t.choices && t.choices.length && i === a.turns.length - 1
        ? (pendingAction
            // A disambiguation: the app already knows what to do, it just needs
            // to be told WHICH thing. The choice is an entity id.
            ? t.choices.map(c => `<button class="btn alt" style="margin-bottom:8px"
                onclick="confirmPendingAction('${esc(c.id)}')">${esc(c.name)}</button>`).join('')
              + `<div style="text-align:center"><button class="linkbtn" onclick="cancelPendingAction()">Neither</button></div>`
            // A clarify: the model asked a question and there is nothing pending.
            // The answer is TEXT, so tapping one sends it as the next turn --
            // until v9.73 this branch did not exist and the buttons never
            // rendered at all (code review P5).
            : t.choices.map(c => `<button class="btn alt" style="margin-bottom:8px"
                onclick="answerClarify('${esc(c.name)}')">${esc(c.name)}</button>`).join(''))
        : ''}
      ${t.cited.length ? t.cited.map(c => askSourceCard(t.domain, c)).join('')
        : (t.confirm || t.choices ? '' : '')}
    `).join('')}

    ${a.busy ? `<div class="spin" style="padding:24px"><div class="spinner"></div>
      <div class="meta" id="askWait">${aiProvider() === 'local'
        ? `Gordon is working…`
        : `Asking ${esc(aiModelName())}…`}</div>
      ${aiProvider() === 'local' && S.settings.aiFallback ? `<div class="help" style="margin:0">
        If your desktop is asleep this waits for it to time out, then uses Anthropic.</div>` : ''}
      <div style="text-align:center;margin-top:10px"><button class="linkbtn" onclick="cancelAsk()">Cancel</button></div>
      </div>` : ''}

    ${a.error ? `<div class="card" style="border-left:5px solid var(--red-accent)">
      <div class="title" style="font-size:15px">Could not answer that</div>
      <div class="meta">${esc(a.error)}</div>
      <div class="row" style="justify-content:flex-end;gap:2px;margin-top:8px">
        ${a.lastQ?`<button class="linkbtn" onclick="runAsk(askState.lastQ)">Retry</button>`:''}
        <button class="linkbtn" onclick="copyTextValue(askState.error, 'Copied the error')">${ico('clipboard')}Copy</button>
      </div>
      <div class="help" style="margin:8px 0 0">Everything still works by hand — the
        Events list, its search, and the person filters are all unaffected.</div>
    </div>` : ''}

    ${!a.turns.length && !a.busy ? `<div class="label">Ask, or tell me to do one of these</div>
      <div class="suggest">${suggestions.map(s => `<span class="chip" role="button" tabindex="0"
        onclick="askThis('${esc(s).replace(/'/g, "\\'")}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();askThis('${esc(s).replace(/'/g, "\\'")}')}">${esc(s)}</span>`).join('')}</div>` : ''}

    <div class="composer" style="align-items:flex-end">
      <textarea id="askQ" rows="1" aria-label="Your question" spellcheck="true"
        autocapitalize="sentences" autocorrect="on"
        style="min-height:44px;max-height:160px;resize:none;line-height:1.4;padding-top:11px"
        placeholder="${a.turns.length ? 'Ask a follow-up…' : 'Ask, or tell me to add something…'}"
        oninput="askState.draft=this.value;autogrow(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runAsk()}">${esc(a.draft)}</textarea>
      <button class="btn sm" onclick="runAsk()" ${a.busy?'disabled':''}>Ask</button>
    </div>
    <div class="help" style="text-align:center;font-size:11px;margin:4px 0 0">Enter to send · Shift+Enter for a new line</div>
    ${isCarriedOver(a.turns, todayISO()) ? `<div class="help" style="text-align:center">
      That was an earlier day. Gordon can still see it, but starts fresh from here —
      answers about "this week" change when the week does.</div>` : ''}
    ${a.turns.length ? `<div style="text-align:center">
      <button class="linkbtn" onclick="clearAsk()">${ico('plus')}New chat</button></div>` : ''}
`;
  // Keep the elapsed/staged wait indicator ticking only while a call is in
  // flight; tear it down as soon as the screen is no longer busy.
  if(a.busy) startAskWaitTimer(); else clearAskWaitTimer();
}

// Render whatever a citation pointed at, in the shape that screen already uses.
function askSourceCard(domain, c){
  if(domain === 'events'){
    const ev = S.events.find(e => e.id === c.id);
    return ev ? evtCard(ev, false) : '';
  }
  return `<div class="card row" style="padding:11px">
    ${ico(domain === 'chores' ? 'check-circle' : 'cart', {cls:'rowicon'})}
    <div class="grow"><div class="title" style="font-size:15px">${esc(c.line.replace(/^\[\d+\]\s*/, ''))}</div></div>
  </div>`;
}

function askThis(q){ runAsk(q); }
function clearAsk(){
  askState = { turns:[], busy:false, error:'', draft:'' };
  pendingAction = null;
  S.ask = { turns: [] };
  save(); render();
  toast('Started a new chat');
}

// `explicit` is passed when a suggestion chip is tapped. Without it the chips
// were dead: they set askState.draft, but this read the (empty) input box and
// bailed on the falsy value. Caught by the end-to-end harness, not by a unit
// test -- which is why the harness exists.
// --- Ask progress + cancel --------------------------------------------------
// A local model can take many seconds -- a cold load is a minute. NN/g: past
// ~10s, show progress and offer a way out. askGen invalidates an in-flight
// runAsk when the user cancels (or asks again), so a late answer is discarded
// rather than popping in after. We do NOT abort the network request: aborting
// would look like a local failure and trip the Anthropic fallback, which is the
// opposite of "cancel". The request finishes in the background, ignored.
let askGen = 0, askWaitTimer = null, askWaitStart = 0;
function clearAskWaitTimer(){
  if(typeof clearInterval !== 'undefined' && askWaitTimer) clearInterval(askWaitTimer);
  askWaitTimer = null; askWaitStart = 0;
}
function askWaitLabel(s){
  if(aiProvider() !== 'local') return 'Asking ' + aiModelName() + '… ' + s + 's';
  if(s < 5)  return 'Gordon is working…';
  if(s < 20) return 'Gordon is working… ' + s + 's';
  if(s < 50) return 'Still going — a cold model can take up to a minute… ' + s + 's';
  return 'The desktop is likely loading the model… ' + s + 's';
}
function startAskWaitTimer(){
  if(typeof setInterval === 'undefined' || askWaitTimer) return;
  if(!askWaitStart) askWaitStart = Date.now();
  askWaitTimer = setInterval(() => {
    const el = document.getElementById('askWait');
    if(!el){ clearAskWaitTimer(); return; }
    el.textContent = askWaitLabel(Math.round((Date.now() - askWaitStart) / 1000));
  }, 1000);
}
// Grow a composer textarea with its content, up to a cap, so a long instruction
// is visible while typing instead of scrolling inside one cramped line.
function autogrow(el){
  if(!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}
function cancelAsk(){
  askGen++;                 // any in-flight runAsk will now discard its result
  askState.busy = false;
  clearAskWaitTimer();
  render();
  toast('Stopped waiting — Gordon may still finish in the background');
}

async function runAsk(explicit){
  const el = document.getElementById('askQ');
  const q = String(explicit || (el && el.value) || askState.draft || '').trim();
  if(!q || askState.busy) return;
  const myGen = ++askGen;   // cancel, or a new question, invalidates this run
  askState.lastQ = q;   // remembered so a failed turn can offer Retry
  askState.draft = '';
  askState.busy = true; askState.error = ''; pendingAction = null;
  render();
  try{
    // Classify for free when the wording is obvious. Routing used to add a
    // whole round-trip in front of every answer, which is why asking a simple
    // question felt slow -- and Anthropic's own guidance is that
    // high-frequency, low-complexity work belongs in deterministic code.
    // quickRoute only ever short-circuits to a read-only intent; anything
    // that could change data still goes to the model and through every check.
    // The names are passed in so a question that mentions one of Logan's
    // people, lists or chores counts as being about this app -- see
    // mentionsAppTopic. Without them, "how many stars does Olivia have?"
    // would take a model round-trip it does not need.
    let route = quickRoute(q, { names: [
      ...allPeople().map(p => p.name),
      ...S.lists.filter(l => !l.deleted).map(l => l.name),
      ...S.chores.filter(c => !c.deleted).map(c => c.title),
    ] });
    // Greeting / help / thanks: answer instantly, locally — no model call, works
    // even signed out. quickRoute stays read-only-only, so this is separate.
    if(!route){
      const hello = eaGreeting(q, assistantTone());
      if(hello){
        askState.turns.push({ q, a: hello, domain:'chat', cited:[], day: todayISO(), sourceNote:'' });
        askState.busy = false; saveConversation(); render();
        const h = document.getElementById('askQ'); if(h) h.focus();
        return;
      }
    }

    if(!route){
      // Conversational EA (FLYERSNAP-EA-ASSISTANT-PLAN.md): the model may reply
      // in words, take ONE action (an intent — still validated + confirmed), or
      // ask ONE clarifying question. Same safety as the router; now it can talk.
      const batchCtx = pendingEvents.length
        ? `\n\nA batch of ${pendingEvents.length} draft entr${pendingEvents.length===1?'y':'ies'} is under review right now (titles: ${pendingEvents.slice(0,8).map(e=>e.title||'untitled').join('; ')}${pendingEvents.length>8?'; …':''}). If the user says "these", "all these", or "them", they mean this batch — use enrich_batch.`
        : '';
      const turnText = await callAI(
        [{ type:'text', text:`Today is ${todayISO()}.${batchCtx}\n\nUser: ${q}` }],
        500, buildAssistantPrompt(assistantTone()), 'ask.route');
      if(myGen !== askGen) return;   // cancelled while waiting — drop the answer
      const parsed = parseAssistantTurn(cleanModelText(turnText));
      if(parsed.ok && (parsed.turn.kind === 'message' || parsed.turn.kind === 'clarify')){
        askState.turns.push({ q, domain:'chat', cited:[], day: todayISO(), sourceNote:'',
          a: parsed.turn.kind === 'message' ? parsed.turn.text : parsed.turn.question,
          // NORMALISE HERE, once. The prompt asks the model for
          // {"clarify":"...","options":["A","B"]} -- strings -- while the
          // renderer reads {id,name}. It emitted [{},{}]: two blank buttons.
          // Nobody ever saw them, because the gate below also required a
          // pendingAction that a clarify never sets, so fixing only one of the
          // two would have SHIPPED the blank buttons (code review P5).
          choices: parsed.turn.kind === 'clarify' ? clarifyChoices(parsed.turn.options) : null });
        askState.busy = false; saveConversation(); render();
        const c = document.getElementById('askQ'); if(c) c.focus();
        return;
      }
      route = (parsed.ok && parsed.turn.kind === 'tool')
        ? validateRoute({ intent: parsed.turn.intent, params: parsed.turn.params,
            confidence: typeof parsed.turn.confidence === 'number' ? parsed.turn.confidence : 0.9 })
        : { ok:false, reason: (parsed.error || 'unclear') };
    }

    if(!route.ok){
      // A routing failure becomes capability disclosure rather than a dead
      // end -- HAX G1, and PAIR's "safe, boring" failure.
      askState.turns.push({ q, domain:'events', cited:[], day: todayISO(),
        a: `I could not turn that into something I can do (${route.reason}).`,
        sourceNote: 'Try one of the suggestions below.' });
    } else {
      const out = await performRoute(route, q);
      if(myGen !== askGen) return;   // cancelled while waiting — drop the result
      askState.turns.push({ q, a: out.answer, domain: out.domain, day: todayISO(),
        cited: out.cited || [], sourceNote: out.sourceNote || '',
        confirm: !!out.confirm, choices: out.choices || null,
        actionName: out.actionName || '', destructive: !!out.destructive,
        intentTitle: (intentById(route.intent) || {}).title || '' });
    }
    askState.busy = false;
    saveConversation();
  }catch(err){
    if(myGen !== askGen) return;   // cancelled — do not surface an error
    askState.busy = false;
    askState.error = err && err.message === 'NO_API_KEY'
      ? 'No API key saved yet — add one in Settings.'
      : (err && err.message) || 'Something went wrong.';
    logProblem('Assistant', 'Could not handle a request', (err && err.message) || '');
  }
  render();
  const again = document.getElementById('askQ');
  if(again) again.focus();
}

// ---------- Assistant: acting on a routed intent ----------
// Anthropic's routing workflow: one model call classifies, then ordinary code
// decides what happens. Nothing below is model-driven.

// A pending CONFIRM action, waiting on an explicit yes. Held outside askState
// so a re-render cannot lose it.
let pendingAction = null;

// Kept as a thin wrapper so every call site stays put; the selection itself
// lives in js/assistant-actions.js where it is testable.
function assistantCapabilityChips(){ return capabilityChips(4); }

/**
 * "Tick off "Milk", "Bread" on Groceries." -- said once, by both the first
 * proposal and any later one, so the two cannot drift apart.
 */
function tickSentence(list, items, missing){
  return `Tick off ${items.map(m => '"' + m.text + '"').join(', ')} on "${list.name}".`
    + (missing && missing.length ? `\n\nNot on that list: ${missing.join(', ')}.` : '');
}

/**
 * Ask "which <word> did you mean?" again, from inside a confirm.
 *
 * Two ambiguous words are two questions. The first is asked by performRoute,
 * which returns a turn; by the time the second is due we are inside
 * confirmPendingAction, which renders rather than returns -- so this pushes the
 * turn itself. The renderer only offers buttons on the LAST turn, which is what
 * this becomes, and it deliberately reads pendingAction to decide that a choice
 * is an id rather than text, so that is set here too.
 */
function askAnotherItem(route, list, round){
  pendingAction = { route, target:null, collection:'listItems',
    listId: list.id, doneIds: round.doneIds, restItems: round.rest,
    missingItems: round.missing };
  askState.turns.push({ q:'', a:`Which "${round.word}" did you mean?`,
    domain:'lists', cited:[], day: todayISO(), sourceNote:'',
    choices: round.matches.map(m => ({ id:m.id, name:m.text })) });
  saveConversation();
  render();
}

/** Turn a validated route into something that happened. */
async function performRoute(route, question){
  const intent = intentById(route.intent);

  // ---- ANSWER -----------------------------------------------------------
  if(route.consequence === CONSEQUENCE.ANSWER){
    if(route.intent === 'what_needs_doing'){
      // Deliberately no model: this reads the deterministic clash detector.
      const cs = findConflicts(S.events, todayISO());
      return { answer: cs.length
          ? cs.slice(0, 5).map(c => '• ' + describeConflict(c) + ' (' + friendly(c.date) + ')').join('\n')
          : 'Nothing is clashing and no deadline has slipped.',
        cited: [], domain:'events', sourceNote:'Checked your events — no AI used for this one.' };
    }
    const domain = route.intent === 'ask_chores' ? 'chores'
                 : route.intent === 'ask_lists'  ? 'lists' : 'events';
    const scope = scopeForQuestion(question, S.events, todayISO());
    const built = buildAskPrompt(question, scope, allPeople(), todayISO(), {
      domain, chores:S.chores, balances:starBalances(),
      lists:S.lists, listItems:S.listItems,
      // Today's turns only. Yesterday's answer said "in 2 days" about a date
      // that has since moved; replaying it invites the model to repeat a
      // claim that is now false.
      history: contextTurns(askState.turns, todayISO()),
    });
    const text = await callAI([{ type:'text', text: built.user }], 700, built.system, 'ask.answer');
    // NOT cleanModelText: this is the app's only PROSE answer, and the JSON
    // extractor inside it returns the first [n] citation and throws the
    // sentence away. ANSWER_CONTRACT rule 2 demands those citations, so the
    // better the model behaved, the worse the answer rendered -- observed on
    // device 31 Aug 2026 as a four-event answer displayed as "[1]".
    const answer = stripThinking(text).trim();
    return { answer, cited: citedEvents(answer, built.refs), domain,
      sourceNote: domain === 'events'
        ? `Looked at ${scope.label} — ${scope.events.length} event${scope.events.length===1?'':'s'}.`
        : `Looked at your ${domain}.` };
  }

  // ---- NAVIGATE ---------------------------------------------------------
  if(route.consequence === CONSEQUENCE.NAVIGATE){
    const target = route.params.screen;
    // Both halves of the Notes tab are addressable by name -- asking for notes
    // must not drop you on lists just because that is where you were last. That
    // is nav()'s job now: this branch computes a destination and goes there, and
    // touches no state of its own. nav('lists') already forces its own area.
    setTimeout(() => nav(target, target === 'notes' ? 'notes' : null), 350);
    return { answer:`Opening ${target}.`, cited:[], domain:'events', sourceNote:'' };
  }

  // ---- DRAFT: hand to the screen the user already knows ------------------
  if(route.consequence === CONSEQUENCE.DRAFT){
    if(route.intent === 'add_event'){
      // The one replace path that does NOT get a confirm. A modal appearing out
      // of a chat answer is its own surprise, and the assistant has somewhere
      // better to put the message: its own reply. Refuse rather than destroy.
      if(pendingEvents.length){
        const n = pendingEvents.length;
        return { answer:`You have ${n} item${n===1?'':'s'} still waiting on the review screen`
            + `${pendingSource ? ' from ' + pendingSource : ''}. Save or skip ${n===1?'it':'them'} first,`
            + ' then ask me again and I will draft this one.',
          cited:[], domain:'events', sourceNote:'Nothing was changed.' };
      }
      const draft = buildEventDraft(route.params, allPeople(), aiModelName());
      pendingEvents = [draft];
      pendingSource = 'assistant';
      setTimeout(() => sub('review'), 350);
      // Say what was NOT understood as well as what was. A name that matched
      // nobody must not silently vanish -- the user needs to know to tag it.
      const who = draft.personIds.length ? personById(draft.personIds[0]) : null;
      const notes = [];
      if(route.params.person && !who) notes.push(`I did not recognise "${route.params.person}" — tag it yourself on the review screen.`);
      if(!draft.date) notes.push('No date was given, so you will need to pick one.');
      return { answer:`Drafted ${draft.kind === 'deadline' ? 'a deadline' : 'an event'}`
          + `${who ? ' for ' + who.name : ''} — check the details before saving.`
          + (notes.length ? '\n\n' + notes.join('\n') : ''),
        cited:[], domain:'events',
        sourceNote:'Nothing is saved until you tap through the review screen.' };
    }
    // add_chore: open the chore form PRE-FILLED. Set the form state directly
    // rather than calling newChoreForm(), which takes no arguments and resets
    // it -- calling that here would silently throw the draft away.
    choreForm = buildChoreDraft(route.params, justKids());
    setTimeout(() => nav('chores'), 350);
    const kid = choreForm.kidId ? personById(choreForm.kidId) : null;
    return { answer:`Filled in a chore${kid ? ' for ' + kid.name : ''} — check it and save.`
        + (route.params.person && !kid ? `\n\nI did not recognise "${route.params.person}", so it is set to anyone.` : ''),
      cited:[], domain:'chores', sourceNote:'Nothing is saved until you tap Save.' };
  }

  // ---- CONFIRM: never acts here; only proposes --------------------------
  //
  // Every branch below resolves the entity FIRST and refuses when two things
  // could be meant (HAX G10, "scope services when in doubt"). Not one of them
  // writes: confirmPendingAction() is the only path in the app that turns an
  // assistant sentence into a change, and everything it does is undoable.
  //
  // Apple's App Intents confirmation carries an `actionName` -- "the name to
  // use in the button that confirms the action" -- so the button says what it
  // will do rather than "Yes, do it".
  const propose = (domain, target, answer, extra) => {
    pendingAction = Object.assign({ route, target, collection: null }, extra || {});
    return { answer: answer || describeIntent(route, target), cited:[], domain,
      sourceNote:'', confirm:true,
      actionName: actionName(route, target), destructive: isDestructive(route) };
  };
  // "Which one did you mean?" -- the app asks instead of picking. `collection`
  // tells confirmPendingAction where to look the chosen id back up.
  const askWhich = (domain, matches, collection, nameKey, extra, question) => {
    // AN EMPTY LIST IS NOT A QUESTION. `[]` is truthy, so asking "which one did
    // you mean?" with nothing to offer rendered the question, zero buttons and
    // a "Neither" link -- measured 29 Aug with a user who had no lists at all
    // (code review P5). Say the true thing instead.
    if(!matches || !matches.length){
      return nothing(domain, 'You do not have any ' + domain + ' yet.');
    }
    // `extra` carries whatever confirmPendingAction will need AFTER the choice
    // is made. check_list_item reads pa.itemIds, and until v9.73 nothing ever
    // put them there -- so picking the list from this prompt ticked nothing off.
    pendingAction = Object.assign({ route, target:null, collection }, extra || {});
    // `question` names the word being asked about. With several items to tick
    // there can be more than one question in a row, and four identical
    // "Which one did you mean?" screens tell you nothing about which one.
    return { answer: question || 'Which one did you mean?', cited:[], domain, sourceNote:'',
      choices: matches.map(m => ({ id:m.id, name:m[nameKey || 'name'] })) };
  };
  const nothing = (domain, answer) => ({ answer, cited:[], domain, sourceNote:'' });

  // EA batch enrichment — operates on the review batch (pendingEvents), not a
  // single entity. Preview now; confirmPendingAction applies it (undoable).
  if(route.intent === 'enrich_batch'){
    if(!pendingEvents.length)
      return nothing('events', "There's no batch under review right now. Scan or import first, then I can tag them all at once.");
    const preview = computeBatchEnrichment(pendingEvents, route.params);
    if(!preview.count)
      return nothing('events', 'Nothing to change — those entries already read that way.');
    const ex = preview.changes[0];
    const scopeWord = preview.scope === 'selected' ? 'selected ' : '';
    const summary = `Add "${preview.value}" to the ${preview.field} of ${preview.count} ${scopeWord}entr${preview.count===1?'y':'ies'}.\nExample: "${ex.before || '(empty)'}" → "${ex.after}"`;
    return propose('events', null, summary, { enrichment: preview });
  }

  const liveLists  = () => S.lists.filter(l => !l.deleted);
  const liveChores = () => S.chores.filter(c => !c.deleted);
  const liveEvents = () => S.events.filter(e => !e.deleted);
  const nameList = (rows, key) => rows.map(r => r[key]).join(', ') || 'none yet';

  if(route.intent === 'create_list'){
    const wanted = String(route.params.name || '').trim();
    const clash = resolveEntity(wanted, S.lists, 'name');
    if(clash.status === 'ok'){
      return nothing('lists', `You already have a list called "${clash.match.name}".`);
    }
    return propose('lists', null, `Start a new list called "${wanted}".`);
  }

  if(route.intent === 'add_list_item'){
    const res = resolveEntity(route.params.list, S.lists);
    if(res.status === 'none'){
      return nothing('lists', `There is no list called "${route.params.list}". `
        + `Your lists are: ${nameList(liveLists(), 'name')}.`);
    }
    if(res.status === 'ambiguous') return askWhich('lists', res.matches, 'lists');
    return propose('lists', res.match);
  }

  if(route.intent === 'check_list_item'){
    // The list is optional: with one list there is nothing to disambiguate.
    let list = null;
    if(route.params.list){
      const res = resolveEntity(route.params.list, S.lists);
      if(res.status === 'none'){
        return nothing('lists', `There is no list called "${route.params.list}". `
          + `Your lists are: ${nameList(liveLists(), 'name')}.`);
      }
      // Carry the item NAMES here too. The v9.73 fix landed on the no-list-named
      // branch below and this one was left behind, so answering "which list?"
      // after naming an ambiguous one ticked nothing off and said "0 items".
      if(res.status === 'ambiguous') return askWhich('lists', res.matches, 'lists', null,
        { pendingItems: route.params.items || [] });
      list = res.match;
    } else if(liveLists().length === 1){
      list = liveLists()[0];
    } else {
      // Carry the item NAMES, not ids: the ids can only be resolved once we
      // know which list, which is the whole point of the question being asked.
      return askWhich('lists', liveLists(), 'lists', null,
        { pendingItems: route.params.items || [] });
    }
    const items = S.listItems.filter(i => i.listId === list.id && !i.deleted && !i.checked);
    const round = tickRound(items, route.params.items, null);
    if(round.kind === 'ask'){
      // The app asks instead of picking. Everywhere else it already does this
      // (a list, a chore, an event); ticking off was the one place that resolved
      // ambiguity by array position and told you the answer as if it were sure.
      return askWhich('lists', round.matches, 'listItems', 'text',
        { listId: list.id, doneIds: round.doneIds, restItems: round.rest,
          missingItems: round.missing },
        `Which "${round.word}" did you mean?`);
    }
    if(round.kind === 'none'){
      return nothing('lists', `Nothing on "${list.name}" matches ${route.params.items.join(', ')}.`);
    }
    return propose('lists', list, tickSentence(list, round.items, round.missing),
      { itemIds: round.items.map(m => m.id) });
  }

  if(route.intent === 'complete_chore'){
    const res = resolveEntity(route.params.chore, S.chores, 'title');
    if(res.status === 'none'){
      return nothing('chores', `There is no chore called "${route.params.chore}". `
        + `Your chores are: ${nameList(liveChores(), 'title')}.`);
    }
    // Carry the resolved person. Without it the confirm falls back to the
    // chore's own assignee, so "Olivia did the bins" after a disambiguation
    // credited whoever the chore belongs to -- confidently, with a toast.
    if(res.status === 'ambiguous') return askWhich('chores', res.matches, 'chores', 'title',
      { kidId: resolvePersonId(route.params.person, justKids()) });
    if(completionFor(res.match.id, todayISO())){
      return nothing('chores', `"${res.match.title}" is already ticked off for today.`);
    }
    // The person is resolved here so the stars land on the right child; an
    // unrecognised name falls through to the app's own "who did it?" sheet
    // rather than guessing.
    const kidId = resolvePersonId(route.params.person, justKids());
    const kid = kidId ? personById(kidId) : null;
    return propose('chores', res.match,
      `Mark "${res.match.title}" done for today${kid ? ' — ' + kid.name : ''}.`
      + (route.params.person && !kid ? `\n\nI did not recognise "${route.params.person}", so I will ask who did it.` : ''),
      { kidId });
  }

  if(route.intent === 'mark_event_handled'){
    const res = resolveEntity(route.params.event, liveEvents(), 'title');
    if(res.status === 'none'){
      return nothing('events', `I cannot find anything called "${route.params.event}".`);
    }
    if(res.status === 'ambiguous') return askWhich('events', res.matches, 'events', 'title');
    if(res.match.handled){
      return nothing('events', `"${res.match.title}" is already marked as handled.`);
    }
    return propose('events', res.match,
      `Mark "${res.match.title}" as handled, so it stops warning you.`);
  }

  if(route.intent === 'edit_event'){
    const res = resolveEntity(route.params.event, liveEvents(), 'title');
    if(res.status === 'none'){
      return nothing('events', `I cannot find an event called "${route.params.event}".`);
    }
    // Not `{ changes }`: what changes depends on WHICH event, and that is the
    // question being asked. Carry the raw params and work it out once the user
    // has answered -- the same shape as the v9.73 list fix.
    if(res.status === 'ambiguous') return askWhich('events', res.matches, 'events', 'title',
      { editParams: route.params });
    const changes = eventEditChanges(route.params, res.match);
    if(!Object.keys(changes).length){
      // Writing an identical row and reporting success is a lie the user
      // cannot see through.
      return nothing('events', describeEdit(changes, res.match));
    }
    return propose('events', res.match, describeEdit(changes, res.match), { changes });
  }

  if(route.intent === 'delete_event' || route.intent === 'delete_chore'){
    const isChore = route.intent === 'delete_chore';
    const spoken = isChore ? route.params.chore : route.params.event;
    const res = resolveEntity(spoken, isChore ? S.chores : liveEvents(), 'title');
    if(res.status === 'none'){
      return nothing(isChore ? 'chores' : 'events',
        `I cannot find ${isChore ? 'a chore' : 'an event'} called "${spoken}".`);
    }
    // A delete is the one place ambiguity absolutely must not resolve itself.
    if(res.status === 'ambiguous') return askWhich(isChore ? 'chores' : 'events', res.matches,
      isChore ? 'chores' : 'events', 'title');
    return propose(isChore ? 'chores' : 'events', res.match);
  }

  return { answer:'That is not something I can do yet.', cited:[], domain:'events', sourceNote:'' };
}

/**
 * The explicit yes. This is the only path in the app that turns an assistant
 * sentence into a change.
 *
 * It calls the app's OWN functions wherever one exists -- softDelete,
 * markHandled, completeChore -- rather than reimplementing the write. A second
 * implementation is a second set of bugs, and completeChore in particular
 * carries behaviour Gordon must not skip (the "who did it?" sheet on a chore
 * that belongs to nobody). Everything here is undoable.
 */
function confirmPendingAction(chosenId){
  if(!pendingAction){ return; }
  const pa = pendingAction;
  const route = pa.route;

  // Coming back from a "which one did you mean?" prompt.
  let target = pa.target;
  if(chosenId){
    const coll = pa.collection && S[pa.collection] ? S[pa.collection] : [];
    target = coll.find(x => x.id === chosenId) || null;
  }
  pendingAction = null;

  const needsTarget = route.intent !== 'create_list' && route.intent !== 'enrich_batch';
  if(needsTarget && !target){ toast('That is gone now'); render(); return; }

  switch(route.intent){
    case 'create_list': {
      const name = String(route.params.name || '').trim();
      if(!name) break;
      const row = { id:uid(), name, deleted:false };
      S.lists.push(row); save();
      toast(`Started "${name}"`, { label:'Undo', fn:() => {
        S.lists = S.lists.filter(l => l.id !== row.id); save(); render(); toast('Undone');
      }});
      break;
    }
    case 'enrich_batch': {
      // Applies to the review batch (pendingEvents), which is not persisted until
      // the user saves the batch — so no save() here, just an in-memory edit +
      // undo. Guard each index — the batch may have shifted since the preview.
      const pv = pa.enrichment;
      if(!pv || !pv.changes || !pv.changes.length) break;
      const undo = pv.changes
        .filter(c => pendingEvents[c.index])
        .map(c => ({ index:c.index, field:c.field, before:pendingEvents[c.index][c.field] }));
      pv.changes.forEach(c => { if(pendingEvents[c.index]) pendingEvents[c.index][c.field] = c.after; });
      toast(`Applied "${pv.value}" to ${undo.length} entr${undo.length===1?'y':'ies'}`, { label:'Undo', fn:() => {
        undo.forEach(u => { if(pendingEvents[u.index]) pendingEvents[u.index][u.field] = u.before; });
        render(); toast('Undone');
      }});
      render();
      break;
    }
    case 'add_list_item': {
      const added = route.params.items.map(text => {
        const row = { id:uid(), listId:target.id, text:String(text), checked:false, deleted:false };
        S.listItems.push(row); return row.id;
      });
      save();
      toast(`Added ${added.length} item${added.length===1?'':'s'} to ${target.name}`,
        { label:'Undo', fn:() => {
          // By id, not by text: undoing must not remove an identically-named
          // item the user added themselves.
          S.listItems = S.listItems.filter(i => !added.includes(i.id));
          save(); render(); toast('Undone');
        }});
      break;
    }
    case 'check_list_item': {
      // Three ways in, and they all have to end in the same place:
      //   1. the plain "tick these off" confirm      -- pa.itemIds is set
      //   2. an answer to "which list?"              -- target IS the list
      //   3. an answer to "which <word>?"            -- target is a list ITEM,
      //      and pa.listId says which list it belongs to. This one can repeat:
      //      two ambiguous words are two questions, not one question and a guess.
      // Case 2 existed before v9.73 reading an itemIds nobody ever set, so
      // answering the question ticked nothing off (code review P5, reproduced).
      const list = pa.listId ? S.lists.find(l => l.id === pa.listId && !l.deleted) : target;
      if(!list){ toast('That list is gone now'); render(); break; }
      let ids = pa.itemIds || [];
      let missing = pa.missingItems || [];
      if(!ids.length){
        const open = S.listItems.filter(i => i.listId === list.id && !i.deleted && !i.checked);
        // On path 3 the row just chosen is settled; on path 2 nothing is yet.
        const carry = { doneIds: (pa.doneIds || []).concat(pa.listId && target ? [target.id] : []),
          missing };
        const round = tickRound(open, pa.listId ? (pa.restItems || []) : (pa.pendingItems || []), carry);
        if(round.kind === 'ask'){
          // Still not sure. Ask again rather than settle it by position -- the
          // whole point of asking the first time.
          askAnotherItem(route, list, round);
          return;
        }
        ids = round.items.map(i => i.id);
        missing = round.missing;
      }
      const changed = S.listItems.filter(i => ids.includes(i.id) && !i.checked);
      changed.forEach(i => { i.checked = true; });
      save();
      // The words that matched nothing are said here as well as in the
      // proposal, because paths 2 and 3 never show a proposal -- tapping the
      // answer ticks straight away, so this toast is the only place they appear.
      toast(`Ticked off ${changed.length} item${changed.length===1?'':'s'}`
        + (missing.length ? ` — not on that list: ${missing.join(', ')}` : ''),
        { label:'Undo', fn:() => {
          changed.forEach(i => { i.checked = false; });
          save(); render(); toast('Undone');
        }});
      break;
    }
    case 'complete_chore': {
      // NEVER toggleChore here. toggleChore UNticks when the chore is already
      // done, so a confirm button reading "Mark 'Bins' done for today" could
      // un-complete it -- the exact opposite of what the button said, on the one
      // confirmed write that had no undo. completeChore now carries the same-day
      // guard, so calling it directly is safe; when nobody is resolved, ask who
      // through the same sheet the Chores tab uses rather than guessing.
      const kidId = pa.kidId || target.kidId || null;
      if(kidId) completeChore(target, kidId);
      else if(target.stars > 0 && justKids().length) askWhoDidChore(target);
      else completeChore(target, null);
      break;
    }
    case 'mark_event_handled':
      markHandled(target.id);
      break;
    case 'edit_event': {
      // Recomputed here when the event was chosen from a "which one?" prompt.
      // Until v9.95 this read pa.changes, which that path never set, so
      // Object.assign(target, {}) wrote nothing and the user was told
      // 'Updated "X"' and handed an Undo that also did nothing -- the exact lie
      // the guard in performRoute refuses for the non-ambiguous case.
      const changes = pa.changes || (pa.editParams ? eventEditChanges(pa.editParams, target) : {});
      if(!Object.keys(changes).length){
        toast('Nothing to change on "' + target.title + '"');
        render();
        break;
      }
      const before = { date: target.date, time: target.time, title: target.title };
      Object.assign(target, changes);
      save();
      toast(`Updated "${target.title}"`, { label:'Undo', fn:() => {
        Object.assign(target, before); save(); render(); toast('Put back');
      }});
      break;
    }
    case 'delete_event':
      softDelete('events', target.id, '"' + target.title + '"');
      break;
    case 'delete_chore':
      // Stars already earned are kept either way -- softDelete only flags the
      // chore row, and completions are a separate collection.
      softDelete('chores', target.id, '"' + target.title + '"');
      break;
  }
  render();
}

// ---------- Gmail watcher ----------
// A Google Apps Script reads matching emails on Google's servers every 15 min
// and holds extracted events in a queue. We just fetch and review them.
/**
 * Which emails the review screen is currently showing, derived from the rows
 * themselves rather than tracked beside them.
 *
 * This used to be a module-level `pendingMsgIds` array, set when an email batch
 * opened and cleared only by saveReview/dismissPendingEmail -- both of which run
 * AFTER committing those ids to seenMsgs. Nothing cleared it when pendingEvents
 * was replaced by a different source, and pendingEvents is replaced by a photo
 * scan, a link import and the assistant's draft. So: open the email banner, tap
 * Back, scan a flyer, tap "Track N items" -- and the app wrote the EMAIL ids
 * into seenMsgs forever. Those emails were never offered again and their events
 * were gone, with no route back. The review screen even offered "Skip all from
 * this email" for a batch that was no longer there.
 *
 * Carrying the id on the row makes that unreachable by construction: replacing
 * pendingEvents replaces the ids, because they are the same objects.
 */
function pendingMsgIdsOf(){
  return [...new Set((pendingEvents || []).map(e => e && e.msgId).filter(Boolean))];
}

function watcherConfigured(){ return !!(S.settings.watcherUrl && S.settings.watcherToken); }
function personsForSender(from){
  const map = S.settings.senderTags || {};
  if(!from) return [];
  const addr = String(from).toLowerCase();
  if(map[addr]) return map[addr].filter(id => personById(id));
  const at = addr.indexOf('@');
  const domain = at >= 0 ? addr.slice(at+1) : addr;
  if(map[domain]) return map[domain].filter(id => personById(id));
  return [];
}

// Apps Script /exec redirects to script.googleusercontent.com, and that hop
// does not carry CORS headers a browser will accept for a cross-origin fetch().
// Script tags are exempt from CORS, so we load the response as JSONP instead.
function watcherBaseUrl(){
  let u = (S.settings.watcherUrl || '').trim();
  const q = u.indexOf('?');
  if(q >= 0) u = u.slice(0, q);        // drop any query the user pasted in
  return u.replace(/\/+$/, '');
}

function jsonpRequest(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = 'fsWatcherCb' + Date.now() + Math.floor(Math.random() * 1e6);
    const tag = document.createElement('script');
    let settled = false;
    const cleanup = () => {
      settled = true;
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(tag.parentNode) tag.parentNode.removeChild(tag);
    };
    const timer = setTimeout(() => {
      if(settled) return;
      cleanup();
      reject(new Error('The watcher did not answer in time. Check the /exec URL and that the deployment is Active.'));
    }, timeoutMs || 20000);
    window[cb] = (data) => { if(settled) return; cleanup(); resolve(data); };
    tag.onerror = () => {
      if(settled) return;
      cleanup();
      reject(new Error('Could not load that URL. Copy it again from Deploy > Manage deployments > Web app.'));
    };
    tag.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.body.appendChild(tag);
  });
}

async function fetchEmailQueue(){
  const base = watcherBaseUrl();
  if(!base) throw new Error('No watcher URL saved.');
  const url = base + '?token=' + encodeURIComponent((S.settings.watcherToken || '').trim());
  const data = await jsonpRequest(url);
  if(data.error) throw new Error(data.error === 'unauthorized'
    ? 'Token rejected — check the secret matches the script.' : data.error);
  const seen = new Set(S.settings.seenMsgs || []);
  const items = data.items || [];
  const today = todayISO();
  let noMsgId = 0, alreadySeen = 0, inPast = 0;
  const fresh = items.filter(i => {
    if(!i.msgId){ noMsgId++; return false; }
    if(seen.has(i.msgId)){ alreadySeen++; return false; }
    if(isMessageRef(i)) return true;                             // not extracted yet
    if(!(i.date >= today)){ inPast++; return false; }
    return true;
  });
  const report = 'Queue: ' + items.length + ' item(s) from the watcher. ' +
    'Offered: ' + fresh.length + '. Skipped -- already imported: ' + alreadySeen +
    ', dated before today (' + today + '): ' + inPast + ', missing message id: ' + noMsgId + '.';
  return { fresh, lastRun: data.lastRun, report };
}

/**
 * Rewrite the watched sender list.
 *
 * The only call in the app that CHANGES what the watcher may read from Gmail,
 * so as of v9.75 the script can require a second secret for it. That secret is
 * asked for here and forgotten immediately: it is never written to S.settings,
 * so it never reaches localStorage and never ships in a backup -- which is the
 * whole reason it exists, since `watcherToken` does both.
 */
async function saveSenders(list){
  const base = watcherBaseUrl();
  if(!base) throw new Error('No watcher URL saved.');
  let url = base + '?token=' + encodeURIComponent((S.settings.watcherToken||'').trim()) +
    '&action=setsenders&senders=' + encodeURIComponent(list.join(','));
  if(watcherWriteToken) url += '&wtoken=' + encodeURIComponent(watcherWriteToken);
  const data = await jsonpRequest(url);
  if(data.error === 'write_unauthorized'){
    // Ask once, retry once. A wrong answer the second time is a real failure --
    // looping here would be a password prompt that never stops.
    const typed = prompt('Your watcher asks for its WRITE_SECRET before it will '
      + 'change which senders it reads.\n\nThis is NOT the token you saved in '
      + 'Settings — it is the second value from Script Properties. FlyerSnap does '
      + 'not store it.');
    if(typed === null) throw new Error('Sender list not changed.');
    watcherWriteToken = String(typed).trim();
    const retryUrl = base + '?token=' + encodeURIComponent((S.settings.watcherToken||'').trim()) +
      '&action=setsenders&senders=' + encodeURIComponent(list.join(',')) +
      '&wtoken=' + encodeURIComponent(watcherWriteToken);
    const again = await jsonpRequest(retryUrl);
    if(again.error === 'write_unauthorized'){
      watcherWriteToken = '';                    // wrong: do not keep it around
      throw new Error('That WRITE_SECRET was not accepted.');
    }
    if(again.error) throw new Error(again.error);
    return again.senders || [];
  }
  if(data.error) throw new Error(data.error);
  return data.senders || [];
}

// djb2, hex-encoded — same recipe as the other apps so grouping is uniform.
function reportHash(input){
  let h = 5381;
  const s = String(input || '');
  for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(16);
}

// letter-prefixed ids). Same scheme in all three apps.
const ID_MAX_TS = 9999999999999; // 13 nines, ~year 2286

  const n = Math.min(Math.max(Math.trunc(now) || 0, 0), ID_MAX_TS);
  return String(ID_MAX_TS - n).padStart(13, '0') + '-' + kind + '-' + String(rand);
