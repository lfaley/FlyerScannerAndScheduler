<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No user-scalable=no / maximum-scale: blocking pinch-zoom fails WCAG
     2.2 SC 1.4.4, and an installed iOS web app DOES honour it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2D5A4A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2F5D4C" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<!-- iOS wants 180x180 and composites any transparency onto BLACK, so this
     one is opaque and its own file. Generated by tools/build-app-icons.py. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="description" content="Snap a school flyer, forward an email or import a PDF, and FlyerSnap pulls out the dates and deadlines, then hands you calendar reminders.">
<title>FlyerSnap</title>
<style>
  :root{
    /* DARK -- the shipped default. True dark green-tinted neutrals, not an
       inversion. Fills keep their weight; text accents brighten to hold WCAG
       AA. Cards trade shadows for a 1px edge, the standard dark-elevation
       cue. EVERY color in the app lives here or in the light block below --
       nothing elsewhere may name a raw color, and a test enforces that. */
    --green:#2F5D4C; --accent:#9CC9B4; --green-lt:#24382F; --green-line:#3C574B;
    --red:#C0392B; --red-accent:#F0A091; --red-lt:#3B211D;
    --amber:#B45309; --amber-accent:#E5A163;
    --bg:#131715; --card:#1C2320; --card-edge:#2A332E; --divider:#2A332E;
    --ink:#E9EDEA; --muted:#AEBAB3; --faint:#93A099; --line:#323D37;
    --placeholder:#66756D; --on-accent:#fff; --overlay:rgba(0,0,0,.55);
    --on-accent-press:rgba(255,255,255,.18);
    --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.35);
    --shadow-near:0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.4);
    --shadow-float:0 3px 12px rgba(0,0,0,.55);
    --shadow-nav:0 -4px 12px rgba(0,0,0,.45);
    --shadow-sheet:0 -2px 16px rgba(0,0,0,.55);

    /* Type scale. Five steps instead of twelve ad-hoc sizes. Body sits at 16px,
       the mobile minimum in Apple HIG (17pt) and Material (16sp). */
    --t-cap:13px;    /* captions, tags -- non-essential only */
    --t-sm:15px;     /* secondary text */
    --t-body:16px;   /* body minimum */
    --t-title:17px;  /* card titles */
    --t-lg:22px;     /* section heads */
    --t-xl:28px;     /* page numbers, counts */

    /* 4px spacing grid */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;

    /* WCAG 2.5.8 floor is 24px; 44px is the Apple HIG / WCAG 2.5.5 AAA target. */
    --tap:44px;

    /* Tell the browser which way round this is, so form controls, scrollbars
       and the like render in the matching scheme without extra CSS. */
    color-scheme: dark;
  }
  /* LIGHT -- opt in, either by choosing it or by choosing "match my phone"
     while the phone is in light mode. Only the colors change; the type scale,
     spacing and tap tokens above are shared. */
  :root[data-theme="light"]{
    --green:#2D5A4A; --accent:#2D5A4A; --green-lt:#E4EEE9; --green-line:#CBDDD2;
    --red:#C0392B; --red-accent:#C0392B; --red-lt:#FDEBEA;
    --amber:#B45309; --amber-accent:#B45309;
    --bg:#F7F5F0; --card:#fff; --card-edge:transparent; --divider:#EEF2EF;
    --ink:#1E2B26; --muted:#4A5B53; --faint:#637169; --line:#D5DDD8;
    --placeholder:#7C9188; --on-accent:#fff; --overlay:rgba(0,0,0,.3);
    --on-accent-press:rgba(255,255,255,.15);
    --shadow-card:0 1px 2px rgba(30,43,38,.04), 0 2px 8px rgba(30,43,38,.05);
    --shadow-near:0 1px 2px rgba(30,43,38,.05), 0 4px 14px rgba(30,43,38,.09);
    --shadow-float:0 3px 10px rgba(0,0,0,.2);
    --shadow-nav:0 -4px 12px rgba(0,0,0,.06);
    --shadow-sheet:0 -2px 12px rgba(0,0,0,.12);
    color-scheme: light;
  }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Nothing in the app showed focus before -- switch-control and keyboard users
     had no idea where they were. :focus-visible keeps it invisible for taps. */
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
  /* main gets focus on navigation for screen-reader users; that is a cue to
     assistive tech, not a visual state. */
  main:focus,main:focus-visible{outline:none}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
  /* iOS 26 leaves a strip below the layout viewport in an installed web app
     (WebKit 158055568). Nothing inside the page can paint there -- only the
     CANVAS background does, and the canvas takes its colour from <html>.
     So html is painted the NAV colour, and body keeps the page colour and is
     forced to fill the viewport so it always covers everything above the
     strip. Result: the exposed strip reads as part of the tab bar instead of
     a gap under it, on any device, in either theme. */
  html{background:var(--card)}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--ink);font-size:var(--t-body);line-height:1.5;
    min-height:100vh;
    padding-top:env(safe-area-inset-top);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;background:var(--green);color:var(--on-accent);padding:14px 16px;
    font-weight:800;font-size:19px;letter-spacing:-.01em;z-index:10;display:flex;align-items:center;gap:10px;
    padding-top:calc(14px + env(safe-area-inset-top));margin-top:calc(-1 * env(safe-area-inset-top))}
  /* The back chevron is the primary escape route on seventeen sub-screens and
     was a 24x39px tap target -- the smallest control in the app, in the corner
     hardest to hit one-handed. The box is now a full 44px square; the negative
     margins absorb it so the header bar keeps its height and the icon keeps
     its position. (WCAG 2.5.8 sets 24px as the AA floor; Apple HIG asks 44,
     which is what the rest of this app already uses.) */
  header .back{background:none;border:none;color:var(--on-accent);font-size:20px;font-weight:700;
    min-width:var(--tap);min-height:var(--tap);margin:calc((var(--tap) - 24px) / -2) 0;
    padding:0 4px;display:inline-flex;align-items:center;justify-content:flex-start}
  /* Real headings now (h1 in the bar, h2 on empty states) so heading
     navigation works. Strip the UA margins/sizes -- the design owns those. */
  .htitle{margin:0;font-size:inherit;font-weight:inherit;letter-spacing:inherit}
  .empty .et{margin:0 0 var(--s2)}
  main{padding:var(--s4);max-width:640px;margin:0 auto;padding-bottom:var(--s5)}
  /* Larger phones get a touch more air; content stays in a readable measure. */
  @media (min-width:430px){ main{padding:var(--s5)} }
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
    box-shadow:var(--shadow-nav);z-index:30}
  nav button{flex:1;background:none;border:none;padding:8px 0 6px;font-size:var(--t-cap);font-weight:600;min-height:var(--tap);
    color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button.on{color:var(--accent)}
  nav button .ic{font-size:20px;opacity:.45}
  nav button.on .ic{opacity:1}
  /* iOS 26 standalone viewport bug: the layout viewport can come up short of
     the physical screen (WebKit 158055568; improved in 26.1 but still seen in
     the field), which leaves a strip of page background exposed BELOW a
     bottom-fixed bar. Extend the nav's white downward to cover any such gap;
     when the viewport is sized correctly this paints off-screen and is
     invisible. */
  /* (The old nav::after cover lived here. It could not work: the strip iOS 26
     leaves exposed is OUTSIDE the layout viewport, and only the canvas
     background paints there. Replaced by the html/body split above.) */
  .card{background:var(--card);border:1px solid var(--card-edge);border-radius:14px;padding:var(--s4);margin-bottom:var(--s3);
    box-shadow:var(--shadow-card);
    transition:transform .1s ease, box-shadow .1s ease}
  .card:active{transform:scale(.99)}

  /* Sticky bucket headers -- the anchor points that make a long list scannable. */
  .bucket{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s2);
    background:var(--bg);padding:var(--s4) 0 var(--s2);
    font-size:var(--t-cap);font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted)}
  .bucket::after{content:'';flex:1;height:1px;background:var(--line)}
  .bucket-n{order:3;background:var(--line);color:var(--muted);border-radius:9px;
    padding:1px 7px;font-size:11px;letter-spacing:0}

  /* Density tiers. Imminent events earn presence; distant ones stay quiet. */
  .card.near{box-shadow:var(--shadow-near)}
  .card.compact{padding:var(--s3) var(--s4);margin-bottom:var(--s2);opacity:.88}
  .card.compact .badge{background:transparent;color:var(--faint);padding:4px 0;font-weight:600}

  /* Entrances. Guarded by the prefers-reduced-motion block above. */
  @keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  main > .card, main > .bucket{animation:riseIn .22s ease both}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .title{font-size:var(--t-title);font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .meta{font-size:var(--t-sm);color:var(--muted);margin-top:var(--s1);line-height:1.45}
  .notes{font-size:var(--t-sm);color:var(--faint);font-style:normal;margin-top:var(--s2);
    white-space:pre-wrap;word-break:break-word;line-height:1.5;padding-left:10px;border-left:2px solid var(--line)}
  .stripe{border-left:5px solid var(--accent)}
  .stripe.deadline{border-left-color:var(--red-accent)}
  .badge{font-size:var(--t-cap);font-weight:700;color:var(--accent);background:var(--green-lt);
    padding:6px 10px;border-radius:9px;white-space:nowrap}
  .badge.urgent{color:var(--on-accent);background:var(--red)}
  .kidtag{display:inline-block;color:var(--on-accent);font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:10px;margin-top:6px}
  .kindtag{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--accent);
    background:var(--green-lt);padding:2px 6px;border-radius:4px}
  .kindtag.deadline{color:var(--on-accent);background:var(--red)}
  .btn{background:var(--green);color:var(--on-accent);border:none;border-radius:12px;
    padding:14px 18px;font-size:var(--t-body);font-weight:700;width:100%;
    min-height:var(--tap);-webkit-tap-highlight-color:transparent;
    transition:transform .08s ease}
  .btn:active{transform:scale(.985)}
  .btn.alt{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
  .btn.sm{width:auto;padding:10px 18px;font-size:var(--t-sm);min-height:var(--tap)}
  .btn.danger{background:var(--red)}
  .btn:disabled{opacity:.5}
  .fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:auto;padding:14px 24px;border-radius:28px;box-shadow:var(--shadow-float);z-index:9}
  .newflag{display:inline-block;background:var(--amber);color:var(--on-accent);border-radius:6px;
    padding:1px 6px;font-size:10px;font-weight:800;margin-right:6px;vertical-align:middle;letter-spacing:.4px}
  .calflag{display:inline-block;background:var(--green-lt);color:var(--accent);border:1px solid var(--green-line);
    border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;margin-top:4px;white-space:nowrap}
  .chip{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);
    color:var(--muted);border-radius:22px;padding:0 16px;min-height:var(--tap);
    font-size:var(--t-sm);font-weight:600;font-family:inherit;margin:0 var(--s2) var(--s2) 0;
    flex-shrink:0;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}
  .check{width:28px;height:28px;border-radius:14px;border:2px solid var(--placeholder);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:800;font-size:14px}
  .check.on{background:var(--green);border-color:var(--green)}
  /* Every text-entry type the app actually ships. `email` was missing until
     v9.68, so the one type=email input in the app -- Gordon sign-in -- got no
     styling at all and rendered as a narrow UA-default box with Safari's
     autofill wash showing through, directly above a correctly styled password
     field. tests-cases.js pins this: any input type in the shipped markup that
     is not checkbox/file/radio/image must appear in this selector. */
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],textarea{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:16px;font-family:inherit;color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  .formrow{display:flex;gap:8px;margin-bottom:10px}
  /* Two-up only. Three flex:1 columns on a 393px screen leave ~116px each,
     which is too narrow for these labels (they wrap and break alignment) and
     too narrow for a native time input (it clips). Baymard's tested failure:
     a field that cannot show its own value cannot be checked by the user. */
  .fieldpair{display:flex;gap:var(--s3);margin-bottom:var(--s3)}
  .fieldpair > *{flex:1;min-width:0}
  /* Inline validation, next to the field it is about (NN/g). */
  /* Sits directly under its field. No negative margin: the inputs carry no
     bottom margin of their own, so pulling up collides with the border. */
  .fielderr{display:block;font-size:var(--t-sm);font-weight:600;color:var(--red-accent);
    margin:var(--s2) 0 0;line-height:1.4}
  input.bad,textarea.bad{border-color:var(--red-accent);border-width:2px}
  /* Form screens need the last control to clear the tab bar with room to
     spare -- the Save button was being clipped by it. */
  main.isform{padding-bottom:120px}
  textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:var(--t-body);font-family:inherit;color:var(--ink)}
  /* Now a real <label for>, which is inline by default -- keep it block so
     the layout is identical to the <div> it replaced. */
  .label{display:block;font-size:var(--t-sm);font-weight:700;color:var(--ink);
    margin:var(--s4) 0 var(--s2)}
  /* "(optional)" is a modifier, not part of the name -- GOV.UK marks optional
     fields rather than required ones, so this appears often and must not
     shout. */
  .label .opt{font-weight:600;color:var(--faint)}
  /* Read-only metadata shown inside a form. Deliberately NOT .label, which
     would make it read as an editable field. */
  .metalabel{display:block;font-size:var(--t-cap);font-weight:700;color:var(--faint);
    margin:var(--s4) 0 var(--s1);text-transform:uppercase;letter-spacing:.06em}
  .empty{text-align:center;padding:44px 24px 40px;color:var(--muted)}
  /* Empty-state mark: large, quiet, unmistakably the same family as the
     controls. Tinted surface rather than a heavy outline so it recedes. */
  .empty .art{width:66px;height:66px;margin:0 auto 18px;border-radius:22px;
    background:var(--green-lt);display:flex;align-items:center;justify-content:center}
  .empty .art .ico{width:31px;height:31px;stroke-width:1.5;color:var(--accent);margin:0}
  /* Equal-width actions on one line. Labels stay short enough to fit three. */
  .actionrow{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
  .actionrow .btn{flex:1;padding:12px 8px;font-size:var(--t-sm);width:auto}
  .empty .et{font-size:var(--t-lg);font-weight:800;color:var(--ink);margin-bottom:var(--s2)}
  .empty .eb{font-size:var(--t-body);line-height:1.6;max-width:34ch;margin:0 auto}
  .sect{font-size:var(--t-lg);font-weight:800;margin:var(--s6) 0 var(--s2);letter-spacing:-.02em}
  .help{font-size:var(--t-sm);color:var(--muted);line-height:1.55;margin-bottom:var(--s3)}
  /* A command the user is meant to type. break-all rather than overflow:
     a wrapped command can still be read; a clipped one cannot. */
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;
    background:var(--bg);border:1px solid var(--line);border-radius:6px;
    padding:1px 5px;word-break:break-all}
  .filterbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
  .balance{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid;
    border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
  .spin{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px}
  .spinner{width:36px;height:36px;border:4px solid var(--green-lt);border-top-color:var(--accent);
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* Skeleton placeholders (extraction "it's working" feedback). The global
     reduced-motion rule above freezes the shimmer to a static block. */
  .skel{background:linear-gradient(90deg,var(--green-lt) 25%,var(--card) 50%,var(--green-lt) 75%);
    background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:6px}
  @keyframes skel{0%{background-position:100% 0}100%{background-position:0 0}}
  /* screenIn must NEVER animate transform. main.enter keeps its finished
     animation applied forever (fill-mode: both), and a filled transform -- even
     the identity matrix that `transform:none` resolves to -- makes <main> the
     containing block for every position:fixed descendant (CSS Transforms
     spec). That pinned the .fab buttons to the CONTENT instead of the screen:
     mid-page on short tabs (Chores), buried below the list on long ones
     (Events). Reproduced in headless Chromium; matches on-device screenshots.
     Opacity is safe -- it creates a stacking context, not a containing block.
     A test in tests-modules.js guards this. */
  @keyframes screenIn{from{opacity:0}to{opacity:1}}
  main.enter{animation:screenIn .2s ease both}
  .celebrate{background:var(--green-lt);border-radius:10px;padding:12px;text-align:center;
    font-weight:700;color:var(--accent);margin-bottom:12px}
  /* 136px, not 80px. At 80 the toast sat 1px above the .fab (which is 48px
     tall on a 76px offset) and covered 65% of it at z-index 99 vs 9 -- measured
     in a 390x844 browser, on every screen with a FAB, not just theme changes.
     136 = the FAB's 76px offset + its 48px height + a 12px gap. */
  .toast{position:fixed;bottom:calc(136px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;
    z-index:99;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;
    display:inline-flex;align-items:center;gap:var(--s3)}
  .toast.show{opacity:1}
  /* Only a toast offering an action may take taps -- otherwise it would eat
     taps meant for the screen underneath while it fades. */
  .toast.interactive{pointer-events:auto}
  .toast-action{background:none;border:none;color:var(--accent);font-weight:800;
    font-size:var(--t-sm);padding:6px 2px;min-height:32px;white-space:nowrap;
    text-decoration:underline;text-underline-offset:3px}
  .strike{text-decoration:line-through;color:var(--faint)}
  .dim{opacity:.55}
  .slot{display:flex;align-items:center;gap:10px;padding:6px 0}
  .slotb{width:24px;height:24px;border-radius:12px;background:var(--green-lt);color:var(--accent);
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .slottext{font-size:14px}
  .slottext.empty{color:var(--faint);font-style:italic}
  .sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;
    padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;
    box-shadow:var(--shadow-sheet)}
  .overlay{position:fixed;inset:0;background:var(--overlay);z-index:15}
  /* A SHEET MUST OUTRANK THE NAV (v10.1). The sheet was z-index 20 and the
     overlay 15, against nav's 30 -- so the nav sat on top of every sheet in the
     app, undimmed and still clickable.

     MEASURED at 393x852, 390x664 and 360x640, with elementFromPoint at each
     button's centre: the LAST button of every sheet was unreachable, because a
     tap there landed on the nav instead. That button is "Cancel" on the link
     sheet, "Remove event" on an event's actions and "Delete N events" on the
     bulk sheet -- and the tap did not do nothing, it switched tabs and left the
     sheet floating over a different screen.

     40/35 keeps the toast (99) above both, which is right: an Undo has to be
     reachable over a sheet. The composer stays at 20 -- it is offset above the
     nav by 54px on purpose and never overlaps it. */
  .sheet{z-index:40}
  .overlay{z-index:35}
  /* A SHEET MUST NOT GROW OFF THE TOP OF THE SCREEN (v10.1). It was
     position:fixed;bottom:0 with max-height:none and overflow-y:visible, so a
     long one simply extended upward past the viewport and the options at the
     top became unreachable -- there was nothing to scroll.

     MEASURED with 16 people in bulkTagSheet (19 buttons): at 393x852 the sheet
     started at y -242 and lost three "Tag as ..." options; at 360x640 it
     started at -454 and lost seven. Ten people already put the top edge at
     y 67, so this was not far off in normal use.

     100vh, not 100dvh: the app already relies on 100vh at line 23, and the iOS
     26 bug documented above makes the LAYOUT viewport come up SHORT of the
     screen -- which errs toward a smaller cap, never a taller sheet. The 32px
     keeps a strip of the screen behind visible, so a tall sheet still reads as
     a sheet rather than a takeover. overscroll-behavior stops a flick at the
     end of the list scrolling the page underneath. */
  .sheet{max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch}
  /* min-height wins over the inline paddings scattered through the markup, so
     every one of these clears the 44px target without touching 26 call sites. */
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:700;
    font-size:var(--t-sm);padding:8px;min-height:var(--tap);min-width:var(--tap);
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:8px;-webkit-tap-highlight-color:rgba(45,90,74,.12)}
  .linkbtn:active{background:var(--green-lt)}
  .linkbtn.red{color:var(--red-accent)}
  .sheetbtn{display:block;width:100%;background:var(--green-lt);color:var(--accent);border:none;
    border-radius:10px;padding:13px;font-size:15px;font-weight:700;margin-bottom:8px;text-align:center}
  .sheetbtn.danger{background:var(--red-lt);color:var(--red-accent)}
  .sheetbtn.cancel{background:none;color:var(--muted);font-weight:600}
  h3{margin:6px 0 10px;font-size:16px}
  /* Inline SVG icons (v8.9, replacing emoji chrome). currentColor means an
     icon inherits its label's color, so active/dark/disabled states need no
     icon-specific rules. Sized in em so an icon tracks its text. */
  .ico{width:1.15em;height:1.15em;flex-shrink:0;vertical-align:-.18em;margin-right:.4em;
    fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  /* An icon standing alone IS the control (delete, back) -- no label to space
     from. Marked by ico() when the icon carries its own accessible name;
     :only-child cannot be used here because CSS ignores text-node siblings. */
  .ico-solo{margin-right:0}
  nav button .ic{display:flex;align-items:center;justify-content:center;height:22px}
  nav button .ic .ico{width:23px;height:23px;stroke-width:1.6}
  .card.row>.ico{width:26px;height:26px;stroke-width:1.5;color:var(--accent)}
  /* Leading icon on a card row -- the old 28px emoji slot. Accent-colored so
     the row reads as an action, not decoration. */
  .rowicon{width:26px;height:26px;stroke-width:1.5;color:var(--accent);margin-right:0}
  /* Header action (Ask). Sits opposite the title; 44px like every other target. */
  .headerbtn{margin-left:auto;background:none;border:none;color:var(--on-accent);
    min-width:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;
    justify-content:center;border-radius:10px;padding:0}
  .headerbtn .ico{width:22px;height:22px;margin:0}
  .headerbtn:active{background:var(--on-accent-press)}
  /* Ask composer. Pinned directly above the tab bar, the way every messaging
     UI does it: the input must stay reachable no matter how long the
     conversation gets, and it must not drift into the middle of an empty
     screen. 54px is the measured nav height. */
  .composer{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));
    background:var(--bg);border-top:1px solid var(--line);z-index:20;
    padding:var(--s2) var(--s4);display:flex;gap:var(--s2);
    max-width:640px;margin:0 auto}
  .composer input{flex:1}
  .composer .btn{width:auto;flex-shrink:0}
  /* Room so the last message is never hidden behind the composer. */
  main.hascomposer{padding-bottom:96px}
  /* Suggestions as chips rather than six full-width buttons -- lighter, and
     they wrap instead of pushing the input off the screen. */
  .suggest{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s3)}
  .suggest .chip{margin:0}
  /* Long diagnostic text, shortened until asked for.
     The self-test prints raw error strings, model lists and JSON fragments,
     and one bad call can be a full screen of it -- which pushes the check
     that FAILED off the top and buries the "Run again" button. Clamped to
     three lines with an explicit control, never truncated permanently: the
     text is the whole point of a diagnostic, so it must always be one tap
     away. -webkit-line-clamp is the only reliable multi-line clamp in
     Safari, which is where this app actually runs. */
  .clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden}
  /* A plain text control, not a .btn: it sits inside a card row and a
     44px-tall button per result would be taller than the text it reveals.
     The tap target is met by padding rather than by height alone. */
  .morebtn{background:none;border:0;color:var(--accent);font:inherit;
    font-size:var(--t-cap);font-weight:700;padding:var(--s2) 0;cursor:pointer;
    min-height:var(--tap);display:inline-flex;align-items:center}
</style>

<script>'use strict';
// Paint the theme before anything renders. Reads localStorage directly
// because S does not exist yet, and a flash of the wrong palette on every
// launch is exactly the kind of cheap-feeling detail this app is trying to
// leave behind. Wrapped: a themeless app is worse than a mis-themed one.
(function paintThemeEarly(){
  try{
    var raw = localStorage.getItem('flyersnap');
    var pref = 'dark';
    if(raw){ var s = JSON.parse(raw); if(s && s.settings && s.settings.theme) pref = s.settings.theme; }
    var light = pref === 'light' ||
      (pref === 'system' && window.matchMedia
        && window.matchMedia('(prefers-color-scheme: light)').matches);
    if(light) document.documentElement.setAttribute('data-theme', 'light');
  }catch(e){ /* dark is the default; leaving the attribute off is correct */ }
})();

// ---------------------------------------------------------------------------
// MODULES ARE INLINED HERE ON PURPOSE.
//
// These four blocks live in js/*.js and are the source of truth for the tests.
// They are inlined into this file for delivery because loading them as real ES
// modules broke the installed iOS PWA: an import that fails to resolve kills
// the whole module, and the app renders as a bare background with no visible
// error. One file has no imports to fail.
//
// Keep editing js/*.js -- the build step re-inlines them, and a test asserts
// the two copies stay identical.
// ---------------------------------------------------------------------------

// ===== inlined from js/format.js =====
/**
 * Formatting helpers. Pure functions -- no DOM, no app state, no side effects.
 *
 * This is the first module extracted from index.html. It was chosen because it
 * is entirely pure and already well covered by tests, so moving it proves the
 * pattern works without risking anything.
 */

// --- dates -----------------------------------------------------------------

function todayISO(d){
  const t = d || new Date();
  return t.getFullYear() + '-' +
    String(t.getMonth() + 1).padStart(2, '0') + '-' +
    String(t.getDate()).padStart(2, '0');
}

function daysUntil(dateStr, today){
  const [y, m, d] = String(dateStr).split('-').map(Number);
  const target = new Date(y, m - 1, d);
  const now = today ? new Date(today) : new Date();
  now.setHours(0, 0, 0, 0);
  target.setHours(0, 0, 0, 0);
  return Math.round((target - now) / 86400000);
}

// --- times -----------------------------------------------------------------

/**
 * 24-hour to 12-hour for display. Stored data and the .ics file stay 24-hour;
 * the iCalendar standard requires it and the phone renders it per its own
 * settings. Only what the user reads changes here.
 */
function fmt12(t){
  if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return t || '';
  let [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
}

function fmtTimeRange(e){
  if(!e || !e.time) return '';
  return e.endTime ? fmt12(e.time) + '–' + fmt12(e.endTime) : fmt12(e.time);
}

// --- text ------------------------------------------------------------------

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// --- copy/share formatting -------------------------------------------------
// Pure: turn app records into plain text a person can paste elsewhere. The
// Problem Log used to be a dead end on a phone -- you could see an error and
// not get it out. These build the exact text the Copy/Share buttons hand to
// the clipboard or the share sheet.

function formatProblemForCopy(p){
  if(!p) return '';
  const lines = [];
  lines.push(String(p.message || 'Problem'));
  if(p.where) lines.push('Where: ' + p.where);
  if(p.count > 1) lines.push('Happened: ' + p.count + ' times');
  if(p.last) lines.push('Last: ' + p.last);
  if(p.detail) lines.push('', String(p.detail));
  return lines.join('\n').trim();
}

function formatAnswerForCopy(turn){
  return String(turn && turn.a != null ? turn.a : '').trim();
}

// --- problem guidance ------------------------------------------------------
// Pure: read a logged problem's text (message + detail) and return how urgent
// it is and one line on what to do about it. A log that only names the symptom
// leaves the reader stuck; NN/g's error guidance is to offer the next step.
// `tier`: 'act' = won't fix itself, you must do something (red);
//         'wait' = transient, retrying may work (amber);
//         '' = unknown, no specific advice (amber default).
// Matches on the text so it needs no schema change to the stored entry.
function problemGuidance(text){
  const t = String(text || '').toLowerCase();
  if(/not signed in|sign in|unauthor|forbidden|\b401\b|\b403\b/.test(t))
    return { tier:'act', hint:'Sign in to Gordon — Settings → Gordon and AI.' };
  if(/only reasoning|thinking|produced no answer|never (?:replied|answered)/.test(t))
    return { tier:'act', hint:'Wrong model tag — it must be the Instruct build, not the Thinking one.' };
  if(/pdf|unsupported|cannot read|only photos/.test(t))
    return { tier:'act', hint:'PDFs need Anthropic — photograph the page, or turn on the fallback.' };
  if(/rate.?limit|too many requests|\b429\b|is busy/.test(t))
    return { tier:'wait', hint:'Gordon was busy (rate limited) — wait a moment and try again.' };
  if(/timeout|timed out|took too long|three minutes/.test(t))
    return { tier:'wait', hint:'It took too long — try one page at a time.' };
  if(/failed to fetch|network|unreachable|connection|offline|econnrefused|\b502\b|\b503\b/.test(t))
    return { tier:'wait', hint:'Could not reach the desktop — wake it and check Tailscale, then retry.' };
  return { tier:'', hint:'' };
}

// --- relative time ---------------------------------------------------------
// Pure: "3h ago" / "in 2d" for a timestamp. `now` is injectable for tests.
// The exact date still travels alongside (callers keep it in a title/tooltip),
// so nothing is lost -- the relative form is just easier to read at a glance.
function relativeTime(iso, now){
  const then = new Date(iso).getTime();
  if(!isFinite(then)) return '';
  const nowMs = now instanceof Date ? now.getTime() : (now || Date.now());
  const secs = Math.round((nowMs - then) / 1000);
  const abs = Math.abs(secs), future = secs < 0;
  const label = (n, u) => future ? 'in ' + n + u : n + u + ' ago';
  if(abs < 45) return 'just now';
  if(abs < 5400) return label(Math.round(abs / 60), 'm');
  if(abs < 129600) return label(Math.round(abs / 3600), 'h');
  if(abs < 6 * 86400) return label(Math.round(abs / 86400), 'd');
  if(abs < 60 * 86400) return label(Math.round(abs / 604800), 'w');
  if(abs < 365 * 86400) return label(Math.round(abs / 2592000), 'mo');
  return label(Math.round(abs / 31536000), 'y');
}

/**
 * A date that a calendar could actually have.
 *
 * The shape regex /^\d{4}-\d{2}-\d{2}$/ was doing this job everywhere -- the
 * router's param check, the manual add form, the extraction sanitiser and the
 * Gmail watcher -- and shape is not validity. Measured before this existed:
 * validateRoute returned ok:true for '2026-99-99' and '99:99', and nothing
 * downstream looked again, so the value reached a real event.
 *
 * It never THREW, which is why nobody noticed. parseDate rolls over silently:
 * '2026-99-99' renders as "Wednesday, June 7" and '2026-02-30' as "March 2",
 * while every filter and sort still uses the raw string -- so a row is shown on
 * one day and reasoned about on another. The ICS export is worse: DTSTART keeps
 * the junk verbatim while DTEND is computed through a real Date, so the two
 * disagree by years and the file is garbage to a calendar client.
 *
 * Round-tripped through Date rather than a month-length table, because that
 * table has to know about leap years and this does not. Note Date.UTC maps
 * years 0-99 into 1900-1999, so the readback also rejects those.
 */
function isRealDate(s){
  if(typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  if(m < 1 || m > 12 || d < 1 || d > 31) return false;
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
}

/** A time a clock could actually show. Same reasoning as isRealDate. */
function isRealTime(s){
  if(typeof s !== 'string' || !/^\d{2}:\d{2}$/.test(s)) return false;
  const [h, mi] = s.split(':').map(Number);
  return h >= 0 && h <= 23 && mi >= 0 && mi <= 59;
}

/**
 * Event matching and grouping. Pure -- no DOM, no app state.
 *
 * The thresholds were tuned against real failures. Short titles need full
 * containment because "Mini Jazz" and "Mini M.T." share a word by chance;
 * longer ones need 0.8 overlap because 0.5 merged unrelated school events.
 */

// The same announcement can reach us twice -- once photographed, once by email --
// and Claude words the two slightly differently ("&" vs "and", extra qualifiers).
// Matching therefore has to be on meaning, not on the exact string.
function normTitle(t){
  return String(t || '').toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\b(the|a|an|of|for|to|at|on|in|our|your|please|note)\b/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Overlap measured against the shorter title, so "Picture Day" still matches
// "Fall Picture Day for Grades 1-5".
function titleSimilarity(a, b){
  // Compare SETS, not multisets. Counting repeats on the A side while dividing
  // by the shorter title's word count let one repeated word drive the score to
  // 1.0: "Grade 3 and Grade 4 and Grade 5 Swim" vs "Grade 6 Trip" on the same
  // day scored as duplicates. Verified against looksDuplicate before and after
  // (code review P5-01).
  const A = [...new Set(normTitle(a).split(' ').filter(Boolean))];
  const B = [...new Set(normTitle(b).split(' ').filter(Boolean))];
  // A title made entirely of stop-words normalises to nothing ("The Note",
  // "A", a single letter). Returning 0 here meant two BYTE-IDENTICAL titles
  // scored as completely unlike each other -- so looksDuplicate missed them,
  // which is the one thing it exists to catch. Compare the raw text instead.
  // (v9.18. The extraction scorer had quietly solved this in a private copy;
  // consolidating the two is what surfaced it.)
  if(!A.length || !B.length){
    const ra = String(a || '').trim().toLowerCase();
    const rb = String(b || '').trim().toLowerCase();
    return (ra && ra === rb) ? 1 : 0;
  }
  const setB = new Set(B);
  const overlap = A.filter(w => setB.has(w)).length;
  return overlap / Math.min(A.length, B.length);
}

function looksDuplicate(a, b){
  if(!a || !b || a.date !== b.date) return false;          // same day is required
  const na = normTitle(a.title), nb = normTitle(b.title);
  // Both normalise to nothing: titleSimilarity compares the raw text.
  if(!na || !nb) return titleSimilarity(a.title, b.title) === 1;
  if(na === nb) return true;                                // identical after normalizing
  // For anything else, demand a strong match. Short titles (1-2 words) are too
  // easy to collide by chance ("Mini Jazz" vs "Mini M.T."), so for those we
  // require one title to fully contain the other rather than mere word overlap.
  const wa = na.split(' ').filter(Boolean), wb = nb.split(' ').filter(Boolean);
  const shorter = Math.min(wa.length, wb.length);
  if(shorter <= 2){
    return na.indexOf(nb) >= 0 || nb.indexOf(na) >= 0;     // full containment only
  }
  return titleSimilarity(a.title, b.title) >= 0.8;         // was 0.6 — too loose
}

// Group upcoming events into scannable time buckets. A flat list of 25 cards
// gives the eye nothing to anchor on; headers let you navigate by scanning.
function timeBucket(days){
  if(days <= 0) return 'Today';
  if(days === 1) return 'Tomorrow';
  if(days <= 7) return 'This week';
  if(days <= 14) return 'Next week';
  if(days <= 31) return 'This month';
  return 'Later';
}

// Duplicates that are already saved -- e.g. a flyer scanned by hand and the same
// announcement arriving by email before matching was improved.
function pairKey(a, b){ return [a.id, b.id].sort().join('~'); }

// ===========================================================================
// SECRETARY PERSONA + GROUNDING
//
// Modelled on how a world-class executive assistant takes minutes. The rules
// below are drawn from professional minute-taking practice, and each one exists
// to prevent a specific failure we have actually seen:
//
//  - "owner, task, deadline" for every item   -> stops vague, unusable entries
//  - "never invent clarity"                   -> stops inferred/hallucinated dates
//  - "suggestion is not a decision"           -> stops 'maybe' becoming an event
//  - "restraint vs elaboration"               -> stops a whole week collapsing
//                                                into one generic item

const SECRETARY_PERSONA = `You are the executive secretary to a busy parent. You are a world-class note taker: precise, literal, and completely reliable. Your reputation rests on one thing -- what you write down is exactly what the source said, no more and no less.

How you work:

1. OWNER, TASK, DEADLINE. Every item you record answers three questions: what is happening, who it concerns, and exactly when. An item missing a date is not an item; leave it out rather than guessing.

2. NEVER INVENT CLARITY. If the source is vague, your note is vague. You do not resolve ambiguity by guessing, and you never infer a date, time, or location that is not stated. A missing field is null. Inventing a plausible detail is the worst error you can make -- worse than omitting the item.

3. A SUGGESTION IS NOT A DECISION. "We hope to schedule", "a sign-up sheet will be available", "more details to follow" are not events. Record only what is actually scheduled or actually due.

4. RESTRAINT AND ELABORATION. Never collapse many things into one summary item. If a schedule lists twelve sessions, you record twelve items -- not "training week". Conversely, do not pad: no item needs a paragraph.

5. OBJECTIVE AND LITERAL. Keep the source's own wording for names and titles, including instructor or room names in parentheses. Add no opinion, no interpretation, no encouragement.

6. DEADLINES ARE DIFFERENT FROM EVENTS. A form due, registration cutoff, payment date, or RSVP-by is a deadline. Something you attend is an event.

7. VERIFY BEFORE FINALISING. Re-read what you produced against the source. If a date, time, or name does not appear verbatim in the source, remove it.`;

/**
 * Schema migration. Pure: takes a saved object, returns it upgraded.
 *
 * This is the most consequential code in the app. Every existing install runs
 * it on load, and a mistake here does not fail loudly -- it silently damages
 * data people cannot get back. It lives on its own so it can be read, reasoned
 * about and tested in isolation.
 *
 * Rules:
 *  - Migrations only ever ADD or TRANSFORM. Never delete a field you do not
 *    fully understand; an unknown field may belong to a newer version.
 *  - Each step is guarded by `from < N` and must be safe to run once, in order.
 *  - Bumping SCHEMA_VERSION without adding the matching block means old saves
 *    are stamped as current without being upgraded.
 */

// Bump when the saved shape changes, and add a migration step below.
// v1 = everything up to and including v2.1 (implicit; no version field was stored).
// v2 = meal planner / recipe box retired; recipes+meals now live in the recipe app.
// NOTE: declared before load() runs, since blank() reads it at startup.
const SCHEMA_VERSION = 10;

function migrate(s, fromVersion){
  const from = Number(fromVersion) || 1;
  if(from >= SCHEMA_VERSION){ s.schemaVersion = SCHEMA_VERSION; return s; }

  if(from < 2){
    // FlyerSnap no longer owns recipes or meal plans — the recipe app does.
    // Keep the rows (harmless, and a user may want them exported) but stop
    // treating them as live data. Nothing is deleted here on purpose: a
    // migration that destroys data is the thing we most want to avoid.
    s.legacyRecipes = Array.isArray(s.recipes) ? s.recipes : [];
    s.legacyMeals   = Array.isArray(s.meals)   ? s.meals   : [];
    delete s.recipes;
    delete s.meals;
  }

  if(from < 3){
    // People can now be adults, and events can be tagged to several people.
    // Existing kids become type 'kid'; existing single kidId becomes a
    // one-entry personIds list. kidId is preserved so the star/chore system,
    // which is deliberately kids-only, keeps working untouched.
    (s.kids || []).forEach(k => { if(!k.type) k.type = 'kid'; });
    (s.events || []).forEach(e => {
      if(!Array.isArray(e.personIds)){
        e.personIds = e.kidId ? [e.kidId] : [];
      }
    });
  }

  if(from < 4){
    // Events can now be flagged unread. Everything already in the app counts as
    // seen, so nobody opens the app to a wall of "new" items.
    (s.events || []).forEach(e => { if(e.unread === undefined) e.unread = false; });
  }

  if(from < 5){
    // Gordon-by-default: make the self-hosted model (via the auth-checking proxy)
    // the PRIMARY provider on existing installs. The Anthropic fallback is left
    // untouched — it stays as the safety net for when the desktop is off. The saved
    // endpoint falls through to the app's GORDON_BASE_URL, so clear any stale direct
    // endpoint; move the old text-only default model onto the shared vision model.
    if(s.settings){
      s.settings.aiProvider = 'local';
      s.settings.localBaseUrl = '';
      // ...to the INSTRUCT tag. Earlier builds migrated onto `qwen3-vl:8b`
      // (the Thinking edition, which reasons until it runs out of budget) and
      // then onto the q8_0 (9.8 GB, the slowest 8B) -- rewrite both to the
      // shared fast tag. Also catches anyone still on the text-only 14B.
      //
      // The tag is a LITERAL here, not index.html's GORDON_MODEL: this module is
      // imported and unit-tested on its own, and referencing a constant that only
      // exists in the shipped file would throw ReferenceError the first time a
      // test exercised this branch. A guard test pins the two together instead.
      if(!s.settings.localModel
         || s.settings.localModel === 'qwen2.5:14b-instruct'
         || s.settings.localModel === 'qwen3-vl:8b'
         || s.settings.localModel === 'qwen3-vl:8b-instruct-q8_0'){
        s.settings.localModel = 'qwen3-vl:8b-instruct-q4_K_M';
      }
    }
  }

  if(from < 6){
    // The from<5 rewrite above was ADDED LATER than the v9.32 migration that
    // first wrote a model tag. v9.32 set `qwen3-vl:8b` (the Thinking edition --
    // reasons to budget, never answers) AND stamped schemaVersion 5, so on those
    // installs `from < 5` can never run again: they are permanently stuck asking
    // for the wrong model. Confirmed live via an error report (description
    // `qwen3-vl:8b` on v9.38, model error 429 then Anthropic). Force the shared
    // instruct tag now -- the same one-time repair the recipe app does with
    // migrateModelTag(). LITERAL tag, per the note in the from<5 block.
    const bad = new Set(['qwen2.5:14b-instruct', 'qwen3-vl:8b',
      'qwen3-vl:8b-thinking', 'qwen3-vl:8b-thinking-bf16', 'qwen3-vl:8b-instruct-q8_0']);
    if(s.settings && bad.has(s.settings.localModel)){
      s.settings.localModel = 'qwen3-vl:8b-instruct-q4_K_M';
    }
  }

  if(from < 7){
    // Recovered fallbacks to Anthropic used to be logged as Problems, so the
    // "N problems to look at" count never dropped even though every one had been
    // answered (e.g. 74 rate-limited calls that all fell back). They live in the
    // AI call log, not here -- drop the stale entries. New ones are no longer
    // logged as problems (see callAI). Only removes recovered-fallback rows.
    if(Array.isArray(s.problems)){
      s.problems = s.problems.filter(p => !/^Fell back to Anthropic/.test(String(p && p.message || '')));
    }
  }

  if(from < 8){
    // Notes arrived in v9.60. blank() already provides `notes: []` and load()
    // merges onto blank(), so an old save gets the empty array for free -- this
    // block exists for the case blank() cannot cover: a save whose `notes` key
    // exists but is not an array (hand-edited file, a truncated import, a
    // restore from a future version). Coercing here is cheaper than making
    // every reader defensive, and it destroys nothing that was ever usable.
    if(!Array.isArray(s.notes)) s.notes = [];
  }

  if(from < 9){
    // Notes gained folders and labels (v9.71). Apple's model: one folder says
    // WHERE a note lives, any number of labels say WHAT IT IS ABOUT.
    //
    // This block invents nothing. It creates no folders and no labels, so every
    // existing note lands as Unfiled with none -- which is precisely what it is
    // today. All it does is guarantee the shapes every reader now assumes, so
    // that a hand-edited file or a restore from an older export cannot reach
    // the render path with `labelIds` as a string.
    if(!Array.isArray(s.noteFolders)) s.noteFolders = [];
    if(!Array.isArray(s.noteLabels)) s.noteLabels = [];
    (s.notes || []).forEach(n => {
      if(!n) return;
      if(typeof n.folderId !== 'string') n.folderId = null;
      if(!Array.isArray(n.labelIds)) n.labelIds = [];
      if(typeof n.color !== 'string') n.color = '';
      if(typeof n.archived !== 'boolean') n.archived = false;
    });
  }

  if(from < 10){
    // Soft deletes gained a timestamp (v9.82). An existing tombstone cannot say
    // when it was deleted -- that was never recorded -- so it is stamped NOW.
    //
    // That is a CHOSEN value, not a recovered one, and it is chosen to be
    // generous: every existing tombstone gets a full retention window from the
    // day of the upgrade rather than being destroyed by the next prune. The
    // alternative, leaving them unstamped, keeps them for ever, which at a
    // 5 MiB ceiling is a leak with no bound.
    const stamp = new Date().toISOString();
    // Array.isArray, not `|| []`: adoptParsed coerces a junk collection AFTER
    // migrate runs, so a save carrying notes:'not an array' reaches this block
    // as a STRING and 'x'.forEach is not a function. Caught by the v9.80 test
    // on the first run -- the same shape migrate's own from<8 block guards.
    ['events','kids','chores','rewards','lists','listItems','notes','noteFolders','noteLabels']
      .forEach(coll => {
        const rows = s[coll];
        if(!Array.isArray(rows)) return;
        rows.forEach(row => { if(row && row.deleted && !row.deletedAt) row.deletedAt = stamp; });
      });
  }

  s.schemaVersion = SCHEMA_VERSION;
  return s;
}

  refreshUrl: (key) => 'https://securetoken.googleapis.com/v1/token?key=' + key,

  // (magic link, popup, and redirect all fail there -- SECURITY-PLAN.md 3.2).
  signInRequest(email, password, apiKey){
    return { url: this.signInUrl(apiKey), options: {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password, returnSecureToken: true })
    } };
  },

  refreshRequest(refreshToken, apiKey){
    return { url: this.refreshUrl(apiKey), options: {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(refreshToken)
    } };
  },

  // junk 200 can never masquerade as a signed-in state (hostile-parse discipline).

    if(!json || !json.idToken || !json.refreshToken) throw new Error('sign-in response missing tokens');

  },

  // endpoint returns snake_case; accept either just in case.
  parseRefresh(json, prev, nowMs){

    const refreshToken = json && (json.refresh_token || json.refreshToken);
    if(!idToken || !refreshToken) throw new Error('refresh response missing tokens');
    const ttl = (Number(json.expires_in || json.expiresIn) || 3600) * 1000;
    return { idToken: idToken, refreshToken: refreshToken,
      email: (prev && prev.email) || '', idTokenExpiresAt: nowMs + ttl };

    // which reads as an accusation about the email -- Logan hit it on 28 Aug

    if(/EMAIL_NOT_FOUND/.test(code))
      return 'No account for that email address.';
    if(/INVALID_PASSWORD/.test(code))
      return 'That password is not right. The email address is fine.';
    if(/INVALID_LOGIN_CREDENTIALS/.test(code))
      return 'Sign-in was refused. Google does not say which is wrong, so check the password first \u2014 it is the usual one.';
    if(/USER_DISABLED/.test(code)) return 'This account has been disabled.';
    if(/TOO_MANY_ATTEMPTS/.test(code)) return 'Too many attempts — wait a moment and try again.';
    if(/MISSING_PASSWORD|MISSING_EMAIL/.test(code)) return 'Enter both your email and password.';
    return 'Sign-in failed' + (code ? ' (' + code + ')' : '') + '.';

      if(r.status === 400 || r.status === 401 || r.status === 403){ clearGordonSession(); return null; }
      if(!r.ok) return Date.now() < s.idTokenExpiresAt ? s.idToken : null; // transient: keep a still-valid token
      s = GORDON_AUTH.parseRefresh(await r.json(), s, Date.now());
      saveGordonSession(s);
    }catch(e){
      return Date.now() < s.idTokenExpiresAt ? s.idToken : null; // offline
    }
  }
  return s.idToken;
}

async function gordonSignIn(email, password){
  const { url, options } = GORDON_AUTH.signInRequest(String(email||'').trim(), String(password||''), FB_API_KEY);
  const r = await fetch(url, options);
  const json = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(GORDON_AUTH.signInErrorMessage(json));
  const s = GORDON_AUTH.parseSignIn(json, Date.now());
  saveGordonSession(s);
  return s;
}

/**
 * Icon helper.
 *
 * Emoji were used as UI chrome until v8.9. They render differently on every
 * platform, cannot inherit color or state, and read as unfinished to anyone
 * who evaluates interfaces for a living. The replacement is a stroke-based
 * inline SVG sprite (<symbol> defs in index.html's body, referenced by <use>),
 * which costs no network request -- important, since the app ships as one
 * self-contained file and must work offline.
 *
 * Emoji that carry MEANING rather than chrome stay: the reward stars, the
 * celebration, and the example inside the chore-title placeholder. Those are
 * content, not controls.
 *
 * Accessibility: icons are decorative here -- every one sits beside a real
 * text label -- so they are aria-hidden and the label does the announcing.
 * The one exception is an icon-only control, which must pass a `title`.
 */

// Names must match a <symbol id="i-NAME"> in index.html's sprite. A test
// ("every icon referenced exists in the sprite") fails the build otherwise,
// because a typo would otherwise render a silent blank box.
function ico(name, opts){
  const o = opts || {};
  // An icon that carries its own accessible name IS the whole control, so it
  // needs no gap before a label. CSS :only-child cannot express this: it
  // ignores text-node siblings and would match every labelled button icon.
  const cls = 'ico' + (o.title ? ' ico-solo' : '') + (o.cls ? ' ' + o.cls : '');
  const style = o.size ? ` style="width:${o.size}px;height:${o.size}px"` : '';
  // An icon-only button needs an accessible name; a labelled one must stay
  // silent so screen readers do not announce the same thing twice.
  const a11y = o.title
    ? ` role="img" aria-label="${String(o.title).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}"`
    : ' aria-hidden="true"';
  return `<svg class="${cls}"${style}${a11y}><use href="#i-${name}"/></svg>`;
}

/**
 * Swipe navigation between the main tabs.
 *
 * Design constraints, each for a reason:
 *
 * 1. EDGE ZONES ARE NOT OURS. An installed iOS web app keeps Safari's native
 *    edge-swipe back/forward gesture, and there is no reliable way to disable
 *    it from web code. So a gesture starting within EDGE px of either side is
 *    ignored outright and left to the OS -- otherwise both fire and the app
 *    appears to jump two screens.
 *
 * 2. NEVER preventDefault. We cannot win against the OS gesture, and calling
 *    it would only break vertical scrolling. Listeners are passive, which also
 *    keeps scrolling off the main thread.
 *
 * 3. HORIZONTAL DOMINANCE. A gesture must be clearly sideways (|dx| well over
 *    |dy|) or every slightly-slanted scroll flings the user to another tab.
 *
 * 4. NOT THE ONLY WAY. The tab bar still does everything swiping does --
 *    required by WCAG 2.5.1 (Pointer Gestures), which says a path-based
 *    gesture must have a single-pointer alternative.
 *
 * The decision is a pure function (`swipeIntent`) so it can be tested without
 * a browser; the DOM wiring below it is deliberately thin.
 */

// Tuned for a 390-430px phone. MIN_DIST is far enough that a tap-drag or a
// scroll wobble cannot reach it, close enough to feel light.
const SWIPE = {
  EDGE: 28,        // px from either side that belongs to the OS gesture
  MIN_DIST: 60,    // px of horizontal travel before it counts
  RATIO: 1.7,      // |dx| must exceed |dy| by this much
  MAX_MS: 800,     // slower than this is a drag, not a swipe
  MAX_OFF: 90,     // and it must not wander this far vertically
};

/**
 * Decide what a finished gesture meant.
 * @returns 'next' (swipe left), 'prev' (swipe right), or null.
 */
function swipeIntent(g){
  const { dx, dy, ms, startX, width } = g;
  // The OS owns the edges. Checked first: an edge gesture is never ours, no
  // matter how clean it looks.
  if(startX <= SWIPE.EDGE || startX >= width - SWIPE.EDGE) return null;
  if(ms > SWIPE.MAX_MS) return null;
  if(Math.abs(dy) > SWIPE.MAX_OFF) return null;
  if(Math.abs(dx) < SWIPE.MIN_DIST) return null;
  if(Math.abs(dx) < Math.abs(dy) * SWIPE.RATIO) return null;
  return dx < 0 ? 'next' : 'prev';
}

/**
 * Should a gesture starting on this element be ignored?
 * Text selection, form fields, and anything the user is scrolling sideways
 * on its own (the person/filter chip bar) all outrank tab switching.
 */
function startsOnSomethingElse(el){
  for(let n = el; n && n.closest; n = n.parentElement){
    if(n.matches && n.matches('input,textarea,select,[contenteditable="true"]')) return true;
    // A horizontally scrollable strip owns sideways gestures that start on it.
    if(n.scrollWidth && n.clientWidth && n.scrollWidth > n.clientWidth + 4){
      const st = (typeof getComputedStyle === 'function') ? getComputedStyle(n).overflowX : '';
      if(st === 'auto' || st === 'scroll') return true;
    }
  }
  return false;
}

// The only classes an AI capability may have. Adding one is a deliberate act
// with a test to update, which is the point.
const RISK = {

  // user can check, because answers cite what they were based on.
  READ: 'read',
  // Produces a DRAFT. It reaches the user's data only after they review and
  // accept it in the existing review screen. Worst case: wasted taps.

  // to do and getting an explicit yes, and every change is undoable. Added in
  // v9.14, when the assistant gained the ability to tick things off, edit and
  // delete. It is NOT "acts on its own": the consent is the whole class.

  // No model involved at all -- plain, deterministic code. Listed here so the
  // app can be honest that it is NOT AI, which is its own kind of
  // transparency, and so the capability list is complete.

/**

function registryProblems(){

  for(const a of AI_ACTIONS){
    if(!a.id || seen.has(a.id)) problems.push(`duplicate or missing id: ${a.id}`);
    seen.add(a.id);
    if(!ALL_RISKS.has(a.risk)) problems.push(`${a.id}: unknown risk class "${a.risk}"`);

    }

    if(a.risk !== RISK.DERIVE && String(a.cannot).length < 40){

/**
 * Clash and deadline detection. Pure, deterministic, NO MODEL INVOLVED.
 *
 * This file is the argument that knowing where *not* to put AI is part of
 * integrating it well.
 *
 * "Do these two events overlap?" is arithmetic. It has one exact answer.
 * Routing it through a language model would add latency, cost, a network
 * dependency and non-determinism to a question that needs none of them — and
 * would introduce the possibility of being wrong about something that cannot
 * be wrong. So this is ordinary code: it runs offline, instantly, free, and
 * a test can prove it correct.
 *
 * It is still listed in the AI capability registry (as class `derive`) so the
 * app can tell the user plainly that this particular help is NOT AI. That is
 * its own kind of transparency, and it is what HAX G2 ("make clear how well
 * the system can do what it can do") looks like when the honest answer is
 * "perfectly, because it isn't guessing".
 */

const clashMinutes = (hhmm) => {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
  if(!m) return null;
  const h = Number(m[1]), mi = Number(m[2]);
  if(h > 23 || mi > 59) return null;
  return h * 60 + mi;
};

// An event with a start but no end is treated as this long when checking for
// an overlap. A school event with no stated end is realistically an hour;
// assuming zero would report no clashes at all, and assuming all day would
// report clashes constantly. Both failure modes are worse than one hour.
const ASSUMED_MINUTES = 60;

function clashSpan(e){
  const start = clashMinutes(e.time);
  if(start === null) return null;                 // all-day: not a time clash
  const end = clashMinutes(e.endTime);
  return { start, end: (end !== null && end > start) ? end : start + ASSUMED_MINUTES };
}

/**
 * Two events clash when they are on the same day and their times overlap.
 * Touching endpoints (one ends exactly as the other starts) do NOT clash --
 * back-to-back is normal family life, not a problem to warn about.
 */
function eventsClash(a, b){
  if(!a || !b || a.date !== b.date) return false;
  if(a.deleted || b.deleted) return false;
  const A = clashSpan(a), B = clashSpan(b);
  if(!A || !B) return false;                      // an all-day item clashes with nothing
  return A.start < B.end && B.start < A.end;
}

/**
 * Find everything worth warning about, newest concern first.
 *
 * Deliberately conservative about what counts as a problem: an app that cries
 * wolf gets its warnings ignored, which is worse than not warning at all.
 * Only three things qualify.
 *
 * @param events  all events (deleted ones are skipped)
 * @param todayISO  reference date, injected so this stays pure and testable
 * @param opts.busyDayThreshold  how many items make a day "crowded"
 */
function findConflicts(events, todayISO, opts){
  const busyThreshold = (opts && opts.busyDayThreshold) || 4;
  const live = (events || []).filter(e => e && !e.deleted && e.date);
  const out = [];

  // 1. Overlapping times on the same day.
  const byDate = new Map();
  for(const e of live){
    if(!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  }
  const seenPair = new Set();
  for(const [date, list] of byDate){
    for(let i = 0; i < list.length; i++){
      for(let j = i + 1; j < list.length; j++){
        if(!eventsClash(list[i], list[j])) continue;
        const key = [list[i].id, list[j].id].sort().join('~');
        if(seenPair.has(key)) continue;
        seenPair.add(key);
        out.push({ type: 'overlap', date, events: [list[i], list[j]] });
      }
    }
  }

  // 2. A deadline that has quietly gone past without being dealt with.
  //    Only deadlines: a past *event* is simply over, and warning about it
  //    would be noise.
  for(const e of live){
    if(e.kind !== 'deadline') continue;
    if(e.date >= todayISO) continue;
    // `handled` is set by "Mark as handled" on the warning itself. Exported
    // (added to the calendar) also counts, but it is a poor proxy on its own:
    // a form can be submitted in real life without ever being exported, and
    // before v9.9 the app had no way to hear that. (This line previously also
    // checked `e.done`, a field NOTHING in the app ever set -- dead code that
    // implied a concept that did not exist.)
    if(e.exported || e.handled) continue;
    out.push({ type: 'missed-deadline', date: e.date, events: [e] });
  }

  // 3. A day that has become crowded. Upcoming only -- a busy day already
  //    survived is not information.
  for(const [date, list] of byDate){
    if(date < todayISO) continue;
    if(list.length < busyThreshold) continue;
    out.push({ type: 'busy-day', date, events: list.slice() });
  }

  // Soonest first, and within a date the more urgent kind first.
  const rank = { 'missed-deadline': 0, overlap: 1, 'busy-day': 2 };
  out.sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : rank[x.type] - rank[y.type]));
  return out;
}

/**
 * One plain sentence per conflict. Written here rather than generated, because
 * a fixed sentence is predictable, instant, translatable and cannot drift --
 * and because "two things overlap" does not need prose written for it.
 */
function describeConflict(c){
  const t = (e) => e.title || 'Untitled';
  if(c.type === 'overlap')          return `${t(c.events[0])} and ${t(c.events[1])} overlap`;
  if(c.type === 'missed-deadline')  return `${t(c.events[0])} was due and has not been dealt with`;
  if(c.type === 'busy-day')         return `${c.events.length} things on one day`;
  return '';
}

// How far each kind of question reaches. Deliberately small: a tight scope is
// faster, cheaper, more private, and gives the model less room to wander.
const SCOPES = {
  today:    { back: 0,  forward: 0,   label: 'today' },
  week:     { back: 0,  forward: 7,   label: 'the next 7 days' },
  fortnight:{ back: 0,  forward: 14,  label: 'the next 2 weeks' },
  month:    { back: 0,  forward: 31,  label: 'the next month' },
  recent:   { back: 30, forward: 0,   label: 'the last 30 days' },
  wide:     { back: 7,  forward: 90,  label: 'the next 3 months' },

// Namespaced deliberately: these are inlined into one global scope
// alongside the whole app, and a generic name like `iso` collides.
const ASK_DAY_MS = 86400000;
const askISODate = (d) => d.toISOString().slice(0, 10);

function askShiftDays(todayISO, days){
  const d = new Date(todayISO + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return askISODate(d);
}

function daysBetween(fromISO, toISO){
  return Math.round((Date.parse(toISO + 'T00:00:00Z') - Date.parse(fromISO + 'T00:00:00Z')) / ASK_DAY_MS);
}

/**
 * Which part of the app a question is about.
 *
 * Decided in code, not by the model, for the same reason the time scope is:
 * it decides what data leaves the device, and that must stay predictable and
 * auditable. Unrecognised wording means events, which is what the app is
 * mostly for -- and the model is told plainly when it cannot see something.
 */
function pickDomain(question){
  const q = String(question || '').toLowerCase();
  if(/\bchore|\bstar|\brout(ine|ines)\b|\btidy|\bmake (his|her|their) bed\b/.test(q)) return 'chores';
  if(/\blist\b|\blists\b|\bshopping|\bgrocer|\bbuy\b|\bpick up\b|\bcostco\b|\bstore\b/.test(q)) return 'lists';
  return 'events';
}

/**
 * Pick a scope from the wording of the question.
 *
 * Keyword matching rather than a model call, on purpose: choosing how much
 * data to send is a privacy decision, and a privacy decision should be
 * predictable and auditable, not delegated to a model. When the wording gives
 * no clue we widen rather than narrow -- a missing answer is more annoying
 * than a slightly larger prompt, and `wide` is still bounded.
 */
function pickScope(question){
  const q = String(question || '').toLowerCase();
  if(/\btoday\b|\btonight\b|\bthis evening\b/.test(q))          return 'today';
  if(/\byesterday\b|\blast week\b|\brecently\b|\bdid i\b|\bwas there\b/.test(q)) return 'recent';
  if(/\bthis week\b|\bthis weekend\b|\btomorrow\b|\bnext few days\b/.test(q))    return 'week';
  if(/\bnext week\b|\bfortnight\b|\btwo weeks\b/.test(q))        return 'fortnight';
  if(/\bthis month\b|\bnext month\b|\bcoming weeks\b/.test(q))   return 'month';
  return 'wide';
}

/**
 * The events a question is allowed to see.
 * Returns both the slice and the human-readable window, so the UI can tell the
 * user exactly what was looked at -- part of G11, and it makes an empty answer
 * explicable rather than mysterious.
 */
function scopeForQuestion(question, events, todayISO){
  const key = pickScope(question);
  const s = SCOPES[key];
  const from = askShiftDays(todayISO, -s.back);
  const to   = askShiftDays(todayISO, s.forward);
  const inWindow = (events || [])
    .filter(e => e && !e.deleted && e.date && e.date >= from && e.date <= to)
    .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  return { key, label: s.label, from, to, events: inWindow };
}

/**
 * Turn the scoped events into the compact block the model sees.
 *
 * Only the fields an answer could need. Notes are truncated: they are the
 * longest field and a question about *when* something is rarely needs the
 * full packing list. Every event carries a short id so the model can cite it
 * without repeating the title back.
 */
function buildAskContext(scope, people){
  const nameById = new Map((people || []).map(p => [p.id, p.name]));
  return scope.events.map((e, i) => {
    const who = (e.personIds || []).map(id => nameById.get(id)).filter(Boolean).join(', ');
    const rel = daysBetween(scope.from, e.date);
    const bits = [
      `[${i + 1}]`,
      e.date,
      e.time ? e.time + (e.endTime ? '-' + e.endTime : '') : 'all day',
      e.kind === 'deadline' ? 'DEADLINE' : 'event',
      e.title,
    ];
    if(who) bits.push(`for ${who}`);
    if(e.location) bits.push(`at ${e.location}`);
    if(e.notes) bits.push('— ' + String(e.notes).slice(0, 160));
    return { ref: i + 1, id: e.id, line: bits.join(' '), rel };
  });
}

/**
 * Chores as reference lines. Chores have no dates, so there is no time window
 * to apply -- the whole (non-deleted) set is small and goes as-is.
 */
function buildChoresContext(chores, people, balances){
  const nameById = new Map((people || []).map(p => [p.id, p.name]));
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const rows = (chores || []).filter(c => c && !c.deleted).map((c, i) => {
    const who = c.kidId ? (nameById.get(c.kidId) || 'someone') : 'anyone';
    const when = c.frequency === 'weekly'
      ? (String(c.daysOfWeek || '').split(',').filter(Boolean).map(d => DOW[Number(d)]).join(' ') || 'weekly')
      : 'every day';
    return { ref: i + 1, id: c.id,
      line: `[${i + 1}] ${c.title} — ${who}, ${when}, ${c.stars || 0} star${c.stars === 1 ? '' : 's'}` };
  });
  const stars = Object.entries(balances || {})
    .map(([id, n]) => `${nameById.get(id) || id}: ${n}`).join(', ');
  return { rows, extra: stars ? `Star balances — ${stars}` : '' };
}

/** Lists and their open items. Checked-off items are dropped: nobody asks
 *  what they have already bought. */
function buildListsContext(lists, items){
  const live = (lists || []).filter(l => l && !l.deleted);
  const rows = live.map((l, i) => {
    const open = (items || []).filter(it => it.listId === l.id && !it.deleted && !it.checked);
    return { ref: i + 1, id: l.id,
      line: `[${i + 1}] ${l.name} — ${open.length ? open.map(o => o.text).join(', ') : '(nothing open)'}` };
  });
  return { rows, extra: '' };
}

/**
 * What the model is told about answering. Kept as a constant so the rules are
 * reviewable in one place, and so the extraction benchmark can eventually
 * measure this prompt the same way it measures the extraction one.
 */
const ANSWER_CONTRACT = `You are answering a parent's question about their own family calendar.

Rules, in order of importance:

1. ANSWER ONLY FROM THE LIST. The numbered events below are everything you can see. If the answer is not in them, say plainly that you cannot see it in the range that was checked. Never fill a gap with something plausible.

2. CITE EVERY CLAIM. After each fact, put the reference number(s) it came from, like [2] or [1][4]. A statement with no reference is not allowed.

3. BE SHORT. Two or three sentences, or a short list. This is read on a phone, usually in a hurry.

4. DO NOT DO ARITHMETIC ON DATES. Each event already states its date and time; use them as given rather than working anything out.

5. NO ADVICE, NO ENCOURAGEMENT, NO OPINION. State what is there. If nothing is, say so.

6. STAY IN YOUR LANE. You can see only the section listed below — events, chores, or lists. If the question is about something not shown, say which section you were given and that the answer is not in it. Do not speculate about the rest of the app.

7. FOLLOW-UPS. Earlier questions and answers may be shown for context. Use them to understand what "it" or "that" refers to, but every fact still has to come from the numbered list and still needs its reference.`;

/**
 * Build the whole request: the right domain, the right window, and enough of
 * the conversation to resolve "it" and "that".
 *
 * `history` is the recent turns. Only the last two are sent -- HAX G12 says
 * remember recent interactions, but sending an ever-growing transcript would
 * quietly widen what leaves the device on every follow-up, which is exactly
 * what the scoping discipline exists to prevent.
 */
const HISTORY_TURNS = 2;

function buildAskPrompt(question, scope, people, todayISO, opts){
  const o = opts || {};
  const domain = o.domain || 'events';
  let heading, list, refs, extra = '';

  if(domain === 'chores'){
    const c = buildChoresContext(o.chores, people, o.balances);
    heading = 'CHORES'; refs = c.rows; extra = c.extra;
    list = c.rows.length ? c.rows.map(r => r.line).join('\n') : '(no chores set up)';
  } else if(domain === 'lists'){
    const c = buildListsContext(o.lists, o.listItems);
    heading = 'LISTS'; refs = c.rows;
    list = c.rows.length ? c.rows.map(r => r.line).join('\n') : '(no lists yet)';
  } else {
    refs = buildAskContext(scope, people);
    heading = 'EVENTS';
    list = refs.length ? refs.map(r => r.line).join('\n') : '(no events in this range)';
  }

  const window = domain === 'events'
    ? `You are looking at ${scope.label} (${scope.from} to ${scope.to}).`
    : `You are looking at the ${domain} section. It has no dates attached.`;

  const past = (o.history || []).slice(-HISTORY_TURNS)
    .map(t => `Earlier question: ${t.q}\nYour earlier answer: ${t.a}`).join('\n\n');

  return {
    domain,
    system: ANSWER_CONTRACT,
    user: `Today is ${todayISO}. ${window}
${past ? '\n' + past + '\n' : ''}
${heading}:
${list}
${extra ? '\n' + extra : ''}

QUESTION: ${question}`,
    refs,
  };
}

/**
 * Pull the [n] citations out of an answer and map them back to real events, so
 * the UI can show what was used rather than asking the user to trust it.
 * A citation pointing at nothing is dropped rather than displayed -- showing a
 * dangling reference would undermine the very thing citations are for.
 */
function citedEvents(answer, refs){
  const nums = new Set();
  // \d{1,2} capped this at 99. A wide scope really can emit more than that --
  // measured: 140 refs for "the next 3 months" on a busy calendar -- and every
  // citation above the 99th was silently dropped, so the answer displayed no
  // source for it (code review, verified by execution 28 Aug).
  for(const m of String(answer || '').matchAll(/\[(\d{1,3})\]/g)) nums.add(Number(m[1]));
  return (refs || []).filter(r => nums.has(r.ref));
}

function intentById(id){ return INTENTS.find(i => i.id === id) || null; }

/** Only ANSWER and NAVIGATE may run without the user agreeing first. */
function runsWithoutAsking(intent){
  return intent
    ? (intent.consequence === CONSEQUENCE.ANSWER || intent.consequence === CONSEQUENCE.NAVIGATE)
    : false;
}

/** Registry self-check, exported so the test suite can assert on it. */
function intentRegistryProblems(){
  const out = [];
  const seen = new Set();
  for(const i of INTENTS){
    if(!i.id || seen.has(i.id)) out.push(`duplicate or missing id: ${i.id}`);
    seen.add(i.id);
    if(!CLASSES.has(i.consequence)) out.push(`${i.id}: unknown consequence "${i.consequence}"`);
    if(!i.title) out.push(`${i.id}: no title`);
    if(!i.fallback) out.push(`${i.id}: no non-AI fallback`);
    if(!Array.isArray(i.examples) || !i.examples.length){
      // Examples are what the UI shows as chips. Without them the capability
      // is undiscoverable, which is the exact NN/g failure this design is
      // meant to avoid.
      if(i.id !== 'what_needs_doing') out.push(`${i.id}: no examples to show the user`);
    }
    // A destructive intent that is not CONFIRM could run without the user
    // agreeing. There is no legitimate reason for that combination to exist.
    if(i.destructive && i.consequence !== CONSEQUENCE.CONFIRM){
      out.push(`${i.id}: destructive but not a CONFIRM intent`);
    }
    for(const [name, spec] of Object.entries(i.params || {})){
      if(!TYPES.has(spec.type)) out.push(`${i.id}.${name}: unknown type "${spec.type}"`);
      if(spec.type === 'enum' && !Array.isArray(spec.values)) out.push(`${i.id}.${name}: enum with no values`);
    }
  }
  return out;
}

// ---------------------------------------------------------------------------
// Entity resolution. Apple's "queries": turn what the user said into the thing
// they meant. Deliberately NOT delegated to the model -- picking the wrong
// list and silently writing to it is precisely the failure that must not
// happen, and matching a name is something code does exactly.
// ---------------------------------------------------------------------------

const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

/**
 * @returns {status:'ok', match} | {status:'none'} | {status:'ambiguous', matches}
 *
 * Never returns a best guess. If two lists could be meant, the caller asks --
 * HAX G10, "scope services when in doubt".
 */
function resolveEntity(spoken, candidates, nameKey){
  const key = nameKey || 'name';
  const live = (candidates || []).filter(c => c && !c.deleted);
  const q = norm(spoken);
  if(!q) return { status:'none' };

  const exact = live.filter(c => norm(c[key]) === q);
  if(exact.length === 1) return { status:'ok', match: exact[0] };
  if(exact.length > 1)   return { status:'ambiguous', matches: exact };

  // Then containment either way, so "shopping" finds "Shopping list" and
  // "the Costco list" finds "Costco".
  const partial = live.filter(c => {
    const n = norm(c[key]);
    return n && (n.includes(q) || q.includes(n));
  });
  if(partial.length === 1) return { status:'ok', match: partial[0] };
  if(partial.length > 1)   return { status:'ambiguous', matches: partial };
  return { status:'none' };
}
