// EA on the review screen: ask Gordon to enrich the whole batch in place.
// Mirrors the chat flow but scoped to pendingEvents, with an inline preview +
// Apply/Cancel. Same computeBatchEnrichment + undo as the chat path.
// `draft` mirrors the textarea on every keystroke, and the textarea is re-emitted
// from it. Without that, render() -- which replaces #main wholesale
// (renderReview ends `m.innerHTML = html`) -- rebuilt the box EMPTY and threw
// away a half-typed question. Anything that re-renders the review screen did it:
// toggling an entry, tagging a person, a save-failure banner appearing. The Ask
// screen has always done this correctly (askState.draft); this box did not.
let reviewAsk = { busy:false, reply:'', preview:null, draft:'' };

async function runReviewAsk(){
  const el = document.getElementById('reviewAskQ');
  // The live node first, the mirror second: the node is the truth while it
  // exists, and the mirror is what survives a re-render that happened between
  // the keystroke and the tap.
  const q = String((el && el.value) || reviewAsk.draft || '').trim();
  if(!q || reviewAsk.busy || !pendingEvents.length) return;
  // Cleared BEFORE the busy render, exactly as runAsk does it -- the render on
  // the next line re-emits the box from `draft`, so clearing afterwards would
  // put the submitted question straight back into it.
  reviewAsk.draft = '';
  reviewAsk.busy = true; reviewAsk.reply = ''; reviewAsk.preview = null; render();
  try{
    const titles = pendingEvents.slice(0,8).map(e=>e.title||'untitled').join('; ');
    const batchCtx = `\n\nA batch of ${pendingEvents.length} draft entr${pendingEvents.length===1?'y':'ies'} is under review (titles: ${titles}). "these", "all these", or "them" mean this batch — use enrich_batch.`;
    const turnText = await callAI(
      [{ type:'text', text:`Today is ${todayISO()}.${batchCtx}\n\nUser: ${q}` }],
      500, buildAssistantPrompt(assistantTone()), 'review.ask');
    const parsed = parseAssistantTurn(cleanModelText(turnText));
    if(parsed.ok && parsed.turn.kind === 'tool' && parsed.turn.intent === 'enrich_batch'){
      const route = validateRoute({ intent:'enrich_batch', params: parsed.turn.params,
        confidence: typeof parsed.turn.confidence === 'number' ? parsed.turn.confidence : 0.9 });
      if(route.ok){
        const preview = computeBatchEnrichment(pendingEvents, route.params);
        if(preview.count) reviewAsk.preview = preview;
        else reviewAsk.reply = 'Nothing to change — those entries already read that way.';
      } else {
        reviewAsk.reply = 'I could not turn that into a change to these entries.';
      }
    } else if(parsed.ok && (parsed.turn.kind === 'message' || parsed.turn.kind === 'clarify')){
      reviewAsk.reply = parsed.turn.kind === 'message' ? parsed.turn.text : parsed.turn.question;
    } else {
      reviewAsk.reply = 'Try something like "add band to the title of all these".';
    }
  }catch(err){
    reviewAsk.reply = (err && err.message === 'GORDON_AUTH_REQUIRED')
      ? 'Sign in to Gordon (Settings → Gordon and AI) to use this.'
      : ((err && err.message) || 'Something went wrong.');
  }
  reviewAsk.busy = false;
  if(el) el.value = '';
  render();
}

function applyReviewEnrich(){
  const pv = reviewAsk.preview;
  if(!pv) return;
  const undo = pv.changes.filter(c=>pendingEvents[c.index]).map(c=>({ index:c.index, field:c.field, before:pendingEvents[c.index][c.field] }));
  pv.changes.forEach(c=>{ if(pendingEvents[c.index]) pendingEvents[c.index][c.field] = c.after; });
  reviewAsk.preview = null;
  toast(`Applied "${pv.value}" to ${undo.length} entr${undo.length===1?'y':'ies'}`, { label:'Undo', fn:()=>{
    undo.forEach(u=>{ if(pendingEvents[u.index]) pendingEvents[u.index][u.field] = u.before; });
    render(); toast('Undone');
  }});
  render();
}

function cancelReviewEnrich(){ reviewAsk.preview = null; reviewAsk.reply = ''; render(); }

function renderReview(m){
  setHeader('Found Events', true);
  const kids = allPeople();
  const n = pendingEvents.filter(e=>e.selected).length;
  const dups = pendingEvents.filter(e=>e.dup).length;
  let html = '';
  if(lastEmailProblems.length){
    const probs = lastEmailProblems;
    const nRetry = probs.filter(p => p && p.retriable).length;
    html += `<div class="card" style="border-left:5px solid var(--amber)">
      <div class="row">
        <div class="grow" style="font-weight:800;font-size:var(--t-sm)">
          ${(() => {
            // The heading follows what is actually true right now. "couldn't be
            // read" stops being true the moment Gordon has read them, which is
            // the whole point of reading them without being asked.
            const nAll = probs.length;
            const nRead = probs.filter(p => p && p.msgId && emailReviews[p.msgId]).length;
            if(emailReviewBusy) return `${ico('sparkles')}${esc(aiName())} is reading ${nAll} email${nAll===1?'':'s'}…`;
            if(nRead >= nAll && nAll) return `${ico('mail')}${nAll} email${nAll===1?'':'s'} that didn’t import — here’s what they say`;
            if(nRead) return `${ico('mail')}${nRead} of ${nAll} read — here’s what they say`;
            return `${ico('alert')}${nAll} email${nAll===1?'':'s'} couldn’t be read`;
          })()}</div>
        <button class="linkbtn" aria-label="Close this box" onclick="closeEmailTrouble()">${ico('x')}</button>
      </div>
      ${emailAutoStop ? `<div class="meta" style="font-size:var(--t-cap);margin-top:4px;color:var(--amber)">${
          // One name for the model throughout (Gordon, never "your local
          // model"), and every line names the button rather than pointing at it.
          emailAutoStop === 'pdf'
            ? `Stopped at a PDF — ${esc(aiName())} can’t read those, so reading it would use your Anthropic key. Tap ${esc(reviewRestLabel())} to go on.`
          : emailAutoStop === 'paid'
            ? `Stopped — reading the rest fell to Anthropic, which uses your key. Tap ${esc(reviewRestLabel())} to go on.`
            : `Stopped partway — that one didn’t come back. Tap ${esc(reviewRestLabel())} to try again.`}</div>` : ''}
      ${(() => {
        // Distinct emails (one email can log several problems). If Gordon has reviewed
        // an email, show his brief; otherwise the plain subject + reason.
        const seen = new Set(); const rows = [];
        for(const p of probs){
          const key = p && p.msgId;
          if(key && seen.has(key)) continue;
          if(key) seen.add(key);
          const brief = key ? emailReviews[key] : null;
          if(brief){
            rows.push(`<div style="margin-top:3px;font-weight:600;font-size:var(--t-cap)">${esc(p.subject || brief.from || '(no subject)')}</div>${emailBriefHtml(brief)}`);
          } else {
            rows.push(`<div style="margin-top:3px">${esc(p.subject || '(no subject)')} — ${esc(p.retriable ? (p.reason || 'could not read it') : 'no dates to import')}</div>`);
          }
        }
        const shown = rows.slice(0, 8).join('');
        const more = rows.length > 8 ? `<div style="margin-top:3px">and ${rows.length-8} more</div>` : '';
        return `<div class="meta" style="font-size:var(--t-cap);margin-top:4px">${shown}${more}</div>`;
      })()}
      <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">
        ${(aiEnabled() && probs.some(p => p && p.msgId && !emailReviews[p.msgId]))
          ? `<button class="btn sm" ${emailReviewBusy?'disabled':''} onclick="reviewEmailTrouble()">${emailReviewBusy ? 'Reviewing…' : (Object.keys(emailReviews).length ? esc(reviewRestLabel()) : `${ico('sparkles')}${esc(reviewRestLabel())}`)}</button>`
          : ''}
        ${nRetry ? `<button class="btn sm" onclick="retryEmailTrouble()">Try ${nRetry===probs.length?'':nRetry+' '}again</button>` : ''}
        <button class="btn alt sm" style="width:auto" onclick="dismissAllEmailTrouble()">Dismiss ${probs.length === 1 ? 'this' : 'these ' + probs.length}</button>
      </div>
      <div class="help" style="font-size:11px;margin-top:6px">${Object.keys(emailReviews).length ? `${esc(aiName())} skims each email so you can see what it was — act, keep, or bin it. ` : ''}Also saved in your Problem Log (Settings → Diagnostics).</div>
    </div>`;
  }
  html += `<div class="help">Found ${pendingEvents.length} item${pendingEvents.length===1?'':'s'}. Tap to include or skip.${dups?` ${dups} already tracked (unchecked for you).`:''}</div>`;
  // Ask Gordon to enrich the whole batch — e.g. "add band to the title of all these".
  html += `<div class="card" style="margin-bottom:10px">
    <div class="formrow">
      <textarea id="reviewAskQ" rows="1" aria-label="Ask Gordon about these entries" spellcheck="true"
        placeholder="Ask Gordon… e.g. add band to the title of all these"
        autocapitalize="sentences" autocorrect="on" ${reviewAsk.busy?'disabled':''}
        style="min-height:44px;max-height:160px;resize:none;line-height:1.4;padding-top:11px"
        oninput="reviewAsk.draft=this.value;autogrow(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runReviewAsk()}">${esc(reviewAsk.draft)}</textarea>
      <button class="btn sm" ${reviewAsk.busy?'disabled':''} onclick="runReviewAsk()" style="align-self:flex-end">${reviewAsk.busy?'…':'Ask'}</button>
    </div>
    ${reviewAsk.reply ? `<div class="help" style="margin-top:6px">${esc(reviewAsk.reply)}</div>` : ''}
    ${reviewAsk.preview ? `<div class="notes" style="margin-top:6px">Add "${esc(reviewAsk.preview.value)}" to the ${reviewAsk.preview.field} of ${reviewAsk.preview.count} entr${reviewAsk.preview.count===1?'y':'ies'}.<br>Example: "${esc(reviewAsk.preview.changes[0].before||'(empty)')}" → "${esc(reviewAsk.preview.changes[0].after)}"</div>
      <div class="formrow" style="margin-top:6px">
        <button class="btn sm" onclick="applyReviewEnrich()">${reviewAsk.preview.scope==='selected'?'Apply to selected':'Apply to all'}</button>
        <button class="btn alt sm" style="width:auto" onclick="cancelReviewEnrich()">Cancel</button>
      </div>` : ''}
  </div>`;
  const people = allPeople();
  if(people.length>1){
    html += `<div style="margin-bottom:10px"><span class="label" style="margin-right:6px">Tag all with:</span>` +
      people.map(k=>`<span class="chip" onclick="tagAll('${k.id}')">${esc(k.name)}</span>`).join('') + `</div>`;
  }
  if(!kids.length) html += `<div class="help" style="font-style:italic">Tip: add people in Settings to tag events.</div>`;
  html += pendingEvents.map((e,i)=>`
    <div class="card ${e.selected?'':'dim'}" style="${e.selected?'border:2px solid var(--accent)':'border:2px solid transparent'}">
      <div class="row" onclick="toggleReview(${i})">
        <div class="check ${e.selected?'on':''}">${e.selected?'✓':''}</div>
        <div class="grow">
          <div class="row"><div class="title grow">${esc(e.title)}</div>
            ${e.dup?`<span class="kindtag" style="background:var(--red-lt);color:var(--red-accent)">TRACKED</span>`:''}
            <span class="kindtag ${e.kind}">${e.kind==='deadline'?'DEADLINE':'EVENT'}</span>
            <button class="linkbtn" style="padding:2px 4px" aria-label="Edit this event" onclick="event.stopPropagation();openPendingEdit(${i})">${ico('edit')}</button></div>
          <div class="meta">${friendly(e.date)}${e.time?' · '+fmtTimeRange(e):''}${e.location?' · '+esc(e.location):''}</div>
          ${e.notes?`<div class="notes">${esc(e.notes)}</div>`:''}
        </div>
      </div>
      ${e.from ? `<div class="meta" style="font-size:11px;opacity:.75">${ico('mail')}${esc(e.from)}</div>` : ''}
      ${e.selected && allPeople().length ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--divider)">
        <span class="label" style="margin-right:6px">Who:</span>` +
        allPeople().map(k=>`<span class="chip" style="${(e.personIds||[]).includes(k.id)?`background:${k.color};border-color:${k.color};color:var(--on-accent)`:''}"
          onclick="setReviewKid(${i},'${k.id}')">${esc(k.name)}</span>`).join('') + `</div>` : ''}
    </div>`).join('');
  html += `<div style="text-align:center"><button class="linkbtn" onclick="scanAnother()">${ico('plus')}Scan another page</button></div>
    <button class="btn fab" onclick="saveReview()">Track ${n} item${n===1?'':'s'}</button>
    ${pendingMsgIdsOf().length ? `<div style="text-align:center;margin-top:8px">
      <button class="linkbtn" onclick="dismissPendingEmail()">Skip all from this email</button></div>` : ''}
    <div style="height:70px"></div>`;
  m.innerHTML = html;
}
function toggleReview(i){ pendingEvents[i].selected = !pendingEvents[i].selected; render(); }
function setReviewKid(i, personId){
  const e = pendingEvents[i];
  if(!Array.isArray(e.personIds)) e.personIds = e.kidId ? [e.kidId] : [];
  const at = e.personIds.indexOf(personId);
  if(at >= 0) e.personIds.splice(at, 1); else e.personIds.push(personId);
  e.kidId = e.personIds[0] || null;      // keep a primary for any legacy reader
  render();
}
function tagAll(personId){
  pendingEvents.forEach(e=>{
    if(!e.selected) return;
    if(!Array.isArray(e.personIds)) e.personIds = e.kidId ? [e.kidId] : [];
    if(!e.personIds.includes(personId)) e.personIds.push(personId);
    e.kidId = e.personIds[0] || null;
  });
  render();
}
// Mark the current email batch handled without tracking anything from it.
function dismissPendingEmail(){
  const ids = pendingMsgIdsOf();
  if(ids.length){
    S.settings.seenMsgs = [...new Set((S.settings.seenMsgs||[]).concat(ids))].slice(-400);
  }
  save();
  toast('Skipped — these will not come back');
  pendingEvents = [];
  lastEmailProblems = [];
  scanContext = '';
  view = {tab:'events', sub:null, data:null};
  render();
}

function saveReview(){
  const chosen = pendingEvents.filter(e=>e.selected);
  if(!chosen.length){
    // Deselecting everything is a legitimate answer: "none of these". This used
    // to bail out before recording the message ids, so the same events came back
    // on every scan with no way to dismiss them.
    if(pendingMsgIdsOf().length){
      if(!confirm('Nothing is selected.\n\nSkip everything from this email? It will not be offered again.')) return;
      dismissPendingEmail();
      return;
    }
    alert('Tap the events you want to track, then save.');
    return;
  }
  for(const e of chosen){
    S.events.push({ id:uid(), title:e.title, date:e.date, time:e.time, location:e.location,
      kind:e.kind, notes:e.notes, endTime:(e.time?e.endTime:null)||null, personIds:(e.personIds||(e.kidId?[e.kidId]:[])), kidId:e.kidId||null, source:pendingSource, from:e.from||null, aiSource:e.aiSource||null, exported:false, unread:true, deleted:false });
  }
  // Only mark emails handled once they've actually been reviewed — abandoning
  // the screen leaves them in the queue for next time. Derived from the rows ON
  // SCREEN, and from ALL of them rather than only the ticked ones: reviewing an
  // email and choosing none of its events is still a review, and that email
  // should not come back. What it can no longer do is mark an email handled
  // because its row happened to be replaced by something else.
  const handled = pendingMsgIdsOf();
  if(handled.length){
    S.settings.seenMsgs = [...new Set((S.settings.seenMsgs||[]).concat(handled))].slice(-400);
  }
  save();
  toast(`Tracking ${chosen.length} item${chosen.length===1?'':'s'} — tap any event to add calendar alerts`);
  pendingEvents = [];
  lastEmailProblems = [];
  scanContext = '';
  view = {tab:'events', sub:null, data:null}; render();
}

// ---------- Event editing ----------
let eventForm = null;
function openEventEdit(id){
  const e = S.events.find(x=>x.id===id);
  const ids = Array.isArray(e.personIds) ? e.personIds.slice() : (e.kidId ? [e.kidId] : []);
  eventForm = { saved:true, ref:id, title:e.title, date:e.date, time:e.time||'', endTime:e.endTime||'',
    location:e.location||'', notes:e.notes||'', kind:e.kind, personIds:ids };
  sub('eventEdit');
}
/**
 * A blank event, typed by hand. The one path to an event that needs no AI.
 *
 * `isNew` is its own flag rather than a third value for `saved`, which is a
 * boolean the save and cancel handlers already branch on -- 'new' would be
 * truthy there and would look up an event id that does not exist.
 *
 * The date defaults to today because that is overwhelmingly what a hand-typed
 * event is for, and the field shows the value plainly so it cannot be saved
 * unnoticed. The validator still refuses an empty or malformed one.
 */
function openNewEvent(){
  eventForm = { isNew:true, saved:false, ref:null, title:'', date:todayISO(),
    time:'', endTime:'', location:'', notes:'', kind:'event', personIds:[] };
  sub('eventEdit');
}

function openPendingEdit(i){
  const e = pendingEvents[i];
  // Carry endTime AND personIds through the edit. The form + saveEventEdit read
  // f.endTime and f.personIds; this used to pass only kidId and no endTime, so
  // editing a scanned event before importing it silently dropped its end time
  // and its person assignment. Mirror openEventEdit's shape exactly.
  const ids = Array.isArray(e.personIds) ? e.personIds.slice() : (e.kidId ? [e.kidId] : []);
  eventForm = { saved:false, ref:i, title:e.title, date:e.date, time:e.time||'', endTime:e.endTime||'',
    location:e.location||'', notes:e.notes||'', kind:e.kind, personIds:ids };
  sub('eventEdit');
}
function renderEventEdit(m){
  // F5: every other screen gets its title through setHeader, which renders an
  // <h1>. This one wrote a bare text node, leaving the screen with no heading
  // at all.
  // Built by hand rather than via setHeader because Back must cancel the edit
  // rather than navigate. The Ask button is added explicitly so this is not
  // the one screen missing it.
  document.getElementById('header').innerHTML =
    `<button class="back" aria-label="Back" onclick="cancelEventEdit()">${ico('chevron-left')}</button>`
    + `<h1 class="htitle">${eventForm && eventForm.isNew ? 'New Event' : 'Edit Event'}</h1>`
    + (aiEnabled() && !S.__locked ? `<button class="headerbtn" aria-label="Ask ${esc(aiName())} a question"
        onclick="openAsk()">${ico('message')}</button>` : '');
  m.classList.add('isform');            // F3: room for Save to clear the tab bar
  const f = eventForm;
  const err = f.errors || {};
  const bad = (k) => err[k] ? ' class="bad"' : '';
  const errLine = (k) => err[k] ? `<span class="fielderr" id="err-${k}">${esc(err[k])}</span>` : '';
  const aria = (k) => err[k] ? ` aria-invalid="true" aria-describedby="err-${k}"` : '';

  m.innerHTML = `
    <label class="label" style="margin-top:0" for="efTitle">Title</label>
    <input type="text" id="efTitle"${bad('title')}${aria('title')} value="${esc(f.title)}">
    ${errLine('title')}

    <label class="label" for="efDate">Date</label>
    <input type="date" id="efDate"${bad('date')}${aria('date')} value="${esc(f.date)}">
    ${errLine('date')}

    <div class="label" id="lbl-times">Start and end <span class="opt">(optional)</span></div>
    <div class="fieldpair" role="group" aria-labelledby="lbl-times">
      <div><label class="label" style="margin:0 0 var(--s1)" for="efTime">Start</label>
        <input type="time" id="efTime" value="${esc(f.time)}"></div>
      <div><label class="label" style="margin:0 0 var(--s1)" for="efEnd">End</label>
        <input type="time" id="efEnd" value="${esc(f.endTime||'')}"></div>
    </div>
    <div class="help">Leave both blank for something with no set time. An end
      time is only kept if there is a start time.</div>

    <div class="label" id="lbl-type">Type</div>
    <div role="radiogroup" aria-labelledby="lbl-type">
      ${['event','deadline'].map(k => `<span class="chip ${f.kind===k?'on':''}"
        role="radio" aria-checked="${f.kind===k}" tabindex="0"
        onclick="setEventKind('${k}')"
        onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();setEventKind('${k}')}"
        >${k==='event'?'Event':'Deadline'}</span>`).join('')}
    </div>

    ${allPeople().length ? `<div class="label" id="lbl-who">Who <span class="opt">(tap all that apply)</span></div>
      <div role="group" aria-labelledby="lbl-who">
      <span class="chip ${!(f.personIds||[]).length?'on':''}"
        role="checkbox" aria-checked="${!(f.personIds||[]).length}" tabindex="0"
        onclick="clearEventPeople()"
        onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();clearEventPeople()}"
        >No one</span>` +
      allPeople().map(k=>{
        const on = (f.personIds||[]).includes(k.id);
        return `<span class="chip" role="checkbox" aria-checked="${on}" tabindex="0"
          style="${on?`background:${k.color};border-color:${k.color};color:var(--on-accent)`:''}"
          onclick="toggleEventPerson('${k.id}')"
          onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggleEventPerson('${k.id}')}"
          >${esc(k.name)}</span>`;
      }).join('') + `</div>` : ''}

    <label class="label" for="efLoc">Location <span class="opt">(optional)</span></label>
    <input type="text" id="efLoc" value="${esc(f.location)}">

    ${(function(){
      const ev = eventForm.ref ? (S.events.find(x=>x.id===eventForm.ref)||{}) : {};
      if(!ev.from && !ev.aiSource) return '';
      // F9: read-only provenance, deliberately not styled as a field label.
      return '<div class="metalabel">Came from</div><div class="help" style="margin-top:0">' +
        (ev.from ? esc(ev.from) : '') +
        (ev.aiSource ? '<br><span style="opacity:.75">read by ' + esc(ev.aiSource) + '</span>' : '') +
        '</div>';
    })()}

    <label class="label" for="efNotes">Notes <span class="opt">(optional)</span></label>
    <textarea id="efNotes" rows="5" style="min-height:110px">${esc(f.notes)}</textarea>

    <div style="height:14px"></div>
    <button class="btn" onclick="saveEventEdit()">Save changes</button>
    <div style="text-align:center;margin-top:8px"><button class="linkbtn" onclick="cancelEventEdit()">Cancel</button></div>`;
}

// Chips act as radios/checkboxes, so they need real handlers rather than
// inline state pokes -- and keyboard users need the same route.
function setEventKind(kind){ syncEventForm(); eventForm.kind = kind; render(); }
function clearEventPeople(){ syncEventForm(); eventForm.personIds = []; render(); }

function syncEventForm(){
  const g = id => document.getElementById(id);
  if(g('efTitle')) eventForm.title = g('efTitle').value;
  if(g('efDate')) eventForm.date = g('efDate').value;
  if(g('efTime')) eventForm.time = g('efTime').value;
  if(g('efEnd')) eventForm.endTime = g('efEnd').value || null;
  if(g('efLoc')) eventForm.location = g('efLoc').value;
  if(g('efNotes')) eventForm.notes = g('efNotes').value;
}
function toggleEventPerson(id){
  syncEventForm();
  if(!Array.isArray(eventForm.personIds)) eventForm.personIds = [];
  const at = eventForm.personIds.indexOf(id);
  if(at >= 0) eventForm.personIds.splice(at, 1); else eventForm.personIds.push(id);
  render();
}

// NN/g: an error must sit next to the field it is about, or the user has to
// memorise it. A blocking alert also has to be dismissed before they can
// even look at the form.
// Pulled out of saveEventEdit (v9.97) so it can be tested on its own:
// saveEventEdit opens with syncEventForm(), which overwrites the form from the
// live inputs, so a test calling it could only ever validate a blank form.
function eventFormErrors(f){
  const errors = {};
  if(!(f.title || '').trim()) errors.title = 'Give it a name so you can recognise it later.';
  if(!isRealDate(f.date)) errors.date = /^\d{4}-\d{2}-\d{2}$/.test(f.date || '')
    ? 'That date does not exist — check the day and month.'
    : 'Pick a date — an item with no date cannot be reminded about.';
  return errors;
}

function saveEventEdit(){
  syncEventForm();
  const f = eventForm;
  const errors = eventFormErrors(f);
  if(Object.keys(errors).length){
    f.errors = errors; render();
    const first = document.getElementById(errors.title ? 'efTitle' : 'efDate');
    if(first) try{ first.focus({ preventScroll:false }); }catch(e){ first.focus(); }
    return;
  }
  f.errors = null;
  const ids = Array.isArray(f.personIds) ? f.personIds : [];
  const fields = { title:f.title.trim(), date:f.date, time:f.time||null,
    endTime:(f.time && f.endTime)?f.endTime:null,
    location:(f.location||'').trim()||null, notes:(f.notes||'').trim()||null,
    kind:f.kind, personIds:ids, kidId:ids[0]||null };
  if(f.isNew){
    // The same shape the review flow writes (index.html's only other
    // S.events.push), so a hand-typed event is indistinguishable downstream --
    // reminders, conflict detection, calendar export and duplicate matching all
    // treat it identically. `source` says where it came from, and `aiSource` is
    // null because no model touched it.
    S.events.push(Object.assign({ id:uid(), source: f.fromEmail ? 'From email' : 'Typed in', from:null,
      aiSource:null, exported:false, unread:false, deleted:false }, fields));
    save();
    const fromEmail = f.fromEmail;
    eventForm = null;
    if(fromEmail){
      // Added from a review brief: clear that email and stay in Found Events so the
      // user keeps triaging the rest, rather than being kicked out to the events list.
      lastEmailProblems = lastEmailProblems.filter(p => !(p && p.msgId === fromEmail));
      if(emailReviews[fromEmail]) delete emailReviews[fromEmail];
      toast('Event added');
      sub('review');
    } else {
      view = {tab:'events', sub:null, data:null}; render();
      toast('Event added');
    }
  } else if(f.saved){
    const e = S.events.find(x=>x.id===f.ref);
    const timingChanged = e.date!==fields.date || (e.time||'')!==(f.time||'');
    Object.assign(e, fields);
    if(timingChanged && e.exported){ e.exported = false; }
    save();
    eventForm = null;
    view = {tab:'events', sub:null, data:null}; render();
    toast(timingChanged ? 'Event updated — re-add to calendar for new alerts' : 'Event updated');
  } else {
    Object.assign(pendingEvents[f.ref], fields);
    eventForm = null;
    sub('review');
  }
}
function cancelEventEdit(){
  // A new event has nothing to go back to -- there is no review queue behind
  // it -- so it returns to Events like a saved one does. EXCEPT one opened from a
  // review brief ("Add as event"), which came FROM the review and should return there.
  const fromReview = eventForm && eventForm.fromEmail;
  const toEvents = eventForm && (eventForm.saved || eventForm.isNew) && !fromReview;
  eventForm = null;
  if(fromReview){ sub('review'); }
  else if(toEvents){ view = {tab:'events', sub:null, data:null}; render(); }
  else sub('review');
}

// ---------- Chores tab ----------
let choreForm = null;
function choresForToday(){
  const dow = new Date().getDay();
  return S.chores.filter(c=>!c.deleted && (c.frequency==='daily' ||
    (c.daysOfWeek||'').split(',').filter(Boolean).map(Number).includes(dow)));
}
function completionFor(choreId, date){
  return S.completions.find(c=>c.choreId===choreId && c.date===date);
}
function starBalances(){
  // Start from stars carried forward when old history was pruned, so balances
  // survive pruning unchanged.
  const bal = Object.assign({}, S.settings.starCarry || {});
  // Both loops guard kidId and default stars. The redemptions line used to do
  // NEITHER, one line below a completions line that did both: a redemption with
  // no kidId wrote bal["undefined"], and one with no stars made the whole
  // balance NaN, which renders as 0 -- a real star total silently replaced by
  // zero on the most emotionally loaded number in the app.
  for(const c of S.completions){ if(c.kidId) bal[c.kidId]=(bal[c.kidId]||0)+(c.stars||0); }
  for(const r of S.redemptions){ if(r.kidId) bal[r.kidId]=(bal[r.kidId]||0)-(r.stars||0); }
  return bal;
}
function renderChores(m){
  setHeader('Chores & Routines', false);
  const kids = justKids();
  const chores = choresForToday();
  const bal = starBalances();
  const t = todayISO();
  let html = '';
  if(kids.length){
    html += `<div class="filterbar">` + kids.map(k=>
      `<span class="balance" style="border-color:${k.color}">
        <span style="color:${k.color}">${esc(k.name)}</span> ⭐ ${bal[k.id]||0}</span>`).join('') +
      `<button class="btn sm" style="border-radius:16px" onclick="sub('rewards')">${ico('gift')}Rewards</button></div>`;
  }
  const allDone = chores.length>0 && chores.every(c=>completionFor(c.id,t));
  if(allDone) html += `<div class="celebrate">🎉 All chores done today!</div>`;
  if(!chores.length){
    html += emptyState('check-circle', 'No chores due today',
      'Add daily routines or weekly chores — tag them to a kid and set star values.');
  } else {
    html += chores.map(c=>{
      const done = completionFor(c.id, t);
      const kid = c.kidId ? kidById(c.kidId) : null;
      const when = c.frequency==='weekly'
        ? (c.daysOfWeek||'').split(',').filter(Boolean).map(d=>DOW[Number(d)]).join(' ')
        : 'Every day';
      return `<div class="card row ${done?'dim':''}" onclick="toggleChore('${c.id}')" oncontextmenu="return delChore(event,'${c.id}')">
        <div class="check ${done?'on':''}">${done?'✓':''}</div>
        <div class="grow"><div class="title ${done?'strike':''}">${esc(c.title)}</div>
          <div class="meta">${kid?esc(kid.name):'Anyone'} · ${when}</div></div>
        ${c.stars>0?`<span style="font-size:12px">${'⭐'.repeat(Math.min(c.stars,5))}</span>`:''}
        <button class="linkbtn red" style="padding:4px" aria-label="Delete chore ${esc(c.title)}" onclick="event.stopPropagation();delChoreById('${c.id}')">${ico('x')}</button>
      </div>`;
    }).join('');
  }
  if(choreForm){

function toggleChore(id){
  const c = S.chores.find(x=>x.id===id);
  const t = todayISO();
  const done = completionFor(id, t);
  if(done){
    // An ordinary untick stays an instant, silent toggle -- ticking it back on
    // returns the stars, so nothing was destroyed. It is only destroyed once the
    // stars have been SPENT: the balance goes below zero, the reward is already
    // redeemed, and no screen in the app can explain why the number fell. That
    // is the one case worth a question, and it was the one case that had none.
    const stars = done.stars || 0;
    const kid = done.kidId ? kidById(done.kidId) : null;
    if(stars > 0 && kid){
      const after = (starBalances()[kid.id] || 0) - stars;
      if(after < 0 && !confirm(
        kid.name + ' has already spent ' + (stars === 1 ? 'this star' : 'these ' + stars + ' stars') +
        '.\n\nUnticking "' + ((c && c.title) || 'this chore') + '" puts them on ' + after + '. Continue?')) return;
    }
    S.completions = S.completions.filter(x=>x!==done);
    save(); render();
    return;
  }
  // "Anyone" chores with star value: ask who did it so the stars land somewhere
  if(!c.kidId && c.stars>0 && justKids().length){ askWhoDidChore(c); return; }
  completeChore(c, c.kidId);
}

// One implementation of the "who did it?" sheet. The assistant's confirm path
// needs the same question and used to reach it by calling toggleChore, which
// also UNticks -- see the complete_chore branch of confirmPendingAction.
function askWhoDidChore(c){
  showSheet(c.title, 'Who did it?',
    justKids().map(k=>({label:k.name, icon:'check-circle', fn:()=>completeChore(c, k.id)}))
      .concat([{label:'Just check it off (no stars)', fn:()=>completeChore(c, null)}]));
}
// A brief, dependency-free confetti burst for the moment a kid earns stars.
// Uses the Web Animations API (no library, no CSS), self-cleans, and honours
// prefers-reduced-motion (skips entirely). Purely decorative — never on the data
// path, wrapped so it can never break completing a chore.
function celebrateBurst(){
  try{
    if(typeof window === 'undefined' || typeof document === 'undefined') return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if(!document.body || !document.createElement('div').animate) return;
    const colors = ['#f59e0b','#10b981','#3b82f6','#ef4444','#a855f7','#ec4899'];
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
    for(let i=0;i<28;i++){
      const p = document.createElement('div');
      const size = 6 + Math.random()*6;
      p.style.cssText = 'position:absolute;top:-14px;left:'+(Math.random()*100)+'%;width:'+size+'px;height:'+(size*0.6)+'px;background:'+colors[i%colors.length]+';border-radius:1px';
      box.appendChild(p);
      p.animate([
        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:'translate('+((Math.random()-0.5)*160)+'px,'+(window.innerHeight+40)+'px) rotate('+(360+Math.random()*360)+'deg)', opacity:0.9 }
      ], { duration:900+Math.random()*700, easing:'cubic-bezier(.2,.6,.4,1)', delay:Math.random()*120 });
    }
    document.body.appendChild(box);
    setTimeout(function(){ box.remove(); }, 1900);
  }catch(e){ /* decoration must never break the action */ }
}

function completeChore(c, kidId){
  // The same-day guard lives HERE, not at the call sites. toggleChore checks
  // before it calls; the assistant path cannot -- performRoute checks at PROPOSE
  // time and the "yes" can land minutes later, after the chore was ticked in the
  // Chores tab. That gap pushed a SECOND completion row: starBalances summed
  // both while completionFor returned only the first, so one later untick left
  // the chore rendered as NOT done with the extra stars still counted, and no
  // screen in the app could explain the number. Reproduced before it was fixed.
  // A deterministic rule like this is checked in code, never left to the model.
  if(completionFor(c.id, todayISO())){
    toast(`"${c.title}" is already done today`);
    return false;
  }
  const row = { id:uid(), choreId:c.id, kidId:kidId||null, date:todayISO(), stars:kidId?(c.stars||0):0 };
  S.completions.push(row);
  // Undo removes the row THIS call pushed, by reference -- never "the completion
  // for this chore today", which after a second tap would be someone else's.
  const undo = { label:'Undo', fn:() => {
    S.completions = S.completions.filter(x => x !== row);
    save(); render();
    toast('Put back — not done');
  }};
  if(kidId && c.stars>0){
    const kid = kidById(kidId);
    if(kid) toast(`⭐ ${kid.name} earned ${c.stars} star${c.stars>1?'s':''} — now at ${starBalances()[kid.id]||0}`, undo);
    celebrateBurst();   // a little confetti for the kid — reduced-motion aware
  } else {
    // The starless tick used to say nothing at all. In the Chores tab a second
    // tap undoes it, but the assistant path has no second tap -- Gordon changed
    // the day's state and reported it in silence.
    toast(`Checked off "${c.title}"`, undo);
  }
  save(); render();
  return true;
}
function delChoreById(id){
  const c = S.chores.find(x=>x.id===id);
  return c ? softDelete('chores', id, '"' + c.title + '"') : null;  // past stars are kept either way

function redeem(id){
  const r = S.rewards.find(x=>x.id===id);
  const kids = justKids();
  if(!kids.length){ alert('Add kids in Settings first.'); return; }
  const bal = starBalances();
  showSheet(`Redeem "${r.title}"`, `Costs ⭐ ${r.cost} — who is redeeming?`,
    kids.map(k=>({label:`${k.name} (⭐ ${bal[k.id]||0})`, fn:()=>{
      const has = bal[k.id]||0;
      if(has < r.cost){ alert(`${k.name} has ${has} of ${r.cost} stars needed. Keep going!`); return; }
      const rid = uid();
      // `at` alongside `date` (v9.99): the ledger's Undo needs to know HOW LONG
      // AGO, and a date alone cannot say -- the same "today" is 5 minutes at
      // 00:05 and 23 hours at 23:00. `date` is untouched because pruneData,
      // starBalances and the ledger's sort all read it.
      S.redemptions.push({id:rid, rewardId:r.id, kidId:k.id, stars:r.cost,
        date:todayISO(), at:new Date().toISOString()});
      save(); render();
      // Spending a kid's hard-earned stars is exactly the mis-tap that needs an
      // Undo — every other data change in the app is reversible, this one wasn't.
      toast(`🎁 ${k.name} traded ${r.cost} stars for "${r.title}". Enjoy!`, {
        label: 'Undo',
        fn: () => {
          S.redemptions = S.redemptions.filter(x => x.id !== rid);
          save(); render();
          toast(`Refunded ${r.cost} ⭐ to ${k.name}`);
        }
      });
    }})));
}

// ---------- Star ledger ----------
/**
 * Is this redemption still undoable from Star History?
 *
 * The toast Undo lasts seven seconds, which is fine for a mis-tap noticed at
 * once and no use at all for one noticed over dinner. A value-bearing action
 * needs a route back that does not expire while you are looking away
 * (DELETE-HONESTY-PLAN section 3.2), so the ledger carries the same undo for a
 * day.
 *
 * Rows written before v9.99 have no `at`. They fall back to "redeemed today",
 * which is the most the stored data can honestly support -- not a 24-hour
 * window dressed up from a date.
 */
const REDEEM_UNDO_HOURS = 24;
function canUndoRedemption(r){
  if(!r) return false;
  if(r.at){
    const t = Date.parse(r.at);
    if(!isNaN(t)) return (Date.now() - t) < REDEEM_UNDO_HOURS * 3600 * 1000;
  }
  return !!r.date && r.date === todayISO();
}

/**
 * Give the stars back. The row is removed rather than flagged, because that is
 * what redeem's own toast Undo has always done and two shapes of undone
 * redemption would be two things starBalances has to agree about.
 */
function undoRedemption(id){
  const r = S.redemptions.find(x => x.id === id);
  if(!r) return;
  if(!canUndoRedemption(r)){
    // Reachable: the screen can be open past the boundary. Say why rather than
    // doing nothing, and rather than quietly doing it anyway.
    toast('That was more than a day ago — it stays on the record');
    render();
    return;
  }
  const kid = kidById(r.kidId);
  S.redemptions = S.redemptions.filter(x => x.id !== r.id);
  save(); render();
  toast(`Refunded ${r.stars||0} ⭐${kid ? ' to ' + kid.name : ''}`, {
    label:'Undo',
    fn: () => { S.redemptions.push(r); save(); render(); toast('Redeemed again'); }
  });
}

let ledgerKid = null;
function renderLedger(m){
  setHeader('Star History', true);
  const kids = justKids();
  const choreById = {}; S.chores.forEach(c=>choreById[c.id]=c);
  const rewardById = {}; S.rewards.forEach(r=>rewardById[r.id]=r);
  let entries = [];
  for(const c of S.completions){
    if(c.kidId && c.stars>0)
      entries.push({date:c.date, kidId:c.kidId, label:(choreById[c.choreId]||{}).title||'Chore', delta:c.stars});
  }
  for(const r of S.redemptions){
    entries.push({date:r.date||'', kidId:r.kidId, label:(rewardById[r.rewardId]||{}).title||'Reward',
      delta:-r.stars, rid:r.id, undoable:canUndoRedemption(r)});
  }
  if(ledgerKid) entries = entries.filter(e=>e.kidId===ledgerKid);
  entries.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  let html = '';
  if(kids.length>1){
    html += `<div class="filterbar">
      <span class="chip ${ledgerKid===null?'on':''}" onclick="setLedgerKid(null)">All</span>` +
      kids.map(k=>`<span class="chip" style="${ledgerKid===k.id?`background:${k.color};border-color:${k.color};color:var(--on-accent)`:''}"
        onclick="setLedgerKid('${k.id}')">${esc(k.name)}</span>`).join('') + `</div>`;
  }
  if(!entries.length){
    html += `<div class="empty"><div class="eb">No star activity yet — stars show up here as chores get checked off.</div></div>`;
  } else {
    html += entries.slice(0,200).map(e=>{
      const kid = kidById(e.kidId);
      // The label names WHAT is being undone. A row of identical "Undo" buttons
      // is unusable with a screen reader, and the audit checks the name that
      // actually computes, not the markup.
      const undo = e.undoable
        ? `<button class="btn sm alt" onclick="undoRedemption('${esc(e.rid)}')"
             aria-label="Undo redeeming ${esc(e.label)}${kid?' for '+esc(kid.name):''}">Undo</button>`
        : '';
      return `<div class="card row" style="padding:12px">
        <div class="grow"><div style="font-weight:600;font-size:14px">${esc(e.label)}</div>
          <div class="meta" style="font-size:12px">${kid?esc(kid.name)+' · ':''}${e.date?friendly(e.date):'—'}</div></div>
        <span style="font-weight:800;color:${e.delta>0?'var(--accent)':'var(--red-accent)'}">${e.delta>0?'+':''}${e.delta} ⭐</span>
        ${undo}
      </div>`;
    }).join('');
  }
  m.innerHTML = html;
}

/**
 * Text a person has typed but not yet submitted.
 *
 * render() replaces #main wholesale -- every render function ends
 * `m.innerHTML = html` -- so an input whose value lives ONLY in the real DOM is
 * rebuilt empty and the typing is gone. Anything that re-renders does it:
 * ticking an item off, tagging a person, a save-failure banner appearing, the
 * quiet email check finishing.
 *
 * Found by tools/browser-check.js on its first run: typing an item and then
 * tapping another item to tick it off discarded the half-typed one. The vm
 * suite reported 851 passed on that same build, because its getElementById
 * hands back a fresh stub per call and can never see an input's value.
 *
 * Keyed by element id so there is one mechanism rather than nine variables.
 * Deliberately NOT on S: a half-finished edit is not the user's data and must
 * never be saved or ride along in a backup. #apiKey and #gordonPassword are
 * excluded on purpose -- echoing a secret back into the markup is not a fix.
 */
let drafts = {};
function draft(id){ return drafts[id] || ''; }
function setDraft(id, v){ drafts[id] = v; }
function clearDraft(id){ delete drafts[id]; }

// View state only. A half-finished edit is not the user's data and must never
// be written by save() or ride along in a backup -- so it lives here, not on S.
let listEditId = null;
let listRenameId = null;

function editItem(id){ listEditId = id; listRenameId = null; render(); focusEditBox('editItem'); }
function cancelItemEdit(){ listEditId = null; render(); }

/**
 * Commit a rename. An EMPTY field cancels rather than deletes: clearing the box
 * and tapping Save would otherwise destroy the text with no undo, and "delete"
 * already has its own labelled control right beside it.
 */
function saveItemEdit(id){
  const box = document.getElementById('editItem');
  const t = box ? box.value.trim() : '';
  const i = S.listItems.find(x => x.id === id);
  if(i && t && t !== i.text){ i.text = t; save(); }
  listEditId = null;
  render();
}

// The app's existing soft delete, so this is undoable and prunes normally.
// A new deletion path here would be a second source of truth for "removed".
function delItem(id){
  const i = S.listItems.find(x => x.id === id);
  listEditId = null;
  return i ? softDelete('listItems', id, '"' + i.text + '"') : (render(), null);
}

function renameList(id){ listRenameId = id; listEditId = null; render(); focusEditBox('renameList'); }
function cancelListRename(){ listRenameId = null; render(); }
function saveListRename(id){
  const box = document.getElementById('renameList');
  const t = box ? box.value.trim() : '';
  const l = S.lists.find(x => x.id === id);
  if(l && t && t !== l.name){ l.name = t; save(); }
  listRenameId = null;
  render();
}

// render() replaces #main, so the field only exists after it returns. Putting
// the caret at the END rather than selecting all means a small correction does
// not require retyping the whole line.
function focusEditBox(id){
  const box = document.getElementById(id);
  if(!box) return;
  box.focus();
  try{ box.setSelectionRange(box.value.length, box.value.length); }catch(e){ /* no selection API on this input type; the text is in, only the caret moved */ }
}

function toggleItem(id){
  const i = S.listItems.find(x=>x.id===id);
  i.checked = !i.checked; save(); render();
}
function clearChecked(listId){
  // Was silent: a finished shopping list vanished with no count and no undo,
  // while delItem right above it has offered both since softDelete existed.
  const hit = S.listItems.filter(i => i.listId === listId && i.checked && !i.deleted);
  hit.forEach(i => markDeleted(i));
  save(); render();
  if(!hit.length){ toast('Nothing was ticked off'); return; }
  toast('Cleared ' + hit.length + ' ticked item' + (hit.length===1?'':'s'), {
    label:'Undo',
    fn: () => {
      hit.forEach(i => unmarkDeleted(i));
      save(); render();
      toast('Put them back');
    }
  });
}

// ---------- Notes (v9.60) ----------
// Shaped like Lists on purpose: a board of cards, tap to open, one input at the
// top to add. See tools/wire-notes.py for what was taken from Keep and Apple
// Notes and, more importantly, what was deliberately left out.

let noteSearch = '';
let noteSaveTimer = null;

/**
 * What the board and the header call a note.
 *
 * Keep gives a note a dedicated title line; Apple Notes derives one from the
 * first line of the body. Doing BOTH means quick capture needs no title at all
 * and the board still reads properly -- an explicit title wins when there is
 * one, otherwise the first non-empty body line stands in.
 */
function noteTitleOf(n){
  const t = String((n && n.title) || '').trim();
  if(t) return t;
  const first = String((n && n.body) || '').split('\n').map(s => s.trim()).find(Boolean);
  return first || 'Untitled note';
}
function notePreviewOf(n){
  const body = String((n && n.body) || '');
  const lines = body.split('\n').map(s => s.trim()).filter(Boolean);
  // If the title was borrowed from line one, previewing line one again would
  // print the same words twice.
  const rest = (n && String(n.title || '').trim()) ? lines : lines.slice(1);
  return rest.join(' ').slice(0, 120);
}
function liveNotes(){ return (S.notes || []).filter(n => !n.deleted); }
function boardNotes(){ return liveNotes().filter(n => !n.archived); }
function archivedNotes(){ return liveNotes().filter(n => n.archived); }

// ---- checklists, stored as lines in the body -----------------------------
// "- [ ] thing" / "- [x] thing", the markdown every notes app that uses text
// already understands. Leading whitespace is allowed and preserved.
const CHECK_LINE = /^(\s*)-\s\[( |x|X)\]\s?(.*)$/;

function noteChecklist(n){
  const out = [];
  String((n && n.body) || '').split('\n').forEach((line, i) => {
    const m = line.match(CHECK_LINE);
    if(m) out.push({ index:i, done: m[2].toLowerCase() === 'x', text: m[3] });
  });
  return out;
}
function noteCheckProgress(n){
  const items = noteChecklist(n);
  if(!items.length) return null;
  return { done: items.filter(i => i.done).length, total: items.length };
}

/**
 * Flip one checkbox, by LINE INDEX, touching nothing else.
 *
 * Rewriting the whole body from a parsed model would silently reformat
 * everything around the item -- indentation, blank lines, the paragraph above
 * it. This replaces exactly one line's marker and leaves its text, its leading
 * whitespace and every other line byte-identical.
 */
function toggleNoteCheck(noteId, lineIndex){
  const n = (S.notes || []).find(x => x.id === noteId);
  if(!n) return;
  const lines = String(n.body || '').split('\n');
  const line = lines[lineIndex];
  if(line === undefined) return;
  const m = line.match(CHECK_LINE);
  if(!m) return;                       // the body moved under us; change nothing
  lines[lineIndex] = m[1] + '- [' + (m[2].toLowerCase() === 'x' ? ' ' : 'x') + '] ' + m[3];
  n.body = lines.join('\n');
  n.updated = new Date().toISOString();
  save();
  renderNoteDetail(document.getElementById('main'));
}

/** Append an empty checkbox line and put the caret in the body after it. */
function addNoteCheckItem(noteId){
  const n = (S.notes || []).find(x => x.id === noteId);
  if(!n) return;
  flushNote();                         // do not let a pending autosave overwrite this
  const body = String(n.body || '');
  n.body = body + (body && !body.endsWith('\n') ? '\n' : '') + '- [ ] ';
  n.updated = new Date().toISOString();
  save();
  renderNoteDetail(document.getElementById('main'));
  const b = document.getElementById('noteBody');
  if(b){ b.focus(); try{ b.setSelectionRange(b.value.length, b.value.length); }catch(e){ /* no selection API on this input type; the line is added either way */ } }
}

// ---- sort -----------------------------------------------------------------
// A SAVED setting, not view state: Apple and Samsung both treat sort order as a
// preference rather than something you re-choose each visit.
const NOTE_SORTS = [
  { key:'edited',  label:'Last edited' },
  { key:'created', label:'Date added' },
  { key:'title',   label:'Title' },
];
function noteSort(){
  const k = S.settings && S.settings.noteSort;
  return NOTE_SORTS.some(s => s.key === k) ? k : 'edited';
}
function setNoteSort(k){
  S.settings.noteSort = NOTE_SORTS.some(s => s.key === k) ? k : 'edited';
  save(); render();
}
function noteSorter(){
  const k = noteSort();
  if(k === 'created') return (a, b) => String(b.created || '').localeCompare(String(a.created || ''));
  if(k === 'title') return (a, b) => noteTitleOf(a).toLowerCase().localeCompare(noteTitleOf(b).toLowerCase());
  return (a, b) => String(b.updated || '').localeCompare(String(a.updated || ''));
}

// ---- archive --------------------------------------------------------------
/**
 * A third state, between "on the board" and "deleted".
 *
 * Delete keeps its own flag and its own undo; this one only takes a note off
 * the board. Nothing is destroyed, so the toast offers a way back rather than
 * a warning -- the note is exactly where you left it, behind a count.
 */
function toggleArchiveNote(id){
  const n = (S.notes || []).find(x => x.id === id);
  if(!n) return;
  n.archived = !n.archived;
  n.updated = new Date().toISOString();
  save(); render();
  toast(n.archived ? 'Archived' : 'Back on the board',
    { label:'Undo', fn:() => { n.archived = !n.archived; save(); render(); } });
}

// ---- colour ---------------------------------------------------------------
// KID_COLORS, not a second palette: one set of accent colours in the app, and a
// note tinted like a person reads as related to them rather than as a clash.
function setNoteColor(id, color){
  const n = (S.notes || []).find(x => x.id === id);
  if(!n) return;
  n.color = KID_COLORS.includes(color) ? color : '';
  n.updated = new Date().toISOString();
  save();
  renderNoteDetail(document.getElementById('main'));
}

// ---- folders (one per note) and labels (many per note) --------------------
// Two collections, one shape, so every helper below is written once and reads
// which one it is working on. `coll` is 'noteFolders' or 'noteLabels'.
function noteFolders(){ return (S.noteFolders || []).filter(f => !f.deleted); }
function noteLabels(){ return (S.noteLabels || []).filter(l => !l.deleted); }
function noteFolderName(id){
  const f = (S.noteFolders || []).find(x => x.id === id);
  return f && !f.deleted ? f.name : '';
}
function noteLabelsOf(n){
  const ids = (n && n.labelIds) || [];
  return noteLabels().filter(l => ids.includes(l.id));
}

/**
 * Add a folder or a label. Returns the row, or the EXISTING row when the name
 * is already taken -- case- and space-insensitively.
 *
 * Silently reusing rather than creating a near-duplicate is the one mitigation
 * that matters for the failure mode every long-term tag user reports: "school"
 * and "School " sitting side by side, splitting a group in half. Nothing else
 * in the app can prevent that, because nothing else sees both names at once.
 */
function addNoteGroup(coll, name){
  const clean = String(name || '').trim().slice(0, 40);
  if(!clean) return null;
  if(!Array.isArray(S[coll])) S[coll] = [];
  const key = clean.toLowerCase();
  const dup = S[coll].find(x => String(x.name || '').trim().toLowerCase() === key);
  if(dup){
    if(dup.deleted){
      // A re-add already revived the ROW (same id, so anything still pointing
      // at it lines up). Reviving it without its notes was a half-restore, and
      // it was the app's own documented way back. Same rule now as Recently
      // Deleted: revival is revival.
      unmarkDeleted(dup);
      relinkNoteGroup(coll, dup);
      save();
    }
    return dup;
  }
  const row = { id:uid(), name:clean, deleted:false };
  S[coll].push(row);
  save();
  return row;
}
/**
 * Put a revived folder's or label's notes back into it. Returns how many.
 *
 * Two things it deliberately will NOT do, because a restore that overrides a
 * later decision is not a restore:
 *   - it never touches a note that has since been DELETED;
 *   - for a folder, it only re-files notes that are still Unfiled. If you moved
 *     one into "Sports" after the folder went, it stays in Sports.
 * For a label it just adds the label back, which cannot displace anything --
 * a note carries as many labels as it likes.
 */
function relinkNoteGroup(coll, row){
  if(!row || !Array.isArray(row.heldNoteIds)) return 0;
  const isFolder = coll === 'noteFolders';
  let n = 0;
  row.heldNoteIds.forEach(nid => {
    const note = (S.notes || []).find(x => x.id === nid);
    if(!note || note.deleted) return;
    if(isFolder){
      if(note.folderId) return;          // moved somewhere else since; leave it
      note.folderId = row.id; n++;
    } else {
      if(!Array.isArray(note.labelIds)) note.labelIds = [];
      if(note.labelIds.includes(row.id)) return;
      note.labelIds.push(row.id); n++;
    }
  });
  delete row.heldNoteIds;
  return n;
}

function renameNoteGroup(coll, id, name){
  const clean = String(name || '').trim().slice(0, 40);
  const row = (S[coll] || []).find(x => x.id === id);
  if(!row || !clean) return false;    // an empty rename CANCELS; it never blanks
  row.name = clean;
  save();
  return true;
}

/**
 * Remove a folder or a label WITHOUT removing anything it contained.
 *
 * A folder delete puts its notes back to Unfiled; a label delete drops the id.
 * Neither touches n.deleted -- deleting a container must never turn out to have
 * meant "and everything in it" (CLAUDE.md rule 26, read forwards). The undo
 * restores both the row and every note's membership.
 */
function delNoteGroup(coll, id){
  const row = (S[coll] || []).find(x => x.id === id);
  if(!row || row.deleted) return;
  const isFolder = coll === 'noteFolders';
  const touched = (S.notes || []).filter(n => isFolder
    ? n.folderId === id
    : Array.isArray(n.labelIds) && n.labelIds.includes(id));

  markDeleted(row);
  // WRITE DOWN WHAT WAS IN IT (v10.3). The toast's Undo restored the notes
  // because `touched` is still in scope; nothing else could, so once the toast
  // went the membership was gone and the folder was not in Recently Deleted at
  // all. Measured: delete "School" with three notes, miss the toast, and
  // re-adding "School" gave back an EMPTY folder -- the app's own documented
  // way back returned less than it took.
  row.heldNoteIds = touched.map(n => n.id);
  touched.forEach(n => {
    if(isFolder) n.folderId = null;
    else n.labelIds = n.labelIds.filter(x => x !== id);
  });
  if(noteFolderFilter === id) noteFolderFilter = null;
  noteLabelFilter.delete(id);
  save(); render();
  const what = isFolder ? 'Folder' : 'Label';
  toast(what + ' “' + row.name + '” removed'
        + (touched.length ? ' — ' + touched.length + ' note' + (touched.length === 1 ? '' : 's') + ' kept' : ''),
    { label:'Undo', fn:() => {
      unmarkDeleted(row);
      // DELETED, not left behind: a live row must not carry a tombstone's
      // bookkeeping, for the same reason unmarkDeleted removes deletedAt.
      delete row.heldNoteIds;
      touched.forEach(n => {
        if(isFolder) n.folderId = id;
        else if(!n.labelIds.includes(id)) n.labelIds.push(id);
      });
      save(); render(); toast('Put back');
    }});
}

function setNoteFolder(noteId, folderId){
  const n = (S.notes || []).find(x => x.id === noteId);
  if(!n) return;
  n.folderId = folderId || null;
  n.updated = new Date().toISOString();
  save();
  renderNoteDetail(document.getElementById('main'));
}
function toggleNoteLabel(noteId, labelId){
  const n = (S.notes || []).find(x => x.id === noteId);
  if(!n) return;
  if(!Array.isArray(n.labelIds)) n.labelIds = [];
  const at = n.labelIds.indexOf(labelId);
  if(at >= 0) n.labelIds.splice(at, 1); else n.labelIds.push(labelId);
  n.updated = new Date().toISOString();
  save();
  // Same caret-preserving re-render as toggleNotePerson: labelling mid-sentence
  // must not throw away where you were.
  const b = document.getElementById('noteBody');
  const caret = b ? b.selectionStart : null;
  renderNoteDetail(document.getElementById('main'));
  const again = document.getElementById('noteBody');
  if(again && caret !== null){ again.focus(); try{ again.setSelectionRange(caret, caret); }catch(e){ /* no selection API on this input type; losing the caret beats throwing */ } }
}

// ---- the board filter -----------------------------------------------------
// View state, never on S: a Set would serialise to {} and ship in a backup, and
// "which folder am I looking at" is not the user's data. Same rule as
// problemSel (v9.39) and clashSel (v9.70).
let noteFolderFilter = null;          // null = every folder; '' = Unfiled only
let noteLabelFilter = new Set();

function setNoteFolderFilter(id){
  noteFolderFilter = (noteFolderFilter === id) ? null : id;
  render();
}
function toggleNoteLabelFilter(id){
  if(noteLabelFilter.has(id)) noteLabelFilter.delete(id); else noteLabelFilter.add(id);
  render();
}
function clearNoteFilters(){ noteFolderFilter = null; noteLabelFilter = new Set(); render(); }
function noteFiltersOn(){ return noteFolderFilter !== null || noteLabelFilter.size > 0; }

/**
 * Does this note pass the folder and label filters?
 *
 * Labels are ANDed. Two labels ticked means "notes about both", which is the
 * only reading that lets a filter NARROW as you add to it -- an OR would make
 * every extra tap return more, which reads as the control not working.
 */
function notePassesFilter(n){
  if(noteFolderFilter !== null){
    const want = noteFolderFilter || null;
    if((n.folderId || null) !== want) return false;
  }
  if(noteLabelFilter.size){
    const has = new Set(n.labelIds || []);
    for(const id of noteLabelFilter) if(!has.has(id)) return false;
  }
  return true;
}

// Keep searches "the titles and body text of all your notes at once". People
// are included because they are this app's labels.
function noteMatches(n){
  const q = noteSearch.trim().toLowerCase();
  if(!q) return true;
  const who = (n.personIds || []).map(id => (allPeople().find(p => p.id === id) || {}).name)
    .filter(Boolean).join(' ');
  // Folder and label names are searchable too. They are on the card, and a name
  // you can read is a name you will type into the box expecting it to work.
  const where = noteFolderName(n.folderId);
  const what = noteLabelsOf(n).map(l => l.name).join(' ');
  return [n.title, n.body, who, where, what].filter(Boolean).join(' ')
    .toLowerCase().includes(q);
}

function notesArea(){ return (S.settings && S.settings.notesArea === 'lists') ? 'lists' : 'notes'; }
function setNotesArea(a){
  S.settings.notesArea = (a === 'lists') ? 'lists' : 'notes';
  save(); render();
}

/**
 * The Notes tab: two areas, one tab. Lists ARE notes -- a jotted thing that is
 * not a date -- which is why renderLists already picked the `note` icon for any
 * list that was not obviously groceries.
 *
 * This function owns the header and the switcher; each area renders its own
 * body below. renderLists is unchanged apart from no longer setting the header,
 * so nothing about lists behaves differently.
 */
function renderNotes(m){
  const area = notesArea();
  setHeader(area === 'lists' ? 'Lists' : 'Notes', false);
  const seg = `<div class="filterbar" style="margin-bottom:10px">
    <button class="chip ${area === 'notes' ? 'on' : ''}" aria-pressed="${area === 'notes'}"
      onclick="setNotesArea('notes')">${ico('note')}Notes</button>
    <button class="chip ${area === 'lists' ? 'on' : ''}" aria-pressed="${area === 'lists'}"
      onclick="setNotesArea('lists')">${ico('cart')}Lists</button>
  </div>`;
  if(area === 'lists'){
    const inner = { innerHTML:'' };
    renderLists(inner);
    m.innerHTML = seg + inner.innerHTML;
    return;
  }
  const inner = { innerHTML:'' };
  renderNotesBoard(inner);
  m.innerHTML = seg + inner.innerHTML;
}

/**
 * The folder row and the label row above the board.
 *
 * Rendered only once there is a vocabulary to render -- a filter bar over zero
 * folders and zero labels is chrome that teaches nothing. "Unfiled" appears
 * only when something is actually unfiled, so it cannot become a permanent
 * accusation on a tidy collection.
 */
function noteFilterBar(all){
  const folders = noteFolders();
  const labels = noteLabels();
  if(!folders.length && !labels.length) return '';

  const inFolder = (id) => all.filter(n => (n.folderId || null) === id).length;
  const unfiled = inFolder(null);
  let html = '';

  if(folders.length){
    html += `<div class="filterbar" style="margin-bottom:6px">
      <button class="chip ${noteFolderFilter === null ? 'on' : ''}"
        aria-pressed="${noteFolderFilter === null}"
        onclick="clearNoteFilters()">All (${all.length})</button>`
      + folders.map(f => `<button class="chip ${noteFolderFilter === f.id ? 'on' : ''}"
          aria-pressed="${noteFolderFilter === f.id}"
          onclick="setNoteFolderFilter('${esc(f.id)}')">${ico('folder')}${esc(f.name)} (${inFolder(f.id)})</button>`).join('')
      + (unfiled ? `<button class="chip ${noteFolderFilter === '' ? 'on' : ''}"
          aria-pressed="${noteFolderFilter === ''}"
          onclick="setNoteFolderFilter('')">Unfiled (${unfiled})</button>` : '')
      + `</div>`;
  }

  if(labels.length){
    html += `<div class="filterbar" style="margin-bottom:6px">`
      + labels.map(l => `<button class="chip ${noteLabelFilter.has(l.id) ? 'on' : ''}"
          aria-pressed="${noteLabelFilter.has(l.id)}"
          onclick="toggleNoteLabelFilter('${esc(l.id)}')">#${esc(l.name)}</button>`).join('')
      + `</div>`;
  }

  html += `<div class="row" style="justify-content:flex-end;gap:10px;margin-bottom:8px">
    ${noteFiltersOn() ? `<button class="linkbtn" onclick="clearNoteFilters()">Clear filters</button>` : ''}
    <button class="linkbtn" onclick="sub('noteGroups')">Manage folders &amp; labels</button>
  </div>`;
  return html;
}

function renderNotesBoard(m){
  // The board shows live, un-archived notes. Archived ones are reachable from
  // their own row below, and a SEARCH still reaches them -- a note you archived
  // is a note you kept, and looking for it by name must find it.
  const all = boardNotes();
  const archived = archivedNotes();
  const shown = (noteSearch ? liveNotes() : all)
    .filter(n => noteMatches(n) && notePassesFilter(n));
  // Newest edit first inside each group; pinned and unpinned are rendered as
  // two clearly separated groups, which is how Keep presents them.
  // Pinned floats to the top of WHATEVER order is chosen -- that is what
  // pinning means. The sort applies within each group.
  const by = noteSorter();
  const pinned = shown.filter(n => n.pinned).sort(by);
  const rest   = shown.filter(n => !n.pinned).sort(by);

  let html = `<div class="card"><div class="formrow" style="margin:0">
    <input type="text" id="newNote" aria-label="Take a note" placeholder="Take a note…"
      value="${esc(draft('newNote'))}" oninput="setDraft('newNote', this.value)"
      onkeydown="if(event.key==='Enter')newNote()">
    <button class="btn sm" onclick="newNote()">Add</button></div></div>`;

  // Search only earns its space once there is enough to sift through -- the
  // same threshold the events screen uses.
  if(all.length > 5 || noteSearch){
    html += `<div class="formrow" style="margin-bottom:10px">
      <input type="text" id="noteSearch" aria-label="Search notes" placeholder="Search notes"
        value="${esc(noteSearch)}" oninput="onNoteSearch(this.value)" autocapitalize="none">
      ${noteSearch ? `<button class="btn alt" style="width:auto" onclick="clearNoteSearch()">Clear</button>` : ''}
    </div>`;
  }

  html += noteFilterBar(all);

  // Sort, and the way into the archive. Only once there is enough to sort.
  if(all.length > 2 || archived.length){
    html += `<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="filterbar" style="margin:0">${NOTE_SORTS.map(s =>
        `<button class="chip ${noteSort() === s.key ? 'on' : ''}" aria-pressed="${noteSort() === s.key}"
          onclick="setNoteSort('${s.key}')">${esc(s.label)}</button>`).join('')}</span>
      ${archived.length ? `<button class="linkbtn" onclick="sub('noteArchive')">Archived (${archived.length})</button>` : ''}
    </div>`;
  }

  // `all` is the BOARD's notes, so an install whose every note is archived would
  // otherwise be told it has none -- with the archive link sitting right above
  // the message saying so (found by its own test, v9.72).
  if(!all.length && !archived.length){
    html += emptyState('note', 'No notes yet',
      'Anything that is not a date and not a shopping list — the school office number, what the coach said, sizes for uniforms.');
    m.innerHTML = html; return;
  }
  if(!shown.length){
    // Two different dead ends, and telling them apart matters: a search that
    // found nothing is the user's word; a filter that found nothing is a
    // control they can see and switch off.
    html += noteSearch
      ? `<div class="empty"><div class="eb">Nothing matches “${esc(noteSearch)}”.</div></div>`
      : `<div class="empty"><div class="et">Nothing here yet</div>
         <div class="eb">No notes match the folder and labels you picked.</div>
         <button class="btn alt" onclick="clearNoteFilters()">Show all notes</button></div>`;
    m.innerHTML = html; return;
  }

  const card = (n) => {
    const preview = notePreviewOf(n);
    const who = eventPeople(n);
    const prog = noteCheckProgress(n);
    return `<div class="card row" onclick="openNote('${n.id}')"${n.color ? ` style="border-left:5px solid ${esc(n.color)}"` : ''}>
      <div class="grow">
        <div class="title">${esc(noteTitleOf(n))}</div>
        ${preview ? `<div class="meta" style="font-size:12px">${esc(preview)}</div>` : ''}
        ${prog ? `<div class="meta" style="font-size:11px;color:var(--accent)">${ico('check-circle')}${prog.done} of ${prog.total}</div>` : ''}
        <div class="meta" style="font-size:11px">${n.updated ? 'edited ' + friendly(String(n.updated).slice(0,10)) : ''}${who.length ? ' · ' + esc(who.map(p=>p.name).join(', ')) : ''}</div>
        ${(noteFolderName(n.folderId) || noteLabelsOf(n).length) ? `<div class="meta" style="font-size:11px;margin-top:3px">
          ${noteFolderName(n.folderId) ? `${ico('folder')}${esc(noteFolderName(n.folderId))}` : ''}
          ${noteLabelsOf(n).map(l => `<span style="color:var(--accent)">#${esc(l.name)}</span>`).join(' ')}
        </div>` : ''}
      </div>
      <button class="linkbtn" style="padding:4px" onclick="event.stopPropagation();togglePinNote('${n.id}')">${n.pinned ? 'Unpin' : 'Pin'}</button>
    </div>`;
  };

  if(pinned.length){
    html += `<div class="sect">Pinned</div>` + pinned.map(card).join('');
    if(rest.length) html += `<div class="sect">Others</div>`;
  }
  html += rest.map(card).join('');
  m.innerHTML = html;
}

// Same caret-preserving pattern as onEventSearch: render() replaces #main, so
// the field has to be found again and the selection restored, or typing loses
// its place after every character.
function onNoteSearch(v){
  noteSearch = v;
  const box = document.getElementById('noteSearch');
  const caret = box ? box.selectionStart : null;
  renderNotes(document.getElementById('main'));   // whole tab: the switcher too
  const again = document.getElementById('noteSearch');
  if(again){
    again.focus();
    if(caret !== null){ try{ again.setSelectionRange(caret, caret); }catch(e){ /* no selection API on this input type; losing the caret beats throwing */ } }
  }
}
function clearNoteSearch(){ noteSearch = ''; render(); }

function newNote(){
  const box = document.getElementById('newNote');
  const seed = box ? box.value.trim() : '';
  const now = new Date().toISOString();
  // Every field the schema promises, set here as well as in the migration. A
  // new note that is shaped differently from a migrated one is a defect waiting
  // for whichever reader stops being defensive first -- `undefined` and `null`
  // are not the same thing to a filter (found by its own test, v9.71).
  const n = { id:uid(), title:'', body:seed, pinned:false, personIds:[],
    folderId:null, labelIds:[], color:'', archived:false,
    created:now, updated:now, deleted:false };
  if(!S.notes) S.notes = [];
  S.notes.unshift(n);
  clearDraft('newNote');
  save();
  sub('noteDetail', {id:n.id});
}
function openNote(id){ sub('noteDetail', {id}); }

/**
 * Make a folder or a label from inside the note that needs it, and apply it.
 *
 * prompt() rather than a screen, deliberately: the point of this control is
 * that filing costs one gesture. A duplicate name returns the existing row
 * (see addNoteGroup), so tapping "+ New folder" and typing a name that already
 * exists files the note there instead of forking the group in two.
 */
function newNoteGroupFor(coll, noteId){
  const isFolder = coll === 'noteFolders';
  const name = prompt(isFolder ? 'Name for the new folder' : 'Name for the new label');
  if(name === null) return;                       // cancelled -- change nothing
  const row = addNoteGroup(coll, name);
  if(!row){ toast('That needs a name'); return; }
  const n = (S.notes || []).find(x => x.id === noteId);
  if(n){
    if(isFolder) n.folderId = row.id;
    else if(!(n.labelIds || []).includes(row.id)) (n.labelIds = n.labelIds || []).push(row.id);
    n.updated = new Date().toISOString();
    save();
  }
  renderNoteDetail(document.getElementById('main'));
}

function togglePinNote(id){
  const n = (S.notes || []).find(x => x.id === id);
  if(!n) return;
  n.pinned = !n.pinned;
  save(); render();
  toast(n.pinned ? 'Pinned to the top' : 'Unpinned');
}

function delNote(id){
  const n = (S.notes || []).find(x => x.id === id);
  if(!n) return null;
  flushNote();                       // do not let a pending autosave resurrect it
  const undo = softDelete('notes', id, '“' + noteTitleOf(n) + '”');
  view = {tab:'notes', sub:null, data:null};
  render();
  return undo;
}

/**
 * Autosave. Keep has no save button -- closing a note saves it -- so neither
 * does this.
 *
 * render() is NOT called here: it replaces #main, which would destroy focus and
 * the caret in the middle of a word. The board picks the new text up on the
 * next real navigation.
 */
function noteEdited(id){
  if(noteSaveTimer) clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(() => { noteSaveTimer = null; writeNote(id); }, 400);
}
function writeNote(id){
  const n = (S.notes || []).find(x => x.id === id);
  if(!n) return;
  const t = document.getElementById('noteTitle');
  const b = document.getElementById('noteBody');
  if(!t && !b) return;               // the screen is gone; nothing to read
  const title = t ? t.value : n.title;
  const body  = b ? b.value : n.body;
  if(title === n.title && body === n.body) return;
  n.title = title; n.body = body;
  n.updated = new Date().toISOString();
  save();
}
// Called on blur and on Done. A debounce that has not fired yet is a write that
// has not happened, and tapping back must not be how a note is lost.
function flushNote(){
  if(noteSaveTimer){ clearTimeout(noteSaveTimer); noteSaveTimer = null; }
  if(view && view.sub === 'noteDetail' && view.data) writeNote(view.data.id);
}
function doneNote(){ flushNote(); view = {tab:'notes', sub:null, data:null}; render(); }

function toggleNotePerson(id, personId){
  const n = (S.notes || []).find(x => x.id === id);
  if(!n) return;
  if(!Array.isArray(n.personIds)) n.personIds = [];
  const at = n.personIds.indexOf(personId);
  if(at >= 0) n.personIds.splice(at, 1); else n.personIds.push(personId);
  n.updated = new Date().toISOString();
  save();
  // Re-render just this screen and put the caret back, so tagging mid-sentence
  // does not throw away where you were.
  const b = document.getElementById('noteBody');
  const caret = b ? b.selectionStart : null;
  renderNoteDetail(document.getElementById('main'));
  const again = document.getElementById('noteBody');
  if(again && caret !== null){ again.focus(); try{ again.setSelectionRange(caret, caret); }catch(e){ /* no selection API on this input type; losing the caret beats throwing */ } }
}
