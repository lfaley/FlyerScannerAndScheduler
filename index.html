/**
 * Does the local model's context window actually fit the job?
 *
 * v9.25. Logan's two 48-second failures were not a model choice. Ollama's
 * default context is 4,096 tokens on any machine with under 24 GiB of VRAM
 * (his RTX 5060 Ti has 15.9 GiB), his flyer prompts measured 2,327 and 2,346
 * tokens, and FlyerSnap asked for up to 4,000 tokens of answer. Prompt plus
 * requested answer was roughly double the window. Those calls could not have
 * succeeded from any model.
 *
 * The app could not see this, and still cannot ask for more: Ollama's own
 * OpenAI-compatibility docs say "the OpenAI API does not have a way of setting
 * context size", so `num_ctx` is not ours to send. The window is fixed
 * server-side by OLLAMA_CONTEXT_LENGTH. All the app can do is FIND OUT and say
 * so -- which is the whole of this module.
 *
 * Pure. No DOM, no network, no app state. The caller does the fetching.
 */

/** Leave the runtime a little headroom rather than filling the window exactly. */
const CTX_MARGIN = 128;

/**
 * Below this many tokens an extraction answer is not worth attempting: a single
 * event in this app's JSON shape runs roughly 120 tokens, so under ~600 even a
 * short flyer gets truncated mid-object and fails to parse.
 */
const MIN_ANSWER = 600;

/**
 * Ollama's OpenAI-compatible base is `.../v1`; the native API sits beside it at
 * `.../api`. `ollama ps` is the only place the LOADED model's real window is
 * reported -- /api/show returns the model's TRAINING context (262,144 for
 * qwen3-vl) which is not what the server allocated.
 */
function psUrlFrom(base){
  const clean = String(base || '').trim().replace(/\/+$/, '');
  if(!clean) return '';
  return clean.replace(/\/v\d+$/, '') + '/api/ps';
}

/**
 * Pull the loaded model's context window out of an /api/ps response.
 *
 * Returns null rather than a guess when the field is absent -- older Ollama
 * builds do not report it, and a made-up number here would produce confident
 * wrong advice, which is worse than none.
 */
function contextFromPs(json, model){
  const models = (json && (json.models || json.data)) || [];
  if(!Array.isArray(models) || !models.length) return null;
  const want = String(model || '').trim();
  const named = want
    ? models.find(m => m && (m.model === want || m.name === want ||
        String(m.model || m.name || '').split(':')[0] === want.split(':')[0]))
    : null;
  // NO FALLBACK TO models[0]. Until v9.73 an unloaded model returned whatever
  // the first loaded one happened to be -- measured at 8192 (llama3:70b) while
  // the caller was asking about a 32k model. That is precisely the "confident
  // wrong advice" the docblock above promises not to give, and it is worse than
  // silence because the advice it feeds is about whether a prompt will FIT.
  // When no name was asked for at all, the single loaded model is still the
  // only sensible answer (code review P5, reproduced by execution 29 Aug).
  const hit = want ? named : models[0];
  if(!hit) return null;
  const n = hit.context_length != null ? hit.context_length : hit.contextLength;
  return Number.isFinite(n) && n > 0 ? Math.floor(n) : null;
}

/**
 * How big is a prompt for this job, measured rather than estimated?
 *
 * The AI log already records `inTokens` for every successful call, so previous
 * runs of the SAME operation are real evidence. The maximum is used, not the
 * mean: the question is whether the window fits the worst flyer, not the
 * typical one.
 *
 * A photo sent to the local model costs about what it costs Anthropic -- both
 * tile the image -- so an Anthropic run of the same operation is a usable
 * stand-in when the local side has never succeeded. That is an approximation,
 * and it is flagged as one.
 */
function observedPromptTokens(log, op, provider){
  const rows = (log || []).filter(e => e && e.op === op && Number.isFinite(e.inTokens));
  const mine = rows.filter(e => e.provider === provider);
  const use = mine.length ? mine : rows;
  if(!use.length) return null;
  return {
    tokens: use.reduce((n, e) => Math.max(n, e.inTokens), 0),
    exact: mine.length > 0,
    samples: use.length,
  };
}

/**
 * Decide what to ask for, given a window that cannot be widened from here.
 *
 * Three outcomes, and the middle one matters most: when the window is tight but
 * usable, ASK FOR LESS rather than failing. A request for 4,000 tokens inside a
 * 4,096-token window is refused or truncated; the same call asking for 1,600
 * may well succeed. Clamping is not a workaround, it is the correct request.
 */
function planBudget(opts){
  const o = opts || {};
  const want = Math.max(1, Math.floor(o.want || 0));
  const ctx = Number.isFinite(o.ctx) && o.ctx > 0 ? Math.floor(o.ctx) : null;
  const prompt = Number.isFinite(o.promptTokens) && o.promptTokens > 0
    ? Math.floor(o.promptTokens) : null;
  const margin = Number.isFinite(o.margin) ? o.margin : CTX_MARGIN;
  const floor = Number.isFinite(o.floor) ? o.floor : MIN_ANSWER;

  // Nothing measured: proceed unchanged. Refusing on an unknown would ground
  // the local model on every server that does not report its window.
  if(ctx === null || prompt === null){
    return { ok:true, maxTokens:want, clamped:false, room:null, ctx, prompt, reason:'unknown' };
  }

  const room = ctx - prompt - margin;
  if(room < floor){
    return { ok:false, maxTokens:0, clamped:false, room, ctx, prompt,
      reason:'too_small',
      // The numbers are the message. "Context too small" alone leaves the user
      // guessing which of the three quantities to change.
      detail: `The prompt is about ${prompt} tokens and the model's window is `
        + `${ctx}, leaving ${Math.max(0, room)} for an answer.` };
  }
  if(room < want){
    return { ok:true, maxTokens:room, clamped:true, room, ctx, prompt, reason:'clamped' };
  }
  return { ok:true, maxTokens:want, clamped:false, room, ctx, prompt, reason:'fits' };
}

/**
 * What to tell someone whose window is too small. Ollama's default really is
 * 4,096 under 24 GiB of VRAM, so most people hitting this have never set it.
 */
function contextAdvice(plan){
  const p = plan || {};
  const need = Math.max(8192, ((p.prompt || 0) + 2000));
  const rounded = need <= 8192 ? 8192 : (need <= 16384 ? 16384 : 32768);
  return `${p.detail || 'The context window is too small for this job.'}\n\n`
    + `Ollama defaults to 4096 tokens on a machine with under 24GB of VRAM. `
    + `Raise it on the desktop and restart Ollama:\n`
    + `OLLAMA_CONTEXT_LENGTH=${rounded}\n\n`
    + `It cannot be set from here — the OpenAI-compatible API has no field for it.`;
}

// ---------- State & storage ----------
const KID_COLORS = ['#7C3AED','#0E7490','#B45309','#BE185D','#166534','#4338CA'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SLOTS = ['breakfast','lunch','snack','dinner','dessert'];

// MUST come after the constants above: load() -> migrate()/blank() reads them,
// and const/let are in the temporal dead zone until their line executes.
let S = load();

/**
 * Turn a PARSED save/backup object into a state object: check the shape, merge
 * onto blank() so a key added since the file was written is never missing,
 * merge the nested settings sub-objects, and migrate. THROWS on a shape it
 * cannot use -- the caller decides what that means (quarantine on boot, or
 * refuse an import).
 *
 * v9.78, scaffold step of DATA-LOSS-PLAN.md. This logic existed THREE times and
 * the copies disagreed: load() merged the nested settings and migrated,
 * importBackup() did neither, restoreSnapshot() did neither. So a restored
 * backup ran the whole session on an un-upgraded shape, and a restored snapshot
 * silently lost any settings.alerts key added since it was taken. One function,
 * three callers, and no fourth way to build S out of JSON.
 *
 * Pure with respect to storage: it reads no localStorage and writes none. That
 * is what lets a caller validate a file BEFORE destroying what it would replace.
 */
function adoptParsed(parsed){
  // Shape check -- a JSON blob that parses but isn't ours is still unusable
  if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || !Array.isArray(parsed.events)){
    throw new Error('Saved data is not in the expected format');
  }
  const base = blank();
  // Captured BEFORE the assign below replaces base.settings with the SAVED
  // settings object. Reading it afterwards would merge the save against itself
  // and every default added since the file was written would be lost.
  const defaults = base.settings;
  // Same reason: which keys are collections is read off blank() BEFORE the
  // saved data overwrites them, so a collection added in a later version is
  // covered here the day it is added, with no list to keep in step.
  const arrayKeys = Object.keys(base).filter(k => Array.isArray(base[k]));
  const s = Object.assign(base, parsed);
  // settings is nested, so merge it rather than letting old saves drop new keys
  s.settings = Object.assign({}, defaults, parsed.settings||{});
  s.settings.alerts = Object.assign({}, defaults.alerts, (parsed.settings||{}).alerts||{});
  s.settings.starCarry = Object.assign({}, (parsed.settings||{}).starCarry||{});
  // Version comes from the SAVED data -- blank() already stamped the current
  // one onto the merge target, so reading it from `s` would skip migration.
  const out = migrate(s, parsed.schemaVersion);
  // Every collection blank() declares as an array must BE an array by the time
  // a render path touches it. Object.assign copies a null STRAIGHT OVER the
  // default, which is how a backup containing "kids":null blank-screened the
  // app on every launch: allPeople() does S.kids.filter(...), load() accepted
  // the file so __locked never fired, and the recovery screen was unreachable
  // (DATA-LOSS-PLAN.md F5).
  //
  // Coerced, not refused -- a deliberate change from what the plan said. The
  // house style is already coercion: migrate's from<8 block coerces a junk
  // `notes` for exactly this reason ("cheaper than making every reader
  // defensive"), and a test pins it. Refusing would lock a user out of the whole
  // app over a field that held nothing. It runs AFTER migrate so migrate's own
  // repairs happen first and are not undone here.
  arrayKeys.forEach(k => { if(!Array.isArray(out[k])) out[k] = []; });
  return out;
}

function load(){
  let raw = null;
  try{
    raw = localStorage.getItem('flyersnap');
    if(!raw) return blank();
    return adoptParsed(JSON.parse(raw));
  }catch(e){
    // NEVER silently start empty — that would let the next save() overwrite the
    // only copy. Quarantine the bytes, lock writes, and let the user decide.
    loadError = e.message || String(e);
    try{
      if(raw) localStorage.setItem('flyersnap-quarantine', raw);
    }catch(_){ /* already handling a load failure. If storage will not take the quarantine copy either, the original bytes are still where they were -- __locked below is what actually protects them */ }
    const locked = blank();
    locked.__locked = true;
    return locked;
  }
}

function save(){
  if(S.__locked){ console.warn('save blocked: data is locked pending recovery'); return; }
  try{
    snapshot();                    // stash the last known good copy first
    localStorage.setItem('flyersnap', JSON.stringify(S));
    if(saveFailed){
      // Cleared FIRST, then logged. logProblem ends with its own save(), so
      // logging while the flag is still set would recurse; clearing first makes
      // that nested save a no-op on this branch. Logging from the FAILURE path
      // would recurse without end, which is why the record happens here.
      const was = saveFailed;
      saveFailed = null;
      logProblem('Storage', was.kind === 'full'
        ? 'Storage filled up — edits were not being saved'
        : 'The browser refused to save — edits were not being saved',
        was.count + ' failed save' + (was.count === 1 ? '' : 's') + ' before it recovered');
    }
  }catch(e){
    // Silence here loses edits invisibly, and that is exactly what the previous
    // version did from the SECOND failure onward: one alert, then nothing, while
    // the user kept typing into memory that dies with the tab.
    //
    // The alert still fires once -- an interruption every keystroke is its own
    // kind of broken -- but the STICKY flag drives a banner that cannot be
    // dismissed and forgotten, and the failure is recorded the moment a save
    // works again. Material's snackbar rule is the same idea: a message about
    // something the user must act on should not vanish on a timer.
    const kind = isQuotaError(e) ? 'full' : 'blocked';
    const first = !saveFailed;
    saveFailed = { kind, at: new Date().toISOString(),
                   count: (saveFailed ? saveFailed.count : 0) + 1 };
    if(first){
      alert(kind === 'full'
        ? 'Could not save — storage on this phone is full.\n\nExport a backup from Settings now, then clear out old past events or recipes.'
        : 'Could not save — this browser is not letting FlyerSnap store data.\n\nThis usually means private browsing, or site data is blocked for this site.');
    }
  }
}

/**
 * Is this throw "the disk is full", or "this browser will not let us store
 * anything"? They need different sentences: telling someone in private
 * browsing to delete old events will not help them.
 *
 * MDN's storageAvailable() helper is the source
 * (developer.mozilla.org/en-US/docs/Web/API/Web_Storage_API/Using_the_Web_Storage_API).
 * It tests `e.name === 'QuotaExceededError'` AND that something is already
 * stored -- because a private-browsing localStorage can be present, empty and
 * zero-quota, which throws the same error for an entirely different reason.
 *
 * MDN also checks `e instanceof DOMException`. We check the NAME, which is the
 * discriminating field: the Node test harness has no DOMException, and a guard
 * that cannot be exercised by a test is a guard nobody has proven.
 */
function isQuotaError(e){
  if(!e || e.name !== 'QuotaExceededError') return false;
  try{ return localStorage.length !== 0; }catch(_){ return false; }
}

/** The banner render() puts above every screen while saving is broken. */
function saveFailedBanner(){
  if(!saveFailed) return '';
  return `<div class="card" style="border-left:5px solid var(--red)">
    <div class="title">Not saving — your changes are only on this screen</div>
    <div class="help" style="margin:8px 0 0">${saveFailed.kind === 'full'
      ? 'Storage on this phone is full. Export a backup now, then clear out old records.'
      : 'This browser is not letting FlyerSnap store data — private browsing, or site data is blocked for this site.'}</div>
    <button class="btn alt" style="margin-top:10px" onclick="nav('settings');sub('setBackup')">Open Backup</button>
  </div>`;
}

// ---------- Pruning ----------
// Storage is ~5MB and these arrays otherwise grow forever. Rules are deliberately
// conservative: nothing recent goes, and anything that would change a visible
// number (star balances) is rolled forward rather than dropped.

const KEEP_COMPLETIONS_DAYS = 365;   // a year of chore history stays browsable
// 30, not 90. Google Drive, Apple Photos, Apple Notes and Dropbox-for-consumers
// all use 30 days, and Google is explicit that trashed items still consume the
// quota -- which at a 5 MiB localStorage ceiling, stored four times over (the
// live blob plus three snapshots), settles it. See DATA-LOSS-PLAN.md 1.4.
const KEEP_SOFT_DELETED_DAYS = 30;   // tombstones for deleted rows
const KEEP_PAST_EVENTS_DAYS = 730;   // two years of past events

function daysAgoISO(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return iso(d);
}

function pruneData(){
  if(S.__locked) return 0;
  let removed = 0;
  const completionCutoff = daysAgoISO(KEEP_COMPLETIONS_DAYS);
  // A timestamp, not a date, because deletedAt is one. daysAgoISO stays for the
  // rules that compare against an event's own DATE, which is date-only.
  const deletedCutoff = new Date(Date.now() - KEEP_SOFT_DELETED_DAYS*24*3600*1000).toISOString();
  const eventCutoff = daysAgoISO(KEEP_PAST_EVENTS_DAYS);

  // Chore completions: roll old ones into a carried balance BEFORE dropping them,
  // so a kid's star total never changes just because time passed.
  const carry = Object.assign({}, S.settings.starCarry || {});
  const keptCompletions = [];
  for(const c of S.completions){
    if(c.date && c.date < completionCutoff){
      if(c.kidId && c.stars) carry[c.kidId] = (carry[c.kidId] || 0) + c.stars;
      removed++;
    } else keptCompletions.push(c);
  }
  // Same for redemptions (they subtract).
  const keptRedemptions = [];
  for(const r of S.redemptions){
    if(r.date && r.date < completionCutoff){
      if(r.kidId && r.stars) carry[r.kidId] = (carry[r.kidId] || 0) - r.stars;
      removed++;
    } else keptRedemptions.push(r);
  }
  S.completions = keptCompletions;
  S.redemptions = keptRedemptions;
  S.settings.starCarry = carry;

  // Soft-deleted rows: once they're old, actually drop them.
  const before = S.events.length + S.listItems.length + S.lists.length +
                 (S.notes || []).length +
                 S.chores.length + S.rewards.length + S.kids.length +
                 (S.noteFolders || []).length + (S.noteLabels || []).length;
  // ONE rule, used by every collection. This helper already existed and was
  // never called: events were filtered on the event's own DATE, so an event
  // dated last year was destroyed however recently it was deleted and a deleted
  // FUTURE event was never reclaimed at all -- and the other six collections had
  // no age test whatsoever, so a person deleted five minutes before a prune was
  // simply gone.
  //
  // A row with no deletedAt is KEPT. Unknown is never a licence to destroy.
  const oldDeleted = row => !!row && row.deleted && !!row.deletedAt && row.deletedAt < deletedCutoff;
  S.events = S.events.filter(e => !oldDeleted(e));
  S.listItems = S.listItems.filter(i => !oldDeleted(i));
  S.notes = (S.notes || []).filter(n => !oldDeleted(n));
  S.lists = S.lists.filter(l => !oldDeleted(l));
  S.chores = S.chores.filter(c => !oldDeleted(c));
  S.rewards = S.rewards.filter(r => !oldDeleted(r));
  S.kids = S.kids.filter(k => !oldDeleted(k));
  // v10.3: these two never aged out at all, so a deleted folder sat in the save
  // file forever. Now that they are in Recently Deleted they follow its
  // countdown like every other row.
  S.noteFolders = (S.noteFolders || []).filter(f => !oldDeleted(f));
  S.noteLabels = (S.noteLabels || []).filter(l => !oldDeleted(l));
  removed += before - (S.events.length + S.listItems.length + S.lists.length +
                       (S.notes || []).length +
                       S.chores.length + S.rewards.length + S.kids.length +
                       (S.noteFolders || []).length + (S.noteLabels || []).length);

  // Very old past events.
  //
  // A DATED tombstone is exempt. Without that clause the two rules in this
  // function contradict each other: an event dated three years ago and deleted
  // TODAY passes the tombstone test above (its deletedAt is minutes old) and is
  // then destroyed here, while Recently Deleted is on screen counting down
  // KEEP_SOFT_DELETED_DAYS days for it.
  //
  // `deletedAt` is required, not decorative. An undated tombstone is KEPT by the
  // rule above on purpose (unknown is never a licence to destroy), so exempting
  // it here as well would make it immortal -- the one row that can never age
  // out. It keeps the sweep it has always had.
  //
  // Deliberately NOT `&& !oldDeleted(e)`: an expired tombstone is already gone
  // by this line, so that clause could never change an outcome. A condition
  // that cannot fail is not a safety net, it is decoration that reads like one.
  const beforeEvents = S.events.length;
  S.events = S.events.filter(e => !e.date || e.date >= eventCutoff ||
                                  (e.deleted && !!e.deletedAt));
  removed += beforeEvents - S.events.length;

  // Watcher message ids don't need to be remembered forever.
  if(S.settings.seenMsgs && S.settings.seenMsgs.length > 400){
    S.settings.seenMsgs = S.settings.seenMsgs.slice(-400);
  }

  if(removed) save();
  return removed;
}

// ---------- Rolling local snapshots ----------
// Protects against corruption and fat-finger deletes. Does NOT protect against
// iOS evicting site data — only an exported file does that.
const SNAP_PREFIX = 'flyersnap-snap-';
const SNAP_KEEP = 3;

/**
 * The API key belongs in exactly ONE place: localStorage['flyersnap'] on this
 * device. Anything else that persists the state -- a rolling snapshot, the
 * downloaded backup file -- gets it blanked.
 *
 * Measured before this existed (v9.90): an exported
 * `flyersnap-backup-<date>.json` carried a plaintext sk-ant- key, and that file
 * is the one designed to LEAVE the phone -- into email, iCloud, a laptop's
 * Downloads folder. The snapshots carried it too, which is why "Remove key from
 * this device" left three restorable copies behind.
 *
 * OWASP Secrets Management is explicit that a revoked secret "must be removed
 * from the exposed system immediately". A copy that is never written needs no
 * removal, so the fix is at the WRITE, not at the delete.
 */
function redactSaved(raw){
  // Takes the stored STRING, not S: snapshot() archives the previous blob on
  // purpose, and re-serialising the live S here would archive the wrong state.
  let obj;
  try{ obj = JSON.parse(raw); }
  catch(e){ return null; }         // unreadable -- see the caller
  if(obj && obj.settings && obj.settings.apiKey) obj.settings.apiKey = '';
  try{ return JSON.stringify(obj); }catch(e){ return null; }
}

/**
 * Blank the key in snapshots that older versions already wrote.
 *
 * A snapshot that will not parse is LEFT EXACTLY AS IT WAS. It cannot be
 * restored either (restoreSnapshot goes through JSON.parse), so there is nothing
 * to protect in it -- and destroying a rescue copy during a security tidy is the
 * recovery-path failure rule 28 is about. Returns how many it changed.
 */
function scrubSnapshots(){
  let cleaned = 0;
  snapshotKeys().forEach(k => {
    let raw = null;
    try{ raw = localStorage.getItem(k); }catch(e){ return; }
    if(!raw || raw.indexOf('"apiKey"') < 0) return;
    const next = redactSaved(raw);
    if(next === null || next === raw) return;
    try{ localStorage.setItem(k, next); cleaned++; }
    catch(e){ /* no room to rewrite it: leaving the old one is better than losing it */ }
  });
  return cleaned;
}

function snapshotKeys(){
  const out = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(SNAP_PREFIX) === 0) out.push(k);
    }
  }catch(e){ /* enumeration can throw where storage is partitioned. An empty list means "no snapshots found", which is the safe reading -- it can only cause the app to keep MORE than it needed */ }
  return out.sort();
}
function snapshot(opts){
  try{
    // `force` is for the one caller that is about to destroy the current state
    // on purpose (importBackup). The daily throttle is right for save(), but it
    // means the newest snapshot can already be today's -- and then the state an
    // import replaces would exist nowhere at all.
    const force = !!(opts && opts.force);
    const now = Date.now();
    const last = Number(localStorage.getItem('flyersnap-lastsnapshot') || 0);
    if(!force && now - last < 24*3600*1000) return;      // at most one a day
    const raw = localStorage.getItem('flyersnap');
    if(!raw) return;
    // A snapshot that cannot be parsed cannot be redacted -- and cannot be
    // restored either, since restoreSnapshot parses it. Skipping is the honest
    // trade: an archived credential is worse than a missing archive of a blob
    // nothing could have recovered from anyway.
    const safe = redactSaved(raw);
    if(safe === null) return;
    localStorage.setItem(SNAP_PREFIX + new Date().toISOString().slice(0,10), safe);
    localStorage.setItem('flyersnap-lastsnapshot', String(now));
    const keys = snapshotKeys();
    while(keys.length > SNAP_KEEP) localStorage.removeItem(keys.shift());
  }catch(e){ /* snapshots are best-effort; never block a save */ }
}
function restoreSnapshot(key){
  const raw = localStorage.getItem(key);
  if(!raw){ alert('That snapshot is gone.'); return; }
  // Same door as load() and importBackup as of v9.80. This path used to skip
  // migration AND the nested settings merges, so a snapshot taken under an
  // older schema was rendered and persisted un-upgraded for the whole session,
  // and one taken before an alerts key existed came back missing it.
  let next;
  try{ next = adoptParsed(JSON.parse(raw)); }
  catch(e){ alert('That snapshot is unreadable too.'); return; }
  if(!confirm('Restore the snapshot from ' + key.replace(SNAP_PREFIX,'') + '?\n\nAnything added since then will be replaced.')) return;
  S = next;
  loadError = null;
  // Written directly rather than through save(): save() would snapshot the
  // state we are replacing, which on the recovery screen is the broken one,
  // and evict a good snapshot to make room for it.
  localStorage.setItem('flyersnap', JSON.stringify(S));
  view = {tab:'events', sub:null, data:null};
  applyTheme();
  render();
  toast('Snapshot restored');
}
function storageBytes(){
  let n = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      n += k.length + (localStorage.getItem(k)||'').length;
    }
  }catch(e){ /* a size READING. An under-count shows a smaller bar on the storage screen; it changes nothing the app does */ }
  return n;
}
/**
 * Last-resort scrub for bytes that will not parse.
 *
 * A PATTERN MATCH, and therefore best-effort -- said plainly rather than
 * implied. It exists for one case that structural redaction cannot reach:
 * `flyersnap-quarantine` holds the bytes that failed JSON.parse, which is
 * exactly why they were quarantined. redactSaved returns null for those, so
 * without this the API key would ride out of the app inside them.
 *
 * Anthropic keys start with `sk-ant-`, which saveKey() already enforces.
 */
function scrubSecretText(s){
  return String(s == null ? '' : s).replace(/sk-ant-[A-Za-z0-9_\-]+/g, 'sk-ant-REDACTED');
}

/**
 * Everything stored under the flyersnap prefix, with the secrets taken out.
 *
 * v9.90 stopped exportBackup and snapshot() writing the API key into a file.
 * THIS PATH WAS MISSED, and it is the worst one to miss: the rescue file is
 * what a stuck user downloads and then emails to someone for help. Measured in
 * a real browser before the fix -- the file contained the live API key, the
 * same key again inside `flyersnap-quarantine`, the key from a pre-v9.90
 * snapshot, AND the Gordon session, whose refresh token is a long-lived
 * credential for the account. Four secrets in a file the app tells you to keep.
 *
 * Fixing one instance of a defect and not sweeping the class is the same habit
 * failure that left #newItem behind in v9.94.
 *
 * The Gordon session is dropped rather than redacted: nothing about a sign-in
 * token helps repair a broken save file, so there is no reason for it to be in
 * there at all.
 */
function quarantineDump(){
  const dump = {};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf('flyersnap') !== 0) continue;
      if(k === GORDON_SESSION_KEY) continue;
      const raw = localStorage.getItem(k);
      // Structural first, because it is exact; the pattern scrub is the
      // backstop for anything that would not parse.
      const clean = redactSaved(raw);
      dump[k] = scrubSecretText(clean === null ? raw : clean);
    }
  }catch(e){ /* the rescue download is a LAST RESORT, reached when things are already broken. A partial dump is worth more than a thrown one */ }
  return dump;
}

function downloadQuarantine(){
  const blob = new Blob([JSON.stringify(quarantineDump(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'flyersnap-rescue-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Rescue file downloaded — your API key is not in it');
}
function startFresh(){
  if(!confirm('Erase everything and start over?\n\nThis cannot be undone. Download the rescue file first if you have not.')) return;
  if(!confirm('Really erase all events, chores, stars, lists and recipes?')) return;
  // THE ONE EMPTY CATCH THAT WAS WRONG (v9.74).
  //
  // This used to swallow the failure and render a blank app regardless. In
  // private mode, or with storage access denied, every removeItem throws: the
  // snapshots survive, the GORDON SESSION TOKEN survives, and the user -- who
  // has just confirmed twice that they want everything erased -- is shown an
  // empty app as proof that it worked. That is P4-01 exactly: asserting an
  // outcome nobody checked, about the one thing where being wrong matters.
  //
  // Verify, then say what is actually true.
  let left = [];
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('flyersnap') === 0) keys.push(k);
    }
    keys.forEach(k => { try{ localStorage.removeItem(k); }catch(e){ left.push(k); } });
    // Read back rather than trusting the writes: removeItem can resolve without
    // removing where storage is partitioned.
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('flyersnap') === 0 && left.indexOf(k) < 0) left.push(k);
    }
  }catch(e){
    left = ['(storage could not be read)'];
  }
  S = blank();
  loadError = null;
  view = {tab:'events', sub:null, data:null};
  save(); render();
  if(left.length){
    logProblem('Storage', 'Erase everything did not remove all data',
      left.length + ' key(s) survived: ' + left.slice(0, 8).join(', '));
    alert('Not everything could be erased.\n\nThis browser refused to remove '
      + left.length + ' item' + (left.length === 1 ? '' : 's')
      + ', which may include a saved sign-in. Clear this site\u2019s data in your '
      + 'browser settings to finish.');
  }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function friendly(s){ const d=parseDate(s); return DOW[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate(); }
function kidById(id){ return S.kids.find(k=>k.id===id && !k.deleted); }
function personById(id){ return S.kids.find(p=>p.id===id && !p.deleted); }
function allPeople(){ return S.kids.filter(p=>!p.deleted); }
function justKids(){ return S.kids.filter(p=>!p.deleted && (p.type||'kid')==='kid'); }
// An event's tagged people, tolerating old single-kidId rows.
function eventPeople(e){
  const ids = Array.isArray(e.personIds) ? e.personIds : (e.kidId ? [e.kidId] : []);
  return ids.map(personById).filter(Boolean);
}
const UNREAD_FILTER = '__unread';
function matchesFilter(e){
  if(!eventFilter) return true;
  if(eventFilter === UNREAD_FILTER) return !!e.unread;
  return eventHasPerson(e, eventFilter);
}
function unreadCount(){ return S.events.filter(e=>!e.deleted && e.unread).length; }
function markRead(id){
  const e = S.events.find(x=>x.id===id);
  if(e && e.unread){ e.unread = false; save(); }
}
function markAllRead(){
  let n = 0;
  S.events.forEach(e => { if(!e.deleted && e.unread){ e.unread = false; n++; } });
  if(n) save();
  if(eventFilter === UNREAD_FILTER) eventFilter = null;
  toast(n ? 'Marked ' + n + ' as seen' : 'Nothing new');
  render();
}

function eventHasPerson(e, personId){
  if(Array.isArray(e.personIds)) return e.personIds.includes(personId);
  return e.kidId === personId;
}

let toastTimer;
function toast(msg, action){
  const t = document.getElementById('toast');
  // Message goes in as TEXT -- it carries list names and event titles.
  t.textContent = msg;
  t.classList.toggle('interactive', !!action);
  if(action){
    const b = document.createElement('button');
    b.className = 'toast-action';
    b.textContent = action.label;
    b.onclick = () => { hideToast(); action.fn(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  // An undo needs long enough to notice, read and reach. 2.6s is fine for a
  // confirmation nobody has to act on; it is not fine for a decision.
  toastTimer = setTimeout(hideToast, action ? 7000 : 2600);
}
function hideToast(){
  clearTimeout(toastTimer);
  const t = document.getElementById('toast');
  t.classList.remove('show'); t.classList.remove('interactive');
}
// Soft-delete anything that lives in a top-level array, with one undo.
// Returns the undo function, so a caller can offer the same escape hatch
// through another surface -- and so tests can exercise the real undo path
// rather than a reimplementation of it.
/**
 * The two halves of a soft delete, and they are a PAIR on purpose: `deleted`
 * says a row is gone, `deletedAt` says when. A row carrying one without the
 * other is a lie sitting in the data waiting for the next reader to trust it --
 * which is why the four undo paths call unmarkDeleted rather than assigning
 * `deleted = false` by hand. v9.82.
 *
 * `deletedAt` is a full ISO timestamp rather than todayISO(). Date-only strings
 * cannot express "in the last N hours", and a timestamp still compares
 * correctly against a date-only cutoff because the date prefix dominates a
 * lexicographic comparison.
 */
function markDeleted(row){
  if(!row) return row;
  row.deleted = true;
  row.deletedAt = new Date().toISOString();
  return row;
}
function unmarkDeleted(row){
  if(!row) return row;
  row.deleted = false;
  // DELETED, not set to null. A row that never carried the key must come back
  // without it, or an undo is not a restoration -- 'undo restores a deleted
  // list exactly' compares the row byte for byte and is right to.
  delete row.deletedAt;
  return row;
}

function softDelete(coll, id, label){
  const row = (S[coll]||[]).find(x => x.id === id);
  if(!row) return null;
  markDeleted(row); save(); render();
  const undo = () => { unmarkDeleted(row); save(); render(); toast('Restored ' + label); };
  toast('Deleted ' + label, { label:'Undo', fn:undo });
  return undo;
}

// ---------- Claude API ----------
const API_URL = 'https://api.anthropic.com/v1/messages';
const MODEL = 'claude-sonnet-4-6';


// ---------------------------------------------------------------------------
// Provider dispatch. Anthropic remains fully intact and is still the default;
// the local model is an additional option, never a replacement.
// ---------------------------------------------------------------------------
// Never hardcode a provider name in the interface -- it will lie the moment the
// user switches. These follow whatever is actually configured.
// Gordon is the assistant's name in the interface. The model behind him is an
// implementation detail that can change (Anthropic, a local model, whatever
// comes next) without the app's voice changing. The real model is still shown
// where it matters -- in Settings, in the self-test, and on each event's
// provenance line -- so a bad extraction can still be traced.
const ASSISTANT_NAME = 'Gordon';

// ---------------------------------------------------------------------------
// FlyerSnap's own monthly ceiling on Anthropic spending (v10.5).
//
// WHAT THIS IS NOT. It is not the spend limit at Anthropic, and it does not
// replace one. This is the app counting what IT has spent and stopping itself.
// Anyone holding the key can spend without limit from anywhere -- curl, another
// app, a phone someone else is holding -- because Anthropic has never heard of
// this rule. A lock on the inside of the door.
//
// What it IS good for is the thing that actually happens: this app surprising
// you. An automatic email pass that keeps falling back to Anthropic on PDFs, a
// big import, a bug in a future version. Those all run through here.
//
// Prices for MODEL, read 4 Sep 2026 from
// https://platform.claude.com/docs/en/about-claude/pricing
//   input $3 / million, output $15 / million.
// One band: 4.6 carries the full context window at standard pricing, so there
// is no long-context premium to model. Images bill as input tokens at the same
// rate, so a flyer photo needs no special case.
//
// A PRICE IN A CONSTANT GOES STALE. Everything built on it says "estimate" in
// the interface for exactly that reason. It is a guardrail, not an invoice.
const AI_PRICE_IN = 3 / 1e6;
const AI_PRICE_OUT = 15 / 1e6;

function spendMonth(){ return todayISO().slice(0, 7); }     // 'YYYY-MM'
/** Estimated Anthropic spend so far this month. A new month reads as zero. */
function spendThisMonth(){
  const s = S.settings.aiSpend;
  return (s && s.month === spendMonth() && Number.isFinite(s.usd)) ? s.usd : 0;
}
/** Charge a completed Anthropic call. Local calls never come through here. */
function addSpend(inTok, outTok){
  const usd = (Number(inTok) || 0) * AI_PRICE_IN + (Number(outTok) || 0) * AI_PRICE_OUT;
  if(!(usd > 0)) return;
  S.settings.aiSpend = { month: spendMonth(), usd: spendThisMonth() + usd };
}
/** The ceiling in whole dollars, or 0 for "no ceiling". */
function spendCap(){
  const n = Number(S.settings.aiCapUsd);
  return Number.isFinite(n) && n > 0 ? n : 0;
}
function spendCapHit(){
  const cap = spendCap();
  return cap > 0 && spendThisMonth() >= cap;
}
/** Clear the running count. The cap itself is left alone. */
function resetSpendCount(){
  const before = S.settings.aiSpend;
  S.settings.aiSpend = { month: spendMonth(), usd: 0 };
  save(); render();
  toast('Count reset to $0.00', { label:'Undo', fn:() => {
    S.settings.aiSpend = before; save(); render(); toast('Put back');
  }});
}

function aiName(){ return ASSISTANT_NAME; }

// ---------- Routing benchmark (see js/route-score.js, js/bench-cases.js) ----
//
// Measures how well the CURRENT provider turns a sentence into an intent. It
// runs here rather than on the desktop for one reason: the API key lives in
// this browser's storage, so a Node script cannot reach the provider actually
// in use. tools/eval-router.js runs the same corpus through the same scorer
// when a key is available on the desktop; the two cannot disagree, because
// they share both files.
//
// SAFETY. This routes and scores. It NEVER calls performRoute, so no case can
// draft, propose or write anything -- a corpus containing "delete the dentist
// appointment" must not be able to touch a real event. There is a test.
let benchState = null;   // { running, done, i, total, results, cancelled, provider, model, ms }

function benchMeta(){
  return { consequenceOf: (id) => (intentById(id) || {}).consequence || null,
           isDestructive: (id) => !!(intentById(id) || {}).destructive };
}

// Reading a flyer is what this app is FOR, and until v9.19 it had never been
// measured -- the harness existed from v9.6 and could never be run, because
// the key is here rather than on the desktop.
//
// Same safety property as the routing benchmark: this extracts and scores. It
// never touches pendingEvents, never opens the review screen, never saves. A
// benchmark that could write would be a benchmark nobody dares run.
async function runExtractionBench(){
  if(benchState && benchState.running) return;
  benchState = { kind:'extraction', running:true, done:false, i:0,
                 total:EXTRACT_BENCH.cases.length, results:[], cancelled:false,
                 provider:aiProvider(), model:aiModelName(),
                 startedAt:Date.now(), ms:0, error:'' };
  sub('bench');
  try{
    for(const c of EXTRACT_BENCH.cases){
      if(benchState.cancelled) break;
      benchState.i++;
      render();
      await new Promise(r => setTimeout(r, 0));
      let events = [];
      let transportError = null;
      try{
        // The SHIPPING prompt, and the app's own parser, so this measures the
        // pipeline rather than a clean-room reimplementation of it.
        const text = await callAI(
          [{ type:'text', text:`Today is ${c.today}.\n\n${c.source}` },
           { type:'text', text: eventPrompt() }],
          3000, GROUNDING_EVENTS, 'bench.extract');
        events = parseExtractedEvents(text) || [];
      }catch(err){
        transportError = (err && err.message) || String(err);
      }
      const r = scoreExtraction(c.expected, events);
      benchState.results.push(Object.assign({ id:c.id, transportError }, r));
    }
  }catch(err){
    benchState.error = (err && err.message) || String(err);
  }
  benchState.running = false;
  benchState.done = true;
  benchState.ms = Date.now() - benchState.startedAt;
  render();
}

async function runRoutingBench(){
  if(benchState && benchState.running) return;
  benchState = { kind:'routing', running:true, done:false, i:0, total:BENCH.cases.length,
                 results:[], cancelled:false, provider:aiProvider(), model:aiModelName(),
                 startedAt:Date.now(), ms:0, error:'' };
  sub('bench');
  const system = buildRouterPrompt();
  try{
    for(const c of BENCH.cases){
      if(benchState.cancelled) break;
      benchState.i++;
      render();
      // Yield so the progress actually paints between calls.
      await new Promise(r => setTimeout(r, 0));
      let route;
      try{
        // Exactly the path a typed sentence takes, quickRoute included.
        // Measuring the model alone would measure something no user meets.
        route = quickRoute(c.sentence, { names: BENCH.names })
          || routeFromText(cleanModelText(await callAI(
              [{ type:'text', text:`Today is ${BENCH.today}.\n\nSentence: ${c.sentence}` }],
              300, system, 'bench.route')));
      }catch(err){
        // A transport failure is not a routing failure, but it must not be
        // silently scored as one either -- it is recorded and shown.
        route = { ok:false, intent:'unknown', params:{} };
        benchState.results.push(Object.assign({ bucket:c.bucket, transportError: err && err.message },
          scoreCase(c, route, benchMeta())));
        continue;
      }
      benchState.results.push(Object.assign({ bucket:c.bucket }, scoreCase(c, route, benchMeta())));
    }
  }catch(err){
    benchState.error = (err && err.message) || String(err);
  }
  benchState.running = false;
  benchState.done = true;
  benchState.ms = Date.now() - benchState.startedAt;
  render();
}

function cancelRoutingBench(){
  if(benchState) benchState.cancelled = true;
  toast('Stopping after this one');
}

function benchSummary(){
  if(!benchState) return null;
  return benchState.kind === 'extraction'
    ? aggregateExtraction(benchState.results)
    : summarise(benchState.results);
}

// The file that goes back to the desktop. Sentences and labels only -- they
// came from the repo, not from Logan's data -- plus what each one routed to.
// Deliberately carries no events, no notes, no API key, exactly like the
// diagnostics export.
function exportBenchmark(){
  if(!benchState || !benchState.results.length){ toast('Nothing to export yet'); return; }
  if(benchState.kind === 'extraction') return exportExtractionBenchmark();
  try{
    const s = benchSummary();
    const payload = {
      kind: 'flyersnap-router-benchmark',
      version: 1,
      generatedAt: new Date().toISOString(),
      app: { version: APP_VERSION, provider: benchState.provider, model: benchState.model,
             elapsedMs: benchState.ms },
      corpusToday: BENCH.today,
      summary: s,
      verdict: verdict(s),
      cases: benchState.results.map(r => ({
        id:r.id, bucket:r.bucket, sentence:r.sentence, expected:r.expected, got:r.got,
        pass:r.pass, intentOk:r.intentOk,
        destructiveEscalation:r.destructiveEscalation, writeEscalation:r.writeEscalation,
        missedRefusal:r.missedRefusal, overRefusal:r.overRefusal,
        missing:r.missing, wrongValue:r.wrongValue, invented:r.invented,
        // The reason a refusal happened, so the next reader does not have to
        // guess between four different bugs.
        why: r.why || undefined,
        transportError: r.transportError ? redact(r.transportError) : undefined,
      })),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'flyersnap-router-benchmark-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast(`Exported ${payload.cases.length} results`);
  }catch(e){
    alert('Could not build the benchmark file: ' + (e && e.message));
  }
}

// ---------- AI call logging (see js/ailog.js) ----------
// Field names follow the OpenTelemetry GenAI conventions so the log means
// what an engineer would expect. Prompt and answer text are NEVER recorded:
// in this app the prompts are children's names, schools and schedules.
function recordAiCall(fields){
  try{
    S.aiLog = appendEntry(S.aiLog || [], makeEntry(
      Object.assign({ at: new Date().toISOString() }, fields)));
    save();
  }catch(e){ /* logging must never break the thing it is logging about */ }
}

// ---------- Theme ----------
function systemPrefersLight(){
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
}
function applyTheme(){
  const resolved = resolveTheme(themePref(S.settings), systemPrefersLight());
  const root = document.documentElement;
  if(resolved === 'light') root.setAttribute('data-theme', 'light');
  else root.removeAttribute('data-theme');           // bare :root IS dark
  // Keep the browser/status-bar chrome in step. One meta, updated here,
  // rather than two media-scoped ones -- those cannot follow an explicit
  // choice that disagrees with the phone.
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', THEME_META[resolved]);
  return resolved;
}
function setTheme(pref){
  S.settings.theme = THEMES.includes(pref) ? pref : DEFAULT_THEME;
  save(); applyTheme(); render();
  toast(THEME_LABELS[S.settings.theme]);
}
// "Match my phone" has to keep matching when the phone changes at sunset.
if(window.matchMedia){
  try{
    window.matchMedia('(prefers-color-scheme: light)')
      .addEventListener('change', () => { if(themePref(S.settings) === 'system'){ applyTheme(); render(); } });
  }catch(e){ /* older WebKit: the choice still works, it just will not follow live */ }
}
