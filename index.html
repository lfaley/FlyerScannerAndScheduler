// ruling it broke is quoted in toReportDoc below.
//
// Audited 31 Aug 2026 against every logProblem call site in index.html:
//   Storage      surviving localStorage key names     content-free
//   Gordon       aiModelName() / a fixed sentence     content-free
//   Local model  aiModelName()                        content-free
//   Recipe scan  a file-read error message            content-free
//   App          filename:lineno / a rejection text   diagnostics, allowed
//   Assistant    a transport error message            diagnostics, allowed
//   Scanning     the user's own typed scan context    WITHHELD
//   Email: ...   the email subject                    WITHHELD
//
// An unlabelled problem ('' or null) is withheld too: an unknown call site is
// exactly the one whose detail nobody has audited.
const CONTENT_FREE_WHERE = new Set(
  ['Storage', 'Gordon', 'Local model', 'Recipe scan', 'App', 'Assistant']);

function isThirdPartyContent(where){
  return !CONTENT_FREE_WHERE.has(String(where || ''));
}

/**
 * One Problem Log entry -> one v2-contract report document (plain object).
 * ctx carries the environment: { version, url, userAgent, standalone }.
 */
function toReportDoc(problem, ctx){
  const c = ctx || {};
  const createdAt = Date.parse(problem.first || '') || Date.parse(problem.last || '') || 0;
  const docOut = {
    // Deterministic per problem (same problem re-queued -> same id -> the
    // 409 on redelivery dedups it server-side), newest-first sortable.
    reportId: newestFirstId('fs', createdAt, String(problem.id || 'unknown')),
    createdAt: createdAt,
    type: 'problem',
    message: redact(String(problem.where || 'App') + ': ' + String(problem.message || '')).slice(0, 2000),
    app: ERROR_REPORT_APP,
    appVersion: String(c.version || ''),
    severity: 'error',
    fingerprint: reportFingerprint(problem.where, problem.message),
    standalone: !!c.standalone,
    url: String(c.url || ''),
    userAgent: String(c.userAgent || '').slice(0, 500),
  };
  // RULING 2026-08-23 (ERROR-LOGGING-STANDARD.md §6, via ERROR-LOGGING-RULINGS-REPLY.md):
  // every field of an AUTOMATIC report is DIAGNOSTICS-ONLY. Third-party or
  // processed content never leaves the device automatically; `description` is
  // for model names and status codes, never for the thing being processed.
  // A deliberately user-filed report is the exception, on the one-tap consent
  // model -- FlyerSnap has no such path today, so nothing here is exempt.
  //
  // The case that forced the ruling: the Gmail watcher passes the email SUBJECT
  // as logProblem's `detail` (index.html:6221, used at :6236/:6240/:6245), so
  // "Braelyn's Field Trip Permission Slip - Maple Elementary" was reaching the
  // shared database. redact() scrubs API keys and email ADDRESSES only, so the
  // sender was redacted and the subject was not. The recipe app had the same
  // exposure and wider (button labels in actionTrail); fixed there the same day.
  //
  // Withheld here at the BOUNDARY rather than at the three call sites, so the
  // subject still reaches the local Problem Log -- where it is the only thing
  // identifying WHICH email failed -- and the diagnostics file, which Logan
  // shares one tap at a time to a recipient he picks.
  if(problem.detail && !isThirdPartyContent(problem.where)){
    docOut.description = redact(String(problem.detail)).slice(0, 400);
  }
  if(problem.count > 1) docOut.occurrenceCount = problem.count;
  return docOut;
}

/** Plain object -> Firestore REST typed `fields` map. */
function toRestFields(docOut){
  const fields = {};
  for(const k of Object.keys(docOut)){
    const v = docOut[k];
    if(typeof v === 'boolean') fields[k] = { booleanValue: v };
    else if(typeof v === 'number') fields[k] = { integerValue: String(Math.trunc(v)) };
    else fields[k] = { stringValue: String(v) };
  }
  return fields;
}

/** The create-document endpoint for one report id. */
function reportRestUrl(docId){
  return 'https://firestore.googleapis.com/v1/projects/' + ERROR_REPORT_PROJECT +
    '/databases/(default)/documents/errorReports?documentId=' + encodeURIComponent(docId) +
    '&key=' + ERROR_REPORT_KEY;
}
// --- end js/errorReport.js ---

// ---------------------------------------------------------------------------
// Problem log. Errors used to appear in a toast or an alert and then vanish, so
// a pattern ("this sender always fails") was impossible to notice. Every
// problem now lands here: persisted, grouped by how often it has happened, and
// dismissable once dealt with. A backlog, not a stack trace dump.
// ---------------------------------------------------------------------------
function logProblem(where, message, detail){
  try{
    if(!S.problems) S.problems = [];
    const msg = String(message || 'Unknown problem').slice(0, 300);
    // Group repeats: numbers vary between occurrences, the shape does not.
    const key = where + '|' + msg.replace(/\d+/g, 'N').slice(0, 120);
    const now = new Date().toISOString();
    const hit = S.problems.find(p => p.key === key && !p.done);
    if(hit){
      hit.count++; hit.last = now;
      if(detail) hit.detail = String(detail).slice(0, 400);
    } else {
      S.problems.unshift({ id: uid(), key, where, message: msg,
        detail: detail ? String(detail).slice(0, 400) : null,
        first: now, last: now, count: 1, done: false });
      queueErrorReport(S.problems[0]);
    }
    if(S.problems.length > 60) S.problems = S.problems.filter(p => !p.done).slice(0, 60);
    save();
  }catch(e){ /* logging must never break the thing it is logging about */ }
}

// Select mode for the Problem Log. `null` = not selecting (the normal state);
// a Set of problem ids = selecting. Held outside S because it is view state,
// not data -- it must never be saved or reach a backup.
let problemSel = null;

function openProblems(){ problemSel = null; sub('problems'); }

function toggleProblemSelect(){
  problemSel = problemSel ? null : new Set();
  render();
}
function toggleProblemPick(id){
  if(!problemSel) return;
  if(problemSel.has(id)) problemSel.delete(id); else problemSel.add(id);
  render();
}
function selectAllProblems(){
  const all = (S.problems || []).map(p => p.id);
  // One control, both directions: if everything is already picked it clears,
  // which is the only sane meaning of tapping "Select all" a second time.
  problemSel = (problemSel && problemSel.size === all.length) ? new Set() : new Set(all);
  render();
}
function selectedProblems(){
  if(!problemSel) return [];
  return (S.problems || []).filter(p => problemSel.has(p.id));
}
function resolveSelectedProblems(){
  const picked = selectedProblems();
  if(!picked.length) return;
  const now = new Date().toISOString();
  picked.forEach(p => { p.done = true; p.resolved = now; });
  problemSel = null;
  save();
  toast('Marked ' + picked.length + ' done');
  render();
}
/**
 * Remove the picked rows outright. Undoable: `before` is the whole array as it
 * stood, so restoring puts every row back in its original position -- the log
 * is read newest-first and an undo that reorders it is not an undo.
 */
function deleteSelectedProblems(){
  if(!problemSel || !problemSel.size) return;
  const before = (S.problems || []).slice();
  const n = problemSel.size;
  S.problems = before.filter(p => !problemSel.has(p.id));
  problemSel = null;
  save();
  render();
  toast('Deleted ' + n + ' problem' + (n === 1 ? '' : 's'), { label:'Undo', fn:() => {
    S.problems = before; save(); render(); toast('Restored');
  }});
}
/**
 * Empty the log. The only control here that touches rows you cannot see, which
 * is why it confirms as well as offering the undo.
 */
function clearAllProblems(){
  const before = (S.problems || []).slice();
  if(!before.length) return;
  if(!confirm('Clear all ' + before.length + ' entries from the Problem Log?\n\nThis only clears the list — it does not fix anything, and new problems will still be recorded.')) return;
  S.problems = [];
  problemSel = null;
  save();
  render();
  toast('Problem Log cleared', { label:'Undo', fn:() => {
    S.problems = before; save(); render(); toast('Restored');
  }});
}


function activeProblems(){ return (S.problems||[]).filter(p => !p.done); }

function resolveProblem(id){
  const p = (S.problems||[]).find(x => x.id === id);
  if(p){ p.done = true; p.resolved = new Date().toISOString(); save(); }
  render();
}
function reopenProblem(id){
  const p = (S.problems||[]).find(x => x.id === id);
  if(p){ p.done = false; delete p.resolved; save(); }
  render();
}
function clearResolvedProblems(){
  S.problems = (S.problems||[]).filter(p => !p.done);
  save(); render();
}

// ---------------------------------------------------------------------------
// Remote error reporting glue (v9.24). The pure builders live in
// js/errorReport.js (inlined above); this half does the I/O. Same
// non-negotiables as the AI log: redact() has already scrubbed the text,
// reporting must never break the thing it reports on, and NOTHING here runs
// at boot or blocks it -- delivery is lazy, the app keeps working with no
// network, and an unreachable Firestore just leaves entries in the outbox.
// Each report lands in the admin console's Logs tab under the `flyersnap`
// badge (ERROR-REPORTING-PLAN.md). Opt out: S.settings.errorReportsOff = true.
// NEVER call logProblem from inside this section -- a failing reporter
// reporting itself is a loop.
const ERROR_OUTBOX_LS = 'flyersnap-error-outbox';
function errorOutboxRead(){
  try{
    const a = JSON.parse(localStorage.getItem(ERROR_OUTBOX_LS) || '[]');
    return Array.isArray(a) ? a : [];
  }catch(e){ return []; }
}
function errorOutboxWrite(list){
  try{ localStorage.setItem(ERROR_OUTBOX_LS, JSON.stringify(list.slice(-ERROR_OUTBOX_MAX))); }catch(e){ /* THE ERROR REPORTER MUST NOT THROW. A failure here would be reported through the thing that just failed (CLAUDE.md rule 28) */ }
}
function queueErrorReport(problem){
  try{
    if(S && S.settings && S.settings.errorReportsOff) return;
    const docOut = toReportDoc(problem, {
      version: APP_VERSION,
      url: location.origin + location.pathname,
      userAgent: navigator.userAgent,
      standalone: !!(navigator.standalone ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)),
    });
    errorOutboxWrite(errorOutboxRead().filter(d => d.reportId !== docOut.reportId).concat([docOut]));
    setTimeout(() => { flushErrorReports(); }, 0);
  }catch(e){ /* reporting must never break the app */ }
}
// Which failures are worth trying again (v10.0). Firestore's own error table
// carries a "Recommended action" column, and this follows it:
//   https://cloud.google.com/firestore/native/docs/use-rest-api
//   400 INVALID_ARGUMENT / FAILED_PRECONDITION  do not retry without fixing
//   401 UNAUTHENTICATED                         do not retry without fixing
//   403 PERMISSION_DENIED                       do not retry without fixing
//   404 NOT_FOUND                               do not retry without fixing
//   409 ALREADY_EXISTS                          do not retry without fixing
//   409 ABORTED                                 retry
//   429 RESOURCE_EXHAUSTED                      backoff
//   500 INTERNAL                                "do not retry more than once"
//   503 UNAVAILABLE / 504 DEADLINE_EXCEEDED     retry with exponential backoff
//
// Both 409s share a status number and are told apart only by `error.status` in
// the body (AIP-193), which is why reportAborted reads it. For a create with an
// explicit documentId, ALREADY_EXISTS is the far likelier of the two.
//
// The policy lives here rather than in js/errorReport.js because it is about
// this I/O half; the module holds the pure builders.
const REPORT_DEAD_STATUS = [400, 401, 403, 404];
const REPORT_TRIES_MAX = 6;
const REPORT_TRIES_500 = 2;   // Firestore: do not retry INTERNAL more than once
const ERROR_TRIES_LS = 'flyersnap-error-tries';
function errorTriesRead(){
  try{
    const o = JSON.parse(localStorage.getItem(ERROR_TRIES_LS) || '{}');
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  }catch(e){ return {}; }
}
function errorTriesWrite(o){
  try{ localStorage.setItem(ERROR_TRIES_LS, JSON.stringify(o)); }catch(e){ /* THE ERROR REPORTER MUST NOT THROW (rule 28) */ }
}
/** Is this 409 the retryable one? Never throws; an unreadable body means no. */
async function reportAborted(res){
  try{
    if(!res || typeof res.text !== 'function') return false;
    const body = JSON.parse(await res.text());
    return !!(body && body.error && body.error.status === 'ABORTED');
  }catch(e){ return false; }
}

let errorFlushBusy = false;
async function flushErrorReports(){
  if(errorFlushBusy) return;
  errorFlushBusy = true;
  try{
    if(S && S.settings && S.settings.errorReportsOff) return;
    if(navigator.onLine === false) return;
    const tries = errorTriesRead();
    const drop = (id) => {
      delete tries[id];
      errorOutboxWrite(errorOutboxRead().filter(d => d.reportId !== id));
    };
    for(const docOut of errorOutboxRead()){
      let res;
      try{
        res = await fetch(reportRestUrl(docOut.reportId), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: toRestFields(docOut) })
        });
      }catch(e){ break; } // offline/blocked -- the outbox keeps everything
      const status = res ? res.status : 0;
      // Delivered, or never deliverable. Either way it leaves the queue, and
      // the loop CONTINUES -- until v10.0 a permanent failure returned, so one
      // malformed report blocked every report behind it for the life of the
      // install. Measured: with a 400 at the head, the entry after it was never
      // attempted on any pass, and the 400 was re-sent on every flush and every
      // boot, forever.
      const settled = res && (res.ok || REPORT_DEAD_STATUS.indexOf(status) >= 0 ||
        (status === 409 && !(await reportAborted(res))));
      if(settled){ drop(docOut.reportId); continue; }
      // Transient: 409 ABORTED, 429, 5xx, or no status at all. Worth trying
      // again -- but not without end. A server that has refused the same
      // document six times is not going to accept it on the seventh, and the
      // outbox is the only thing standing between that and a report that is
      // retried at every boot for years.
      const n = (tries[docOut.reportId] || 0) + 1;
      const cap = status === 500 ? REPORT_TRIES_500 : REPORT_TRIES_MAX;
      if(n >= cap){ drop(docOut.reportId); continue; }
      tries[docOut.reportId] = n;
      errorTriesWrite(tries);
      break; // still worth retrying -- do not hammer the rest of the queue now
    }
    // Counters for documents that have left the queue would otherwise
    // accumulate in localStorage forever.
    const live = errorOutboxRead().map(d => d.reportId);
    Object.keys(tries).forEach(id => { if(live.indexOf(id) < 0) delete tries[id]; });
    errorTriesWrite(tries);
  }catch(e){ /* never throw out of the reporter */
  } finally { errorFlushBusy = false; }
}
// Leftovers from a page that died mid-write get delivered on the next launch.
// Scheduled ONLY when something is actually waiting, so a normal boot adds no
// timer and no work.
try{ if(errorOutboxRead().length) setTimeout(() => { flushErrorReports(); }, 8000); }catch(e){ /* runs at BOOT. Nothing here may stop the app starting -- the v8.1-v8.5 blank screen began as a boot-time throw */ }


function renderProblems(m){
  setHeader('Problem Log', true);
  const all = S.problems || [];
  const open = all.filter(p => !p.done);
  const done = all.filter(p => p.done);

  if(!all.length){
    m.innerHTML = `<div class="empty"><div class="et">Nothing has gone wrong</div>
      <div class="eb">When something fails — an email that will not read, a model that is offline — it is recorded here so you can come back to it.</div></div>`;
    return;
  }

  const picking = !!problemSel;
  const nPicked = problemSel ? problemSel.size : 0;

  const row = (p) => {
    // Tier the stripe and offer a next step, read from the entry's own text
    // (no schema change). Red = you must act; amber = transient/unknown.
    const g = p.done ? { tier:'', hint:'' } : problemGuidance((p.message || '') + ' ' + (p.detail || ''));
    const stripe = p.done ? 'var(--line)' : (g.tier === 'act' ? 'var(--red-accent)' : 'var(--amber)');
    return `<div class="card" style="border-left:5px solid ${stripe}">
    <div class="row">
      ${picking ? `<input type="checkbox" style="margin-right:10px;flex:none"
        aria-label="Select: ${esc(p.message)}"
        ${problemSel.has(p.id)?'checked':''}
        onclick="event.stopPropagation();toggleProblemPick('${p.id}')">` : ''}
      <div class="grow" ${picking?`role="button" tabindex="0"
        onclick="toggleProblemPick('${p.id}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleProblemPick('${p.id}')}"`:''}>
        <div style="font-weight:700;font-size:var(--t-sm)">${esc(p.message)}</div>
        <div class="meta" style="font-size:var(--t-cap)">
          ${esc(p.where)}${p.count>1?' · happened '+p.count+' times':''} · last <span title="${esc(String(p.last).slice(0,10))}">${esc(relativeTime(p.last) || String(p.last).slice(0,10))}</span>
        </div>
        ${p.detail?`<div style="font-size:var(--t-sm);word-break:break-word;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:text;user-select:text;margin-top:6px">${esc(p.detail)}</div>`:''}
        ${g.hint?`<div class="meta" style="font-size:var(--t-cap);margin-top:6px;font-weight:600;color:var(--${g.tier==='act'?'red-accent':'accent'})">→ ${esc(g.hint)}</div>`:''}
      </div>
      <button class="linkbtn" onclick="${p.done?"reopenProblem('"+p.id+"')":"resolveProblem('"+p.id+"')"}">${p.done?'Reopen':'Done'}</button>
    </div>
    ${picking ? '' : `<div class="row" style="justify-content:flex-end;gap:2px;margin-top:4px">
      <button class="linkbtn" onclick="copyProblem('${p.id}')">${ico('clipboard')}Copy</button>
      <button class="linkbtn" onclick="shareProblem('${p.id}')">${ico('share')}Share</button>
    </div>`}</div>`;
  };

  let html = '';

  // The select bar. Kept at the TOP so the count and the escape hatch are
  // visible without scrolling back up from a long log.
  if(picking){
    html += `<div class="card" style="padding:12px;border-left:5px solid var(--accent)">
      <div class="row">
        <div class="grow" style="font-weight:700;font-size:var(--t-sm)">${nPicked} selected</div>
        <button class="linkbtn" onclick="selectAllProblems()">${nPicked === all.length ? 'Select none' : 'Select all'}</button>
        <button class="linkbtn" onclick="toggleProblemSelect()">Cancel</button>
      </div>
      <div class="formrow" style="margin-top:10px">
        <button class="btn sm" ${nPicked?'':'disabled'} onclick="resolveSelectedProblems()">Mark done</button>
        <button class="btn sm alt" ${nPicked?'':'disabled'}
          style="border-color:var(--red-accent);color:var(--red-accent)"
          onclick="deleteSelectedProblems()">Delete</button>
      </div>
    </div>`;
  } else {
    html += `<div class="row" style="justify-content:flex-end">
      <button class="linkbtn" onclick="toggleProblemSelect()">Select</button></div>`;
  }

  if(open.length){
    html += `<div class="help">${open.length} thing${open.length===1?'':'s'} to look at. Repeats are grouped, so a count means it keeps happening.</div>`;
    html += open.map(row).join('');
  } else {
    html += `<div class="help">Nothing outstanding.</div>`;
  }
  if(done.length){
    html += `<div class="sect">Resolved (${done.length})</div>` + done.slice(0,10).map(row).join('');
    html += `<button class="btn alt" onclick="clearResolvedProblems()">Clear resolved</button>`;
  }

  html += `<div style="height:12px"></div>
    <button class="btn alt" style="border-color:var(--red-accent);color:var(--red-accent)"
      onclick="clearAllProblems()">${ico('trash')}Clear all (${all.length})</button>
    <div class="help" style="font-size:12px">Clearing only empties the list. It does not fix
      anything, and it does not stop new problems being recorded.</div>`;

  m.innerHTML = html;
}

async function openSenderManager(){
  if(!watcherConfigured()){ alert('Connect the Gmail watcher first.'); return; }
  sub('busy', {msg:'Loading senders…', hint:''});
  try{
    watchedSenders = await fetchSenders();
    sub('senders');
  }catch(err){ alert('Could not load senders:\n\n'+err.message); nav('settings'); }
}
// FlyerSnap remembers which email messages it has already imported, separately
// from the Apps Script's own history. Clearing the script's memory alone is not
// enough to re-read a message -- this clears ours too.
function forgetImportedEmails(){
  const n = (S.settings.seenMsgs || []).length;
  if(!n){ toast('No imported emails to forget'); return; }
  if(!confirm('Forget ' + n + ' already-imported email' + (n===1?'':'s') + '?\n\nThe next check will offer their events again. Run resetWatcher then checkMail in the Apps Script editor first, so the script re-queues them.')) return;
  S.settings.seenMsgs = [];
  S.settings.lastEmailCheck = null;
  save();
  toast('Forgotten — now tap Check my email now');
  render();
}

function renderSenders(m){
  setHeader('Watched Senders', true);
  const list = watchedSenders || [];
  let html = `<div class="help">FlyerSnap scans email from these senders for dates. Add a full address (jane@school.org) or a whole domain (school.org). Tag a sender with a person and events from them arrive pre-tagged — you can still adjust before saving.</div>
    <div class="formrow">
      <input type="text" id="newSender" aria-label="Sender address or domain to watch" placeholder="domain.com or name@domain.com" autocapitalize="none" autocorrect="off" spellcheck="false"
      value="${esc(draft('newSender'))}" oninput="setDraft('newSender', this.value)">
      <button class="btn sm" onclick="addSender()">Add</button>
    </div>`;
  if(!list.length){
    html += `<div class="help" style="font-style:italic">No senders yet — add at least one.</div>`;
  } else {
    html += list.map((s,i)=>{
      const tagged = (S.settings.senderTags||{})[s.toLowerCase()] || [];
      const people = allPeople();
      const chips = people.length ? `<div style="margin-top:8px"><span class="label" style="margin-right:4px">Tag as:</span>` +
        people.map(p=>`<span class="chip" style="${tagged.includes(p.id)?`background:${p.color};border-color:${p.color};color:var(--on-accent)`:''}"
          onclick="toggleSenderTag('${esc(s.toLowerCase())}','${p.id}')">${esc(p.name)}</span>`).join('') + `</div>` : '';
      return `<div class="card" style="padding:12px">
        <div class="row"><div class="grow" style="font-size:14px;word-break:break-all">${esc(s)}</div>
          <button class="linkbtn red" onclick="removeSender(${i})">Remove</button></div>${chips}</div>`;
    }).join('');
  }
  html += `<div style="height:8px"></div>
    <div class="help">Changes take effect on the next 15-minute run. Keep the list tight — each sender's mail is read by ${esc(aiName())} and counts toward the daily cap.</div>`;
  m.innerHTML = html;
}
function toggleSenderTag(sender, personId){
  if(!S.settings.senderTags) S.settings.senderTags = {};
  const cur = S.settings.senderTags[sender] || [];
  const at = cur.indexOf(personId);
  if(at >= 0) cur.splice(at,1); else cur.push(personId);
  if(cur.length) S.settings.senderTags[sender] = cur; else delete S.settings.senderTags[sender];
  save();
  // Re-render only the senders screen, preserving scroll position, so the chips
  // stay put and readable instead of the whole view jumping.
  const y = window.scrollY;
  renderSenders(document.getElementById('main'));
  window.scrollTo(0, y);
}
function addSender(){
  const el = document.getElementById('newSender');
  const v = (el.value||'').trim().toLowerCase();
  if(!v) return;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$|^[^@\s]+\.[^@\s]+$/.test(v)){
    alert('Enter a domain like "school.org" or an address like "name@school.org".'); return;
  }
  watchedSenders = watchedSenders || [];
  if(watchedSenders.some(s=>s.toLowerCase()===v)){ toast('Already in the list'); return; }
  watchedSenders.push(v);
  clearDraft('newSender');
  persistSenders();
}
function removeSender(i){
  watchedSenders.splice(i,1);
  persistSenders();
}
async function persistSenders(){
  render();                                    // show the change immediately
  try{
    const returned = await saveSenders(watchedSenders);
    // Trust our local list for ordering/visibility; only adopt the server's
    // set if it actually differs, and never yank the screen around mid-tagging.
    if(Array.isArray(returned) && returned.length !== watchedSenders.length){
      watchedSenders = returned;
      render();
    }
    toast('Senders updated');
  }catch(err){
    // The domain didn't save server-side — roll back so the UI stays honest.
    alert('Could not save to the watcher:\n\n'+err.message);
    try{ watchedSenders = await fetchSenders(); render(); }catch(e){ /* already inside the failure path: the alert above told the user. A second failure here leaves the stale list, which is the honest thing to show */ }
  }
}

async function checkEmail(silent){
  if(!watcherConfigured()){
    if(!silent){ alert('Set up the Gmail watcher in Settings first.'); nav('settings'); }
    return;
  }
  if(!silent) sub('busy', {msg:'Checking email…', hint:'Looking for new flyers'});
  try{
    const { fresh } = await fetchEmailQueue();
    S.settings.lastEmailCheck = new Date().toISOString();
    if(!fresh.length){
      // Nothing waiting means the badge must say nothing waiting.
      // openEmailReviewNow() already did this; this path did not, so a queue
      // that emptied any other way left a stale count on the Events tab.
      S.settings.pendingEmailCount = 0;
      save();
      if(silent){ render(); } else { toast('No new events in your email'); back(); }
      return;
    }
    if(silent){
      // Don't hijack the screen — just flag it on the Events tab.
      S.settings.pendingEmailCount = fresh.length;
      save(); render();
      return;
    }
    await openEmailReview(fresh);
  }catch(err){
    if(silent){ console.log('Email check failed: ' + err.message); return; }
    alert('Could not reach the watcher: ' + err.message);
    back();
  }
}

async function openEmailReviewNow(){
  sub('busy', {msg:'Loading…', hint:''});
  try{
    const { fresh } = await fetchEmailQueue();
    if(!fresh.length){ toast('Nothing new'); S.settings.pendingEmailCount = 0; save(); nav('events'); return; }
    await openEmailReview(fresh);
  }catch(err){ alert('Could not reach the watcher: ' + err.message); back(); }
}

// Queue items arrive in one of two shapes: already-extracted events (the old
// path) or raw email text for the app to extract (RAW_MODE). Handle both, so a
// mixed queue during the changeover still works.
// Ask the watcher for one message's prepared text and its attachments.
// A queue entry is either a finished event (has a date/title) or a reference to
// a message the app still needs to fetch and extract.
function isMessageRef(i){
  if(!i || !i.msgId) return false;
  if(typeof i.raw === 'string' && i.raw.length) return true;   // legacy shape
  return !i.date && !i.title;
}

async function fetchMessage(msgId){
  const base = watcherBaseUrl();
  const url = base + '?token=' + encodeURIComponent((S.settings.watcherToken||'').trim()) +
    '&action=message&msgId=' + encodeURIComponent(msgId);
  const data = await jsonpRequest(url, 60000);
  if(!data || data.error) throw new Error((data && data.error) || 'no response');
  return data;
}

// A single email can carry dates in the body AND on an attached flyer image.
// Neither pass alone is enough: a text model cannot see the image, and reading
// only the image loses the body. So run both and merge.
function providerLabel(){ return aiModelName(); }

// One email can hold the date on a flyer, the dress code in the body, and the
// kit list in an attached PDF. Separate passes cannot see across those, so we
// send everything in a SINGLE request first and let the model correlate. Only
// if that is impossible (a PDF on a provider that cannot read PDFs, or a payload
// too large) do we fall back to per-source passes.
function emailBlocks(payload, includeAttachments){
  const blocks = [];
  const atts = (includeAttachments && Array.isArray(payload.attachments))
    ? payload.attachments : [];

  atts.forEach((att, i) => {
    blocks.push({ type:'text', text:'--- ATTACHMENT ' + (i+1) + ': ' + (att.name||'file') + ' ---' });
    blocks.push(att.mediaType === 'application/pdf'
      ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:att.data } }
      : { type:'image',    source:{ type:'base64', media_type:att.mediaType,     data:att.data } });
  });

  if(payload.text && payload.text.trim().length > 20){
    blocks.push({ type:'text', text:
      '--- EMAIL BODY ---\nFrom: ' + (payload.from||'unknown') +
      '\nSubject: ' + (payload.subject||'') + '\n\n' + payload.text });
  }
  return blocks;
}


async function extractFromEmailPayload(payload){
  const found = [];
  const problems = [];
  // PROGRESS, not failure. "The combined read found nothing, so I am trying
  // each part" is worth keeping for diagnosis, but filing it as a problem made
  // the Problem Log accuse the app of failing at something it then did.
  const notes = [];
  const atts = Array.isArray(payload.attachments) ? payload.attachments : [];

  // Preferred path: everything in one request, so notes can be drawn from
  // whichever source happens to hold them.
  if(atts.length){
    try{
      const blocks = emailBlocks(payload, true);
      blocks.push({ type:'text', text: MULTI_SOURCE_NOTE });
      blocks.push({ type:'text', text: eventPrompt() });
      const text = await callAI(blocks, 8000, GROUNDING_EVENTS, 'email.combined');
      const events = parseExtractedEvents(text) || [];
      if(events.length) return { events, problems, notes };
      notes.push('combined read found nothing; trying each part separately');
    }catch(err){
      notes.push('combined read failed (' + err.message + '); trying each part separately');
    }
  }

  // Fallback -- read each source on its own and stitch the results together.
  // Pass 1: the body text. Any model can do this.
  if(payload.text && payload.text.trim().length > 20){
    try{
      const text = await callAI([
        {type:'text', text:'Email from ' + (payload.from||'unknown') +
          '\nSubject: ' + (payload.subject||'') + '\n\n' + payload.text},
        {type:'text', text:eventPrompt()}], 8000, GROUNDING_EVENTS, 'email.body');
      (parseExtractedEvents(text)||[]).forEach(e => found.push(e));
    }catch(err){ problems.push('body text: ' + err.message); }
  }

  // Pass 2 -- each attachment. Images need a vision model; PDFs only work on
  // Anthropic, and callAI reports that clearly rather than failing silently.
  // Give the attachment pass the covering email as context. A flyer often shows
  // the date while the email body carries the detail worth noting.
  const context = (payload.text || '').slice(0, 6000);
  for(const att of atts){
    const isPdf = att.mediaType === 'application/pdf';
    const block = isPdf
      ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:att.data}}
      : {type:'image', source:{type:'base64', media_type:att.mediaType, data:att.data}};
    try{
      const blocks = [block];
      if(context.trim().length > 40){
        blocks.push({type:'text', text:
          'This was attached to an email from ' + (payload.from||'unknown') +
          ', subject "' + (payload.subject||'') + '". The email said:\n\n' + context +
          '\n\nExtract from the ATTACHMENT above. Use the email only for context when writing notes.'});
      }
      blocks.push({type:'text', text:eventPrompt()});
      const text = await callAI(blocks, 8000, GROUNDING_EVENTS, 'email.attachment');
      (parseExtractedEvents(text)||[]).forEach(e => found.push(e));
    }catch(err){
      problems.push((att.name || 'attachment') + ': ' + err.message);
    }
  }

  // Merge: the same date can appear in both the body and the flyer. One event.
  // Merge duplicates, keeping the fullest version of each field. The body and
  // the flyer often each know something the other does not.
  const merged = [];
  found.forEach(e => {
    const hit = merged.find(m => looksDuplicate(m, e));
    if(!hit){ merged.push(e); return; }
    if((e.notes||'').length > (hit.notes||'').length) hit.notes = e.notes;
    if(!hit.time && e.time) hit.time = e.time;
    if(!hit.endTime && e.endTime) hit.endTime = e.endTime;
    if(!hit.location && e.location) hit.location = e.location;
    if((e.title||'').length > (hit.title||'').length) hit.title = e.title;
  });
  return { events: merged, problems, notes };
}

async function extractFromRawItems(items){
  const out = [];
  const failures = [];
  const stamp = aiModelName();

  for(let i = 0; i < items.length; i++){
    const it = items[i];
    const label = it.subject ? String(it.subject).slice(0,60) : '(no subject)';
    sub('busy', {msg:'Reading email ' + (i+1) + ' of ' + items.length + '…', hint: label});
    try{
      const payload = await fetchMessage(it.msgId);
      if(payload.attachments && payload.attachments.length){
        sub('busy', {msg:'Reading email ' + (i+1) + ' of ' + items.length + '…',
                     hint: label + ' (+' + payload.attachments.length + ' attachment)'});
      }
      const { events, problems, notes } = await extractFromEmailPayload(payload);
      events.forEach(e => out.push(Object.assign({}, e,
        { msgId: it.msgId, from: payload.from || it.from || null,
          source: 'Email - ' + (payload.subject || it.subject || ''),
          aiSource: stamp })));
      // Keep msgId + a retriable flag on each failure so the review box can act:
      // an extraction problem is worth retrying (a transient model/proxy error);
      // "no dates found" is deterministic -- re-reading the same email ends the
      // same way -- so it is NOT retriable, just reported.
      problems.forEach(p => {
        failures.push({ subject: label, reason: p, msgId: it.msgId, retriable: true });
        logProblem('Email: ' + (payload.from || it.from || 'unknown'), p, label);
      });
      if(!events.length && !problems.length){
        // Nothing was extracted and nothing errored. The progress notes are
        // worth showing HERE, where they explain what was tried -- and only
        // here. When events did come back, the same notes are just noise.
        const why = (notes || []).length ? notes.join('; ') : 'No dates found';
        failures.push({ subject: label, reason: why, msgId: it.msgId, retriable: false });
        logProblem('Email: ' + (payload.from || it.from || 'unknown'),
          'No dates found in this email', label);
      }
    }catch(err){
      failures.push({ subject: label, reason: err.message, msgId: it.msgId, retriable: true });
      logProblem('Email: ' + (it.from || 'unknown'), err.message, label);
    }
  }

  // Return both, so the caller surfaces failures (the review box) and a retry can
  // reconcile succeeded vs still-failing without relying on a global side effect.
  return { out, failures };
}

async function openEmailReview(fresh){
  // Safe to ask here: the background check (checkEmail(true)) never reaches this
  // function -- it sets pendingEmailCount and returns -- so this is always a tap.
  // Declining leaves the queue untouched, because seenMsgs is written on save.
  if(!confirmReplacePending()){ sub('review'); return; }
  const rawItems = fresh.filter(isMessageRef);
  if(rawItems.length){
    const { out, failures } = await extractFromRawItems(rawItems);
    lastEmailProblems = failures;   // this batch's failures (set even if empty)
    fresh = fresh.filter(i => !isMessageRef(i)).concat(out);
  } else {
    lastEmailProblems = [];
  }
  pendingEvents = markDuplicates(fresh.map(i => {
    const ppl = personsForSender(i.from);
    return {
      title:i.title, date:i.date, time:i.time, endTime:i.endTime||null, location:i.location,
      kind:i.kind, notes:i.notes, source:i.source, from:i.from||null,
      msgId: i.msgId || null,          // the row IS the record that this email was reviewed
      personIds: ppl.slice(), kidId: ppl[0] || null
    };
  }));
  pendingSource = 'Email';
  S.settings.pendingEmailCount = 0;
  save();
  sub('review');
  autoReviewEmailTrouble();
}

// The "couldn't be read" box is a notification the user must be able to clear.
// If nothing else is left to review, leave the (now empty) review screen too,
// rather than stranding them on "Found 0 items".
/**
 * Close the box. THIS ONE DOES NOT DECIDE ANYTHING (v10.4).
 *
 * The ✕ in a panel's corner means "put this away", everywhere. It leaves no
 * record, so the same emails come back on the next check -- which is the right
 * answer for a control that only ever claimed to close a panel.
 */
function closeEmailTrouble(){
  lastEmailProblems = [];
  emailReviews = {};
  if(!pendingEvents.length){ nav('events'); return; }
  render();
}

/**
 * "Dismiss these" — the batch form of the per-row "Dismiss this", and it means
 * the same thing: I have dealt with them, stop offering them.
 *
 * Until v10.4 both this and the ✕ ran the same session-only function, so the
 * button that reads as a decision recorded nothing and the watcher offered the
 * same emails on every check. That is the defect dismissOneEmail was fixed for
 * (28 Aug), left in place at batch scale.
 *
 * It costs more than a repeated screen. autoReviewEmailTrouble re-reads them
 * unasked; that runs on Gordon, so usually it is only his time -- but an email
 * carrying a PDF throws UNSUPPORTED_BLOCK:document on the local model and falls
 * through to paid Anthropic (EMAIL-AUTOREAD-PLAN section 0), every check,
 * indefinitely.
 *
 * Suppression needs a way back (rule 26): the toast carries an Undo for the
 * mistake caught at once, and Settings → "Forget imported emails" clears the
 * whole record for the one noticed later.
 */
function dismissAllEmailTrouble(){
  const ids = [...new Set(lastEmailProblems.map(p => p && p.msgId).filter(Boolean))];
  const before = (S.settings.seenMsgs || []).slice();
  lastEmailProblems = [];
  emailReviews = {};
  if(ids.length){
    S.settings.seenMsgs = [...new Set(before.concat(ids))].slice(-400);
    save();
  }
  if(!pendingEvents.length) nav('events'); else render();
  // An email with no id cannot be recorded, so it is not counted as dismissed.
  // Saying "3" when one of them will be back tomorrow is the lie this whole
  // change is about.
  toast(ids.length
      ? 'Dismissed ' + ids.length + ' email' + (ids.length === 1 ? '' : 's') + ' — they will not come back'
      : 'Cleared',
    ids.length ? { label:'Undo', fn:() => {
      S.settings.seenMsgs = before;
      save(); render();
      toast('They can come back');
    }} : null);
}

// Clear ONE email from the trouble list (act-on-a-single-brief). The rest stay so the
// user can keep triaging. Falls back to leaving Found Events if that emptied everything.
function dismissOneEmail(msgId){
  lastEmailProblems = lastEmailProblems.filter(p => !(p && p.msgId === msgId));
  if(emailReviews[msgId]) delete emailReviews[msgId];
  // RECORD IT AS SEEN. Without this the watcher offers the same message on the
  // next check, and the app fetches and re-extracts it -- at model cost -- every
  // time, forever. dismissPendingEmail() has always done this; this path did
  // not (code review, P5 candidate verified 28 Aug). "Re-import past emails"
  // in Settings is still the way back.
  if(msgId){
    S.settings.seenMsgs = [...new Set((S.settings.seenMsgs || []).concat([msgId]))].slice(-400);
    save();
  }
  if(!lastEmailProblems.length && !pendingEvents.length){ nav('events'); return; }
  render();
}

// Act on a brief: open the manual event editor pre-filled from the email (title from
// its subject, notes from Gordon's gist + any date it mentioned, person tagged from the
// sender) so a "you may want to add this by hand" is one tap, not a retype. `fromEmail`
// on the form tells save/cancel to return to the review and clear that email once added.
function addEventFromEmail(msgId){
  const b = emailReviews[msgId] || {};
  const prob = lastEmailProblems.find(p => p && p.msgId === msgId) || {};
  const title = String(prob.subject || b.subject || b.gist || '').slice(0, 80);
  const ids = personsForSender(b.from) || [];
  const notes = [b.gist ? ('From email: ' + b.gist) : '', b.deadline ? ('Mentioned: ' + b.deadline) : '']
    .filter(Boolean).join('\n');
  eventForm = { isNew:true, saved:false, ref:null, title, date: todayISO(), time:'', endTime:'',
    location:'', notes, kind:'event', personIds: ids.slice(), fromEmail: msgId };
  sub('eventEdit');
}

// Ask Gordon to act as an executive assistant and brief the user on the emails that
// had no dates to import — so a "no dates to import" line becomes "here's what this
// actually was, and whether it's worth your time." Fields follow standard EA triage
// (sender, one-line gist, a Do/Delegate/Defer/Delete-style disposition, any deadline,
// whether a date was likely MISSED, and a recommended next step). One batched AI call.
/**
 * Read the emails that could not be imported, and say what they are.
 *
 * `opts.auto` is the unprompted pass. It differs from the tapped one in every
 * way that matters when nobody asked for it:
 *   - it never alert()s, because a modal on screen entry is an ambush;
 *   - it never sub('busy')s, because render() resets scroll and moves focus on
 *     a screen change, and doing that N times to a user who is reading their
 *     extracted events is unacceptable;
 *   - it stops the moment a call would cost money (see autoPaidStop).
 *
 * The busy flag is CHECKED here now, not merely set. Until v9.92 re-entry was
 * prevented only by the button's `disabled` attribute -- which a programmatic
 * caller walks straight past, and which never covered the double-tap on
 * "Review" either.
 */
async function reviewEmailTrouble(opts){
  const auto = !!(opts && opts.auto);
  if(emailReviewBusy) return;
  const setupErr = aiSetupError();
  if(setupErr){ if(!auto) alert(setupErr); return; }
  // One entry per distinct email (a single email can log several problems).
  const seen = new Set();
  const items = [];
  for(const p of lastEmailProblems){
    if(!p || !p.msgId || seen.has(p.msgId)) continue;
    seen.add(p.msgId);
    items.push(p);
  }
  if(!items.length){ if(!auto) toast('Nothing to review'); return; }
  emailReviewBusy = true;
  if(auto){ emailAutoStop = null; emailAutoAt = 0; }
  render();
  const map = Object.assign({}, emailReviews); // keep any already-reviewed ("Review the rest")
  let done = 0;
  try{
    // PER-EMAIL so flyer IMAGES and PDFs get read too: each email's brief is built
    // from its full content — body text AND any attachment — via the same vision
    // blocks the date-extractor uses. Batching couldn't carry images cleanly.
    for(let i=0;i<items.length;i++){
      if(map[items[i].msgId]) continue; // already reviewed
      if(auto){
        emailAutoAt = done;
        if(view.sub === 'review') render();     // the card shows its own progress
      } else {
        sub('busy', { msg:'Gordon is reviewing email ' + (i+1) + ' of ' + items.length + '…',
                      hint: items[i].subject || '' });
      }
      let brief;
      try{
        const payload = await fetchMessage(items[i].msgId);
        // A PDF attachment is the one paid fallback that is knowable BEFORE
        // spending anything: blocksToOpenAI throws UNSUPPORTED_BLOCK:document on
        // the local model and callAI hands it to Anthropic. Stop here, having
        // spent nothing on it, and let the user decide.
        if(auto && (payload.attachments || []).some(a => a && a.mediaType === 'application/pdf')){
          emailAutoStop = 'pdf';
          break;
        }
        // Everything else is only knowable afterwards. Mark the log, make the
        // call, then look at EVERY entry the call appended -- one callAI can
        // append two, and on a fallback the newest is the local failure, not the
        // Anthropic success. Checking only the last entry misses every fallback.
        const mark = (S.aiLog || []).length;
        brief = await reviewOneEmail(payload, items[i].msgId);
        // Filtered by op, not just by position. This pass does not block the
        // screen -- that is the point of it -- so the user can ask Gordon
        // something in the box below while it runs, and THAT call's log entries
        // would otherwise be read as this one falling back to Anthropic and stop
        // the pass for no reason. reviewOneEmail tags its calls 'email.review'.
        const touched = (S.aiLog || []).slice(mark)
          .filter(e => e && e.op === 'email.review' && e.provider === 'anthropic');
        // Deliberately NOT `|| e.fellBackTo`: every path through callClaude
        // records a provider:'anthropic' entry first -- the no-key throw, the
        // fetch throw, the non-OK response and the success -- so fellBackTo can
        // never be set without one of these already present. A condition that
        // cannot change the outcome is decoration, not a safety net.
        //
        // `ok` decides the WORDING, and it is not cosmetic: a fallback with no
        // API key saved logs provider:'anthropic', ok:false and bills nothing.
        // Saying "this used your key" there would be a lie.
        if(auto && touched.length){
          emailAutoStop = touched.some(e => e.ok) ? 'paid' : 'error';
          // Keep this brief -- it is already paid for, and throwing it away
          // would waste the call as well as the money -- but go no further.
          map[items[i].msgId] = brief;
          done++;
          break;
        }
        brief.subject = payload.subject || items[i].subject || ''; // for "Add as event" prefill
      }catch(err){
        brief = { msgId: items[i].msgId, from: items[i].from || 'unknown', subject: items[i].subject || '',
          gist: 'Could not open this email to read it.', category:'fyi', deadline:null,
          missedDate:false, suggestedAction:'Open it in your mail app to check.' };
        logProblem('Gordon', 'Email review failed: ' + (err && err.message || 'unknown'), aiModelName());
      }
      map[items[i].msgId] = brief;
      done++;
      if(auto){
        emailReviews = map;                      // progressive: the card fills in
        emailAutoAt = done;
        if(view.sub === 'review') render();
      }
    }
    emailReviews = map;
    if(!auto) toast(done ? ('Gordon reviewed ' + done + ' email' + (done===1?'':'s')) : 'Already reviewed');
  }catch(err){
    emailReviews = map; // keep whatever completed
    logProblem('Gordon', 'Email review failed: ' + (err && err.message || 'unknown'), aiModelName());
    if(auto) emailAutoStop = 'error'; else toast('Could not review those: ' + (err && err.message || 'unknown'));
  }finally{
    emailReviewBusy = false;
    // An automatic pass never MOVES the user. sub('review') would be a screen
    // change even from the review screen itself if they had navigated away.
    if(auto){ if(view.sub === 'review') render(); }
    else sub('review');
  }
}

/**
 * Start the unprompted pass, if and only if it is free.
 *
 * Logan: "I'll always want to know what it says." The honest reading of that is
 * "read them without me asking" -- not "spend my Anthropic balance without me
 * asking". So this runs only in the one configuration where a paid call is
 * impossible at the outset: the local model selected AND signed in. Every other
 * state leaves the card's button exactly where it was.
 *
 * Deliberately NOT called from any render function: renderReview is invoked
 * directly by tests, and a fire-and-forget async call started there would settle
 * after the test that triggered it and mutate state under later ones.
 */
function autoReviewEmailTrouble(){
  if(emailReviewBusy) return;
  // aiSetupError() already returns a message when AI is switched off -- it is
  // its own first line -- so a separate !aiEnabled() check could never change
  // the outcome. Proved by reverting it: no test moved.
  if(aiSetupError()) return;
  if(aiProvider() !== 'local' || !gordonSignedInEmail()) return;
  if(!lastEmailProblems.some(p => p && p.msgId && !emailReviews[p.msgId])) return;
  // Fire and forget: no caller awaits this, because awaiting would hold up the
  // screen it is decorating. reviewEmailTrouble has its own try/catch/finally so
  // it cannot reject -- the catch is here because an unhandled rejection is
  // invisible on a phone.
  //
  // The promise is RETURNED even though nothing in the app uses it: a
  // fire-and-forget that hands back its promise is testable without changing
  // what it does, and a test that cannot await this leaves a pass running under
  // every test after it.
  return Promise.resolve(reviewEmailTrouble({ auto:true }))
    .catch(e => { /* already logged inside; nothing further to do or say here */ });
}

// Build ONE email's EA brief from its full content — body text plus any flyer image
// or PDF attachment — using the same multi-source blocks the date-extractor sends, so
// an image-only flyer is actually read (vision) rather than shrugged off.
async function reviewOneEmail(payload, msgId){
  const blocks = emailBlocks(payload, true); // attachments (images/PDF) + body text
  if(!blocks.length){
    blocks.push({ type:'text', text:
      'From: ' + (payload.from||'unknown') + '\nSubject: ' + (payload.subject||'') +
      '\n(This email has no readable text and no attachment.)' });
  }
  blocks.push({ type:'text', text: eaReviewOnePrompt() });
  const raw = await callAI(blocks, 700, EA_REVIEW_GROUNDING, 'email.review');
  return parseEaReviewOne(raw, msgId, payload.from);
}

// EA persona + strict single-object JSON contract for one email (may include a flyer image).
function eaReviewOnePrompt(){
  return `You are a sharp, trusted executive assistant for a busy parent. This email was scanned for calendar dates and none were imported. Read EVERYTHING above — the email body AND any attached flyer image or PDF — and write a one-glance brief so the parent can decide fast whether it matters.

Respond with ONLY a JSON object (no markdown, no commentary):
{"from":"who it's from, plainly","gist":"ONE sentence: what this email/flyer is actually about","category":"action" | "fyi" | "trash","deadline":"any date/time or soft due-date it mentions, else null","missedDate": true only if it clearly names a date/event that SHOULD be on the calendar but wasn't, else false,"suggestedAction":"one short next step, max ~8 words"}

category: "action" = the parent must DO something (reply, sign/return a form, pay, RSVP); "fyi" = useful info, nothing to do; "trash" = newsletter/promotion/receipt/noise, safe to ignore.
If it's a flyer image, describe what the flyer is FOR. If there is genuinely nothing readable, say so in the gist.`;
}

const EA_REVIEW_GROUNDING = 'Be accurate and specific to this email. Never invent a date, deadline, or sender. If unsure, say so plainly. Keep every field short and scannable.';

function parseEaReviewOne(raw, msgId, fallbackFrom){
  try{
    let t = String(raw || '').replace(/```json|```/g, '').trim();
    // Accept a bare object or the first object of an array.
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if(a >= 0 && b > a) t = t.slice(a, b+1);
    const o = JSON.parse(t);
    return {
      msgId,
      from: (o && o.from) || fallbackFrom || 'unknown',
      gist: (o && o.gist) || 'Could not summarise this one.',
      category: (o && ['action','fyi','trash'].includes(o.category)) ? o.category : 'fyi',
      deadline: (o && o.deadline) || null,
      missedDate: !!(o && o.missedDate),
      suggestedAction: (o && o.suggestedAction) || '',
    };
  }catch(e){
    return { msgId, from: fallbackFrom || 'unknown', gist: 'Could not summarise this one.',
      category:'fyi', deadline:null, missedDate:false, suggestedAction:'Open it in your mail app to check.' };
  }
}

// Retry only the retriable failures (transient errors), merge anything that now
// succeeds into the batch under review, and keep only what still failed. The
// non-retriable "no dates found" rows are preserved untouched. Recovery without
// starting the whole import over (NN/g: help users recover, don't make them redo).
async function retryEmailTrouble(){
  const retriable = lastEmailProblems.filter(p => p && p.retriable && p.msgId);
  if(!retriable.length) return;
  const keep = lastEmailProblems.filter(p => !(p && p.retriable && p.msgId));
  try{
    const { out, failures } = await extractFromRawItems(
      retriable.map(p => ({ msgId: p.msgId, subject: p.subject })));
    if(out.length){
      const mapped = markDuplicates(out.map(i => ({
        title:i.title, date:i.date, time:i.time, endTime:i.endTime||null, location:i.location,
        kind:i.kind, notes:i.notes, source:i.source, from:i.from||null,
        msgId: i.msgId || null,
        personIds: personsForSender(i.from).slice(), kidId: personsForSender(i.from)[0] || null,
      })), pendingEvents);
      pendingEvents = pendingEvents.concat(mapped);
    }
    lastEmailProblems = keep.concat(failures);
    // Drop briefs for emails that are no longer in the trouble list (they imported).
    const stillThere = new Set(lastEmailProblems.map(p => p && p.msgId).filter(Boolean));
    emailReviews = Object.fromEntries(Object.entries(emailReviews).filter(([id]) => stillThere.has(id)));
    save();
    const got = out.length;
    toast(got ? `Read ${got} more — added below` : 'Still no luck on those');
  }catch(err){
    toast('Could not retry: ' + (err && err.message || 'unknown'));
  }
  sub('review');
  autoReviewEmailTrouble();
}

// ---------- copy / share a single record (Problem Log entry, Ask answer) ----
// On a phone the Problem Log was a dead end: you could read an error and not
// get it out. writeText works inside a tap handler on iOS; Share offers the
// richer path (Messages/Mail) where the OS supports it. Look-ups are by id or
// index so no untrusted text is ever interpolated into an onclick attribute.
function copyTextValue(text, okNote){
  const t = String(text || '');
  if(!t){ toast('Nothing to copy'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast(okNote || 'Copied'))
      .catch(()=>toast('Could not copy — try Share instead'));
  } else {
    toast('Copy is not available on this device');
  }
}
function shareTextValue(text){
  const t = String(text || '');
  if(!t){ toast('Nothing to share'); return; }
  if(navigator.share){ navigator.share({text:t}).catch(()=>{}); }
  else { copyTextValue(t, 'Copied — paste it wherever you like'); }
}

function isDismissedPair(a, b){
  const d = (S.settings && S.settings.notDuplicates) || [];
  return d.indexOf(pairKey(a, b)) >= 0;
}
function dismissGroup(i){
  const g = duplicateGroups()[i];
  if(!g) return;
  if(!S.settings.notDuplicates) S.settings.notDuplicates = [];
  const added = [];
  for(let x = 0; x < g.length; x++)
    for(let y = x + 1; y < g.length; y++){
      const k = pairKey(g[x], g[y]);
      if(S.settings.notDuplicates.indexOf(k) < 0){ S.settings.notDuplicates.push(k); added.push(k); }
    }
  save();
  // Reversible, like every other suppression as of v9.66 (code review P6-02).
  // `added` is only the keys THIS tap contributed, so an undo cannot remove a
  // decision made earlier about a different pair.
  toast('Marked as different events', { label:'Undo', fn:() => {
    S.settings.notDuplicates = (S.settings.notDuplicates || []).filter(k => !added.includes(k));
    save(); render();
    toast('Back in the duplicates list');
  }});
  if(!duplicateGroups().length){ view = { tab:'events', sub:null, data:null }; }
  render();
}

function duplicateGroups(){
  const evts = S.events.filter(e => !e.deleted)
    .sort((a,b) => a.date.localeCompare(b.date));
  const used = new Set();
  const groups = [];
  for(let i = 0; i < evts.length; i++){
    if(used.has(evts[i].id)) continue;
    const group = [evts[i]];
    for(let j = i + 1; j < evts.length; j++){
      if(used.has(evts[j].id)) continue;
      if(evts[j].date !== evts[i].date) continue;
      if(group.some(g => looksDuplicate(g, evts[j]) && !isDismissedPair(g, evts[j]))){
        group.push(evts[j]);
        used.add(evts[j].id);
      }
    }
    if(group.length > 1){ used.add(evts[i].id); groups.push(group); }
  }
  return groups;
}

// Keep whichever copy carries the most information.
function richness(e){
  return (e.time ? 2 : 0) + (e.location ? 2 : 0) + (e.notes ? 1 : 0) +
         (e.kidId ? 1 : 0) + (e.exported ? 1 : 0);
}
function bestOfGroup(group){
  return group.slice().sort((a,b) => richness(b) - richness(a))[0];
}

let dedupeKeep = {};      // groupIndex -> event id to keep

/**
 * A group's identity, independent of where it currently sits in the list.
 *
 * dedupeKeep used to be keyed by the group's INDEX. dismissGroup() removes a
 * group and duplicateGroups() is recomputed, so every later group shifts down
 * one -- while dedupeKeep still held the id chosen for whatever used to be at
 * that index. When that id belonged to no surviving group, `e.id !== keep` was
 * true for every member and applyDedupe deleted BOTH events instead of one.
 * Found by the Aug 2026 code review (P5-07).
 */
function dedupeGroupKey(g){ return g.map(e => e.id).sort().join('~'); }

function openDedupe(){
  dedupeKeep = {};
  duplicateGroups().forEach(g => { dedupeKeep[dedupeGroupKey(g)] = bestOfGroup(g).id; });
  sub('dedupe');
}
function setDedupeKeep(key, id){ dedupeKeep[key] = id; render(); }

/**
 * What a group's on-screen choice actually was.
 *
 *   an id   -> keep that copy, remove the rest
 *   null    -> the user tapped "Keep both": a reviewed decision
 *   absent  -> no choice was recorded for this group
 *
 * The old code folded the third case into the second with a plain `!keep`, so
 * "we do not know" and "the user reviewed these and they are different" wrote
 * the same permanent record.
 *
 * Reachability, checked rather than assumed: `absent` cannot be produced
 * through the interface today. openDedupe() records a choice for every group on
 * screen, sub('dedupe') has no other caller, and dismissGroup() suppresses or
 * restores a group's pairs as a whole, so no group's key can go missing while
 * the screen is open. The distinction is kept anyway because the id-in-no-group
 * case below IS reachable, and because folding an unknown into a user decision
 * is precisely the shape that gave the P5-07 defect its teeth.
 */
function dedupeChoice(g){
  const key = dedupeGroupKey(g);
  if(!Object.prototype.hasOwnProperty.call(dedupeKeep, key)) return undefined;
  const id = dedupeKeep[key];
  // Belt and braces: even with a stable key, an id that is not in THIS group
  // must never be treated as "keep this one" -- that is the shape that deleted
  // both events. It is not a "keep both" either; it is a defect state, and a
  // defect state must not be recorded as a decision the user made.
  if(id && !g.some(e => e.id === id)) return undefined;
  return id;
}

function applyDedupe(){
  const groups = duplicateGroups();
  if(!S.settings.notDuplicates) S.settings.notDuplicates = [];
  const cleared = [];   // rows this tap deleted, with what they looked like first
  const added = [];     // suppression keys this tap contributed, and only this tap

  groups.forEach(g => {
    const keep = dedupeChoice(g);
    if(keep === undefined) return;               // not reviewed -- leave it alone
    if(keep === null){
      // "Keep both" means you have reviewed this pair and they are different.
      // Record it so the banner stops re-flagging the same events forever.
      for(let x = 0; x < g.length; x++)
        for(let y = x + 1; y < g.length; y++){
          const k = pairKey(g[x], g[y]);
          if(S.settings.notDuplicates.indexOf(k) < 0){ S.settings.notDuplicates.push(k); added.push(k); }
        }
      return;
    }
    g.forEach(e => {
      if(e.id !== keep){ cleared.push({ e, dirty: e.dirty }); markDeleted(e); e.dirty = 1; }
    });
  });

  const removed = cleared.length, kept = added.length;
  save();

  // Say what the tap DID. Until v9.86 a tap that suppressed pairs and removed
  // nothing reported "Kept everything" from a button labelled "remove nothing"
  // -- while writing a permanent record that those events are different. The
  // way back existed (Settings -> Dismissed Warnings, v9.66) but nothing told
  // you there was anything to go back from. Rule 26.
  const parts = [];
  if(removed) parts.push(`Removed ${removed} duplicate${removed===1?'':'s'}`);
  if(kept) parts.push(`${kept} pair${kept===1?'':'s'} marked as different`);
  const undo = () => {
    cleared.forEach(c => { unmarkDeleted(c.e); if(c.dirty === undefined) delete c.e.dirty; else c.e.dirty = c.dirty; });
    S.settings.notDuplicates = (S.settings.notDuplicates || []).filter(k => !added.includes(k));
    save(); render();
    toast('Put back');
  };
  if(parts.length) toast(parts.join(' \u00b7 '), { label:'Undo', fn: undo });
  else toast('Nothing changed');

  view = { tab:'events', sub:null, data:null };
  render();
}

    }).join('')}
    <div style="text-align:right;padding-top:6px">
      <button class="linkbtn" style="padding:2px 6px" onclick="setDedupeKeep('${dedupeGroupKey(g)}', null)">${dedupeKeep[dedupeGroupKey(g)] ? 'Keep both' : '✓ Keeping both'}</button>
      <button class="linkbtn" style="padding:2px 6px" onclick="dismissGroup(${i})">Not duplicates</button>
    </div>
  </div>`).join('');

  // Both halves of what the button will do, counted the same way applyDedupe
  // counts them. The old label read "Done (remove nothing)" whenever nothing was
  // being deleted -- on a tap that could still write permanent suppressions.
  const removing = groups.reduce((n, g) => {
    const k = dedupeChoice(g);
    return n + (k ? g.length - 1 : 0);
  }, 0);
  const keeping = groups.filter(g => dedupeChoice(g) === null).length;
  const label = removing && keeping
      ? `Remove ${removing} duplicate${removing===1?'':'s'}, keep ${keeping} pair${keeping===1?'':'s'}`
    : removing ? `Remove ${removing} duplicate${removing===1?'':'s'}`
    : keeping ? `\u2713 Done \u2014 mark ${keeping} pair${keeping===1?'':'s'} as different`
    : '\u2713 Done';
  html += `<div class="card" style="position:sticky;bottom:76px">
    <button class="btn ${removing?'':'alt'}" onclick="applyDedupe()">${label}</button>
    </div><div style="height:70px"></div>`;
  m.innerHTML = html;
}

function bulkTag(personId){
  // Tagging REPLACES, which the sheet says -- so an event tagged with two
  // people loses one of them, and until v9.99 there was no way back. delKid
  // solved the same problem the same way: snapshot the live rows and their
  // prior values before touching anything. personIds is copied, not aliased;
  // the array is reassigned below, but a slice costs nothing and survives a
  // future edit that mutates it in place instead.
  const hit = S.events.filter(e => selectedEvents.has(e.id));
  const before = hit.map(e => ({ e,
    personIds: Array.isArray(e.personIds) ? e.personIds.slice() : undefined,
    kidId: e.kidId }));
  hit.forEach(e => {
    e.personIds = personId ? [personId] : [];

  save();

  toast('Tagged ' + n + ' event' + (n===1?'':'s') + ' as ' + who, n ? {
    label:'Undo',

}

// ---------- Capture & Review ----------
let pendingEvents = [], pendingSource = '', captureAppend = false;

/**
 * Nothing starts a new review batch over the top of one already open.
 *
 * pendingEvents is never persisted, so an assignment to it throws away the
 * extraction that produced the current batch. Four paths did that silently:
 * openEmailReview, handleCapture, handleLinkCapture and the assistant's DRAFT
 * branch. Scan a flyer while an email batch is open and the emails vanished
 * mid-review with no warning and no way back to them.
 *
 * A confirm rather than a merge, deliberately. What is lost is the WORK, not the
 * data: an abandoned email batch stays in the watcher queue, because seenMsgs is
 * only written on save, and the photo is still on the phone. Merging would fix a
 * cheaper problem at the price of a per-row source field, since saveReview
 * stamps every saved event with one pendingSource and a merged batch would carry
 * the wrong provenance for half of it.
 *
 * Asked BEFORE the model call, never after, so declining costs nothing.
 */
function confirmReplacePending(){
  const n = pendingEvents.length;
  if(!n) return true;
  return confirm('You still have ' + n + ' item' + (n === 1 ? '' : 's') +
    ' under review from ' + (pendingSource || 'an earlier scan') + '.\n\n' +
    'Starting a new one replaces ' + (n === 1 ? 'it' : 'them') + '. Continue?');
}

// Shared by every import path: photo, PDF, link and email.
function markDuplicates(found, alsoPending){
  const seen = S.events.filter(e => !e.deleted).map(e => ({ title:e.title, date:e.date }));
  if(alsoPending) alsoPending.forEach(p => seen.push({ title:p.title, date:p.date }));
  return found.map(e => {
    const dup = seen.some(x => looksDuplicate(e, x));
    seen.push({ title:e.title, date:e.date });
    return { ...e, selected: !dup, dup,
      personIds: Array.isArray(e.personIds) ? e.personIds : [],
      kidId: (Array.isArray(e.personIds) && e.personIds[0]) || null };
  });
}

async function handleCapture(fileList, isPdf){
  const files = Array.from(fileList||[]).filter(Boolean);
  if(!files.length) return;
  const setupErr = aiSetupError();
  if(setupErr){ alert(setupErr); nav('settings'); return; }
  const append = captureAppend && pendingEvents.length > 0;
  captureAppend = false;
  // Before the model call, so saying no costs nothing. Declining puts the user
  // back on the batch they kept rather than stranding them on the capture screen.
  if(!append && !confirmReplacePending()){ sub('review'); return; }
  sub('busy', {msg:'Reading the document…', hint: aiWorkingHint()});
  try{
    let found = [];
    for(let i=0; i<files.length; i++){
      if(files.length>1) sub('busy', {msg:`Reading page ${i+1} of ${files.length}…`, hint: aiName() + ' is working out what this is'});
      const f = files[i];
      let base64, mediaType;
      if(isPdf){ base64 = await readFile(f); mediaType='application/pdf'; }
      else { const r = await readImageDownscaled(f); base64=r.base64; mediaType=r.mediaType; }

      // A single capture might be a recipe rather than paperwork — let Claude
      // decide rather than making the user sort it first.
      if(files.length === 1 && !append){
        const out = await extractAny(base64, mediaType, isPdf);
        if(out.type === 'recipe'){
          recipeForm = {
            title: out.recipe.title || '',
            category: ['Breakfast','Lunch','Dinner','Snack','Other'].includes(out.recipe.category) ? out.recipe.category : 'Other',
            ingredients: out.recipe.ingredients || '',
            instructions: out.recipe.instructions || ''
          };
          toast('That looks like a recipe — sending it to the Recipe app');
          sub('recipeForm');
          return;
        }
        if(out.type === 'unknown'){
          alert('Could not tell what that is. Try a clearer photo, or use Scan a recipe if it is a recipe.');
          back(); return;
        }
        found = out.events;
      } else {
        found = found.concat(await extractEvents(base64, mediaType, isPdf));
      }
    }
    if(!found.length){
      alert('No dates found. Try a clearer photo or a different page.');
      append ? sub('review') : back();
      return;
    }
    // Duplicate detection: against saved events, prior pending items, and within this batch
    const items = markDuplicates(found, append ? pendingEvents : null);
    if(append){ pendingEvents = pendingEvents.concat(items); }
    else {
      pendingEvents = items;
      pendingSource = isPdf ? (files[0].name||'PDF import') : 'Photo '+todayISO();
    }
    sub('review');
  }catch(err){
    // The classification already exists; using it is the difference between
    // "Extraction failed: Load failed" and "Check your connection and try again".
    alert(explainError(classifyError(err), aiProvider()));
    append ? sub('review') : back();
  }
}

async function pasteFromClipboard(){
  if(!navigator.clipboard || !navigator.clipboard.read){
    alert('This iOS version does not support paste. Use Choose from Photos instead.');
    return;
  }
  try{
    const items = await navigator.clipboard.read();
    for(const item of items){
      for(const type of item.types){
        if(type.startsWith('image/')){
          const blob = await item.getType(type);
          const file = new File([blob], 'pasted.'+type.split('/')[1], {type});
          handleCapture([file], false);
          return;
        }
      }
    }
    alert('No image on your clipboard. Copy an image first (long-press it in Mail, Photos, or Safari and tap Copy), then come back and tap Paste an image.');
  }catch(err){
    if(err.name === 'NotAllowedError'){
      alert('Paste blocked. When you tap Paste an image, iOS will ask "Allow paste?" — tap Allow.');
    } else {
      alert('Could not read the clipboard: ' + err.message);
    }
  }
}

async function handleLinkCapture(url){
